<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Slate">
<meta name="format-detection" content="telephone=no">
<title>Slate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F2ED;
  --panel:#FFFFFF;
  --note:#EFE9DB;
  --note-edge:#DFD5BF;
  --ink:#1B1A17;
  --muted:#7C776C;
  --line:#DEDAD1;
  --line-soft:#E9E5DD;
  --accent:#2C5849;
  --accent-ink:#2C5849;
  --accent-soft:#E1EAE5;
  --danger:#8C3A2B;
  --shadow:0 1px 1px rgba(27,26,23,.04), 0 2px 6px rgba(27,26,23,.05);
  --radius:5px;
  --ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141619;
    --panel:#1C1F23;
    --note:#241F17;
    --note-edge:#3B3325;
    --ink:#E8E6E0;
    --muted:#94918A;
    --line:#2D3137;
    --line-soft:#24272C;
    --accent:#84B9A4;
    --accent-ink:#9CCBB7;
    --accent-soft:#22322C;
    --danger:#D08878;
    --shadow:0 1px 1px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --paper:#141619;
  --panel:#1C1F23;
  --note:#241F17;
  --note-edge:#3B3325;
  --ink:#E8E6E0;
  --muted:#94918A;
  --line:#2D3137;
  --line-soft:#24272C;
  --accent:#84B9A4;
  --accent-ink:#9CCBB7;
  --accent-soft:#22322C;
  --danger:#D08878;
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::placeholder{color:var(--muted);opacity:.75}

/* touch devices: never hide an action behind hover */
@media (hover:none){
  .rowx,.blkcopy,.spacex{opacity:1 !important}
}

/* ---------- shell ---------- */
#shell{
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  /* landscape on a notched phone: keep the rail and bar out of the cutout */
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}

#topbar{
  display:flex;align-items:center;gap:14px;
  padding:0 16px;height:52px;flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .mark{
  width:15px;height:15px;border-radius:2px;
  background:var(--accent);flex:0 0 auto;align-self:center;
  transform:rotate(-8deg);
}
.brand .word{font-size:15px}
.brand .sub{font-size:12px;color:var(--muted);font-weight:400}
#railToggle{display:none}

#search{
  flex:1;max-width:340px;margin-left:auto;
  border:1px solid var(--line);background:var(--paper);
  border-radius:var(--radius);padding:6px 10px;font-size:13px;
}
#search:focus{border-color:var(--accent);outline:none}
#whoami{display:flex;align-items:center;gap:7px;flex:0 0 auto}
#whoami img{width:24px;height:24px;border-radius:50%;display:block}
#whoami .nm{font-size:13px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#body{display:grid;grid-template-columns:224px minmax(0,1fr);flex:1 1 auto;min-height:0}

/* base rule must precede the 860px block, or the scrim becomes a grid item and
   displaces the rail and main pane on every desktop width */
#railScrim{display:none}

/* ---------- rail ---------- */
#rail{
  border-right:1px solid var(--line);
  background:var(--panel);
  padding:14px 0 28px;
  overflow-y:auto;
}
.rail-sec{margin-bottom:22px}
.rail-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 6px;font-size:12px;color:var(--muted);letter-spacing:.01em;
}
.rail-head button{color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;border-radius:3px}
.rail-head button:hover{color:var(--accent-ink);background:var(--accent-soft)}
.rail-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:5px 14px;font-size:13.5px;text-align:left;
  border-left:2px solid transparent;color:var(--ink);
}
.rail-item:hover{background:var(--line-soft)}
.rail-item.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
.rail-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
.rail-item .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rail-item .ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-empty{padding:2px 14px 0;font-size:12.5px;color:var(--muted)}

/* ---------- main ---------- */
#main{min-width:0;display:flex;flex-direction:column}
#mainhead{padding:20px 22px 0;flex:0 0 auto}
.title-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
#projTitle{
  font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2;
  border:0;background:none;padding:2px 4px;margin:-2px -4px;
  border-radius:3px;min-width:120px;max-width:100%;
}
#projTitle:hover:not(:disabled){background:var(--line-soft)}
#projTitle:disabled{
  cursor:default;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink);
}
#mainhead .meta{font-size:12.5px;color:var(--muted);margin-top:7px}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:5px 11px;font-size:13px;background:var(--panel);
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{opacity:.88;color:var(--panel);border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{border-color:var(--line);color:var(--ink)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}

.tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line)}
.tab{
  padding:7px 12px;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab .n{font-size:11.5px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}

#mainbody{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 22px 40px}

/* ---------- board ---------- */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.col{
  /* flexes so all four columns fit an iPad in landscape, and widens a little on a
     big monitor, but never gets too narrow to read a card */
  flex:1 1 0;min-width:216px;max-width:300px;
  background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;max-height:calc(100dvh - 230px);
}
.col.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.col-head{
  display:flex;align-items:center;gap:8px;padding:9px 11px;
  border-bottom:1px solid var(--line-soft);
}
.col-head .bar{width:18px;height:3px;border-radius:2px;background:var(--accent);opacity:.85}
.col-head .nm{font-size:13px;font-weight:500}
.col-head .n{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-body{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:44px}
.col-foot{padding:0 8px 8px}
.addtask{
  width:100%;border:1px dashed var(--line);background:transparent;
  border-radius:var(--radius);padding:6px 9px;font-size:13px;
}
.addtask:focus{border-style:solid;border-color:var(--accent);outline:none}

.card{
  position:relative;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 10px 8px 22px;cursor:pointer;
  box-shadow:var(--shadow);
}
.card .grip{
  position:absolute;left:0;top:0;bottom:0;width:20px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;letter-spacing:-1px;
  cursor:grab;touch-action:none;opacity:.45;
  border-radius:var(--radius) 0 0 var(--radius);
}
.card .grip:hover{opacity:1;background:var(--line-soft)}
.card .grip:active{cursor:grabbing}
@media (hover:none){ .card .grip{opacity:.8;width:26px} .card{padding-left:28px} }
.card.dragging{opacity:.32}
.dragghost{
  position:fixed;z-index:95;pointer-events:none;
  box-shadow:0 12px 28px rgba(20,19,17,.28);
  transform:rotate(1.4deg);opacity:.96;
}
body.dragging-now{user-select:none;-webkit-user-select:none}

/* task sheet reuses the schedule dialog shell */
#taskDlg{
  position:fixed;inset:0;z-index:76;display:none;
  background:rgba(20,19,17,.36);padding:9vh 16px 16px;overflow-y:auto;
}
#taskDlg.on{display:block}
.card .ttl{font-size:13.5px;line-height:1.35;word-break:break-word}
.card.done .ttl{color:var(--muted);text-decoration:line-through}
.card .foot{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.chip{
  font-size:11px;padding:1px 6px;border-radius:3px;
  background:var(--line-soft);color:var(--muted);
}
.chip.proj{background:var(--accent-soft);color:var(--accent-ink)}
.chip.due{border:1px solid var(--line);background:transparent}
.chip.due.late{color:var(--danger);border-color:var(--danger)}
.card .who{width:19px;height:19px;border-radius:50%;margin-left:auto;display:block}
.drop-line{height:2px;background:var(--accent);border-radius:2px;margin:-4px 0}

/* ---------- list ---------- */
.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{
  text-align:left;font-weight:500;font-size:12px;color:var(--muted);
  padding:0 10px 7px;border-bottom:1px solid var(--line);
}
.list td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.list tr:hover td{background:var(--panel)}
.list .c-check{width:30px}
.list .c-due{width:128px}
.list .c-who{width:44px}
.list .c-st{width:132px}
.list .c-x{width:34px}
.list td.tt{word-break:break-word}
.list td.tt.done{color:var(--muted);text-decoration:line-through}
.list input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.list select,.list input[type=date]{
  border:1px solid transparent;background:transparent;border-radius:3px;
  padding:3px 5px;font-size:12.5px;width:100%;
}
.list select:hover,.list input[type=date]:hover{border-color:var(--line)}
.list img.who{width:21px;height:21px;border-radius:50%;display:block}
.rowx{color:var(--muted);font-size:15px;padding:0 5px;border-radius:3px;opacity:0}
tr:hover .rowx{opacity:1}
.rowx:hover{color:var(--danger)}

/* ---------- notes ---------- */
.notes{
  display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
  align-items:start;
}
.note{
  background:var(--note);border:1px solid var(--note-edge);
  border-radius:3px 12px 3px 3px;padding:12px 13px 11px;
  text-align:left;width:100%;min-height:104px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;
  box-shadow:var(--shadow);
}
.note:hover{border-color:var(--accent)}
.note .nt{
  font-family:var(--serif);font-size:17px;font-weight:500;
  line-height:1.25;letter-spacing:-.005em;word-break:break-word;
}
.note .nb{
  font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink);
  opacity:.78;flex:1;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;
  white-space:pre-wrap;word-break:break-word;
}
.note .nf{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.note .nf img{width:17px;height:17px;border-radius:50%;margin-left:auto}
.note.add{
  background:transparent;border:1px dashed var(--line);box-shadow:none;
  align-items:center;justify-content:center;color:var(--muted);
  font-family:var(--ui);font-size:13px;border-radius:3px;
}
.note.add:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- empty ---------- */
.empty{
  max-width:400px;padding:34px 0;color:var(--muted);font-size:14px;line-height:1.55;
}
.empty h2{
  font-family:var(--serif);font-size:20px;font-weight:500;
  color:var(--ink);margin:0 0 6px;letter-spacing:-.01em;
}
.empty .btn{margin-top:14px}

/* ---------- note editor ---------- */
#overlay{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(20,19,17,.36);
  padding:24px 16px;overflow-y:auto;
}
#overlay.on{display:block}
#editor{
  max-width:680px;margin:0 auto;background:var(--note);
  border:1px solid var(--note-edge);border-radius:4px 16px 4px 4px;
  box-shadow:0 18px 44px rgba(20,19,17,.24);
  padding:20px 22px 16px;display:flex;flex-direction:column;gap:10px;
}
#edTitle{
  font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.015em;
  border:0;background:transparent;width:100%;padding:0;line-height:1.2;
}
#edTitle:focus{outline:none}
#edBody{
  font-family:var(--serif);font-size:16px;line-height:1.62;
  border:0;background:transparent;width:100%;resize:vertical;
  min-height:300px;padding:0;
}
#edBody:focus{outline:none}
#edRule{height:1px;background:var(--note-edge);margin:2px 0 4px}
#edFoot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--note-edge);padding-top:11px;margin-top:4px;
  font-size:12.5px;color:var(--muted);
}
#edProj{
  border:1px solid var(--note-edge);background:transparent;
  border-radius:3px;padding:4px 7px;font-size:12.5px;font-family:var(--ui);
}
#edStatus{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- inline edit ---------- */
.inline-edit{
  width:100%;border:1px solid var(--accent);border-radius:3px;
  padding:2px 5px;font-size:13.5px;background:var(--panel);
}
.inline-edit:focus{outline:none}
.rail-new{padding:3px 12px 0}
.rail-new input{
  width:100%;border:1px solid var(--accent);border-radius:3px;
  padding:4px 7px;font-size:13px;background:var(--paper);
}
.rail-new input:focus{outline:none}

/* ---------- confirm ---------- */
#confirm{
  position:fixed;inset:0;z-index:80;display:none;
  background:rgba(20,19,17,.36);padding:22vh 16px 16px;
}
#confirm.on{display:block}
.cbox{
  max-width:400px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 18px 44px rgba(20,19,17,.26);padding:18px 20px 16px;
}
.cbox h3{
  margin:0 0 6px;font-size:16px;font-weight:600;letter-spacing:-.01em;
}
.cbox p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.crow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn.solid-danger:hover{opacity:.88;color:var(--panel);border-color:var(--danger)}

/* ---------- assignee menu ---------- */
#amenu{
  position:absolute;z-index:70;display:none;min-width:212px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 10px 26px rgba(20,19,17,.18);
  padding:6px;
}
#amenu.on{display:block}
#amenu input{
  width:100%;border:1px solid var(--line);border-radius:3px;
  padding:5px 8px;font-size:13px;background:var(--paper);margin-bottom:5px;
}
#amenu .opt{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:5px 7px;border-radius:3px;font-size:13px;text-align:left;
}
#amenu .opt:hover{background:var(--accent-soft)}
#amenu .opt img{width:20px;height:20px;border-radius:50%}
#amenu .none{color:var(--muted)}

/* ---------- toast / banner ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:13px;
  padding:8px 14px;border-radius:var(--radius);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .16s;max-width:88vw;
}
#toast.on{opacity:1}
#banner{
  display:none;padding:9px 22px;font-size:13px;
  background:var(--accent-soft);color:var(--accent-ink);
  border-bottom:1px solid var(--line);
}
#banner.on{display:block}

/* ---------- capture ---------- */
#capture{
  display:none;margin:14px 22px 0;flex:0 0 auto;
  border:1px solid var(--note-edge);background:var(--note);
  border-radius:3px 12px 3px 3px;padding:10px 12px 9px;
}
#capture.on{display:block}
#capture.drag{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#capInput{
  width:100%;border:0;background:transparent;resize:none;overflow:hidden;
  font-family:var(--serif);font-size:16px;line-height:1.5;
  min-height:26px;max-height:240px;padding:0;
}
#capInput:focus{outline:none}
#capFoot{display:flex;align-items:center;gap:9px;margin-top:7px}
#capHint{font-size:11.5px;color:var(--muted)}
#capFoot .btn{margin-left:auto;padding:3px 10px;font-size:12.5px}
#capThumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#capThumbs:empty{margin:0}
.thumb{
  position:relative;width:60px;height:60px;border-radius:3px;
  border:1px solid var(--note-edge);overflow:hidden;background:var(--paper);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{
  position:absolute;top:1px;right:1px;width:17px;height:17px;
  border-radius:50%;background:rgba(20,19,17,.72);color:#fff;
  font-size:12px;line-height:17px;text-align:center;
}

/* ---------- tags ---------- */
#tagbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tagchip{
  font-size:12px;padding:2px 8px;border-radius:11px;
  border:1px solid var(--line);color:var(--muted);background:transparent;
}
.tagchip:hover{border-color:var(--accent);color:var(--accent-ink)}
.tagchip.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.tagref{color:var(--accent-ink);font-weight:500;cursor:pointer}
.tagref:hover{text-decoration:underline}

/* ---------- feed ---------- */
.feed{max-width:620px}
.daymark{
  font-size:11.5px;color:var(--muted);margin:20px 0 9px;
  display:flex;align-items:center;gap:9px;
}
.daymark::after{content:"";flex:1;height:1px;background:var(--line)}
.daymark:first-child{margin-top:0}
.fitem{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--note);border:1px solid var(--note-edge);
  border-radius:3px 12px 3px 3px;padding:11px 13px 9px;margin-bottom:8px;
  box-shadow:var(--shadow);
}
.fitem:hover{border-color:var(--accent)}
.fitem .ft{
  font-family:var(--serif);font-size:16px;font-weight:500;line-height:1.25;
  margin-bottom:3px;word-break:break-word;
}
.fitem .fb{
  font-family:var(--serif);font-size:15px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;
}
.fitem .ff{
  display:flex;align-items:center;gap:8px;margin-top:8px;
  font-size:11.5px;color:var(--muted);
}
.fitem .ff img.av{width:17px;height:17px;border-radius:50%;margin-left:auto}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.imgs img{
  width:74px;height:74px;object-fit:cover;border-radius:3px;
  border:1px solid var(--note-edge);display:block;
}
.fitem a,.note a,.nb a{color:var(--accent-ink)}

/* ---------- editor images ---------- */
#edImgs{display:flex;gap:8px;flex-wrap:wrap}
#edImgs:empty{display:none}
#edImgs .thumb{width:88px;height:88px}

/* ---------- spaces in rail ---------- */
.rail-sub{padding-left:14px}
.rail-sub .rail-item{padding-left:22px;font-size:13px}
.rail-sub .rail-item .lbl{color:var(--muted)}
.rail-sub .rail-item.on .lbl{color:var(--ink)}
.rail-addspace{
  display:block;width:100%;text-align:left;padding:3px 14px 3px 36px;
  font-size:12.5px;color:var(--muted);
}
.rail-addspace:hover{color:var(--accent-ink)}
.rail-sub input{
  width:calc(100% - 44px);margin:2px 0 2px 36px;
  border:1px solid var(--accent);border-radius:3px;
  padding:3px 6px;font-size:12.5px;background:var(--paper);
}
.rail-sub input:focus{outline:none}
.spacex{
  margin-left:4px;color:var(--muted);font-size:13px;opacity:0;
  padding:0 3px;border-radius:3px;
}
.rail-item:hover .spacex{opacity:1}
.spacex:hover{color:var(--danger)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.calbar .mon{font-size:16px;font-weight:600;letter-spacing:-.01em;min-width:150px}
.calbar .nav{
  border:1px solid var(--line);border-radius:var(--radius);
  width:27px;height:27px;line-height:1;font-size:14px;color:var(--muted);
}
.calbar .nav:hover{border-color:var(--accent);color:var(--accent-ink)}
.calgrid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--line);gap:1px;
}
.caldow{
  background:var(--panel);padding:6px 8px;font-size:11.5px;color:var(--muted);
}
.calday{
  background:var(--panel);min-height:108px;padding:5px 6px 7px;
  display:flex;flex-direction:column;gap:3px;
}
.calday.off{background:var(--paper)}
.calday.off .dn{opacity:.4}
.calday .dn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.calday.today .dn{
  color:var(--panel);background:var(--accent);border-radius:9px;
  padding:0 6px;align-self:flex-start;font-weight:500;
}
.occ{
  display:flex;align-items:center;gap:5px;width:100%;text-align:left;
  font-size:11.5px;line-height:1.3;padding:3px 5px;border-radius:3px;
  background:var(--accent-soft);color:var(--accent-ink);
}
.occ:hover{filter:brightness(.97)}
.occ .tm{font-variant-numeric:tabular-nums;opacity:.75;flex:0 0 auto}
.occ .ot{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.occ.done{background:var(--line-soft);color:var(--muted);text-decoration:line-through}
.occ.task{background:transparent;border:1px solid var(--line);color:var(--ink)}
.occ.task.late{border-color:var(--danger);color:var(--danger)}
.schedlist{margin-top:22px;max-width:620px}
.schedrow{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);margin-bottom:7px;
}
.schedrow .sn{font-size:13.5px;flex:1;min-width:0;word-break:break-word}
.schedrow .sw{font-size:12px;color:var(--muted);flex:0 0 auto}

/* ---------- schedule dialog ---------- */
#schedDlg{
  position:fixed;inset:0;z-index:75;display:none;
  background:rgba(20,19,17,.36);padding:9vh 16px 16px;overflow-y:auto;
}
#schedDlg.on{display:block}
.sbox{
  max-width:470px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 18px 44px rgba(20,19,17,.26);padding:20px 22px 18px;
}
.sbox h3{margin:0 0 14px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=time],.field input[type=date],.field select{
  width:100%;border:1px solid var(--line);border-radius:3px;
  padding:6px 9px;font-size:13.5px;background:var(--paper);
}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.days{display:flex;gap:4px;flex-wrap:wrap}
.daybtn{
  width:35px;height:31px;border:1px solid var(--line);border-radius:3px;
  font-size:12px;color:var(--muted);
}
.daybtn.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.two{display:flex;gap:10px}
.two .field{flex:1}

/* ---------- doc mode ---------- */
#editor.doc{max-width:860px;background:var(--panel);border-color:var(--line);border-radius:var(--radius)}
#editor.doc #edTitle,#editor.doc #edBody{font-family:var(--serif)}
#editor.doc #edBody{min-height:440px;font-size:15.5px}
#editor.doc #edRule{background:var(--line)}
#editor.doc #edFoot{border-top-color:var(--line)}
#editor.doc #edProj{border-color:var(--line)}
.modeswitch{display:flex;gap:2px;margin-right:auto}
.modeswitch button{
  font-size:12px;padding:3px 9px;border-radius:3px;color:var(--muted);
  border:1px solid transparent;
}
.modeswitch button.on{border-color:var(--line);color:var(--ink);background:var(--paper)}
#edRead{display:none;flex-direction:column;gap:10px;min-height:300px}
#edRead.on{display:flex}
.blk{position:relative;padding-right:60px}
.blk p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
.blk h2{margin:10px 0 0;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.blk h3{margin:8px 0 0;font-family:var(--serif);font-size:16.5px;font-weight:600}
.blk ul{margin:0;padding-left:20px;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.blk pre{
  margin:0;background:var(--paper);border:1px solid var(--line);
  border-radius:4px;padding:10px 12px;overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;
}
.blkcopy{
  position:absolute;top:2px;right:0;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:2px 7px;
  background:var(--panel);opacity:0;
}
.blk:hover .blkcopy,.blkcopy:focus{opacity:1}
.blkcopy:hover{border-color:var(--accent);color:var(--accent-ink)}
.blkcopy.ok{color:var(--accent-ink);border-color:var(--accent);opacity:1}

/* ---------- whiteboard ---------- */
#editor.board{
  max-width:min(1180px,96vw);background:var(--panel);
  border-color:var(--line);border-radius:var(--radius);
  padding:14px 14px 12px;gap:8px;
}
#inkbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#inkbar .tool{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:4px 10px;font-size:12.5px;color:var(--muted);
}
#inkbar .tool.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
#inkbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.swatch{
  width:21px;height:21px;border-radius:50%;border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);
}
.swatch.on{border-color:var(--accent)}
#inkWrap{
  border:1px solid var(--line);border-radius:4px;background:#fff;
  overflow:auto;max-height:64vh;touch-action:pan-y;
}
#inkCanvas{display:block;touch-action:none;cursor:crosshair}
#inkFoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#inkFoot .btn{padding:4px 10px;font-size:12.5px}
#inkText{
  font-family:var(--serif);font-size:15px;line-height:1.6;white-space:pre-wrap;
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  padding:10px 12px;max-height:180px;overflow-y:auto;display:none;
}
#inkText.on{display:block}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

/* ---------- sign in (rendered by store.js when there's no session) ---------- */
#slateLogin{
  position:fixed;inset:0;z-index:200;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  padding:24px max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
}
#slateLogin form{
  width:100%;max-width:330px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px 22px 22px;
}
#slateLogin .lbrand{
  display:flex;align-items:center;gap:9px;
  font-size:19px;font-weight:600;letter-spacing:-.01em;
}
#slateLogin .lbrand .mark{
  width:15px;height:15px;border-radius:2px;background:var(--accent);
  transform:rotate(-8deg);flex:0 0 auto;
}
#slateLogin .lsub{margin:6px 0 20px;font-size:13px;color:var(--muted)}
#slateLogin label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
#slateLogin input{
  width:100%;border:1px solid var(--line);border-radius:3px;background:var(--paper);
  padding:10px 11px;font-size:16px;margin-bottom:14px;min-height:44px;
}
#slateLogin input:focus{border-color:var(--accent);outline:none}
#slateLogin button{
  width:100%;background:var(--accent);border:1px solid var(--accent);
  border-radius:var(--radius);color:var(--panel);
  padding:11px;font-size:15px;font-weight:500;min-height:46px;
}
#slateLogin button:disabled{opacity:.6}
#slateLogin .lerr{
  margin:12px 0 0;font-size:13px;color:var(--danger);line-height:1.45;min-height:1px;
}
#slateLogin .lerr:empty{margin:0}

/* same for the floating dialogs — must sit after their own padding shorthands */
#overlay,#taskDlg,#schedDlg,#confirm{
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}

/* agenda is phone-only */
.agenda{display:none}
.agday{margin-bottom:16px}
.agday h4{
  margin:0 0 7px;font-size:12px;font-weight:500;color:var(--muted);
  display:flex;align-items:center;gap:9px;
}
.agday h4::after{content:"";flex:1;height:1px;background:var(--line)}
.agday.is-today h4{color:var(--accent-ink)}
.agrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);margin-bottom:7px;min-height:48px;
}
.agrow .tm{
  font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  flex:0 0 58px;
}
.agrow .ot{flex:1;font-size:14.5px;word-break:break-word}
.agrow.done{opacity:.55}
.agrow.done .ot{text-decoration:line-through}
.agrow .tick{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;
}
.agrow.done .tick{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.agempty{font-size:13px;color:var(--muted);padding:6px 0 2px}

/* ---------- bottom nav (phones) ---------- */
#bottomnav{
  display:none;
  position:sticky;bottom:0;z-index:35;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#bottomnav .bn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px 6px;min-height:52px;color:var(--muted);
}
#bottomnav .bn .ic{font-size:17px;line-height:1}
#bottomnav .bn .bl{font-size:10.5px;letter-spacing:.01em}
#bottomnav .bn.on{color:var(--accent-ink)}
#bottomnav .bn.on .ic{transform:translateY(-1px)}

/* ---------- tablet ----------
   iPads sit here, including portrait (744–834px): they keep the persistent rail
   and the month grid rather than inheriting the phone layout. */
@media (max-width:1080px) and (min-width:721px){
  #body{grid-template-columns:200px minmax(0,1fr)}
  .board{scroll-snap-type:x proximity}
  .col{scroll-snap-align:start}
  #mainhead{padding:18px 18px 0}
  #mainbody{padding:16px 18px 40px}
  .calday{min-height:88px}
  .occ{font-size:11px;padding:3px 4px;gap:4px}
}

/* narrow tablets: the month grid has ~70px per column, so the time label goes
   and the title takes the room */
@media (max-width:900px) and (min-width:721px){
  .occ .tm{display:none}
  .calday{min-height:76px;padding:4px 4px 6px}
  .caldow{padding:5px 5px;font-size:11px}
}

/* ---------- phone ---------- */
@media (max-width:720px){
  #body{grid-template-columns:1fr}
  #rail{
    position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);z-index:50;
    transform:translateX(-100%);transition:transform .2s ease;
    box-shadow:0 0 40px rgba(20,19,17,.28);
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    overscroll-behavior:contain;
  }
  #rail.open{transform:none}
  #railScrim{
    display:none;position:fixed;inset:0;z-index:45;
    background:rgba(20,19,17,.34);
  }
  #railScrim.on{display:block}

  #topbar{
    height:auto;min-height:52px;padding:0 12px;gap:10px;
    padding-top:env(safe-area-inset-top);
  }
  #railToggle{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;margin-left:-6px;font-size:19px;color:var(--ink);
    border-radius:var(--radius);
  }
  .brand .sub{display:none}
  .brand .word{font-size:16px}
  #whoami .nm{display:none}
  #whoami img{width:28px;height:28px}
  #search{
    max-width:none;font-size:16px;padding:8px 11px;min-height:38px;
  }

  #mainhead{padding:14px 15px 0}
  #capture{margin:12px 15px 0;padding:11px 13px 10px}
  #capInput{font-size:16px;min-height:40px}
  #capFoot .btn{padding:8px 15px;font-size:14px;min-height:38px}
  .thumb button{width:26px;height:26px;font-size:15px;line-height:26px;top:3px;right:3px}
  #mainbody{padding:14px 15px 28px}

  /* headline + actions stack */
  #projTitle{font-size:22px}
  .head-actions{margin-left:0;width:100%;gap:7px;flex-wrap:wrap}
  .head-actions .btn{min-height:38px;padding:7px 13px;font-size:13.5px}
  .title-row{gap:8px}

  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 13px;font-size:14px;flex:0 0 auto}

  /* board: one column per screen, snapped */
  .board{
    gap:12px;scroll-snap-type:x mandatory;
    margin:0 -15px;padding:0 15px 10px;
  }
  .col{flex:0 0 86vw;max-width:none;max-height:none;scroll-snap-align:center}
  .col-body{max-height:none}
  .addtask{font-size:16px;padding:9px 11px}
  /* keep room for the grip — this rule comes after the (hover:none) block, so a

  .card{padding:11px 12px 11px 30px}
  .card .ttl{font-size:15px}

  /* list: tick + title only; tap a row for status, due and owner */
  .list th{display:none}
  .list .c-st,.list .c-due,.list .c-who{display:none}
  .list td{padding:12px 8px;font-size:15px}
  .list input[type=checkbox]{width:21px;height:21px}
  .rowx{font-size:21px;padding:6px 9px}

  .notes{grid-template-columns:1fr;gap:10px}
  .feed{max-width:none}
  .fitem{padding:13px 14px 11px}
  .tagchip{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;font-size:13px}

  /* calendar becomes an agenda — a 7-col grid is unreadable here */
  .calgrid{display:none}
  .agenda{display:block}
  .calbar .mon{font-size:17px;flex:1;min-width:0}
  .calbar .nav{width:38px;height:38px;font-size:17px}
  .calbar .btn{min-height:38px}

  #bottomnav{display:flex}

  /* every overlay becomes a full-height sheet */
  #overlay,#schedDlg,#taskDlg{padding:0;background:var(--paper)}
  #editor,#editor.doc,#editor.board,.sbox{
    max-width:none;margin:0;min-height:100dvh;border:0;border-radius:0;
    box-shadow:none;
    padding:calc(14px + env(safe-area-inset-top)) 15px calc(15px + env(safe-area-inset-bottom));
  }
  #edTitle{font-size:21px}
  #edBody{font-size:16px;min-height:44vh}
  #editor.doc #edBody{min-height:44vh;font-size:16px}
  #edFoot{
    position:sticky;bottom:0;background:var(--note);
    /* auto top margin pins the footer to the bottom of the sheet when the note is

    margin:auto -15px 0;padding:10px 15px calc(6px + env(safe-area-inset-bottom));
    gap:7px;

  #editor.doc #edFoot,#editor.board #edFoot{background:var(--panel)}
  #edFoot .btn{min-height:38px;padding:7px 12px}
  /* 16px or iOS zooms the sheet when the select takes focus */
  #edProj,#edSpace{font-size:16px;padding:7px 9px;min-height:38px;flex:1;min-width:120px}
  #edFoot label{display:none}
  #edStatus{width:100%;order:9}
  .modeswitch{width:100%;order:-1}
  .modeswitch button{flex:1;padding:8px;font-size:13.5px}
  .blk{padding-right:0}
  .blk pre{white-space:pre-wrap;word-break:break-word}
  .blkcopy{position:static;display:block;margin-top:7px;padding:7px 12px;font-size:13px}

  #inkbar{gap:6px}
  #inkbar .tool{min-height:38px;padding:7px 12px;font-size:13.5px}
  .swatch{width:34px;height:34px}
  #inkWrap{max-height:none}
  #inkFoot .btn{min-height:38px}
  #inkHint{width:100%}

  .daybtn{width:44px;height:42px;font-size:13px}

    margin:auto -15px 0;position:sticky;bottom:0;background:var(--panel);

  .rail-item{padding-top:9px;padding-bottom:9px;font-size:15px}

  .rail-head button{font-size:20px;padding:8px 12px}
  #amenu{min-width:min(86vw,260px)}

}

@media (max-width:430px){
  .two{flex-direction:column;gap:0}

  .calbar .btn.primary{width:100%;margin-left:0}
}

/* very narrow phones */
@media (max-width:380px){
  #bottomnav .bn .bl{font-size:9.5px}
  .col{flex:0 0 90vw}
  .brand .word{display:none}
}

<body>

<div id="shell">

    <div id="whoami"></div>
  </header>

  <div id="banner"></div>

  <div id="body">
    <div id="railScrim"></div>
    <aside id="rail"></aside>
    <main id="main">
      <div id="mainhead"></div>
      <div id="capture">
        <textarea id="capInput" rows="1" placeholder="Get it out of your head. Enter saves it."></textarea>

<script>
(function(){
"use strict";

/* ============ constants ============ */
var STATUSES = [
  {id:"backlog", label:"Backlog"},
  {id:"doing",   label:"In progress"},
  {id:"review",  label:"Review"},
  {id:"done",    label:"Done"}
];
var STATUS_LABEL = {};
STATUSES.forEach(function(s){ STATUS_LABEL[s.id] = s.label; });

/* ============ state ============ */
var S = {
  db:null, user:null, assets:null, sample:null, canSampleImages:false,
  uid:null, me:null,
  canWrite:null,          // true / false / null (unknown)
  projects:[], spaces:[], tasks:[], notes:[], schedules:[],
  sel:"feed",             // "feed" | "all" | "unfiled" | projectId
  space:null,             // spaceId within the selected project, or null for all
  tab:"board",
  q:"",
  tag:null,
  capImages:[],
  calMonth:null,          // Date on the 1st of the shown month
  newSpaceFor:null,
  editSched:null,
  docMode:"write",
  composing:{col:null, text:""},
  newProject:false, newProjectText:"",
  openNote:null,
  ready:false
};

var $ = function(s){ return document.querySelector(s); };
var railEl=$("#rail"), headEl=$("#mainhead"), bodyEl=$("#mainbody");

/* ============ helpers ============ */
function esc(s){ return String(s==null?"":s); }
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function nowISO(){ return new Date().toISOString(); }

var toastT;
function toast(msg){
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}
function banner(msg){
  var b = $("#banner");
  if(!msg){ b.classList.remove("on"); return; }
  b.textContent = msg;
  b.classList.add("on");
}

/* a dialog that works inside a sandboxed frame, unlike confirm() */
function askConfirm(title, body, yesLabel){
  return new Promise(function(resolve){
    var box = $("#confirm"), yes = $("#cYes"), no = $("#cNo");
    $("#cTitle").textContent = title;
    $("#cBody").textContent = body;
    yes.textContent = yesLabel || "Delete";
    box.classList.add("on");
    yes.focus();
    function done(v){
      box.classList.remove("on");
      yes.onclick = no.onclick = null;
      box.onmousedown = null;
      document.removeEventListener("keydown", key);
      resolve(v);
    }
    function key(e){ if(e.key === "Escape"){ e.stopPropagation(); done(false); } }
    yes.onclick = function(){ done(true); };
    no.onclick = function(){ done(false); };
    box.onmousedown = function(e){ if(e.target === box) done(false); };
    document.addEventListener("keydown", key);
  });
}

/* swap a node's contents for a text input; Enter or blur saves, Escape cancels */
function inlineEdit(container, current, onSave){
  container.textContent = "";
  var i = document.createElement("input");
  i.type = "text";
  i.className = "inline-edit";
  i.value = current || "";
  container.appendChild(i);
  i.focus();
  i.select();
  var closed = false;
  function finish(save){
    if(closed) return;
    closed = true;
    var v = i.value.trim();
    if(save && v && v !== current) onSave(v);
    else render();
  }
  i.onkeydown = function(e){
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); finish(true); }
    else if(e.key === "Escape"){ e.preventDefault(); finish(false); }
  };
  i.onblur = function(){
    if(!i.isConnected){ closed = true; return; }
    finish(true);
  };
  i.onclick = function(e){ e.stopPropagation(); };
}

function prefGet(k, d){
  try{ var v = localStorage.getItem("slate:"+k); return v==null?d:v; }catch(e){ return d; }
}
function prefSet(k, v){
  try{ localStorage.setItem("slate:"+k, v); }catch(e){}
}

/* one write at a time per document path */
var chains = new Map();
function queue(path, fn){
  var prev = chains.get(path) || Promise.resolve();
  var next = prev.catch(function(){}).then(fn).catch(function(e){ dbErr(e); });
  chains.set(path, next);
  return next;
}
function dbErr(e){
  var code = (e && e.code) || "unavailable";
  if(code === "invalid_argument"){
    S.canWrite = false;
    banner("You have read-only access to this board, so changes aren't saved.");
    render();
  } else if(code === "quota_exceeded"){
    toast("This board is full. Delete some tasks or notes to add more.");
  } else if(code === "resource_exhausted"){
    toast("Too many changes at once. Give it a second.");
  } else if(code === "revoked"){
    banner("Your access to this board changed. Reload to continue.");
  } else {
    toast("That change didn't save. Try again.");
  }
}
function writable(){ return S.canWrite !== false && !!S.db; }

function fmtDate(d){
  if(!d) return "";
  var p = d.split("-");
  if(p.length !== 3) return d;
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return mons[dt.getMonth()] + " " + dt.getDate();
}
function isLate(d, status){
  if(!d || status === "done") return false;
  var today = new Date(); today.setHours(0,0,0,0);
  var p = d.split("-");
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  return dt < today;
}
function relTime(iso){
  if(!iso) return "";
  var diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 60) return "just now";
  if(diff < 3600) return Math.floor(diff/60) + "m ago";
  if(diff < 86400) return Math.floor(diff/3600) + "h ago";
  if(diff < 604800) return Math.floor(diff/86400) + "d ago";
  return fmtDate(iso.slice(0,10));
}
/* ---- tags, links, days ---- */
var TAG_RE = /#([\w-]{1,32})/g;
var URL_RE = /(https?:\/\/[^\s<>()]+)/g;

function tagsOf(n){
  var out = [], m;
  var hay = (n.title || "") + " " + (n.body || "");
  TAG_RE.lastIndex = 0;
  while((m = TAG_RE.exec(hay)) !== null){
    var t = m[1].toLowerCase();
    if(out.indexOf(t) === -1) out.push(t);
  }
  return out;
}
function allTags(notes){
  var counts = {};
  notes.forEach(function(n){
    tagsOf(n).forEach(function(t){ counts[t] = (counts[t]||0) + 1; });
  });
  return Object.keys(counts).sort(function(a,b){
    return counts[b] - counts[a] || a.localeCompare(b);
  }).map(function(t){ return {tag:t, n:counts[t]}; });
}

/* text with #tags and links made live, built as nodes (never innerHTML) */
function richText(container, text){
  var parts = String(text || "").split(/(\s+)/);
  parts.forEach(function(p){
    if(!p) return;
    if(/^#[\w-]{1,32}$/.test(p)){
      var s = el("span","tagref", p);
      s.onclick = function(e){
        e.stopPropagation();
        S.tag = p.slice(1).toLowerCase();
        if(S.sel !== "feed" && S.tab !== "notes") S.sel = "feed";
        render();
      };
      container.appendChild(s);
    } else if(/^https?:\/\//.test(p)){
      var a = document.createElement("a");
      a.href = p; a.textContent = p;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.onclick = function(e){ e.stopPropagation(); };
      container.appendChild(a);
    } else {
      container.appendChild(document.createTextNode(p));
    }
  });
}

/* a card that can contain links, so not a <button> */
function clickable(cls, onActivate){
  var d = el("div", cls);
  d.setAttribute("role","button");
  d.tabIndex = 0;
  d.onclick = function(e){
    if(e.target.closest && e.target.closest("a, .tagref")) return;
    onActivate();
  };
  d.onkeydown = function(e){
    if(e.key === "Enter" || e.key === " "){
      if(e.target !== d) return;
      e.preventDefault();
      onActivate();
    }
  };
  return d;
}

function dayKey(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
}
function dayLabel(iso){
  if(!iso) return "";
  var d = new Date(iso), now = new Date();
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((b - a) / 86400000);
  if(days === 0) return "Today";
  if(days === 1) return "Yesterday";
  var mons = ["January","February","March","April","May","June","July",
              "August","September","October","November","December"];
  var s = mons[d.getMonth()] + " " + d.getDate();
  if(d.getFullYear() !== now.getFullYear()) s += ", " + d.getFullYear();
  return s;
}

function projName(id){
  for(var i=0;i<S.projects.length;i++) if(S.projects[i].id === id) return S.projects[i].name || "Untitled project";
  return null;
}
function spaceName(id){
  for(var i=0;i<S.spaces.length;i++) if(S.spaces[i].id === id) return S.spaces[i].name || "Untitled space";
  return null;
}
function spacesOf(projectId){
  return S.spaces.filter(function(s){ return s.projectId === projectId; })
    .sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
function currentProject(){
  return (S.sel !== "all" && S.sel !== "unfiled" && S.sel !== "feed") ? S.sel : null;
}

/* ============ selectors ============ */
function visibleTasks(){
  var q = S.q.toLowerCase();
  return S.tasks.filter(function(t){
    if(S.sel === "unfiled" || S.sel === "feed") return false;
    if(S.sel !== "all" && t.projectId !== S.sel) return false;
    if(S.space && t.spaceId !== S.space) return false;
    if(q && String(t.title||"").toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort(function(a,b){ return (a.order||0) - (b.order||0); });
}
function visibleNotes(){
  var q = S.q.toLowerCase();
  return S.notes.filter(function(n){
    if(S.sel === "unfiled"){ if(n.projectId) return false; }
    else if(S.sel !== "all" && S.sel !== "feed"){
      if(n.projectId !== S.sel) return false;
      if(S.space && n.spaceId !== S.space) return false;
    }
    if(S.tag && tagsOf(n).indexOf(S.tag) === -1) return false;
    if(q){
      var hay = (String(n.title||"") + " " + String(n.body||"")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function(a,b){
    return String(b.updatedAt||"").localeCompare(String(a.updatedAt||""));
  });
}
function visibleSchedules(){
  return S.schedules.filter(function(s){
    if(S.sel === "all") return true;
    if(S.sel !== s.projectId) return false;
    if(S.space && s.spaceId !== S.space) return false;
    return true;
  }).sort(function(a,b){ return String(a.time||"").localeCompare(String(b.time||"")); });
}

/* ============ writes ============ */
/* ---- spaces ---- */
function createSpace(projectId, name){
  if(!writable() || !String(name||"").trim()) return;
  var id = uid();
  var maxOrder = spacesOf(projectId).reduce(function(m,s){ return Math.max(m, s.order||0); }, 0);
  queue("spaces/"+id, function(){
    return S.db.doc("spaces/"+id).set({
      projectId: projectId,
      name: String(name).trim(),
      order: maxOrder + 1,
      createdAt: nowISO(),
      createdBy: S.uid || null
    });
  }).then(function(){ S.space = id; render(); });
}
function renameSpace(id, name){
  if(!writable()) return;
  queue("spaces/"+id, function(){ return S.db.doc("spaces/"+id).update({ name: name }); });
}
function deleteSpace(id){
  if(!writable()) return;
  var n = S.tasks.filter(function(t){ return t.spaceId === id; }).length +
          S.notes.filter(function(x){ return x.spaceId === id; }).length;
  askConfirm("Delete " + (spaceName(id) || "this space") + "?",
    n ? "Its " + n + " item" + (n===1?"":"s") + " stay in the project, just without a space."
      : "Nothing is in it yet.",
    "Delete space").then(function(ok){
    if(!ok) return;
    S.tasks.filter(function(t){ return t.spaceId === id; }).forEach(function(t){
      queue("tasks/"+t.id, function(){ return S.db.doc("tasks/"+t.id).update({ spaceId:null }); });
    });
    S.notes.filter(function(x){ return x.spaceId === id; }).forEach(function(x){
      queue("notes/"+x.id, function(){ return S.db.doc("notes/"+x.id).update({ spaceId:null }); });
    });
    S.schedules.filter(function(x){ return x.spaceId === id; }).forEach(function(x){
      queue("schedules/"+x.id, function(){ return S.db.doc("schedules/"+x.id).update({ spaceId:null }); });
    });
    queue("spaces/"+id, function(){ return S.db.doc("spaces/"+id).delete(); })
      .then(function(){ if(S.space === id) S.space = null; render(); });
  });
}

/* ---- schedules ---- */
function saveSchedule(id, data){
  if(!writable()) return Promise.resolve();
  var sid = id || uid();
  if(id){
    return queue("schedules/"+sid, function(){ return S.db.doc("schedules/"+sid).update(data); });
  }
  data.done = {};
  data.createdAt = nowISO();
  data.createdBy = S.uid || null;
  return queue("schedules/"+sid, function(){ return S.db.doc("schedules/"+sid).set(data); });
}
function deleteSchedule(id){
  if(!writable()) return;
  queue("schedules/"+id, function(){ return S.db.doc("schedules/"+id).delete(); });
}
function toggleOccurrence(sched, dateStr){
  if(!writable()) return;
  var done = Object.assign({}, sched.done || {});
  if(done[dateStr]) delete done[dateStr]; else done[dateStr] = true;
  queue("schedules/"+sched.id, function(){
    return S.db.doc("schedules/"+sched.id).update({ done: done });
  });
}

function createProject(name){
  if(!writable()) return;
  var id = uid();
  var maxOrder = S.projects.reduce(function(m,p){ return Math.max(m, p.order||0); }, 0);
  queue("projects/"+id, function(){
    return S.db.doc("projects/"+id).set({
      name: name || "New project",
      order: maxOrder + 1,
      createdAt: nowISO(),
      createdBy: S.uid || null
    });
  }).then(function(){ S.sel = id; S.tab = "board"; render(); });
}
function renameProject(id, name){
  if(!writable()) return;
  queue("projects/"+id, function(){
    return S.db.doc("projects/"+id).update({ name: name });
  });
}
function deleteProject(id){
  if(!writable()) return;
  var tasks = S.tasks.filter(function(t){ return t.projectId === id; });
  var notes = S.notes.filter(function(n){ return n.projectId === id; });
  var msg = tasks.length + " task" + (tasks.length===1?"":"s") + " will be deleted with it. " +
            notes.length + " note" + (notes.length===1?"":"s") + " will move to Unfiled notes.";
  askConfirm("Delete " + (projName(id) || "this project") + "?", msg, "Delete project").then(function(ok){
    if(!ok) return;
    tasks.forEach(function(t){ queue("tasks/"+t.id, function(){ return S.db.doc("tasks/"+t.id).delete(); }); });
    notes.forEach(function(n){ queue("notes/"+n.id, function(){ return S.db.doc("notes/"+n.id).update({ projectId:null }); }); });
    queue("projects/"+id, function(){ return S.db.doc("projects/"+id).delete(); })
      .then(function(){ S.sel = "all"; render(); });
  });
}

function createTask(title, status, projectId, spaceId){
  if(!writable() || !String(title||"").trim()) return;
  var id = uid();
  var inCol = S.tasks.filter(function(t){ return t.status === status; });
  var maxOrder = inCol.reduce(function(m,t){ return Math.max(m, t.order||0); }, 0);
  queue("tasks/"+id, function(){
    return S.db.doc("tasks/"+id).set({
      title: String(title).trim(),
      status: status,
      projectId: projectId || null,
      spaceId: spaceId || null,
      assignee: null,
      due: null,
      order: maxOrder + 1,
      createdAt: nowISO(),
      createdBy: S.uid || null,
      updatedAt: nowISO()
    });
  });
}
function patchTask(id, patch){
  if(!writable()) return;
  patch.updatedAt = nowISO();

/* a captured note: first line becomes the name, the rest is the body */
function captureNote(text, images, projectId){
  if(!writable()) return Promise.resolve();
  var raw = String(text || "").replace(/\r/g,"");
  if(!raw.trim() && !(images && images.length)) return Promise.resolve();
  var lines = raw.split("\n");
  var title = "", body = raw.trim();
  if(lines.length > 1 && lines[0].trim() && lines[0].trim().length <= 70){
    title = lines[0].trim();
    body = lines.slice(1).join("\n").trim();
  } else if(lines.length === 1 && raw.trim().length <= 70){
    title = raw.trim();
    body = "";
  }
  var id = uid();
  return queue("notes/"+id, function(){
    return S.db.doc("notes/"+id).set({
      title: title,
      body: body,
      kind: "note",
      images: images ? images.slice() : [],
      projectId: projectId || null,
      spaceId: (projectId && S.space) ? S.space : null,
      createdAt: nowISO(),
      createdBy: S.uid || null,
      updatedAt: nowISO(),
      updatedBy: S.uid || null
    });
  });
}

function noteToTask(n){
  if(!writable()) return;
  var title = (n.title && n.title.trim()) || String(n.body||"").split("\n")[0].trim() || "Untitled";
  if(title.length > 120) title = title.slice(0,117) + "…";
  createTask(title, "backlog", n.projectId || null, n.spaceId || null);
  toast(n.projectId ? "Added to " + (projName(n.projectId) || "the board")
                    : "Added to Everything — file it into a project from the board");
}

/* Pointer-based dragging. HTML5 drag-and-drop does nothing on touch, so
   cards move by pointer events instead: drag the grip on any device, or
   drag the card body with a mouse. */
var drag = null;

function attachDrag(card, grip, t){
  grip.addEventListener("pointerdown", function(e){ startDrag(e, card, t, true); });
  card.addEventListener("pointerdown", function(e){
    if(e.pointerType !== "mouse") return;          // touch drags via the grip only
    if(e.target.closest(".grip")) return;
    startDrag(e, card, t, false);
  });
}

function startDrag(e, card, t, immediate){
  if(!writable()) return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  var pid = e.pointerId;
  var sx = e.clientX, sy = e.clientY;
  var began = false;

  function begin(){
    began = true;
    var r = card.getBoundingClientRect();
    var ghost = card.cloneNode(true);
    var g = ghost.querySelector(".grip");
    if(g) g.remove();
    ghost.className = "card dragghost";
    ghost.style.width = r.width + "px";
    drag = { id: t.id, card: card, ghost: ghost, ox: sx - r.left, oy: sy - r.top, col: null };
    document.body.appendChild(ghost);
    moveGhost(sx, sy);
    card.classList.add("dragging");
    document.body.classList.add("dragging-now");
    if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(err){} }
  }
  function moveGhost(x, y){
    drag.ghost.style.left = (x - drag.ox) + "px";
    drag.ghost.style.top  = (y - drag.oy) + "px";
  }
  function onMove(ev){
    if(ev.pointerId !== pid) return;
    if(!began){
      if(Math.abs(ev.clientX-sx) + Math.abs(ev.clientY-sy) < 7) return;
      begin();
    }
    ev.preventDefault();
    moveGhost(ev.clientX, ev.clientY);
    var col = columnAt(ev.clientX, ev.clientY);
    if(drag.col && drag.col !== col) drag.col.classList.remove("over");
    drag.col = col;
    if(col) col.classList.add("over");
    autoPan(ev.clientX);
  }
  function onUp(ev){
    if(ev.pointerId !== pid) return;
    cleanup();
    if(!began) return;
    justDragged = true;
    setTimeout(function(){ justDragged = false; }, 120);
    var col = columnAt(ev.clientX, ev.clientY);
    if(col){
      var body = col.querySelector(".col-body");
      dropOn(t.id, col.dataset.status, ev.clientY, body);
    }
  }
  function cleanup(){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    clearTimeout(panT);
    if(!began) return;
    if(drag){
      if(drag.col) drag.col.classList.remove("over");
      if(drag.ghost) drag.ghost.remove();
      drag.card.classList.remove("dragging");
      drag = null;
    }
    document.body.classList.remove("dragging-now");
  }

  document.addEventListener("pointermove", onMove, {passive:false});
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
  if(immediate){ e.preventDefault(); begin(); }
}

function columnAt(x, y){
  if(drag && drag.ghost) drag.ghost.style.pointerEvents = "none";
  var n = document.elementFromPoint(x, y);
  return n && n.closest ? n.closest(".col") : null;
}

/* nudge the board sideways when a card is dragged to the edge */
var panT = null;
function autoPan(x){
  var board = document.querySelector(".board");
  if(!board) return;
  clearTimeout(panT);
  var r = board.getBoundingClientRect();
  var d = 0;
  if(x > r.right - 56) d = 16;
  else if(x < r.left + 56) d = -16;
  if(!d) return;
  board.scrollLeft += d;
  panT = setTimeout(function(){ autoPan(x); }, 16);
}

function dropOn(id, status, clientY, colBody){
  var task = null;
  for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id === id) task = S.tasks[i];
  if(!task) return;

  var siblings = visibleTasks().filter(function(t){ return t.status === status && t.id !== id; });
  var cards = Array.prototype.slice.call(colBody.querySelectorAll(".card"))
    .filter(function(c){ return c.dataset.id !== id; });

  var idx = cards.length;
  for(var j=0;j<cards.length;j++){
    var r = cards[j].getBoundingClientRect();
    if(clientY < r.top + r.height/2){ idx = j; break; }
  }
  var before = idx > 0 ? siblings[idx-1] : null;
  var after  = idx < siblings.length ? siblings[idx] : null;
  var order;
  if(before && after) order = ((before.order||0) + (after.order||0)) / 2;
  else if(before)     order = (before.order||0) + 1;
  else if(after)      order = (after.order||0) - 1;
  else                order = 1;

  if(task.status === status && task.order === order) return;
  patchTask(id, { status: status, order: order });
}

/* ============ render: calendar ============ */
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MONTHS = ["January","February","March","April","May","June","July",
              "August","September","October","November","December"];

function ymd(d){
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
}
function parseYmd(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length !== 3) return null;
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function fmtTime(t){
  if(!t) return "";
  var p = t.split(":");
  var h = +p[0], m = p[1] || "00";
  var ap = h >= 12 ? "pm" : "am";
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  return h12 + (m === "00" ? "" : ":" + m) + ap;
}
/* does this schedule fall on this date? */
function occursOn(s, date){
  var start = parseYmd(s.startDate);
  if(start && date < start) return false;
  var end = parseYmd(s.endDate);
  if(end){ var e = new Date(end); e.setHours(23,59,59); if(date > e) return false; }
  if(s.freq === "daily") return true;
  if(s.freq === "monthly") return date.getDate() === (+s.dayOfMonth || 1);
  var days = s.days || [];
  return days.indexOf(date.getDay()) !== -1;
}

function renderCalendar(){
  if(!S.calMonth){
    var now = new Date();
    S.calMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  var m = S.calMonth;

  var bar = el("div","calbar");
  var prev = el("button","nav","‹");
  prev.setAttribute("aria-label","Previous month");
  prev.onclick = function(){ S.calMonth = new Date(m.getFullYear(), m.getMonth()-1, 1); render(); };
  var next = el("button","nav","›");
  next.setAttribute("aria-label","Next month");
  next.onclick = function(){ S.calMonth = new Date(m.getFullYear(), m.getMonth()+1, 1); render(); };
  bar.appendChild(prev);
  bar.appendChild(next);
  bar.appendChild(el("span","mon", MONTHS[m.getMonth()] + " " + m.getFullYear()));
  var today = el("button","btn quiet","Today");
  today.onclick = function(){
    var n = new Date();
    S.calMonth = new Date(n.getFullYear(), n.getMonth(), 1);
    render();
  };
  bar.appendChild(today);
  if(writable() && currentProject()){
    var addS = el("button","btn primary","New repeating item");
    addS.style.marginLeft = "auto";
    addS.onclick = function(){ openSchedule(null); };
    bar.appendChild(addS);
  }
  bodyEl.appendChild(bar);

  var scheds = visibleSchedules();
  var tasks = visibleTasks().filter(function(t){ return t.due; });
  var todayStr = ymd(new Date());

  var grid = el("div","calgrid");
  DOW.forEach(function(d){ grid.appendChild(el("div","caldow", d)); });

  var first = new Date(m.getFullYear(), m.getMonth(), 1);
  var cur = new Date(first);
  cur.setDate(1 - first.getDay());
  for(var i=0;i<42;i++){
    grid.appendChild(calCell(new Date(cur), m, scheds, tasks, todayStr));
    cur.setDate(cur.getDate() + 1);
  }
  bodyEl.appendChild(grid);
  bodyEl.appendChild(calAgenda(m, scheds, tasks, todayStr));

  if(scheds.length){
    var list = el("div","schedlist");
    scheds.forEach(function(s){
      var r = el("div","schedrow");
      r.appendChild(el("span","sn", s.title || "Untitled"));
      var when = s.freq === "daily" ? "Every day"
        : s.freq === "monthly" ? "Day " + (s.dayOfMonth || 1) + " each month"
        : (s.days || []).map(function(d){ return DOW[d]; }).join(" ") || "No days set";
      r.appendChild(el("span","sw", when + " · " + fmtTime(s.time)));
      if(s.spaceId){
        var sn = spaceName(s.spaceId);
        if(sn) r.appendChild(el("span","chip proj", sn));
      }
      if(writable()){
        var ed = el("button","btn quiet","Edit");
        ed.onclick = function(){ openSchedule(s); };
        r.appendChild(ed);
      }
      list.appendChild(r);
    });
    bodyEl.appendChild(list);
  } else if(!currentProject()){
    bodyEl.appendChild(emptyBlock("No repeating items yet",
      "Open a project to set one up — like Instagram posts, Monday to Friday at 8am.", null));
  }
}

/* one day cell — its own function so each handler keeps its own date */
function calCell(d, m, scheds, tasks, todayStr){
  var ds = ymd(d);
  var inMonth = d.getMonth() === m.getMonth();
  var cell = el("div","calday" + (inMonth ? "" : " off") + (ds === todayStr ? " today" : ""));
  cell.appendChild(el("div","dn", String(d.getDate())));

  scheds.forEach(function(s){
    if(!occursOn(s, d)) return;
    var done = !!(s.done && s.done[ds]);
    var o = el("button","occ" + (done ? " done" : ""));
    o.appendChild(el("span","tm", fmtTime(s.time)));
    o.appendChild(el("span","ot", s.title || "Untitled"));
    o.title = (s.title || "Untitled") + " — click to mark it done, double-click to edit";
    o.onclick = function(){ toggleOccurrence(s, ds); };
    o.ondblclick = function(){ openSchedule(s); };
    cell.appendChild(o);
  });

  tasks.forEach(function(t){
    if(t.due !== ds) return;
    var o = el("button","occ task" + (t.status === "done" ? " done" : "") +
                        (isLate(t.due, t.status) ? " late" : ""));
    o.appendChild(el("span","ot", t.title || "Untitled"));
    o.title = "Task due — click to toggle done";
    o.onclick = function(){ patchTask(t.id, { status: t.status === "done" ? "backlog" : "done" }); };
    cell.appendChild(o);
  });
  return cell;
}

/* the phone view of a month: a scrollable agenda, only days that have something */
function calAgenda(m, scheds, tasks, todayStr){
  var wrap = el("div","agenda");
  var days = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  var any = false;

  for(var i=1;i<=days;i++){
    var d = new Date(m.getFullYear(), m.getMonth(), i);
    var ds = ymd(d);
    var items = [];

    scheds.forEach(function(s){
      if(occursOn(s, d)) items.push({kind:"sched", s:s, time:s.time || "", ds:ds});
    });
    tasks.forEach(function(t){
      if(t.due === ds) items.push({kind:"task", t:t, time:"", ds:ds});
    });
    if(!items.length) continue;
    any = true;
    items.sort(function(a,b){ return String(a.time).localeCompare(String(b.time)); });

    var sec = el("div","agday" + (ds === todayStr ? " is-today" : ""));
    var h = document.createElement("h4");
    h.textContent = DOW[d.getDay()] + " " + d.getDate() + (ds === todayStr ? " · today" : "");
    sec.appendChild(h);
    items.forEach(function(it){ sec.appendChild(agendaRow(it)); });
    wrap.appendChild(sec);
  }

  if(!any){
    wrap.appendChild(el("div","agempty",
      "Nothing scheduled this month. Add a repeating item and it fills in from here."));
  }
  return wrap;
}

function agendaRow(it){
  if(it.kind === "sched"){
    var done = !!(it.s.done && it.s.done[it.ds]);
    var r = el("button","agrow" + (done ? " done" : ""));
    var tick = el("span","tick","✓");
    r.appendChild(tick);
    r.appendChild(el("span","ot", it.s.title || "Untitled"));
    r.appendChild(el("span","tm", fmtTime(it.s.time)));
    r.onclick = function(){ toggleOccurrence(it.s, it.ds); };
    return r;
  }
  var t = it.t;
  var tr = el("button","agrow" + (t.status === "done" ? " done" : ""));
  var tk = el("span","tick","✓");
  tr.appendChild(tk);
  tr.appendChild(el("span","ot", t.title || "Untitled"));
  tr.appendChild(el("span","tm","task"));
  tr.onclick = function(){ patchTask(t.id, { status: t.status === "done" ? "backlog" : "done" }); };
  return tr;
}

/* ============ capture bar ============ */
var capEl = $("#capture"), capInput = $("#capInput"),
    capThumbs = $("#capThumbs"), capSave = $("#capSave"), capHint = $("#capHint");

function autosize(ta){
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 240) + "px";
}
function captureTarget(){
  return (S.sel !== "all" && S.sel !== "unfiled" && S.sel !== "feed") ? S.sel : null;
}
function updateCapture(){
  var show = writable() && (S.sel === "feed" || S.sel === "unfiled" || S.tab === "notes");
  capEl.classList.toggle("on", !!show);
  if(!show) return;
  var target = captureTarget();
  capInput.placeholder = target
    ? "Capture something for " + (projName(target) || "this project") + ". Enter saves it."
    : "Get it out of your head. Enter saves it.";
  capHint.textContent = S.assets
    ? "#tag anything · Shift+Enter for a new line · paste an image"
    : "#tag anything · Shift+Enter for a new line";
}
function drawCapThumbs(){
  capThumbs.textContent = "";
  S.capImages.forEach(function(id){
    var w = el("div","thumb");
    var im = document.createElement("img");
    im.src = SlateStore.blobUrl(id); im.alt = "";
    w.appendChild(im);
    var x = el("button",null,"×");
    x.setAttribute("aria-label","Remove image");
    x.onclick = function(){
      S.capImages = S.capImages.filter(function(i){ return i !== id; });
      drawCapThumbs();
      if(S.assets) S.assets.delete(id).catch(function(){});
    };
    w.appendChild(x);
    capThumbs.appendChild(w);
  });
}
function uploadImages(files, onId){
  if(!S.assets || !files || !files.length) return;
  Array.prototype.slice.call(files).forEach(function(f){
    if(!/^image\//.test(f.type)) return;
    S.assets.upload(f).then(function(r){ onId(r.id); }).catch(function(e){
      var c = (e && e.code) || "";
      if(c === "too_large") toast("That image is too big. 20 MB is the limit.");
      else if(c === "unsupported_type") toast("That file type can't be attached.");
      else if(c === "quota_or_state") toast("Image storage is full for this board.");
      else if(c === "rate_limited") toast("Slow down a moment — too many uploads.");
      else toast("That image didn't upload.");
    });
  });
}
function doCapture(){
  var text = capInput.value;
  if(!text.trim() && !S.capImages.length) return;
  var imgs = S.capImages.slice();
  capInput.value = "";
  S.capImages = [];
  drawCapThumbs();
  autosize(capInput);
  captureNote(text, imgs, captureTarget());
}
capInput.addEventListener("input", function(){ autosize(capInput); });
capInput.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doCapture(); }
});
capInput.addEventListener("paste", function(e){
  var items = e.clipboardData && e.clipboardData.files;
  if(items && items.length && S.assets){
    uploadImages(items, function(id){ S.capImages.push(id); drawCapThumbs(); });
  }
});
capSave.addEventListener("click", doCapture);
["dragenter","dragover"].forEach(function(ev){
  capEl.addEventListener(ev, function(e){ e.preventDefault(); capEl.classList.add("drag"); });
});
["dragleave","drop"].forEach(function(ev){
  capEl.addEventListener(ev, function(e){
    if(ev === "drop") e.preventDefault();
    capEl.classList.remove("drag");
  });
});
capEl.addEventListener("drop", function(e){
  if(e.dataTransfer && e.dataTransfer.files && S.assets){
    uploadImages(e.dataTransfer.files, function(id){ S.capImages.push(id); drawCapThumbs(); });
  }
});

var overlay = $("#overlay"), edTitle = $("#edTitle"), edBody = $("#edBody"),
    edProj = $("#edProj"), edStatus = $("#edStatus"), edImgs = $("#edImgs");
var saveT = null, dirty = false;

function currentNote(){
  for(var i=0;i<S.notes.length;i++) if(S.notes[i].id === S.openNote) return S.notes[i];
  return null;
}
function drawEdImgs(){
  edImgs.textContent = "";
  var n = currentNote();
  if(!n || !n.images || !n.images.length) return;
  n.images.forEach(function(id){
    var w = el("div","thumb");
    var im = document.createElement("img");
    im.src = SlateStore.blobUrl(id); im.alt = "";
    im.onerror = function(){ w.remove(); };
    w.appendChild(im);
    if(writable()){
      var x = el("button",null,"×");
      x.setAttribute("aria-label","Remove image");
      x.onclick = function(){
        askConfirm("Remove this image?", "It's deleted from the board for both of you.", "Remove")
          .then(function(ok){
            if(!ok) return;
            var cur = currentNote();
            if(!cur) return;
            var left = (cur.images||[]).filter(function(i){ return i !== id; });
            patchNote(cur.id, { images: left }).then(function(){
              if(S.assets) S.assets.delete(id).catch(function(){});
            });
          });
      };
      w.appendChild(x);
    }
    edImgs.appendChild(w);
  });
}

function noteKind(n){
  var k = n && n.kind;
  return (k === "doc" || k === "board") ? k : "note";
}

function openNote(id, fresh){
  var n = null;
  for(var i=0;i<S.notes.length;i++) if(S.notes[i].id === id) n = S.notes[i];
  if(!n) return;
  S.openNote = id;
  var kind = noteKind(n);
  var editor = $("#editor");
  editor.className = kind === "doc" ? "doc" : kind === "board" ? "board" : "";

  edTitle.value = n.title || "";
  edTitle.placeholder = kind === "doc" ? "Name this doc"
                      : kind === "board" ? "Name this page" : "Name this note";
  edBody.value = n.body || "";
  edTitle.disabled = edBody.disabled = edProj.disabled = !writable();

  /* which parts show for this kind */
  var isBoard = kind === "board", isDoc = kind === "doc";
  $("#inkbar").style.display = isBoard ? "" : "none";
  inkWrap.style.display = isBoard ? "" : "none";
  $("#inkFoot").style.display = isBoard ? "" : "none";
  inkTextEl.style.display = "";
  if(!isBoard) inkTextEl.classList.remove("on");
  $("#edModes").style.display = isDoc ? "" : "none";
  edBody.style.display = isBoard ? "none" : "";
  edBody.placeholder = isDoc
    ? "Paste your prompts here. Leave a blank line between each one."
    : "Write it down.";
  edRead.classList.remove("on");
  S.docMode = "write";
  if(isDoc) applyDocMode();

  fillProjSelect(n.projectId);
  fillSpaceSelect(n.projectId, n.spaceId);
  drawEdImgs();
  $("#edTask").style.display = writable() ? "" : "none";
  $("#edDelete").style.display = writable() ? "" : "none";
  edStatus.textContent = writable() ? ("Edited " + relTime(n.updatedAt)) : "Read only";

  overlay.classList.add("on");
  document.body.style.overflow = "hidden";

  if(isBoard){ openInk(id); edTitle.focus(); }
  else { (fresh ? edTitle : edBody).focus(); if(fresh) edTitle.select(); }
}
function closeNote(){
  if(dirty) flushNote();
  closeInk();
  S.openNote = null;
  overlay.classList.remove("on");
  document.body.style.overflow = "";
  closeAssignee();
  render();
}

function markDirty(){
  if(!S.openNote || !writable()) return;
  dirty = true;
  edStatus.textContent = "Saving…";
  clearTimeout(saveT);
  saveT = setTimeout(flushNote, 700);
}
function flushNote(){
  clearTimeout(saveT);
  if(!S.openNote || !dirty) return;
  var id = S.openNote;
  dirty = false;
  patchNote(id, { title: edTitle.value, body: edBody.value }).then(function(){
    if(S.openNote === id) edStatus.textContent = "Saved";
  });
}

edBody.addEventListener("input", markDirty);
edTitle.addEventListener("blur", flushNote);
edBody.addEventListener("blur", flushNote);

/* ============ doc read mode ============ */
var edRead = $("#edRead");

/* split a doc body into blocks: fenced code, headings, bullet lists, paragraphs */
function docBlocks(text){
  var lines = String(text || "").replace(/\r/g,"").split("\n");
  var blocks = [], buf = [], inFence = false, fence = [];

  function flush(){
    while(buf.length && !buf[buf.length-1].trim()) buf.pop();
    while(buf.length && !buf[0].trim()) buf.shift();
    if(!buf.length) return;
    var joined = buf.join("\n");
    if(/^#{1,3}\s/.test(buf[0]) && buf.length === 1){
      blocks.push({type: /^###\s/.test(buf[0]) ? "h3" : "h2",
                   text: buf[0].replace(/^#{1,3}\s*/,"")});
    } else if(buf.every(function(l){ return /^\s*[-*]\s+/.test(l); })){
      blocks.push({type:"ul", items: buf.map(function(l){ return l.replace(/^\s*[-*]\s+/,""); }), text: joined});
    } else {
      blocks.push({type:"p", text: joined});
    }
    buf = [];
  }

  lines.forEach(function(l){
    if(/^```/.test(l)){
      if(inFence){ blocks.push({type:"code", text: fence.join("\n")}); fence = []; inFence = false; }
      else { flush(); inFence = true; }
      return;
    }
    if(inFence){ fence.push(l); return; }
    if(!l.trim()){ flush(); return; }
    if(/^#{1,3}\s/.test(l)){ flush(); buf.push(l); flush(); return; }
    buf.push(l);
  });
  if(inFence && fence.length) blocks.push({type:"code", text: fence.join("\n")});
  flush();
  return blocks;
}

function copyText(text, btn){
  function ok(){
    var old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.textContent = "Copied";
    btn.classList.add("ok");
    setTimeout(function(){ btn.textContent = old; btn.classList.remove("ok"); }, 1300);
  }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); ok(); }
    catch(e){ toast("Couldn't copy here — select the text instead."); }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else fallback();
}

function renderDocRead(){
  edRead.textContent = "";
  var blocks = docBlocks(edBody.value);
  if(!blocks.length){
    var e = el("div","blk");
    e.appendChild(el("p", null,
      "Nothing here yet. Switch to Write and paste your prompts in — leave a blank line between each one and every block gets its own copy button."));
    edRead.appendChild(e);
    return;
  }
  blocks.forEach(function(b){
    var w = el("div","blk");
    if(b.type === "h2") w.appendChild(el("h2", null, b.text));
    else if(b.type === "h3") w.appendChild(el("h3", null, b.text));
    else if(b.type === "code") w.appendChild(el("pre", null, b.text));
    else if(b.type === "ul"){
      var ul = document.createElement("ul");
      b.items.forEach(function(it){
        var li = document.createElement("li");
        richText(li, it);
        ul.appendChild(li);
      });
      w.appendChild(ul);
    } else {
      var p = document.createElement("p");
      richText(p, b.text);
      w.appendChild(p);
    }
    if(b.type !== "h2" && b.type !== "h3"){
      var cp = el("button","blkcopy","Copy");
      cp.onclick = function(){ copyText(b.text, cp); };
      w.appendChild(cp);
    }
    edRead.appendChild(w);
  });
}

function applyDocMode(){
  var modes = $("#edModes").querySelectorAll("button");
  Array.prototype.forEach.call(modes, function(b){
    b.classList.toggle("on", b.dataset.mode === S.docMode);
  });
  var read = S.docMode === "read";
  edRead.classList.toggle("on", read);
  edBody.style.display = read ? "none" : "";
  if(read){ flushNote(); renderDocRead(); }
}

  if(!b) return;
  S.docMode = b.dataset.mode;
