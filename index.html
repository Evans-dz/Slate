}
.pstage:focus{border-color:var(--accent);outline:none}

/* ---------- dashboard ---------- */
/* .dcard and the row styles are the Today page's; the dashboard's lists reuse the rows */
.dcard{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 14px 12px;
}
.dcard h3{
  margin:0 0 9px;font-size:12.5px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
}
.dcard h3 .n{
  font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;text-transform:none;
}
.dlist{display:flex;flex-direction:column;gap:2px}
.dempty{font-size:13px;color:var(--muted);line-height:1.5;padding:2px 0 3px}

.drow{display:flex;align-items:flex-start;gap:9px;border-radius:3px}
.drow:hover{background:var(--line-soft)}
.dtick{
  position:relative;
  flex:0 0 auto;width:19px;height:19px;margin-top:7px;border-radius:50%;
  border:1.5px solid var(--line-strong);color:transparent;
  display:flex;align-items:center;justify-content:center;
}
.dtick .ico{width:12px;height:12px;stroke-width:2.6}
.dtick:hover{border-color:var(--accent);background:var(--accent-soft)}
.dtick.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dmain{
  flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px;
  padding:6px 4px 6px 0;
}
.dt{font-size:13.5px;line-height:1.35;word-break:break-word}
.drow.is-done .dt{color:var(--muted);text-decoration:line-through}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.dtime{font-variant-numeric:tabular-nums}
.ddue{font-variant-numeric:tabular-nums}
.ddue.late{color:var(--danger)}

/* ========== dashboard, All projects, rail counts, board history (redesign) ========== */
/* Every base rule for these lives in this block, above the tablet and phone
   blocks (CSS trap 1); their overrides live in delimited parts of those blocks. */

/* Two independent stacks, not grid areas: the lists vary in height, and a shared
   grid either stretches a whole row to its tallest list or leaves holes. Source
   order is the phone order and the screen-reader order. */
.dboard{max-width:1400px;display:flex;flex-direction:column;gap:14px}
.dtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dstacks{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:14px;align-items:start}
.dstack{display:flex;flex-direction:column;gap:14px;min-width:0}
.dband2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.sr-only{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;
}

/* the two controls that scope everything below them: one row, above, never in a card */
.dfilters{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 2px}
.seg.dseg{display:inline-flex;flex:0 0 auto}
.dseg button{flex:0 0 auto;min-height:32px;padding:5px 12px;font-size:13px;white-space:nowrap}
/* these scope the whole page, so the choice has to read at a glance in both themes */
.dseg button.on{font-weight:500;box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.dseg img{width:18px;height:18px;border-radius:50%;display:block;background:var(--line-soft)}

/* stat tiles: proportional figures at this size — tabular digits look loose */
.dtile{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px 13px;
}
.dtile:hover{border-color:var(--accent)}
.dtile .tl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.dtile .tl .ico{color:var(--muted)}
.dtile .tl .ico.crit{color:var(--danger)}
.dtile .tv{font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-.02em;color:var(--ink)}
.dtile .ts{font-size:12px;color:var(--muted);line-height:1.35}
.dtile .ts .up{color:var(--good)}
.dtile .ts .down{color:var(--danger)}

/* cards */
.wcard{
  margin:0;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px 12px;scroll-margin-top:66px;
}
.wcard:focus{outline:none}
.whead{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.whead .wt{flex:1;min-width:0}
.whead h3{
  margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.005em;
  display:flex;align-items:center;gap:8px;
}
.whead h3 .n{
  font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;
}
.wsub{font-size:12px;color:var(--muted);margin-top:1px}
.wact{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:1px;
  font-size:12.5px;color:var(--accent-ink);padding:4px 4px 4px 8px;margin:-4px -6px 0 0;border-radius:4px;
}
.wact:hover{background:var(--accent-soft)}
.wmore{display:block;text-align:left;font-size:12.5px;color:var(--accent-ink);padding:6px 4px 3px 28px}
.wmore:hover{text-decoration:underline}
.wnote{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}
.dgroup.crit{display:flex;align-items:center;gap:5px;color:var(--danger)}
.dgroup.crit .ico{width:13px;height:13px}
button.dgroup{display:block;width:100%;text-align:left}
button.dgroup:hover{color:var(--accent-ink)}
.dspace{flex:0 0 auto;width:19px}
.drow .dwho{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;margin:7px 2px 0 0;
  background:var(--line-soft);
}
.dassign{
  flex:0 0 auto;width:22px;height:22px;margin:6px 2px 0 0;border-radius:50%;position:relative;
  border:1.5px dashed var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.dassign .ico{width:12px;height:12px;stroke-width:2.4}
.dassign:hover{border-color:var(--accent);color:var(--accent-ink)}
.dpick{
  display:inline-flex;align-items:center;gap:2px;margin:0 0 8px;
  border:1px solid var(--line);border-radius:999px;padding:1px 2px 1px 10px;
  font-size:12px;color:var(--ink-2);background:var(--panel-2);
}
.dpick button{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.dpick button:hover{color:var(--ink);background:var(--line-soft)}
.dpick .ico{width:13px;height:13px}

/* the completions chart. No colour is ever written into the SVG — var() inside a
   presentation attribute is unreliable on iOS — so every mark gets a class, and a
   theme flip repaints it without a redraw. */
.vx-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:-2px 0 10px}
.vx-total{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.vx-stat{font-size:12.5px;color:var(--muted)}
.vx-host{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
svg.vx{display:block;overflow:visible}
.vx-bar{fill:var(--viz-1)}
.vx-bar.dim{opacity:.35}
.vx-grid{stroke:var(--viz-grid);stroke-width:1;shape-rendering:crispEdges}
.vx-base{stroke:var(--viz-axis);stroke-width:1;shape-rendering:crispEdges}
.vx-tick{fill:var(--muted);font-family:var(--ui);font-size:11px;font-variant-numeric:tabular-nums}
.vx-tick.now{fill:var(--ink-2);font-weight:600}
.vx-lbl{fill:var(--ink);font-family:var(--ui);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.vx-untracked{fill:var(--viz-untracked)}
.vx-utxt{fill:var(--muted);font-family:var(--ui);font-size:11.5px}
.vx-msg{
  position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:0 10px;font-size:12.5px;line-height:1.4;color:var(--muted);pointer-events:none;
}
.vx-hits{position:absolute;display:flex}
.vx-hit{flex:1 1 0;min-width:0;height:100%;border-radius:3px}
.vx-hit:hover{background:var(--viz-1-soft)}
.vx-hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--viz-1-soft)}
.vx-hit.off,.vx-hit.off:hover{background:transparent;cursor:default}
.vx-tip{
  position:absolute;z-index:5;pointer-events:none;width:max-content;max-width:230px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:8px 10px 9px;font-size:12px;line-height:1.4;color:var(--ink-2);
}
.vx-tip[hidden]{display:none}
.vx-tip .tv{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink)}
.vx-tip .tv::before{content:"";width:12px;height:2px;border-radius:1px;background:var(--viz-1);flex:0 0 auto}
.vx-tip .td{color:var(--muted)}
.vx-tip .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.vx-tip .tsplit{margin-top:3px}
.vx-readout{
  display:flex;align-items:center;gap:2px;margin-top:8px;padding:1px;
  border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2);
}
.vx-readout .rt{flex:1;min-width:0;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.vx-readout button{
  flex:0 0 auto;width:38px;height:38px;border-radius:4px;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
}
.vx-readout button:hover{background:var(--line-soft)}
.vx-readout button:disabled{opacity:.35;cursor:default;background:transparent}
.seg.wtog{display:inline-flex;flex:0 0 auto;margin:-3px 0 0}
.wtog button{flex:0 0 auto;padding:3px 9px;font-size:12px}
.vx-table{width:100%;border-collapse:collapse;font-size:13px}
.vx-table th{
  text-align:left;font-weight:500;font-size:12px;color:var(--muted);
  padding:0 8px 6px;border-bottom:1px solid var(--line);
}
.vx-table td{padding:6px 8px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.vx-table .num{text-align:right}
.vx-table .muted{color:var(--muted)}

/* part-to-whole bars: one ordinal ramp, so one encoding means status everywhere on
   the page. A 2px surface gap between segments, the data end rounded, the start square. */
.stk{display:flex;gap:2px;height:10px;min-width:0}
.stk span{flex:1 1 0;min-width:3px}
.stk span:last-child{border-radius:0 4px 4px 0}
.stk .s-done{background:var(--viz-done)}
.stk .s-doing{background:var(--viz-doing)}
.stk .s-todo{background:var(--viz-todo)}
/* not ".empty": that's the empty-state block, and it would pad this to 68px */
.stk.stk-none{background:var(--line-soft);border-radius:0 4px 4px 0}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px}
.lgd .s-done{background:var(--viz-done)}
.lgd .s-doing{background:var(--viz-doing)}
.lgd .s-todo{background:var(--viz-todo)}

/* projects: a table because it's many rows with several measures each */
.ptable{display:flex;flex-direction:column}
.pth,.ptr{
  display:grid;align-items:center;gap:0 14px;
  grid-template-columns:minmax(0,2.3fr) minmax(0,2fr) 48px 48px 64px 76px;
}
.pth{font-size:11.5px;color:var(--muted);padding:0 8px 6px;border-bottom:1px solid var(--line)}
.pth .pa{text-align:right}
.pth .num,.ptr .num{text-align:right;font-variant-numeric:tabular-nums}
.ptr{width:100%;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.ptr:hover{background:var(--panel-2)}
.ptr .pn{display:flex;align-items:center;gap:8px;min-width:0}
.ptr .pdot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;transform:rotate(-8deg);background:var(--muted)}
.ptr .pnw{display:flex;flex-direction:column;min-width:0}
.ptr .pnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ptr .pquiet{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.ptr .pp{display:flex;align-items:center;gap:10px;min-width:0}
.ptr .pp .stk{flex:1 1 auto}
.ptr .ppct{flex:0 0 auto;min-width:34px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptr .late{color:var(--danger);font-weight:500;display:inline-flex;align-items:center;justify-content:flex-end;gap:3px}
.ptr .late .ico{width:12px;height:12px}
.ptr .zero{color:var(--muted)}
.ptr .pa{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.ptr .pai,.ptr .pm{display:none}
.ptr .pm .late{display:inline-flex;font-weight:400}
.pfold{
  width:100%;text-align:left;padding:9px 8px;font-size:12.5px;color:var(--accent-ink);
  border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:4px;
}
.pfold:hover{background:var(--panel-2)}
.pfold .ico{width:14px;height:14px}

/* workload */
.wlrow{
  display:grid;grid-template-columns:120px minmax(0,1fr);gap:3px 12px;align-items:center;
  width:100%;text-align:left;padding:8px 6px;border-radius:4px;
}
.wlrow:hover{background:var(--panel-2)}
.wlrow[aria-expanded="true"]{background:var(--panel-2)}
.wlwho{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.wlwho img,.wlwho .wlnone{width:22px;height:22px;border-radius:50%;flex:0 0 auto;background:var(--line-soft)}
.wlwho .wlnone{background:transparent;border:1.5px dashed var(--muted)}
.wlwho .wln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wltrack{display:flex;align-items:center;gap:8px;min-width:0}
.wltrack .stk{flex:0 0 auto}
.wlval{font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wlval.zero{color:var(--muted)}
.wlmeta{grid-column:2;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wlmeta .late{color:var(--danger);display:inline-flex;align-items:center;gap:3px}
.wlmeta .ico{width:12px;height:12px}
.wlx{padding:2px 4px 8px 36px}
.wlx .wmore{padding-left:0}

/* pipeline: three numbers read faster than three bars */
.pcounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcount{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0;
  padding:8px 10px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2);
}
.pcount:hover{border-color:var(--accent)}
.pcount b{font-size:20px;font-weight:600;line-height:1.2}
.pcount span{font-size:12px;line-height:1.3;color:var(--muted);max-width:100%}
.plost{font-size:12px;color:var(--muted);margin-top:7px}
.psub{font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin:14px 0 3px}
.pchase{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:7px 4px;border-radius:3px}
.pchase:hover{background:var(--line-soft)}
.pchase .pc1{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchase .pc2{font-size:12px;color:var(--muted);white-space:nowrap}
.pchase .pcd{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pchase .pcd.late{color:var(--danger)}
.pnudge{display:block;text-align:left;margin-top:8px;font-size:12.5px;color:var(--accent-ink)}
.pnudge:hover{text-decoration:underline}

/* All projects: a drill-through arrives as one removable chip, so a filter is
   never left on the shared board without saying so */
.drill{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.dchip{
  display:inline-flex;align-items:center;gap:2px;font-size:12.5px;
  color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:999px;padding:1px 2px 1px 11px;
}
.dchip button{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dchip button:hover{background:var(--panel)}
.dchip .ico{width:13px;height:13px}

/* rail: the virtual views carry an icon where projects carry their colour dot,
   and the dot sits in the same 15px so every label lines up */
.rail-item .rico{width:15px;height:15px;color:var(--muted)}
.rail-item.on .rico{color:var(--accent-ink)}
.rail-item .dot{margin:0 4px}
.rail-item .ct.crit{color:var(--danger);font-weight:600}

/* boards and the list: finished work folds away after a fortnight */
.doneolder{
  width:100%;padding:6px 8px;font-size:12.5px;color:var(--muted);
  border:1px dashed var(--line);border-radius:var(--radius);
}
.doneolder:hover{color:var(--accent-ink);border-color:var(--accent)}
.listmore{margin-top:10px}
/* A phone board snaps a column at a time, and a mandatory snap undoes every 16px
   autoPan nudge — the dragged card could never reach the next column. Snapping
   comes back on release, and settles on whichever column is nearest. */
body.dragging-now .board{scroll-snap-type:none}

/* touch: the tick stays small to look at and gets a finger-sized target */
@media (hover:none){
  .dtick{width:22px;height:22px;margin-top:6px}
  .dtick::after,.dassign::after{content:"";position:absolute;inset:-9px}
  .dspace{width:22px}
}
@media (forced-colors:active){
  .vx-bar,.vx-bar.dim{fill:CanvasText}
  .vx-untracked{fill:GrayText}
  .stk span{background:CanvasText}
}

/* ---------- today: the page behind the notification briefs ---------- */
/* a vertical stack on every width — this page is for scrolling, not snapping */
.todaywrap{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;max-width:760px}
.dgroup{
  font-size:11.5px;color:var(--muted);letter-spacing:.02em;
  margin:9px 0 2px;padding-top:8px;border-top:1px solid var(--line-soft);
}
.dgroup:first-child{margin-top:2px;padding-top:0;border-top:0}

/* ---------- bottom nav (phones) ---------- */
#bottomnav{
  display:none;
  position:sticky;bottom:0;z-index:35;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#bottomnav .bn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px 6px;min-height:52px;color:var(--muted);
}
#bottomnav .bn .ic{display:flex}
#bottomnav .bn .ic .ico{width:22px;height:22px}
#bottomnav .bn .bl{font-size:10.5px;letter-spacing:.01em}
#bottomnav .bn.on{color:var(--accent-ink)}
#bottomnav .bn.on .ic{transform:translateY(-1px)}

/* ---------- tablet ----------
   iPads sit here, including portrait (744–834px): they keep the persistent rail
   and the month grid rather than inheriting the phone layout. */
@media (max-width:1080px) and (min-width:721px){
  #body{grid-template-columns:200px minmax(0,1fr)}
  .board{scroll-snap-type:x proximity}
  .col{scroll-snap-align:start}
  #mainhead{padding:18px 18px 0}
  #mainbody{padding:16px 18px 40px}
  /* ---- dashboard (redesign): one stack, Today first ---- */
  .dstacks{grid-template-columns:minmax(0,1fr)}
  /* ---- end dashboard ---- */
}

/* narrow tablets: ~500-600px of content (the calendar's narrow rules live in its
   own section) */
@media (max-width:900px) and (min-width:721px){
  /* iPad portrait: the view buttons go back to icons so the tabs keep the room */
  .vbtn{width:36px;height:36px;padding:0;justify-content:center}
  .vbtn .vlabel{display:none}
  /* ---- dashboard (redesign): ~500-600px of content ---- */
  .dtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dband2{grid-template-columns:minmax(0,1fr)}
  /* Active moves under the project name rather than squeezing the bar */
  .pth,.ptr{grid-template-columns:minmax(0,2fr) minmax(0,2fr) 44px 44px 60px}
  .pth .pa,.ptr .pa{display:none}
  .ptr .pai{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
  /* ---- end dashboard ---- */
}

/* ---------- phone ---------- */
@media (max-width:720px){
  #body{grid-template-columns:1fr}
  #rail{
    position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);z-index:50;
    transform:translateX(-100%);transition:transform .2s ease;
    /* no shadow while closed: its blur spilled a grey band down the page's left edge */
    box-shadow:none;
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    overscroll-behavior:contain;
  }
  #rail.open{transform:none;box-shadow:var(--shadow-lg)}
  #railScrim{
    display:none;position:fixed;inset:0;z-index:45;
    background:var(--scrim);
  }
  #railScrim.on{display:block}

  #topbar{
    height:auto;min-height:52px;padding:0 12px;gap:10px;
    padding-top:env(safe-area-inset-top);
  }
  #railToggle{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;margin-left:-6px;color:var(--ink);
    border-radius:var(--radius);
  }
  .brand .sub{display:none}
  .brand .word{font-size:16px}
  #whoami .nm{display:none}
  #whoami img{width:28px;height:28px}
  #search{
    max-width:none;font-size:16px;padding:8px 11px;min-height:38px;
  }

  #mainhead{padding:14px 15px 0}
  #capture{margin:12px 15px 0;padding:11px 13px 10px}
  #capInput{font-size:16px;min-height:40px}
  #capFoot .btn{padding:8px 15px;font-size:14px;min-height:38px}
  #capProj,#capSpace{font-size:16px;padding:7px 8px;min-height:38px;flex:1 1 40%;max-width:none;min-width:0}
  #capHint{flex:1 1 100%;order:9}
  .thumb button{width:26px;height:26px;font-size:15px;line-height:26px;top:3px;right:3px}
  #mainbody{padding:14px 15px 28px}

  /* headline + actions stack */
  .projtitle{font-size:22px}
  .projtitle .pinfo{opacity:1}
  .head-actions{margin-left:0;width:100%;gap:7px;flex-wrap:wrap}
  .head-actions .btn{min-height:38px;padding:7px 13px;font-size:13.5px}
  .title-row{gap:8px}

  .tab{padding:10px 13px;font-size:14px}
  .viewswitch{margin-left:12px;padding-left:6px}
  /* back to square icons on a phone: the row already scrolls sideways, and the
     bottom bar names these same views anyway */
  .vbtn{width:36px;height:36px;padding:0;justify-content:center;font-size:15px}
  .vbtn .vlabel{display:none}
  .pmeta-line{gap:6px 12px;font-size:13px}
  .docpage-head h2{font-size:20px}
  .docpage-head .btn{min-height:38px;padding:7px 14px}
  .docpage .blk{padding-right:0}
  .docpage .blkcopy{position:static;display:block;margin-top:7px;padding:7px 12px;font-size:13px}

  /* board: one column per screen, snapped */
  .board{
    gap:12px;scroll-snap-type:x mandatory;
    margin:0 -15px;padding:0 15px 10px;
  }
  .col{flex:0 0 86vw;max-width:none;max-height:none;scroll-snap-align:center}
  .col-body{max-height:none}
  .addtask{font-size:16px;padding:9px 11px}
  /* keep room for the grip — this rule comes after the (hover:none) block, so a
     bare `padding` here would silently drop its padding-left */
  .card{padding:11px 12px 11px 30px}
  .card .ttl{font-size:15px}

  /* list: tick + title only; tap a row for status, due and owner */
  .list th{display:none}
  .list .c-st,.list .c-due,.list .c-who{display:none}
  .list td{padding:12px 8px;font-size:15px}
  .list input[type=checkbox]{width:21px;height:21px}
  .rowx{font-size:21px;padding:6px 9px}

  /* ---- dashboard (redesign): one column in source order ---- */
  .dboard,.dstack{gap:10px}
  .dtiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .dtile{min-height:76px;padding:11px 12px 12px 12px}
  .dtile .tv{font-size:26px}
  .dstacks,.dband2{grid-template-columns:minmax(0,1fr);gap:10px}
  .dfilters{flex-direction:column;align-items:stretch;gap:8px}
  .seg.dseg{display:flex}
  .dseg button{flex:1 1 0;min-width:0;min-height:38px;padding:6px 6px;font-size:13.5px}
  .wcard{padding:13px 13px 11px 13px}
  .wact{min-height:38px;padding:4px 6px 4px 10px;margin:-10px -8px -6px 0}
  .wmore,.pnudge{min-height:38px;display:flex;align-items:center}
  .wtog button{min-height:38px;padding:4px 12px}
  button.dgroup{min-height:38px;display:flex;align-items:center}
  .dtick{width:22px;height:22px;margin-top:6px}
  .dtick::after,.dassign::after{content:"";position:absolute;inset:-9px}
  .dspace{width:22px}
  .dpick{min-height:38px;padding-left:12px}
  .dpick button{width:38px;height:38px}
  .dchip{min-height:38px;font-size:13.5px;padding-left:13px}
  .dchip button{width:38px;height:38px}
  /* account menu: finger-sized, and the seven swatches still fit one row — each
     keeps its 28px look with a 38px target around it */
  #umenu .seg button{min-height:38px}
  #umenu .signout{min-height:42px}
  .accsws{gap:10px}
  .accsw::after{content:"";position:absolute;inset:-5px}
  /* projects: name and % / a full-width bar / the numbers as one line */
  .pth{display:none}
  .ptr{grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;padding:11px 4px;font-size:14.5px}
  .ptr .pn{grid-column:1;grid-row:1}
  .ptr .pp{display:contents}
  .ptr .ppct{grid-column:2;grid-row:1;font-size:12.5px}
  .ptr .pp .stk{grid-column:1 / -1;grid-row:2}
  .ptr .num,.ptr .pa,.ptr .pai{display:none}
  .ptr .pm{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;grid-column:1 / -1;grid-row:3;font-size:12.5px;color:var(--muted)}
  .pfold{min-height:44px}
  /* workload: the name above its bar */
  .wlrow{grid-template-columns:minmax(0,1fr);padding:10px 4px}
  .wlmeta{grid-column:1}
  .wlx{padding-left:4px}
  .pchase{padding:10px 4px}
  .pcount{min-height:58px}
  .doneolder{min-height:38px}
  /* ---- end dashboard ---- */

  .bgroup{margin-bottom:20px}
  .coladd{flex:0 0 auto;min-height:38px}
  .triage select{font-size:16px;padding:8px 9px;min-height:38px;flex:1 1 40%}
  .triage .btn{min-height:38px;padding:8px 14px;font-size:14px}
  .prow{flex-wrap:wrap;padding:11px 12px}
  .pmain{flex:1 1 100%}
  .pstage{font-size:16px;padding:7px 8px;min-height:38px;flex:1}
  .padd input{font-size:16px;min-height:42px}
  .pnote{white-space:normal}

  .notes{grid-template-columns:1fr;gap:10px}
  .feed{max-width:none}
  .fitem{padding:13px 14px 11px}
  .tagchip{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;font-size:13px}

  /* ---- calendar (phone) ----
     A 7-column month still fits at 320px once cells carry only a date and dots;
     the chips don't, so they go, and the selected day's panel below lists them
     with room for a thumb. The cell's date button fills it: that's the target. */
  .calbar{gap:6px;margin-bottom:8px}
  .calbar .mon{font-size:20px}
  .calbar .nav{width:38px;height:38px}
  .calbar .btn{min-height:38px}
  .calbar .todaybtn{height:38px}
  .calbar .addsched{display:none}
  .schedhead .addsched{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;font-size:14px}
  .calwrap{gap:12px}
  .calgrid{background:transparent;border:0;border-radius:0;gap:0;overflow:visible}
  .caldow{background:transparent;padding:0 0 5px;text-align:center;font-size:10.5px;letter-spacing:.02em}
  .calday{
    min-height:0;padding:0;gap:0;cursor:default;
    background:transparent;border-top:1px solid var(--line-soft);
  }
  .calday:hover,.calday.off{background:transparent}
  .calday.sel{box-shadow:none}
  .calday .occ,.calday .cmore{display:none}
  .calday .dn{
    flex:1 1 auto;justify-content:flex-start;gap:3px;
    min-height:50px;padding:5px 0 4px;border-radius:6px;
  }
  .calday .dnum{width:32px;height:32px;min-width:0;padding:0;border-radius:50%;font-size:16px}
  .calday .dn:hover .dnum{background:transparent}
  .calday.sel:not(.today) .dnum{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-ink);font-weight:600}
  /* today is always filled, so selecting it adds a halo rather than a ring */
  .calday.today.sel .dnum{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent)}
  .calday .dots{display:flex;align-items:center;justify-content:center;gap:3px;height:6px}
  .calday .dot{width:6px;height:6px;border-radius:50%;background:var(--cp,var(--muted))}
  .calday .dot.done{opacity:.35}
  /* a diamond, not a dot: a shape as well as a colour, since red sits close to
     some project hues (and to others under colour-blindness) */
  .calday .dot.late{background:var(--danger);border-radius:1px;transform:rotate(45deg) scale(.9)}
  .calday .dot.over{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
  .calday.off .dots{opacity:.5}
  .calpanel{padding:13px 10px 8px}
  .cphead h3{font-size:17px}
  .cpsub{font-size:13px}
  .cprow .ctick{width:44px;height:44px}
  .cprow .ring{width:22px;height:22px}
  .cprow .cmain{min-height:44px;justify-content:center;padding:9px 6px 9px 2px}
  .cprow .ct{font-size:15px}
  .cprow img.av{width:22px;height:22px;margin-top:11px}
  .cprow .cmeta{font-size:12.5px}
  .cpempty{font-size:14px}
  .cpaddbtn{min-height:44px;font-size:15px}
  .cpinput,.cpproj{font-size:16px;min-height:42px;padding:8px 10px}
  .cpform .btn{min-height:42px;padding:8px 16px;font-size:14px}
  .cpx{width:42px;height:42px}
  .schedrow{padding:10px 8px 10px 12px}
  .schedrow .sn{font-size:15px}
  .schedrow .smeta{font-size:13px}
  .schedrow .btn{min-height:38px}
  .schednote{font-size:14px}
  /* ---- end calendar (phone) ---- */

  #bottomnav{display:flex}

  /* every overlay becomes a full-height sheet */
  #overlay,#schedDlg,#taskDlg,#prospectDlg,#projDlg{padding:0;background:var(--paper)}
  #editor,#editor.doc,#editor.whiteboard,.sbox{
    max-width:none;margin:0;min-height:100dvh;border:0;border-radius:0;
    box-shadow:none;
    padding:calc(14px + env(safe-area-inset-top)) 15px calc(15px + env(safe-area-inset-bottom));
  }
  #edTitle{font-size:21px}
  #edBody{font-size:16px;min-height:44vh}
  #editor.doc #edBody{min-height:44vh;font-size:16px}
  #edFoot{
    position:sticky;bottom:0;background:var(--note);
    /* auto top margin pins the footer to the bottom of the sheet when the note is
       short; sticky takes over once the body overflows */
    margin:auto -15px 0;padding:10px 15px calc(6px + env(safe-area-inset-bottom));
    gap:7px;
  }
  #editor.doc #edFoot,#editor.whiteboard #edFoot{background:var(--panel)}
  #edFoot .btn{min-height:38px;padding:7px 12px}
  /* 16px or iOS zooms the sheet when the select takes focus */
  #edProj,#edSpace{font-size:16px;padding:7px 9px;min-height:38px;flex:1;min-width:120px}
  #edFoot label{display:none}
  #edStatus{width:100%;order:9}
  .modeswitch{width:100%;order:-1}
  .modeswitch button{flex:1;padding:8px;font-size:13.5px}
  .blk{padding-right:0}
  .blk pre{white-space:pre-wrap;word-break:break-word}
  .blkcopy{position:static;display:block;margin-top:7px;padding:7px 12px;font-size:13px}

  /* ---- rich docs, phone ----
     one sideways-scrolling strip, bled to the sheet edges; margins and padding
     written out longhand so nothing an earlier block added is silently dropped */
  #editor.doc.writing #edToolsWrap{margin-left:-15px;margin-right:-15px}
  #edTools{
    flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding-left:8px;padding-right:8px;gap:1px;
  }
  #edTools::-webkit-scrollbar{display:none}
  #editor.doc.writing #edToolsWrap::after{
    content:"";position:absolute;top:1px;right:0;bottom:1px;width:24px;pointer-events:none;
    background:linear-gradient(to right,transparent,var(--panel));
  }
  #editor.kbd #edToolsWrap::after{display:none}
  .fmt{min-width:40px;height:40px}
  .fmt.done{display:inline-flex;color:var(--accent-ink)}
  /* the checklist box stays 16px to look at but takes a 38px finger: the extra is
     a transparent border, the visible edge an inset ring */
  #edRich li[data-task]::before{
    width:38px;height:38px;left:calc(-1.5em - 11px);top:calc(.32em - 11px);
    border:11px solid transparent;background-clip:padding-box;border-radius:15px;
    box-shadow:inset 0 0 0 1.5px var(--muted);
  }
  #edRich li[data-task="1"]::before{border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
  .fmt.md{margin-left:6px}
  #edLinkUrl{font-size:16px;min-height:38px}
  #edLinkRow .btn{min-height:38px}
  #editor.doc #edRich{min-height:44vh;font-size:16px}
  /* the footer's selects and buttons would sit on the keyboard next to the bar */
  #editor.typing #edFoot{display:none}
  #edConflict .btn{min-height:38px}
  .blk li.task > label{min-height:38px;align-items:center}
  .blk li.task input{width:20px;height:20px;margin-top:0}

  /* whiteboard */
  #inkbar{gap:6px}
  #inkbar .tool{min-height:38px;padding:7px 12px;font-size:13.5px}
  .swatch{width:34px;height:34px}
  #inkWrap{max-height:none}
  #inkFoot .btn{min-height:38px}
  #inkHint{width:100%}

  /* forms — 16px or iOS zooms the page the moment one takes focus */
  .field input[type=text],.field input[type=time],.field input[type=date],.field select,
  .field textarea{
    font-size:16px;padding:9px 11px;min-height:42px;
  }
  .daybtn{width:44px;height:42px;font-size:13px}
  .crow{gap:8px}
  .crow .btn{flex:1;min-height:42px}

  /* task and schedule sheets: actions belong at the bottom of the screen, not
     floating under the last field */
  #tkNote{width:100%;min-height:38px;margin-bottom:10px}
  #prNote{font-size:16px}
  .sbox{display:flex;flex-direction:column;padding-bottom:0}
  .sbox .crow{
    margin:auto -15px 0;position:sticky;bottom:0;background:var(--panel);
    border-top:1px solid var(--line-soft);
    padding:10px 15px calc(10px + env(safe-area-inset-bottom));
  }
  #confirm{padding:0}
  #confirm.on{display:flex;align-items:flex-end}
  .cbox{
    max-width:none;width:100%;border-radius:12px 12px 0 0;
    padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  }

  #toast{bottom:calc(76px + env(safe-area-inset-bottom));font-size:14px;padding:10px 16px}
  .inline-edit,.rail-new input,.rail-sub input{font-size:16px;padding:7px 9px}
  .tabnew{font-size:16px;min-height:38px}
  .rail-item{padding-top:9px;padding-bottom:9px;font-size:15px}
  .rail-sub .rail-item{font-size:14.5px}
  .rail-addspace{padding-top:9px;padding-bottom:9px;font-size:14px}
  .rail-head{font-size:13px;padding-bottom:8px}
  .rail-head button{font-size:20px;padding:8px 12px}
  #amenu{min-width:min(86vw,260px)}
  #amenu input{font-size:16px;padding:9px 10px}
  #amenu .opt{padding:9px 8px;font-size:15px}
}

/* narrow phones: paired fields stack rather than squeeze */
@media (max-width:430px){
  .two{flex-direction:column;gap:0}
  .head-actions .btn{flex:1 1 auto}
  /* Delete project is often the only header action, and stretching it makes the
     most destructive control the largest target on the screen */
  .head-actions .btn.danger{flex:0 0 auto}
}

/* very narrow phones */
@media (max-width:380px){
  #bottomnav .bn .bl{font-size:9.5px}
  .col{flex:0 0 90vw}
  .brand .word{display:none}
}

<body>

<div id="shell">
  <header id="topbar">
    <button id="railToggle" aria-label="Show projects"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <div class="brand"><span class="mark"></span><span class="word">Slate</span><span class="sub">projects &amp; notes</span></div>
    <input id="search" type="search" placeholder="Filter tasks and notes" aria-label="Filter tasks and notes">
    <button id="bell" aria-label="Notification briefs" title="Notification briefs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </button>
    <button id="whoami" aria-haspopup="true" aria-label="Account and appearance" title="Account and appearance"></button>
  </header>

  <div id="banner"></div>

  <div id="body">
    <div id="railScrim"></div>
    <aside id="rail"></aside>
    <main id="main">
      <div id="mainhead"></div>
      <div id="capture">
        <textarea id="capInput" rows="1" placeholder="Get it out of your head. Enter saves it."></textarea>
        <div id="capThumbs"></div>
        <div id="capFoot">
          <select id="capProj" aria-label="File this note under a project"></select>
          <select id="capSpace" aria-label="File this note under a space"></select>
          <span id="capHint">#tag anything · Shift+Enter for a new line · paste an image</span>
          <span class="capacts">
            <label class="btn quiet capphoto" id="capPhoto" hidden>
              <svg class="ico sm" aria-hidden="true"><use href="#i-camera"/></svg><span>Photo</span>
              <input type="file" id="capFile" accept="image/*" multiple>
            </label>
            <button class="btn" id="capSave">Save</button>
          </span>
        </div>
      </div>
      <div id="mainbody"></div>
    </main>
  </div>

  <nav id="bottomnav" aria-label="Main">
    <button class="bn" data-nav="dash">
      <span class="ic"><svg class="ico" aria-hidden="true"><use href="#i-dash"/></svg></span><span class="bl">Dashboard</span>
    </button>
    <button class="bn" data-nav="capture">
      <span class="ic"><svg class="ico" aria-hidden="true"><use href="#i-capture"/></svg></span><span class="bl">Capture</span>
    </button>
    <button class="bn" data-nav="board">
      <span class="ic"><svg class="ico" aria-hidden="true"><use href="#i-board"/></svg></span><span class="bl">Board</span>
    </button>
    <button class="bn" data-nav="calendar">
      <span class="ic"><svg class="ico" aria-hidden="true"><use href="#i-calendar"/></svg></span><span class="bl">Calendar</span>
    </button>
    <button class="bn" data-nav="projects">
      <span class="ic"><svg class="ico" aria-hidden="true"><use href="#i-folder"/></svg></span><span class="bl">Projects</span>
    </button>
  </nav>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-label="Note">
  <div id="editor">
    <input id="edTitle" placeholder="Name this note" aria-label="Note name">
    <div id="edRule"></div>

    <div id="inkbar">
      <button class="tool" data-ink="pen">Pen</button>
      <button class="tool" data-ink="marker">Marker</button>
      <button class="tool" data-ink="eraser">Eraser</button>
      <span class="sep"></span>
      <button class="swatch" data-color="#1B1A17" style="background:#1B1A17" aria-label="Black"></button>
      <button class="swatch" data-color="#2C5849" style="background:#2C5849" aria-label="Green"></button>
      <button class="swatch" data-color="#1D4E8F" style="background:#1D4E8F" aria-label="Blue"></button>
      <button class="swatch" data-color="#8C3A2B" style="background:#8C3A2B" aria-label="Red"></button>
      <span class="sep"></span>
      <button class="tool" id="inkUndo">Undo</button>
      <button class="tool" id="inkClear">Clear page</button>
      <span class="sep"></span>
      <button class="tool" id="inkUp" aria-label="Scroll page up">↑</button>
      <button class="tool" id="inkDown" aria-label="Scroll page down">↓</button>
    </div>
    <div id="inkWrap"><canvas id="inkCanvas"></canvas></div>
    <div id="inkFoot">
      <span id="inkHint">Write with your Pencil — each stroke is cleaned up when you lift it. Use ↑ ↓ to move down the page.</span>
      <button class="btn" id="inkToText">Turn writing into text</button>
    </div>
    <div id="inkText"></div>

    <!-- docs only: the formatting bar, over a rich editor that stores markdown.
         mousedown on a button is cancelled in JS so a tap never takes the caret
         out of the text or drops the keyboard. -->
    <div id="edToolsWrap">
      <div id="edTools" role="toolbar" aria-label="Formatting">
        <button type="button" class="fmt txt" data-fmt="h1" aria-label="Title" title="Title (⌘⌥1)">H1</button>
        <button type="button" class="fmt txt" data-fmt="h2" aria-label="Heading" title="Heading (⌘⌥2)">H2</button>
        <button type="button" class="fmt txt" data-fmt="h3" aria-label="Subheading" title="Subheading (⌘⌥3)">H3</button>
        <span class="fmtsep"></span>
        <button type="button" class="fmt txt" data-fmt="b" aria-label="Bold" title="Bold (⌘B)"><b>B</b></button>
        <button type="button" class="fmt txt" data-fmt="i" aria-label="Italic" title="Italic (⌘I)"><i>I</i></button>
        <button type="button" class="fmt txt" data-fmt="u" aria-label="Underline" title="Underline (⌘U)"><u>U</u></button>
        <button type="button" class="fmt txt" data-fmt="s" aria-label="Strikethrough" title="Strikethrough (⌘⇧X)"><s>S</s></button>
        <button type="button" class="fmt" data-fmt="link" aria-label="Link" title="Link (⌘K)"><svg class="ico" aria-hidden="true"><use href="#i-link"/></svg></button>
        <span class="fmtsep"></span>
        <button type="button" class="fmt" data-fmt="ul" aria-label="Bulleted list" title="Bulleted list (⌘⇧8)"><svg class="ico" aria-hidden="true"><use href="#i-list"/></svg></button>
        <button type="button" class="fmt" data-fmt="ol" aria-label="Numbered list" title="Numbered list (⌘⇧7)"><svg class="ico" aria-hidden="true"><use href="#i-ol"/></svg></button>
        <button type="button" class="fmt" data-fmt="task" aria-label="Checklist" title="Checklist (⌘⇧9)"><svg class="ico" aria-hidden="true"><use href="#i-task"/></svg></button>
        <button type="button" class="fmt" data-fmt="outdent" aria-label="Move out a level" title="Move out a level (⇧Tab)"><svg class="ico" aria-hidden="true"><use href="#i-outdent"/></svg></button>
        <button type="button" class="fmt" data-fmt="indent" aria-label="Move in a level" title="Move in a level (Tab)"><svg class="ico" aria-hidden="true"><use href="#i-indent"/></svg></button>
        <span class="fmtsep"></span>
        <button type="button" class="fmt" data-fmt="hl" aria-label="Highlight" title="Highlight (⌘⇧H)"><svg class="ico" aria-hidden="true"><use href="#i-mark"/></svg></button>
        <button type="button" class="fmt" data-fmt="quote" aria-label="Quote" title="Quote"><svg class="ico" aria-hidden="true"><use href="#i-quote"/></svg></button>
        <button type="button" class="fmt" data-fmt="code" aria-label="Code" title="Code (⌘E)"><svg class="ico" aria-hidden="true"><use href="#i-code"/></svg></button>
        <button type="button" class="fmt" data-fmt="fence" aria-label="Code block" title="Code block"><svg class="ico" aria-hidden="true"><use href="#i-fence"/></svg></button>
        <button type="button" class="fmt" data-fmt="hr" aria-label="Divider" title="Divider"><svg class="ico" aria-hidden="true"><use href="#i-hr"/></svg></button>
        <span class="fmtsep"></span>
        <button type="button" class="fmt" data-fmt="undo" aria-label="Undo" title="Undo (⌘Z)"><svg class="ico" aria-hidden="true"><use href="#i-undo"/></svg></button>
        <button type="button" class="fmt" data-fmt="redo" aria-label="Redo" title="Redo (⌘⇧Z)"><svg class="ico" aria-hidden="true"><use href="#i-redo"/></svg></button>
        <button type="button" class="fmt unsaved" data-fmt="unsaved" title="Someone else changed this doc: pick a version"><svg class="ico sm" aria-hidden="true"><use href="#i-alert"/></svg><span>Not saved</span></button>
        <button type="button" class="fmt md" data-fmt="md" aria-pressed="false" title="Show the markdown this doc is stored as">Markdown</button>
        <button type="button" class="fmt done" data-fmt="done">Done</button>
        <div id="edLinkRow">
          <input id="edLinkUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
                 placeholder="Paste or type a link" aria-label="Link address">
          <button type="button" class="btn primary" id="edLinkOk">Link</button>
          <button type="button" class="btn quiet" id="edLinkOff">Remove</button>
          <button type="button" class="btn quiet" id="edLinkCancel">Cancel</button>
        </div>
      </div>
    </div>
    <div id="edConflict" role="status" aria-live="polite"></div>

    <textarea id="edBody" placeholder="Write it down." aria-label="Note body"></textarea>
    <div id="edRich" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Doc"
         spellcheck="true" autocapitalize="sentences" autocorrect="on"
         data-placeholder="Write, or paste your prompts. A blank line — Return on an empty line — starts a new block, and every block gets its own Copy button."></div>
    <div id="edRead"></div>
    <div id="edImgs"></div>

    <div id="edFoot">
      <span class="modeswitch" id="edModes">
        <button data-mode="write">Write</button>
        <button data-mode="read">Read</button>
      </span>
      <label for="edProj">Filed under</label>
      <select id="edProj" aria-label="Project this note belongs to"></select>
      <select id="edSpace" aria-label="Space this note belongs to"></select>
      <button class="btn quiet" id="edTask">Make this a task</button>
      <button class="btn quiet" id="edToDoc" title="Headings, bold, lists and checklists, and a Copy button on every block">Turn into doc</button>
      <button class="btn quiet danger" id="edDelete">Delete note</button>
      <button class="btn" id="edClose">Close</button>
      <span id="edStatus"></span>
    </div>
  </div>
</div>

<div id="schedDlg" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="sbox">
    <h3 id="sTitle">Repeating item</h3>
    <div class="field">
      <label for="sName">What happens</label>
      <input type="text" id="sName" placeholder="Instagram post">
    </div>
    <div class="two">
      <div class="field">
        <label for="sFreq">How often</label>
        <select id="sFreq">
          <option value="weekly">Certain days each week</option>
          <option value="daily">Every day</option>
          <option value="monthly">Once a month</option>
        </select>
      </div>
      <div class="field">
        <label for="sTime">Time</label>
        <input type="time" id="sTime" value="08:00">
      </div>
    </div>
    <div class="field" id="sDaysField">
      <label>Which days</label>
      <div class="days" id="sDays"></div>
    </div>
    <div class="field" id="sDomField" style="display:none">
      <label for="sDom">Day of the month</label>
      <input type="text" id="sDom" value="1" inputmode="numeric">
    </div>
    <div class="two">
      <div class="field">
        <label for="sStart">Starts</label>
        <input type="date" id="sStart">
      </div>
      <div class="field">
        <label for="sEnd">Ends (optional)</label>
        <input type="date" id="sEnd">
      </div>
    </div>
    <div class="field">
      <label for="sSpace">Space</label>
      <select id="sSpace"></select>
    </div>
    <div class="crow">
      <button class="btn quiet danger" id="sDelete">Delete</button>
      <button class="btn" id="sCancel">Cancel</button>
      <button class="btn primary" id="sSave">Save</button>
    </div>
  </div>
</div>

<div id="projDlg" role="dialog" aria-modal="true" aria-labelledby="pjHead">
  <div class="sbox">
    <h3 id="pjHead">Project</h3>

      <label for="pjName">Name</label>
      <input type="text" id="pjName" placeholder="Project name">
    </div>
    <div class="two">
      <div class="field">
        <label for="pjContact">Contact</label>
        <input type="text" id="pjContact" placeholder="Who you deal with">
      </div>
      <div class="field">
        <label for="pjEmail">Email</label>
        <input type="text" id="pjEmail" inputmode="email" placeholder="name@company.com">
      </div>
    </div>
    <div class="two">

<script>
(function(){
"use strict";

/* ============ constants ============ */
/* Columns belong to a space. A project carries its own set too, used by tasks
   filed to the project but to no space. A set that has never been edited uses
   these. The LAST column always means done — the tick, the strikethrough and
   the dashboard all read it that way, so a set needs no extra flag. */
/* Every project gets its own hue, and an index is never handed out twice —
   not even after the project that held it is deleted. The golden angle keeps
   consecutive hues far apart, so the palette never visually repeats and never
   runs out. */
var GOLDEN_ANGLE = 137.508;
function projectHue(idx){ return ((idx || 0) * GOLDEN_ANGLE) % 360; }
function hueOf(projectId){
  var p = findProject(projectId);
  return p ? projectHue(p.colorIndex || 0) : null;
}
/* Project colours use oklch() so every hue is equally bright, and the golden
   angle spaces them evenly by eye — in HSL, brightness swung 2.4-3.2x across
   hues and projects #2 and #7 were near-identical greens. Lightness comes from
   the theme (the --ph-*-l tokens), so a theme switch repaints every project
   colour without a render(); render() rebuilds the page, which must never happen
   under someone typing. Chroma depends on the hue but not the theme: it is the
   most that stays inside sRGB at BOTH themes' lightness, so PH_L must match the
   tokens. */
var PH_L = { dot:[0.56, 0.68], ink:[0.44, 0.82], soft:[0.945, 0.31] };   /* [light, dark] */
var PH_CAP = { dot:0.15, ink:0.13, soft:0.045 };
var phChroma = {};
function phInSrgb(L, C, h){
  var a = C * Math.cos(h * Math.PI / 180), b = C * Math.sin(h * Math.PI / 180);
  var l = L + 0.3963377774 * a + 0.2158037573 * b,
      m = L - 0.1055613458 * a - 0.0638541728 * b,
      s = L - 0.0894841775 * a - 1.2914855480 * b;
  l = l * l * l; m = m * m * m; s = s * s * s;
  var R =  4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      G = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      B = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  return R >= 0 && R <= 1 && G >= 0 && G <= 1 && B >= 0 && B <= 1;
}
function projectChroma(kind, h){
  var key = kind + h;
  if(phChroma[key] != null) return phChroma[key];
  var L = PH_L[kind], lo = 0, hi = 0.4, i, mid;
  for(i = 0; i < 20; i++){
    mid = (lo + hi) / 2;
    if(phInSrgb(L[0], mid, h) && phInSrgb(L[1], mid, h)) lo = mid; else hi = mid;
  }
  return (phChroma[key] = Math.round(Math.min(PH_CAP[kind], lo * 0.92) * 1000) / 1000);
}
function projectColor(projectId, kind){
  var h = hueOf(projectId);
  if(h === null) return null;
  var k = kind === "ink" || kind === "soft" ? kind : "dot";
  var hue = Math.round(h * 10) / 10;
  return "oklch(var(--ph-" + (k === "dot" ? "" : k + "-") + "l) " + projectChroma(k, hue) + " " + hue + ")";
}
/* A project's name as a chip in the project's own colour, so a cross-project
   list reads by project the way the rail dots and calendar already do — they
   were all one accent colour before. */
function projChip(projectId, text){
  var c = el("span","chip proj", text);
  var soft = projectColor(projectId, "soft"), ink = projectColor(projectId, "ink");
  if(soft){ c.style.background = soft; c.style.color = ink; }
  return c;
}
/* The high water mark lives in the database, not this browser, so a colour
   stays retired for both of you and survives the project that held it. */
function nextColorIndex(){
  var high = (S.meta.colors && S.meta.colors.high) || 0;
  S.projects.forEach(function(p){
    if((p.colorIndex || 0) >= high) high = (p.colorIndex || 0) + 1;
  });
  S.meta.colors = { high: high + 1 };
  queue("meta/colors", function(){ return S.db.doc("meta/colors").set({ high: high + 1 }); });
  return high;
}

/* one definition, shared with the brief logic in lib/brief.js */
var DEFAULT_COLUMNS = SlateBrief.DEFAULT_COLUMNS;

/* patchTask has stamped completedAt only since f6a0e3e (Sep 17, 2026). Nothing
   earlier knows when it finished, so completion history starts here: older days
   are drawn as "Not tracked", never as zeros that would claim nobody worked. No
   backfill from updatedAt either — it moves on any edit, so it would invent dates. */
var TRACK_START = "2026-09-17";
/* a project with open work and no edits for this long gets a Quiet flag */
var STALE_DAYS = 7;
/* finished cards stay on a board this long, then fold behind "Show N older" —
   otherwise every Done column keeps every card ever finished */
var DONE_KEEP_DAYS = 14;

/* outreach pipeline. Won is terminal: a won prospect becomes a project. */
var STAGES = [
  {id:"lead",      label:"Lead"},
  {id:"contacted", label:"Contacted"},
  {id:"talking",   label:"In conversation"},
  {id:"won",       label:"Won"},
  {id:"lost",      label:"Not now"}
];
var STAGE_LABEL = {};
STAGES.forEach(function(s){ STAGE_LABEL[s.id] = s.label; });

/* ============ state ============ */
var S = {
  db:null, user:null, assets:null, sample:null, canSampleImages:false,
  uid:null, me:null,
  canWrite:null,          // true / false / null (unknown)
  projects:[], spaces:[], tasks:[], notes:[], schedules:[], prospects:[],
  meta:{},                // small shared counters, currently just the colour high water mark
  sel:"dash",             // "dash" | "all" | "capture" | "unfiled" | "today" | projectId
  space:null,             // spaceId within the selected project, or null for all
  tab:"board",
  q:"",
  tag:null,
  capBatch:{ ids:[], pending:0, waits:[], noteId:null },   // the photos in the capture box
  capProj:null, capSpace:null,   // capture box pickers; cleared after every save
  doc:null,                      // a doc opened as a tab inside its project
  todaySec:null,                 // section the Today page should scroll to, from a notification link
  triage:{},                     // noteId -> project chosen mid-triage, before a space is picked
  calMonth:null,          // Date on the 1st of the shown month
  calDay:null,            // "YYYY-MM-DD" selected in the calendar; Denver today by default
  calAdd:null,            // {day, sel, text, focus, proj} while adding a task on a date
  calAddProj:null,        // project last picked for a cross-project add
  calFocus:false, calReveal:false,   // one-shot: refocus the selected day / scroll its panel in
  newSpaceFor:null,
  editSched:null,
  docMode:"write",
  composing:{col:null, text:""},
  newProject:false, newProjectText:"",
  openNote:null,
  /* the dashboard. who and dashRange are per device; the rest is transient but
     lives here so a realtime re-render doesn't collapse what you just opened */
  people:[],                     // profiles, me first; empty until loaded (and offline)
  who:prefGet("who",""),         // person lens: "" = everyone, else their work plus unassigned
  dashRange:prefGet("dashRange","7"),   // "7" | "30" | "12w"
  dashPick:null,                 // the chart bucket picked, by its start date
  dashTable:false,               // the chart's table twin
  dashMore:{},                   // "Show N more" expanders
  wlOpen:null,                   // the Workload row expanded
  drill:null,                    // All projects filter from a drill-through: {lens, owner, status, project}
  doneOlder:{},                  // board or list key -> showing finished work older than DONE_KEEP_DAYS
  ready:false
};

var $ = function(s){ return document.querySelector(s); };
var railEl=$("#rail"), headEl=$("#mainhead"), bodyEl=$("#mainbody");

/* ============ helpers ============ */
function esc(s){ return String(s==null?"":s); }
/* an icon from the sprite at the top of <body>; decorative, so the control that
   holds it carries the accessible name */
var SVGNS = "http://www.w3.org/2000/svg", XLINK = "http://www.w3.org/1999/xlink";
function ico(name, cls){
  var s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("class", "ico" + (cls ? " " + cls : ""));
  s.setAttribute("aria-hidden", "true");
  s.setAttribute("focusable", "false");
  var u = document.createElementNS(SVGNS, "use");
  u.setAttribute("href", "#i-" + name);
  u.setAttributeNS(XLINK, "xlink:href", "#i-" + name);
  s.appendChild(u);
  return s;
}
/* a button holding just an icon, named for screen readers and the tooltip */
function icoBtn(cls, name, label){
  var b = el("button", cls);
  b.appendChild(ico(name));
  b.setAttribute("aria-label", label);
  b.title = label;
  return b;
}
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function nowISO(){ return new Date().toISOString(); }

var toastT;
/* action: optional {label, fn} — a button in the toast, and a longer stay so
   there's time to reach it */
function toast(msg, action){
  var t = $("#toast");
  t.textContent = "";
  t.appendChild(document.createTextNode(msg));
  t.classList.toggle("act", !!action);
  if(action){
    var b = el("button","toastbtn", action.label);
    b.onclick = function(){
      b.onclick = null;                    // one undo per toast
      clearTimeout(toastT); t.classList.remove("on", "act"); action.fn();
    };
    t.appendChild(b);
  }
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove("on", "act"); }, action ? 6000 : 2600);
}
/* One strip, three things that want it. Highest wins, and a lower one never
   erases a higher one — the update notice in particular carries a click handler
   that a plain banner() call used to destroy. */
var bannerLayers = { update:null, error:null, outbox:null };
var BANNER_ORDER = ["update","error","outbox"];
function paintBanner(){
  var b = $("#banner");
  var top = null;
  for(var i=0;i<BANNER_ORDER.length;i++){
    if(bannerLayers[BANNER_ORDER[i]]){ top = bannerLayers[BANNER_ORDER[i]]; break; }
  }
  b.onclick = null;
  b.classList.remove("tap");
  if(!top){ b.classList.remove("on"); b.textContent = ""; return; }
  b.textContent = top.text;
  if(top.onTap){ b.classList.add("tap"); b.onclick = top.onTap; }
  b.classList.add("on");
}
function setBanner(layer, text, onTap){
  bannerLayers[layer] = text ? { text: text, onTap: onTap || null } : null;
  paintBanner();
}
function banner(msg){ setBanner("error", msg || null); }

/* a dialog that works inside a sandboxed frame, unlike confirm() */
function askConfirm(title, body, yesLabel){
  return new Promise(function(resolve){
    var box = $("#confirm"), yes = $("#cYes"), no = $("#cNo");
    $("#cTitle").textContent = title;
    $("#cBody").textContent = body;
    yes.textContent = yesLabel || "Delete";
    box.classList.add("on");
    yes.focus();
    function done(v){
      box.classList.remove("on");
      yes.onclick = no.onclick = null;
      box.onmousedown = null;
      document.removeEventListener("keydown", key);
      resolve(v);
    }
    function key(e){ if(e.key === "Escape"){ e.stopPropagation(); done(false); } }
    yes.onclick = function(){ done(true); };
    no.onclick = function(){ done(false); };
    box.onmousedown = function(e){ if(e.target === box) done(false); };
    document.addEventListener("keydown", key);
  });
}

/* swap a node's contents for a text input; Enter or blur saves, Escape cancels */
function inlineEdit(container, current, onSave){
  container.textContent = "";
  var i = document.createElement("input");
  i.type = "text";
  i.className = "inline-edit";
  i.value = current || "";
  container.appendChild(i);
  i.focus();
  i.select();
  var closed = false;
  function finish(save){
    if(closed) return;
    closed = true;
    var v = i.value.trim();
    if(save && v && v !== current) onSave(v);
    else render();
  }
  i.onkeydown = function(e){
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); finish(true); }
    else if(e.key === "Escape"){ e.preventDefault(); finish(false); }
  };
  i.onblur = function(){
    if(!i.isConnected){ closed = true; return; }
    finish(true);
  };
  i.onclick = function(e){ e.stopPropagation(); };
}

function prefGet(k, d){
  try{ var v = localStorage.getItem("slate:"+k); return v==null?d:v; }catch(e){ return d; }
}
function prefSet(k, v){
  try{ localStorage.setItem("slate:"+k, v); }catch(e){}
}

/* one write at a time per document path */
var chains = new Map();
function queue(path, fn){
  var prev = chains.get(path) || Promise.resolve();
  var next = prev.catch(function(){}).then(fn).catch(function(e){ dbErr(e); });
  chains.set(path, next);
  return next;
}
/* The codes this used to test — invalid_argument, quota_exceeded,
   resource_exhausted, revoked — were artifact-runtime strings. PostgREST emits
   none of them, so every branch was dead and the read-only banner had never
   fired once. These are what actually arrives. */
function dbErr(e){
  var code = (e && e.code) || "";
  var status = (e && e.status) || 0;
  if(code === "offline"){
    toast("Images need a connection. Your text saves now — add the photo when you're back.");
  } else if(code === "queue_full"){
    banner("There are too many unsaved changes on this device. Get back online before adding more.");
  } else if(code === "not_loaded"){
    toast("That isn't loaded yet. Give it a second and try again.");
  } else if(code === "42501" || status === 401 || status === 403){
    S.canWrite = false;
    banner("You have read-only access to this board, so changes aren't saved.");
    render();
  } else if(code === "23505"){
    toast("Something with that name already exists.");
  } else if(code === "PGRST301" || code === "PGRST303"){
    banner("Your sign-in expired. Reload to continue.");
  } else {
    toast("That change didn't save. Try again.");
  }
}
function writable(){ return S.canWrite !== false && !!S.db; }

function fmtDate(d){
  if(!d) return "";
  var p = d.split("-");
  if(p.length !== 3) return d;
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return mons[dt.getMonth()] + " " + dt.getDate();
}
function isLate(d, status){
  if(!d || status === "done") return false;
  var today = new Date(); today.setHours(0,0,0,0);
  var p = d.split("-");
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  return dt < today;
}
function relTime(iso){
  if(!iso) return "";
  var diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 60) return "just now";
  if(diff < 3600) return Math.floor(diff/60) + "m ago";
  if(diff < 86400) return Math.floor(diff/3600) + "h ago";
  if(diff < 604800) return Math.floor(diff/86400) + "d ago";
  return fmtDate(iso.slice(0,10));
}
/* ---- tags, links, days ---- */
var TAG_RE = /#([\w-]{1,32})/g;
var URL_RE = /(https?:\/\/[^\s<>()]+)/g;

function tagsOf(n){
  var out = [], m;
  var hay = (n.title || "") + " " + (n.body || "");
  TAG_RE.lastIndex = 0;
  while((m = TAG_RE.exec(hay)) !== null){
    var t = m[1].toLowerCase();
    if(out.indexOf(t) === -1) out.push(t);
  }
  return out;
}
function allTags(notes){
  var counts = {};
  notes.forEach(function(n){
    tagsOf(n).forEach(function(t){ counts[t] = (counts[t]||0) + 1; });
  });
  return Object.keys(counts).sort(function(a,b){
    return counts[b] - counts[a] || a.localeCompare(b);
  }).map(function(t){ return {tag:t, n:counts[t]}; });
}

/* text with #tags and links made live, built as nodes (never innerHTML) */
function richText(container, text){
  var parts = String(text || "").split(/(\s+)/);
  parts.forEach(function(p){
    if(!p) return;
    if(/^#[\w-]{1,32}$/.test(p)){
      var s = el("span","tagref", p);
      s.onclick = function(e){
        e.stopPropagation();
        S.tag = p.slice(1).toLowerCase();
        if(S.sel === "dash" || (S.sel !== "capture" && S.tab !== "notes")) S.sel = "capture";
        render();
      };
      container.appendChild(s);
    } else if(/^https?:\/\//.test(p)){
      var a = document.createElement("a");
      a.href = p; a.textContent = p;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.onclick = function(e){ e.stopPropagation(); };
      container.appendChild(a);
    } else {
      container.appendChild(document.createTextNode(p));
    }
  });
}

/* a card that can contain links, so not a <button> */
function clickable(cls, onActivate){
  var d = el("div", cls);
  d.setAttribute("role","button");
  d.tabIndex = 0;
  d.onclick = function(e){
    if(e.target.closest && e.target.closest("a, .tagref")) return;
    onActivate();
  };
  d.onkeydown = function(e){
    if(e.key === "Enter" || e.key === " "){
      if(e.target !== d) return;
      e.preventDefault();
      onActivate();
    }
  };
  return d;
}

function dayKey(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
}
function dayLabel(iso){
  if(!iso) return "";
  var d = new Date(iso), now = new Date();
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((b - a) / 86400000);
  if(days === 0) return "Today";
  if(days === 1) return "Yesterday";
  var mons = ["January","February","March","April","May","June","July",
              "August","September","October","November","December"];
  var s = mons[d.getMonth()] + " " + d.getDate();
  if(d.getFullYear() !== now.getFullYear()) s += ", " + d.getFullYear();
  return s;
}

function findProject(id){
  for(var i=0;i<S.projects.length;i++) if(S.projects[i].id === id) return S.projects[i];
  return null;
}
function findSpace(id){
  for(var i=0;i<S.spaces.length;i++) if(S.spaces[i].id === id) return S.spaces[i];
  return null;
}
/* the doc that owns a set of columns: the space if there is one, else the project */
function columnHost(projectId, spaceId){
  if(spaceId && findSpace(spaceId)) return "spaces/" + spaceId;
  if(projectId && findProject(projectId)) return "projects/" + projectId;
  return null;
}
function columnsFor(projectId, spaceId){
  var sp = spaceId && findSpace(spaceId);
  if(sp && sp.columns && sp.columns.length) return sp.columns;
  var pr = projectId && findProject(projectId);
  if(pr && pr.columns && pr.columns.length) return pr.columns;
  return DEFAULT_COLUMNS;
}
function firstColumnId(projectId, spaceId){
  var c = columnsFor(projectId, spaceId);
  return c.length ? c[0].id : null;
}
function doneColumnId(projectId, spaceId){
  var c = columnsFor(projectId, spaceId);
  return c.length ? c[c.length-1].id : null;
}
function taskDone(t){
  return !!t && t.status === doneColumnId(t.projectId, t.spaceId);
}
/* started but not finished: anything in a middle column */
function taskUnderway(t){
  var c = columnsFor(t.projectId, t.spaceId);
  if(c.length < 3) return false;
  for(var i=1;i<c.length-1;i++) if(c[i].id === t.status) return true;
  return false;
}
function columnName(projectId, spaceId, colId){
  var c = columnsFor(projectId, spaceId);
  for(var i=0;i<c.length;i++) if(c[i].id === colId) return c[i].name;
  return c.length ? c[0].name : "";
}
/* a status that no longer matches any column falls back to the first one, so a
   renamed or deleted column can never strand a task off the board */
function columnOf(t){
  var c = columnsFor(t.projectId, t.spaceId);
  for(var i=0;i<c.length;i++) if(c[i].id === t.status) return t.status;
  return c.length ? c[0].id : t.status;
}

function projName(id){
  for(var i=0;i<S.projects.length;i++) if(S.projects[i].id === id) return S.projects[i].name || "Untitled project";
  return null;
}
function spaceName(id){
  for(var i=0;i<S.spaces.length;i++) if(S.spaces[i].id === id) return S.spaces[i].name || "Untitled space";
  return null;
}
function spacesOf(projectId){
  return S.spaces.filter(function(s){ return s.projectId === projectId; })
    .sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
/* views that aren't a project: anything else in S.sel is a project id */
var VIRTUAL_VIEWS = ["dash","all","capture","unfiled","today"];
function isVirtualView(sel){ return VIRTUAL_VIEWS.indexOf(sel) !== -1; }
function currentProject(){
  return isVirtualView(S.sel) ? null : S.sel;
}
/* still chasing: won ones became projects, lost ones are parked */
function openProspects(){
  var q = S.q.toLowerCase();
  return S.prospects.filter(function(p){
    if(p.stage === "won" || p.stage === "lost") return false;
    if(q){
      var hay = (String(p.company||"") + " " + String(p.contact||"") + " " + String(p.note||"")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

/* ============ selectors ============ */
function visibleTasks(){
  var q = S.q.toLowerCase();
  /* a drill-through filter only ever applies where its chip is showing */
  var dr = S.sel === "all" ? S.drill : null;
  return S.tasks.filter(function(t){
    /* the dashboard and Today read S.tasks through their own models */
    if(S.sel === "unfiled" || S.sel === "capture" || S.sel === "dash" || S.sel === "today") return false;
    if(S.sel !== "all" && t.projectId !== S.sel) return false;
    if(S.space && t.spaceId !== S.space) return false;
    if(q && (String(t.title||"") + " " + String(t.notes||"")).toLowerCase().indexOf(q) === -1) return false;
    if(dr && !drillMatch(t, dr)) return false;
    return true;
  }).sort(function(a,b){ return (a.order||0) - (b.order||0); });
}
/* The lens rule is the morning brief's: someone's view is theirs plus nobody's. */
function drillMatch(t, dr){
  if(dr.lens && t.assignee && t.assignee !== dr.lens) return false;
  if(dr.owner === "none" && t.assignee) return false;
  if(dr.owner && dr.owner !== "none" && t.assignee !== dr.owner) return false;
  if(dr.status === "doing" && !taskUnderway(t)) return false;
  if(dr.status === "open" && taskDone(t)) return false;
  if(dr.project === "none" && t.projectId && findProject(t.projectId)) return false;
  return true;
}
function visibleNotes(){
  var q = S.q.toLowerCase();
  return S.notes.filter(function(n){
    if(S.sel === "unfiled"){ if(n.projectId) return false; }
    else if(S.sel !== "all" && S.sel !== "capture"){
      if(n.projectId !== S.sel) return false;
      if(S.space && n.spaceId !== S.space) return false;
    }
    if(S.tag && tagsOf(n).indexOf(S.tag) === -1) return false;
    if(q){
      var hay = (String(n.title||"") + " " + String(n.body||"") +
                 (noteKind(n) === "doc" ? " " + docPlain(n.body) : "")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function(a,b){
    return String(b.updatedAt||"").localeCompare(String(a.updatedAt||""));
  });
}
function visibleSchedules(){
  return S.schedules.filter(function(s){
    if(S.sel === "all") return true;
    if(S.sel !== s.projectId) return false;
    if(S.space && s.spaceId !== S.space) return false;
    return true;
  }).sort(function(a,b){ return String(a.time||"").localeCompare(String(b.time||"")); });
}

function deleteProject(id){
  if(!writable()) return;
  var tasks = S.tasks.filter(function(t){ return t.projectId === id; });

  /* Repeating items and spaces belong to the project and can only be reached
     through it. Left behind they become unreachable: a schedule still occurs

     an event for a project that no longer exists, with nowhere to go and delete

            " will be deleted with it. " +
            notes.length + " note" + (notes.length===1?"":"s") + " will move to Unfiled notes.";
  askConfirm("Delete " + (projName(id) || "this project") + "?", msg, "Delete project").then(function(ok){

    notes.forEach(function(n){ queue("notes/"+n.id, function(){ return S.db.doc("notes/"+n.id).update({ projectId:null }); }); });
    scheds.forEach(function(s){ queue("schedules/"+s.id, function(){ return S.db.doc("schedules/"+s.id).delete(); }); });
    spaces.forEach(function(sp){ queue("spaces/"+sp.id, function(){ return S.db.doc("spaces/"+sp.id).delete(); }); });

      .then(function(){ goView("dash"); });

/* due is optional: the calendar creates a task on the day it was added from */
function createTask(title, status, projectId, spaceId, noteId, due){
  if(!writable() || !String(title||"").trim()) return;
  var id = uid();
  status = status || firstColumnId(projectId, spaceId);
  var inCol = S.tasks.filter(function(t){
    return t.status === status && (t.projectId||null) === (projectId||null) && (t.spaceId||null) === (spaceId||null);
  });
  var maxOrder = inCol.reduce(function(m,t){ return Math.max(m, t.order||0); }, 0);
  var doc = {
    title: String(title).trim(),
    status: status,
    projectId: projectId || null,
    spaceId: spaceId || null,
    assignee: null,
    due: due || null,
    noteId: noteId || null,
    order: maxOrder + 1,
    createdAt: nowISO(),
    createdBy: S.uid || null,
    updatedAt: nowISO()
  };
  /* typed straight into the Done column's "Add a task": finished now, and without
     the stamp it would never appear in the evening wrap or the history */
  if(status === doneColumnId(projectId, spaceId)){ doc.completedAt = nowISO(); doc.completedBy = S.uid || null; }
  queue("tasks/"+id, function(){ return S.db.doc("tasks/"+id).set(doc); });
}
function patchTask(id, patch){
  if(!writable()) return;
  patch.updatedAt = nowISO();
  /* Completion is positional — the last column means done — so the timestamp the
     evening brief reads is stamped here, the one door every status change walks
     through. Landing in the done column sets it; leaving clears it. */
  if("status" in patch || "projectId" in patch || "spaceId" in patch){
    var cur = null;
    for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id === id){ cur = S.tasks[i]; break; }
    if(cur){
      var was = taskDone(cur);
      var now = taskDone(Object.assign({}, cur, patch));
      /* and who: the dashboard reports who finished what, and without this the
         answer for anything done before today would always be "someone" */
      if(!was && now){ patch.completedAt = nowISO(); patch.completedBy = S.uid || null; }
      else if(was && !now){ patch.completedAt = null; patch.completedBy = null; }
    }
  }
  queue("tasks/"+id, function(){ return S.db.doc("tasks/"+id).update(patch); });
}
/* Deleting is one tap — on a phone the list row's x sits right beside the row
   you tap to open it — so it keeps a copy and offers Undo for a few seconds.
   The restore is an ordinary set() on the same path, so it goes through the
   same per-path queue and, offline, the outbox collapses delete-then-restore
   into the restore. */
function deleteTask(id){
  if(!writable()) return;
  var copy = null;
  for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id === id){ copy = Object.assign({}, S.tasks[i]); break; }
  if(copy) delete copy.id;
  queue("tasks/"+id, function(){ return S.db.doc("tasks/"+id).delete(); });
  if(copy){
    toast("Deleted \u201c" + (copy.title || "Untitled").slice(0,40) + "\u201d", { label:"Undo", fn:function(){
      queue("tasks/"+id, function(){ return S.db.doc("tasks/"+id).set(copy); });
    }});
  }
}

/* a captured note: first line becomes the name, the rest is the body */
function captureNote(text, images, projectId, spaceId){
  if(!writable()) return Promise.resolve();
  var raw = String(text || "").replace(/\r/g,"");
  if(!raw.trim() && !(images && images.length)) return Promise.resolve();
  var lines = raw.split("\n");
  var title = "", body = raw.trim();
  if(lines.length > 1 && lines[0].trim() && lines[0].trim().length <= 70){
    title = lines[0].trim();
    body = lines.slice(1).join("\n").trim();
  } else if(lines.length === 1 && raw.trim().length <= 70){
    title = raw.trim();
    body = "";
  }
  var id = uid();
  captureNote.lastId = id;
  return queue("notes/"+id, function(){
    return S.db.doc("notes/"+id).set({
      title: title,
      body: body,
      kind: "note",
      images: images ? images.slice() : [],
      projectId: projectId || null,
      spaceId: projectId ? (spaceId || (S.space || null)) : null,
      createdAt: nowISO(),
      createdBy: S.uid || null,
      updatedAt: nowISO(),
      updatedBy: S.uid || null
    });
  });
}

function taskTitleFor(n){
  var title = (n.title && n.title.trim()) || String(n.body||"").split("\n")[0].trim() || "Untitled";
  return title.length > 120 ? title.slice(0,117) + "…" : title;
}

/* ---- columns ---- */
function writeColumns(projectId, spaceId, cols){
  var host = columnHost(projectId, spaceId);
  if(!host || !writable()) return Promise.resolve();
  return queue(host, function(){ return S.db.doc(host).update({ columns: cols }); });
}
function addColumn(projectId, spaceId, name){
  var cols = columnsFor(projectId, spaceId).slice();
  cols.push({ id: uid(), name: name || "New column" });
  return writeColumns(projectId, spaceId, cols);
}
function renameColumn(projectId, spaceId, colId, name){
  var cols = columnsFor(projectId, spaceId).map(function(c){
    return c.id === colId ? { id: c.id, name: name } : { id: c.id, name: c.name };
  });
  return writeColumns(projectId, spaceId, cols);
}
function deleteColumn(projectId, spaceId, colId){
  var cols = columnsFor(projectId, spaceId);
  if(cols.length <= 1) return Promise.resolve();
  var left = cols.filter(function(c){ return c.id !== colId; });
  var fallback = left[0].id;
  /* This re-files cards without going through patchTask, so it has to keep
     completedAt itself — and done-ness has to be judged against the columns that
     will exist after the delete, not the ones being replaced. Deleting down to a
     single column makes that column both first and last, so the cards landing on
     it become done. */
  var doneAfter = left[left.length - 1].id;
  var nowDone = fallback === doneAfter;
  S.tasks.forEach(function(t){
    if(t.projectId === projectId && (t.spaceId || null) === (spaceId || null) && t.status === colId){
      var patch = { status: fallback, updatedAt: nowISO() };
      var wasDone = taskDone(t);
      if(!wasDone && nowDone){ patch.completedAt = nowISO(); patch.completedBy = S.uid || null; }
      else if(wasDone && !nowDone){ patch.completedAt = null; patch.completedBy = null; }
      queue("tasks/"+t.id, function(){ return S.db.doc("tasks/"+t.id).update(patch); });
    }
  });
  return writeColumns(projectId, spaceId, left);
}
