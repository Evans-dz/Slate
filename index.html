<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Slate">
<meta name="format-detection" content="telephone=no">
<title>Slate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
<script>
/* Theme and accent are per device (each of you picks your own), and must be on
   <html> before the first paint or the page flashes the wrong theme on every
   open. Kept tiny and inline for that reason; applyAppearance() owns it after. */
(function(){
  try{
    var d = document.documentElement;
    var t = localStorage.getItem("slate:theme"), a = localStorage.getItem("slate:accent");
    if(t === "light" || t === "dark") d.setAttribute("data-theme", t);
    if(a) d.setAttribute("data-accent", a);
  }catch(e){}
})();
</script>
<style>
:root{
  --paper:#F4F2ED;
  --panel:#FFFFFF;
  --note:#EFE9DB;
  --note-edge:#DFD5BF;
  --ink:#1B1A17;
  --muted:#7C776C;
  --line:#DEDAD1;
  --line-soft:#E9E5DD;
  --accent:#2C5849;
  --accent-ink:#2C5849;
  --accent-soft:#E1EAE5;
  --danger:#8C3A2B;
  --shadow:0 1px 1px rgba(27,26,23,.04), 0 2px 6px rgba(27,26,23,.05);
  /* project hues: projectColor() supplies the hue, the theme supplies these */
  --ph-s:44%; --ph-l:40%; --ph-ink-s:42%; --ph-ink-l:30%; --ph-soft-s:46%; --ph-soft-l:92%;
  /* ---- token contract for the redesign: builders use these names, the palette
     sets the values. Values here are provisional until the palette lands. ---- */
  --panel-2:#F7F8FA;      /* a raised or secondary surface: table heads, hover, segmented tracks */
  --ink-2:#3A404C;        /* secondary text, stronger than --muted */
  --on-accent:#FFFFFF;    /* text and icons on an --accent fill */
  --good:#1B7A45; --warn:#A15C00;   /* status only, always with an icon or label */
  --scrim:rgba(20,22,28,.42);       /* behind sheets and dialogs */
  --mark:#FFE9A8; --code-bg:#EEF0F4; --quote-bar:#C6CCD5;   /* docs: highlight, code, quote rule */
  /* charts: deliberately NOT the accent, so the same chart looks the same on both
     your devices whatever accent each of you picked. One validated blue ramp:
     not started -> in progress -> done. */
  --viz-1:#2a78d6; --viz-1-soft:rgba(42,120,214,.12);
  --viz-todo:#86b6ef; --viz-doing:var(--viz-1); --viz-done:#104281;
  --viz-grid:var(--line-soft); --viz-axis:var(--line); --viz-untracked:var(--line-soft); --crit:var(--danger);
  --radius:5px;
  --ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141619;
    --panel:#1C1F23;
    --note:#241F17;
    --note-edge:#3B3325;
    --ink:#E8E6E0;
    --muted:#94918A;
    --line:#2D3137;
    --line-soft:#24272C;
    --accent:#84B9A4;
    --accent-ink:#9CCBB7;
    --accent-soft:#22322C;
    --danger:#D08878;
    --shadow:0 1px 1px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.28);
    --ph-s:38%; --ph-l:58%; --ph-ink-s:42%; --ph-ink-l:72%; --ph-soft-s:30%; --ph-soft-l:18%;
    --panel-2:#272A31; --ink-2:#C9CDD5; --on-accent:#FFFFFF;
    --good:#5FC48A; --warn:#E2A94A; --scrim:rgba(0,0,0,.55);
    --mark:#5A4A12; --code-bg:#2A2E36; --quote-bar:#444A55;
    --viz-1:#3987e5; --viz-1-soft:rgba(57,135,229,.18);
    --viz-todo:#184f95; --viz-doing:var(--viz-1); --viz-done:#9ec5f4;
  }
}
:root[data-theme="dark"]{
  --paper:#141619;
  --panel:#1C1F23;
  --note:#241F17;
  --note-edge:#3B3325;
  --ink:#E8E6E0;
  --muted:#94918A;
  --line:#2D3137;
  --line-soft:#24272C;
  --accent:#84B9A4;
  --accent-ink:#9CCBB7;
  --accent-soft:#22322C;
  --danger:#D08878;
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.28);
  --ph-s:38%; --ph-l:58%; --ph-ink-s:42%; --ph-ink-l:72%; --ph-soft-s:30%; --ph-soft-l:18%;
  --panel-2:#272A31; --ink-2:#C9CDD5; --on-accent:#FFFFFF;
  --good:#5FC48A; --warn:#E2A94A; --scrim:rgba(0,0,0,.55);
  --mark:#5A4A12; --code-bg:#2A2E36; --quote-bar:#444A55;
  --viz-1:#3987e5; --viz-1-soft:rgba(57,135,229,.18);
  --viz-todo:#184f95; --viz-doing:var(--viz-1); --viz-done:#9ec5f4;
}

*{box-sizing:border-box}
/* the sprite's icons: stroked in the colour of the text they sit beside */
.ico{
  width:18px;height:18px;flex:0 0 auto;display:block;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.ico.sm{width:15px;height:15px}
.ico.lg{width:22px;height:22px}
/* the few glyphs made of dots fill rather than stroke */
.ico.dots{fill:currentColor;stroke:none}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::placeholder{color:var(--muted);opacity:.75}

/* touch devices: never hide an action behind hover */
@media (hover:none){
  .rowx,.blkcopy,.spacex,.col-head .colx,.projtitle .pinfo{opacity:1 !important}
}

/* ---------- shell ---------- */
#shell{
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  /* landscape on a notched phone: keep the rail and bar out of the cutout */
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}

#topbar{
  display:flex;align-items:center;gap:14px;
  padding:0 16px;height:52px;flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .mark{
  width:15px;height:15px;border-radius:2px;
  background:var(--accent);flex:0 0 auto;align-self:center;
  transform:rotate(-8deg);
}
.brand .word{font-size:15px}
.brand .sub{font-size:12px;color:var(--muted);font-weight:400}
#railToggle{display:none}

#search{
  flex:1;max-width:340px;margin-left:auto;
  border:1px solid var(--line);background:var(--paper);
  border-radius:var(--radius);padding:6px 10px;font-size:13px;
}
#search:focus{border-color:var(--accent);outline:none}
#whoami{display:flex;align-items:center;gap:7px;flex:0 0 auto}
#whoami img{width:24px;height:24px;border-radius:50%;display:block}
#whoami .nm{font-size:13px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#body{display:grid;grid-template-columns:224px minmax(0,1fr);flex:1 1 auto;min-height:0}

/* base rule must precede the 860px block, or the scrim becomes a grid item and
   displaces the rail and main pane on every desktop width */
#railScrim{display:none}

/* ---------- rail ---------- */
#rail{
  border-right:1px solid var(--line);
  background:var(--panel);
  padding:14px 0 28px;
  overflow-y:auto;
}
.rail-sec{margin-bottom:22px}
.rail-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 6px;font-size:12px;color:var(--muted);letter-spacing:.01em;
}
.rail-head button{color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;border-radius:3px}
.rail-head button:hover{color:var(--accent-ink);background:var(--accent-soft)}
.rail-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:5px 14px;font-size:13.5px;text-align:left;
  border-left:2px solid transparent;color:var(--ink);
}
.rail-item:hover{background:var(--line-soft)}
.rail-item.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
.rail-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
.rail-item .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rail-item .ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-empty{padding:2px 14px 0;font-size:12.5px;color:var(--muted)}

/* ---------- main ---------- */
#main{min-width:0;display:flex;flex-direction:column}
#mainhead{padding:20px 22px 0;flex:0 0 auto}
.title-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.projtitle{
  display:flex;align-items:center;gap:9px;text-align:left;max-width:100%;
  font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2;
  padding:2px 6px;margin:-2px -6px;border-radius:4px;
}
.projtitle.plain{cursor:default}
.projtitle .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projtitle .pdot{
  width:11px;height:11px;border-radius:3px;flex:0 0 auto;
  transform:rotate(-8deg);
}
.projtitle .pinfo{
  font-size:11.5px;font-weight:400;letter-spacing:0;color:var(--muted);
  border:1px solid var(--line);border-radius:9px;padding:1px 8px;
  flex:0 0 auto;opacity:0;transition:opacity .12s ease;
}
.projtitle:hover{background:var(--line-soft)}
.projtitle:hover .pinfo,.projtitle:focus-visible .pinfo{opacity:1}
#tkNote{align-self:flex-start;margin:2px 0 10px;font-size:12.5px}
.triage{
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--note-edge);
}
.triage select{
  border:1px solid var(--note-edge);background:var(--panel);
  border-radius:3px;padding:4px 7px;font-size:12px;font-family:var(--ui);
  max-width:100%;
}
.triage select:focus{border-color:var(--accent);outline:none}
.triage .btn{padding:4px 10px;font-size:12px}
.pmeta-line{
  display:flex;align-items:center;gap:7px 14px;flex-wrap:wrap;
  margin-top:8px;font-size:12.5px;color:var(--muted);
}
.pmeta-line a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.pmeta-line a:hover{color:var(--accent-ink);border-bottom-color:var(--accent)}

.viewswitch{
  margin-left:auto;display:flex;gap:4px;align-self:center;
  padding-bottom:5px;flex:0 0 auto;
}
/* icon plus its name: these four switch the whole view, and as bare glyphs
   nobody could tell ▣ from ◈ without hovering for the tooltip */
.vbtn{
  display:flex;align-items:center;gap:6px;
  min-height:34px;padding:0 11px;border-radius:5px;
  font-size:13px;line-height:1;white-space:nowrap;
  color:var(--muted);border:1px solid transparent;
}
.vbtn .vico{opacity:.9}
.vbtn:hover{background:var(--line-soft);color:var(--ink)}
.vbtn.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.tab.tabadd{color:var(--muted);font-size:16px;padding:7px 11px}
.tab.tabadd:hover{color:var(--accent-ink)}
.tabnew{
  align-self:center;border:1px solid var(--accent);border-radius:3px;
  padding:4px 8px;font-size:13px;background:var(--paper);margin-bottom:5px;
}
.tabnew:focus{outline:none}
.pjspaces{display:flex;flex-direction:column;gap:6px}
.pjspace{display:flex;align-items:center;gap:8px}
.pjspace input{flex:1}
.pjspace .btn{padding:4px 9px;font-size:12px}
.tabsep{
  align-self:center;width:1px;height:16px;background:var(--line);
  margin:0 6px 6px;flex:0 0 auto;
}
.tab.tabdoc{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:14px}
.tab.tabdoc .dico{color:var(--muted);width:14px;height:14px}
.tab.tabdoc.on .dico{color:var(--accent-ink)}

.docpage-head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);
}
.docpage-head h2{
  margin:0;font-family:var(--serif);font-size:23px;font-weight:600;
  letter-spacing:-.015em;
}
.docpage-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.docpage-head .btn{margin-left:auto}
.docpage{
  display:flex;flex-direction:column;gap:10px;max-width:760px;
}
.pjcolor{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);line-height:1.4}
.pjcolor .sw{width:22px;height:22px;border-radius:4px;flex:0 0 auto;transform:rotate(-8deg)}
#mainhead .meta{font-size:12.5px;color:var(--muted);margin-top:7px}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:5px 11px;font-size:13px;background:var(--panel);
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{opacity:.88;color:var(--panel);border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet:hover{border-color:var(--line);color:var(--ink)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}

.tabs{display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line);align-items:flex-end}
.tab{
  padding:7px 12px;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab .n{font-size:11.5px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}

#mainbody{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 22px 40px}

/* ---------- board ---------- */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.col{
  /* flexes so all four columns fit an iPad in landscape, and widens a little on a
     big monitor, but never gets too narrow to read a card */
  flex:1 1 0;min-width:216px;max-width:300px;
  background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;max-height:calc(100dvh - 230px);
}
.col.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.col-head{
  display:flex;align-items:center;gap:8px;padding:9px 11px;
  border-bottom:1px solid var(--line-soft);
}
.col-head .bar{width:18px;height:3px;border-radius:2px;background:var(--accent);opacity:.85}
.col-head .nm{font-size:13px;font-weight:500}
.col-head .n{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-body{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:44px}
.col-foot{padding:0 8px 8px}
.addtask{
  width:100%;border:1px dashed var(--line);background:transparent;
  border-radius:var(--radius);padding:6px 9px;font-size:13px;
}
.addtask:focus{border-style:solid;border-color:var(--accent);outline:none}

.card{
  position:relative;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 10px 8px 22px;cursor:pointer;
  box-shadow:var(--shadow);
}
.card .grip{
  position:absolute;left:0;top:0;bottom:0;width:20px;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);
  cursor:grab;touch-action:none;opacity:.45;
  border-radius:var(--radius) 0 0 var(--radius);
}
.card .grip:hover{opacity:1;background:var(--line-soft)}
.card .grip:active{cursor:grabbing}
@media (hover:none){ .card .grip{opacity:.8;width:26px} .card{padding-left:28px} }
.card.dragging{opacity:.32}
.dragghost{
  position:fixed;z-index:95;pointer-events:none;
  box-shadow:0 12px 28px rgba(20,19,17,.28);
  transform:rotate(1.4deg);opacity:.96;
}
body.dragging-now{user-select:none;-webkit-user-select:none}

/* task sheet reuses the schedule dialog shell */
#projDlg{
  position:fixed;inset:0;z-index:78;display:none;
  background:rgba(20,19,17,.36);padding:9vh 16px 16px;overflow-y:auto;
}
#projDlg.on{display:block}

#prospectDlg{
  position:fixed;inset:0;z-index:77;display:none;
  background:rgba(20,19,17,.36);padding:9vh 16px 16px;overflow-y:auto;
}
#prospectDlg.on{display:block}
#prNote{
  width:100%;border:1px solid var(--line);border-radius:3px;
  padding:8px 9px;font-size:13.5px;background:var(--paper);
  font-family:var(--ui);line-height:1.5;resize:vertical;
}
#prNote:focus{border-color:var(--accent);outline:none}

#taskDlg{
  position:fixed;inset:0;z-index:76;display:none;
  background:rgba(20,19,17,.36);padding:9vh 16px 16px;overflow-y:auto;
}
#taskDlg.on{display:block}
.card .ttl{font-size:13.5px;line-height:1.35;word-break:break-word}
.card.done .ttl{color:var(--muted);text-decoration:line-through}
.card .foot{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.chip{
  font-size:11px;padding:1px 6px;border-radius:3px;
  background:var(--line-soft);color:var(--muted);
}
.chip.proj{background:var(--accent-soft);color:var(--accent-ink)}
.chip.due{border:1px solid var(--line);background:transparent}
.chip.due.late{color:var(--danger);border-color:var(--danger)}
.card .who{width:19px;height:19px;border-radius:50%;margin-left:auto;display:block}
.drop-line{height:2px;background:var(--accent);border-radius:2px;margin:-4px 0}

/* ---------- list ---------- */
.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{
  text-align:left;font-weight:500;font-size:12px;color:var(--muted);
  padding:0 10px 7px;border-bottom:1px solid var(--line);
}
.list td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.list tr:hover td{background:var(--panel)}
.list .c-check{width:30px}
.list .c-due{width:128px}
.list .c-who{width:44px}
.list .c-st{width:132px}
.list .c-x{width:34px}
.list td.tt{word-break:break-word}
.list td.tt.done{color:var(--muted);text-decoration:line-through}
.list input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.list select,.list input[type=date]{
  border:1px solid transparent;background:transparent;border-radius:3px;
  padding:3px 5px;font-size:12.5px;width:100%;
}
.list select:hover,.list input[type=date]:hover{border-color:var(--line)}
.list img.who{width:21px;height:21px;border-radius:50%;display:block}
.rowx{color:var(--muted);padding:3px;border-radius:3px;opacity:0;display:inline-flex;align-items:center;justify-content:center}
tr:hover .rowx{opacity:1}
.rowx:hover{color:var(--danger)}

/* ---------- notes ---------- */
.notes{
  display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
  align-items:start;
}
.note{
  background:var(--note);border:1px solid var(--note-edge);
  border-radius:3px 12px 3px 3px;padding:12px 13px 11px;
  text-align:left;width:100%;min-height:104px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;
  box-shadow:var(--shadow);
}
.note:hover{border-color:var(--accent)}
.note .nt{
  font-family:var(--serif);font-size:17px;font-weight:500;
  line-height:1.25;letter-spacing:-.005em;word-break:break-word;
}
.note .nb{
  font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink);
  opacity:.78;flex:1;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;
  white-space:pre-wrap;word-break:break-word;
}
.note .nf{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.note .nf img{width:17px;height:17px;border-radius:50%;margin-left:auto}
.note.add{
  background:transparent;border:1px dashed var(--line);box-shadow:none;
  align-items:center;justify-content:center;color:var(--muted);
  font-family:var(--ui);font-size:13px;border-radius:3px;
}
.note.add:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- empty ---------- */
.empty{
  max-width:400px;padding:34px 0;color:var(--muted);font-size:14px;line-height:1.55;
}
.empty h2{
  font-family:var(--serif);font-size:20px;font-weight:500;
  color:var(--ink);margin:0 0 6px;letter-spacing:-.01em;
}
.empty .btn{margin-top:14px}

/* ---------- note editor ---------- */
#overlay{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(20,19,17,.36);
  padding:24px 16px;overflow-y:auto;
}
#overlay.on{display:block}
#editor{
  max-width:680px;margin:0 auto;background:var(--note);
  border:1px solid var(--note-edge);border-radius:4px 16px 4px 4px;
  box-shadow:0 18px 44px rgba(20,19,17,.24);
  padding:20px 22px 16px;display:flex;flex-direction:column;gap:10px;
}
#edTitle{
  font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.015em;
  border:0;background:transparent;width:100%;padding:0;line-height:1.2;
}
#edTitle:focus{outline:none}
#edBody{
  font-family:var(--serif);font-size:16px;line-height:1.62;
  border:0;background:transparent;width:100%;resize:vertical;
  min-height:300px;padding:0;
}
#edBody:focus{outline:none}
#edRule{height:1px;background:var(--note-edge);margin:2px 0 4px}
#edFoot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--note-edge);padding-top:11px;margin-top:4px;
  font-size:12.5px;color:var(--muted);
}
#edProj{
  border:1px solid var(--note-edge);background:transparent;
  border-radius:3px;padding:4px 7px;font-size:12.5px;font-family:var(--ui);
}
#edStatus{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- inline edit ---------- */
.inline-edit{
  width:100%;border:1px solid var(--accent);border-radius:3px;
  padding:2px 5px;font-size:13.5px;background:var(--panel);
}
.inline-edit:focus{outline:none}
.rail-new{padding:3px 12px 0}
.rail-new input{
  width:100%;border:1px solid var(--accent);border-radius:3px;
  padding:4px 7px;font-size:13px;background:var(--paper);
}
.rail-new input:focus{outline:none}

/* ---------- confirm ---------- */
#confirm{
  position:fixed;inset:0;z-index:80;display:none;
  background:rgba(20,19,17,.36);padding:22vh 16px 16px;
}
#confirm.on{display:block}
.cbox{
  max-width:400px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 18px 44px rgba(20,19,17,.26);padding:18px 20px 16px;
}
.cbox h3{
  margin:0 0 6px;font-size:16px;font-weight:600;letter-spacing:-.01em;
}
.cbox p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.crow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn.solid-danger:hover{opacity:.88;color:var(--panel);border-color:var(--danger)}

/* ---------- assignee menu ---------- */
#amenu{
  position:absolute;z-index:70;display:none;min-width:212px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 10px 26px rgba(20,19,17,.18);
  padding:6px;
}
#amenu.on{display:block}
#amenu input{
  width:100%;border:1px solid var(--line);border-radius:3px;
  padding:5px 8px;font-size:13px;background:var(--paper);margin-bottom:5px;
}
#amenu .opt{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:5px 7px;border-radius:3px;font-size:13px;text-align:left;
}
#amenu .opt:hover{background:var(--accent-soft)}
#amenu .opt img{width:20px;height:20px;border-radius:50%}
#amenu .none{color:var(--muted)}

/* ---------- notifications menu ---------- */
#bell{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
#bell:hover{color:var(--ink);background:var(--line-soft)}
#bell.on{color:var(--accent)}
#bell svg{width:16px;height:16px;display:block}
#nmenu,#umenu{
  position:absolute;z-index:70;display:none;width:min(88vw,290px);
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 10px 26px rgba(20,19,17,.18);
  padding:11px 12px 12px;
}
#nmenu.on,#umenu.on{display:block}
#nmenu h4,#umenu h4{
  margin:0 0 6px;font-size:12.5px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;text-transform:uppercase;
}
#nmenu p{margin:0 0 10px;font-size:13px;line-height:1.5;color:var(--muted)}
#nmenu .nrow{display:flex;gap:7px;flex-wrap:wrap}
/* ---------- account menu ---------- */
#whoami{border-radius:999px;padding:3px 4px 3px 10px}
#whoami:hover{background:var(--line-soft)}
#umenu .who{display:flex;align-items:center;gap:10px;padding:2px 0 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
#umenu .who img{width:34px;height:34px;border-radius:50%}
#umenu .who b{display:block;font-weight:600;font-size:14px}
#umenu .who span{font-size:12.5px;color:var(--muted)}
#umenu .sect{margin:0 0 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);padding:2px;gap:2px;background:var(--paper)}
.seg button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 6px;border-radius:calc(var(--radius) - 2px);font-size:12.5px;color:var(--muted);
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{
  width:28px;height:28px;border-radius:50%;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.swatch.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swatch .ico{position:absolute;inset:0;margin:auto;width:14px;height:14px;stroke-width:2.8}
#umenu .signout{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 6px;margin-top:2px;
  border-top:1px solid var(--line);border-radius:0;color:var(--ink);font-size:13.5px;
}
#umenu .signout:hover{color:var(--danger)}

/* ---------- toast / banner ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:13px;
  padding:8px 14px;border-radius:var(--radius);z-index:90;
  opacity:0;pointer-events:none;transition:opacity .16s;max-width:88vw;
}
#toast.on{opacity:1}
#banner{
  display:none;padding:9px 22px;font-size:13px;
  background:var(--accent-soft);color:var(--accent-ink);
  border-bottom:1px solid var(--line);
}
#banner.tap{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
#banner.on{display:block}

/* ---------- capture ---------- */
#capture{
  display:none;margin:14px 22px 0;flex:0 0 auto;
  border:1px solid var(--note-edge);background:var(--note);
  border-radius:3px 12px 3px 3px;padding:10px 12px 9px;
}
#capture.on{display:block}
#capture.drag{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#capInput{
  width:100%;border:0;background:transparent;resize:none;overflow:hidden;
  font-family:var(--serif);font-size:16px;line-height:1.5;
  min-height:26px;max-height:240px;padding:0;
}
#capInput:focus{outline:none}
#capFoot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
#capHint{font-size:11.5px;color:var(--muted)}
#capProj,#capSpace{
  border:1px solid var(--note-edge);background:transparent;
  border-radius:3px;padding:3px 6px;font-size:12px;font-family:var(--ui);
  max-width:46%;
}
#capProj:focus,#capSpace:focus{border-color:var(--accent);outline:none}
#capFoot .btn{margin-left:auto;padding:3px 10px;font-size:12.5px}
#capThumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#capThumbs:empty{margin:0}
.thumb{
  position:relative;width:60px;height:60px;border-radius:3px;
  border:1px solid var(--note-edge);overflow:hidden;background:var(--paper);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{
  position:absolute;top:1px;right:1px;width:17px;height:17px;
  border-radius:50%;background:rgba(20,19,17,.72);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.thumb button .ico{width:11px;height:11px;stroke-width:2.4}

/* ---------- tags ---------- */
#tagbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tagchip{
  font-size:12px;padding:2px 8px;border-radius:11px;
  border:1px solid var(--line);color:var(--muted);background:transparent;
}
.tagchip:hover{border-color:var(--accent);color:var(--accent-ink)}
.tagchip.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.tagref{color:var(--accent-ink);font-weight:500;cursor:pointer}
.tagref:hover{text-decoration:underline}

/* ---------- feed ---------- */
.feed{max-width:620px}
.daymark{
  font-size:11.5px;color:var(--muted);margin:20px 0 9px;
  display:flex;align-items:center;gap:9px;
}
.daymark::after{content:"";flex:1;height:1px;background:var(--line)}
.daymark:first-child{margin-top:0}
.fitem{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--note);border:1px solid var(--note-edge);
  border-radius:3px 12px 3px 3px;padding:11px 13px 9px;margin-bottom:8px;
  box-shadow:var(--shadow);
}
.fitem:hover{border-color:var(--accent)}
.fitem .ft{
  font-family:var(--serif);font-size:16px;font-weight:500;line-height:1.25;
  margin-bottom:3px;word-break:break-word;
}
.fitem .fb{
  font-family:var(--serif);font-size:15px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;
}
.fitem .ff{
  display:flex;align-items:center;gap:8px;margin-top:8px;
  font-size:11.5px;color:var(--muted);
}
.fitem .ff img.av{width:17px;height:17px;border-radius:50%;margin-left:auto}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.imgs img{
  width:74px;height:74px;object-fit:cover;border-radius:3px;
  border:1px solid var(--note-edge);display:block;
}
.fitem a,.note a,.nb a{color:var(--accent-ink)}

/* ---------- editor images ---------- */
#edImgs{display:flex;gap:8px;flex-wrap:wrap}
#edImgs:empty{display:none}
#edImgs .thumb{width:88px;height:88px}

/* ---------- spaces in rail ---------- */
.rail-sub{padding-left:14px}
.rail-sub .rail-item{padding-left:22px;font-size:13px}
.rail-sub .rail-item .lbl{color:var(--muted)}
.rail-sub .rail-item.on .lbl{color:var(--ink)}
.rail-addspace{
  display:block;width:100%;text-align:left;padding:3px 14px 3px 36px;
  font-size:12.5px;color:var(--muted);
}
.rail-addspace:hover{color:var(--accent-ink)}
.rail-sub input{
  width:calc(100% - 44px);margin:2px 0 2px 36px;
  border:1px solid var(--accent);border-radius:3px;
  padding:3px 6px;font-size:12.5px;background:var(--paper);
}
.rail-sub input:focus{outline:none}
.spacex{
  margin-left:4px;color:var(--muted);font-size:13px;opacity:0;
  padding:0 3px;border-radius:3px;
}
.rail-item:hover .spacex{opacity:1}
.spacex:hover{color:var(--danger)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.calbar .mon{font-size:16px;font-weight:600;letter-spacing:-.01em;min-width:150px}
.calbar .nav{
  border:1px solid var(--line);border-radius:var(--radius);
  width:30px;height:30px;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
}
.calbar .nav:hover{border-color:var(--accent);color:var(--accent-ink)}
.calgrid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--line);gap:1px;
}
.caldow{
  background:var(--panel);padding:6px 8px;font-size:11.5px;color:var(--muted);
}
.calday{
  background:var(--panel);min-height:108px;padding:5px 6px 7px;
  display:flex;flex-direction:column;gap:3px;
}
.calday.off{background:var(--paper)}
.calday.off .dn{opacity:.4}
.calday .dn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.calday.today .dn{
  color:var(--panel);background:var(--accent);border-radius:9px;
  padding:0 6px;align-self:flex-start;font-weight:500;
}
.occ{
  display:flex;align-items:center;gap:5px;width:100%;text-align:left;
  font-size:11.5px;line-height:1.3;padding:3px 5px;border-radius:3px;
  background:var(--accent-soft);color:var(--accent-ink);
}
.occ:hover{filter:brightness(.97)}
.occ .tm{font-variant-numeric:tabular-nums;opacity:.75;flex:0 0 auto}
.occ .ot{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.occ.done{background:var(--line-soft);color:var(--muted);text-decoration:line-through}
.occ.task{background:transparent;border:1px solid var(--line);color:var(--ink)}
.occ.task.late{border-color:var(--danger);color:var(--danger)}
.schedlist{margin-top:22px;max-width:620px}
.schedrow{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);margin-bottom:7px;
}
.schedrow .sn{font-size:13.5px;flex:1;min-width:0;word-break:break-word}
.schedrow .sw{font-size:12px;color:var(--muted);flex:0 0 auto}

/* ---------- schedule dialog ---------- */
#schedDlg{
  position:fixed;inset:0;z-index:75;display:none;
  background:rgba(20,19,17,.36);padding:9vh 16px 16px;overflow-y:auto;
}
#schedDlg.on{display:block}
.sbox{
  max-width:470px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 18px 44px rgba(20,19,17,.26);padding:20px 22px 18px;
}
.sbox h3{margin:0 0 14px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=time],.field input[type=date],.field select,
.field textarea{
  width:100%;border:1px solid var(--line);border-radius:3px;
  padding:6px 9px;font-size:13.5px;background:var(--paper);
}
.field textarea{resize:vertical;min-height:72px;line-height:1.45}
.hasnotes{color:var(--muted);display:inline-flex;align-items:center;cursor:default}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.days{display:flex;gap:4px;flex-wrap:wrap}
.daybtn{
  width:35px;height:31px;border:1px solid var(--line);border-radius:3px;
  font-size:12px;color:var(--muted);
}
.daybtn.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.two{display:flex;gap:10px}
.two .field{flex:1}

/* ---------- doc mode ---------- */
#editor.doc{max-width:860px;background:var(--panel);border-color:var(--line);border-radius:var(--radius)}
#editor.doc #edTitle,#editor.doc #edBody{font-family:var(--serif)}
#editor.doc #edBody{min-height:440px;font-size:15.5px}
#editor.doc #edRule{background:var(--line)}
#editor.doc #edFoot{border-top-color:var(--line)}
#editor.doc #edProj{border-color:var(--line)}
.modeswitch{display:flex;gap:2px;margin-right:auto}
.modeswitch button{
  font-size:12px;padding:3px 9px;border-radius:3px;color:var(--muted);
  border:1px solid transparent;
}
.modeswitch button.on{border-color:var(--line);color:var(--ink);background:var(--paper)}
#edRead{display:none;flex-direction:column;gap:10px;min-height:300px}
#edRead.on{display:flex}
.blk{position:relative;padding-right:60px}
.blk p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
.blk h2{margin:10px 0 0;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.blk h3{margin:8px 0 0;font-family:var(--serif);font-size:16.5px;font-weight:600}
.blk ul{margin:0;padding-left:20px;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.blk pre{
  margin:0;background:var(--paper);border:1px solid var(--line);
  border-radius:4px;padding:10px 12px;overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;
}
.blkcopy{
  position:absolute;top:2px;right:0;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:2px 7px;
  background:var(--panel);opacity:0;
}
.blk:hover .blkcopy,.blkcopy:focus{opacity:1}
.blkcopy:hover{border-color:var(--accent);color:var(--accent-ink)}
.blkcopy.ok{color:var(--accent-ink);border-color:var(--accent);opacity:1}

/* ---------- whiteboard ---------- */
/* NOT ".board" — that's the kanban container at the top of this file, and sharing
   the name meant this editor silently inherited its align-items:flex-start, which
   let #inkWrap shrink-wrap the canvas. The canvas is sized FROM the wrap's width,
   so it collapsed to the 320px floor and stayed there on every screen. */
#editor.whiteboard{
  max-width:min(1180px,96vw);background:var(--panel);
  border-color:var(--line);border-radius:var(--radius);
  padding:14px 14px 12px;gap:8px;
}
#inkbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#inkbar .tool{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:4px 10px;font-size:12.5px;color:var(--muted);
}
#inkbar .tool.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
#inkbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.swatch{
  width:21px;height:21px;border-radius:50%;border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);
}
.swatch.on{border-color:var(--accent)}
#inkWrap{
  border:1px solid var(--line);border-radius:4px;background:#fff;
  overflow:auto;max-height:64vh;touch-action:pan-y;
  /* explicit, because the canvas inside is measured from this element: anything
     that lets it shrink-wrap collapses the page to its minimum and keeps it there */
  align-self:stretch;
}
/* On anything bigger than a phone — an iPad especially — a page of handwriting
   should have the screen. Fill the overlay's height and give the ink whatever the
   toolbar, title and footer don't use. Phones already get a full-height sheet from
   the block further down. */
@media (min-width:721px){
  #editor.whiteboard{height:calc(100dvh - 48px)}
  #editor.whiteboard #inkWrap{flex:1 1 auto;max-height:none;min-height:0}
}
#inkCanvas{display:block;touch-action:none;cursor:crosshair}
#inkFoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#inkFoot .btn{padding:4px 10px;font-size:12.5px}
#inkText{
  font-family:var(--serif);font-size:15px;line-height:1.6;white-space:pre-wrap;
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  padding:10px 12px;max-height:180px;overflow-y:auto;display:none;
}
#inkText.on{display:block}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

/* ---------- sign in (rendered by store.js when there's no session) ---------- */
#slateLogin{
  position:fixed;inset:0;z-index:200;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  padding:24px max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
}
#slateLogin form{
  width:100%;max-width:330px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px 22px 22px;
}
#slateLogin .lbrand{
  display:flex;align-items:center;gap:9px;
  font-size:19px;font-weight:600;letter-spacing:-.01em;
}
#slateLogin .lbrand .mark{
  width:15px;height:15px;border-radius:2px;background:var(--accent);
  transform:rotate(-8deg);flex:0 0 auto;
}
#slateLogin .lsub{margin:6px 0 20px;font-size:13px;color:var(--muted)}
#slateLogin label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
#slateLogin input{
  width:100%;border:1px solid var(--line);border-radius:3px;background:var(--paper);
  padding:10px 11px;font-size:16px;margin-bottom:14px;min-height:44px;
}
#slateLogin input:focus{border-color:var(--accent);outline:none}
#slateLogin button{
  width:100%;background:var(--accent);border:1px solid var(--accent);
  border-radius:var(--radius);color:var(--panel);
  padding:11px;font-size:15px;font-weight:500;min-height:46px;
}
#slateLogin button:disabled{opacity:.6}
#slateLogin .lerr{
  margin:12px 0 0;font-size:13px;color:var(--danger);line-height:1.45;min-height:1px;
}
#slateLogin .lerr:empty{margin:0}

/* same for the floating dialogs — must sit after their own padding shorthands */
#overlay,#taskDlg,#schedDlg,#prospectDlg,#projDlg,#confirm{
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}

/* ---------- search results ---------- */
.sbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line);
}
.sbar .sq{font-size:13.5px;color:var(--muted)}
.sbar .btn{margin-left:auto}
.ssec{margin-bottom:22px;max-width:760px}
.ssec h4{
  margin:0 0 8px;font-size:12px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
}
.ssec h4 .n{
  font-size:11.5px;font-variant-numeric:tabular-nums;text-transform:none;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;
}
.srow{
  display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 11px;margin-bottom:6px;
}
.srow:hover{border-color:var(--accent)}
.srow.is-done .st{color:var(--muted);text-decoration:line-through}
.srow .st{font-size:14px;line-height:1.35;word-break:break-word}
.smeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.swhere{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sago{font-variant-numeric:tabular-nums}

/* ---------- grouped boards ---------- */
.bgroup{margin-bottom:26px}
.bgroup h4{
  margin:0 0 9px;font-size:12px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.bgroup h4 .bg-proj{color:var(--ink);font-weight:600}
.bgroup h4 .bg-sep{color:var(--line);font-size:13px}
.bgroup h4 .n{
  font-size:11.5px;font-variant-numeric:tabular-nums;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;
}
.col-head .colx{
  margin-left:4px;color:var(--muted);
  padding:3px;border-radius:3px;opacity:0;display:inline-flex;align-items:center;
}
.col:hover .col-head .colx{opacity:.7}
.col-head .colx:hover{opacity:1;color:var(--danger);background:var(--line-soft)}
.coladd{
  flex:0 0 auto;align-self:flex-start;
  border:1px dashed var(--line);border-radius:var(--radius);
  padding:9px 14px;font-size:12.5px;color:var(--muted);white-space:nowrap;
}
.coladd:hover{border-style:solid;border-color:var(--accent);color:var(--accent-ink)}
.col-head .nm .inline-edit{font-size:13px;padding:1px 4px}

/* ---------- prospects ---------- */
.padd{margin-bottom:18px;max-width:520px}
.padd input{
  width:100%;border:1px dashed var(--line);background:transparent;
  border-radius:var(--radius);padding:9px 11px;font-size:14px;
}
.padd input:focus{border-style:solid;border-color:var(--accent);outline:none}
.psec{margin-bottom:20px;max-width:760px}
.psec h4{
  margin:0 0 8px;font-size:12px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
}
.psec h4 .n{
  font-size:11.5px;font-variant-numeric:tabular-nums;text-transform:none;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;
}
.prow{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 11px;margin-bottom:6px;
}
.prow.is-cold{opacity:.6}
.pmain{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.pco{font-size:14px;font-weight:500;word-break:break-word}
.pmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.pem{font-variant-numeric:tabular-nums}
.pnext{font-variant-numeric:tabular-nums}
.pnext.late{color:var(--danger)}
.pnote{
  font-size:12.5px;color:var(--muted);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pstage{
  flex:0 0 auto;border:1px solid var(--line);border-radius:3px;
  background:var(--paper);padding:4px 6px;font-size:12px;font-family:var(--ui);
}
.pstage:focus{border-color:var(--accent);outline:none}

/* ---------- dashboard ---------- */
/* .dcard and the row styles are the Today page's; the dashboard's lists reuse the rows */
.dcard{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 14px 12px;
}
.dcard h3{
  margin:0 0 9px;font-size:12.5px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
}
.dcard h3 .n{
  font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;text-transform:none;
}
.dlist{display:flex;flex-direction:column;gap:2px}
.dempty{font-size:13px;color:var(--muted);line-height:1.5;padding:2px 0 3px}

.drow{display:flex;align-items:flex-start;gap:9px;border-radius:3px}
.drow:hover{background:var(--line-soft)}
.dtick{
  position:relative;
  flex:0 0 auto;width:19px;height:19px;margin-top:7px;border-radius:50%;
  border:1.5px solid var(--line);color:transparent;
  display:flex;align-items:center;justify-content:center;
}
.dtick .ico{width:12px;height:12px;stroke-width:2.6}
.dtick:hover{border-color:var(--accent)}
.dtick.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.dmain{
  flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px;
  padding:6px 4px 6px 0;
}
.dt{font-size:13.5px;line-height:1.35;word-break:break-word}
.drow.is-done .dt{color:var(--muted);text-decoration:line-through}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.dtime{font-variant-numeric:tabular-nums}
.ddue{font-variant-numeric:tabular-nums}
.ddue.late{color:var(--danger)}

/* ========== dashboard, All projects, rail counts, board history (redesign) ========== */
/* Every base rule for these lives in this block, above the tablet and phone
   blocks (CSS trap 1); their overrides live in delimited parts of those blocks. */

/* Two independent stacks, not grid areas: the lists vary in height, and a shared
   grid either stretches a whole row to its tallest list or leaves holes. Source
   order is the phone order and the screen-reader order. */
.dboard{max-width:1400px;display:flex;flex-direction:column;gap:14px}
.dtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dstacks{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:14px;align-items:start}
.dstack{display:flex;flex-direction:column;gap:14px;min-width:0}
.dband2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.sr-only{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;
}

/* the two controls that scope everything below them: one row, above, never in a card */
.dfilters{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 2px}
.seg.dseg{display:inline-flex;flex:0 0 auto}
.dseg button{flex:0 0 auto;min-height:32px;padding:5px 12px;font-size:13px;white-space:nowrap}
/* these scope the whole page, so the choice has to read at a glance in both themes */
.dseg button.on{font-weight:500;box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.dseg img{width:18px;height:18px;border-radius:50%;display:block;background:var(--line-soft)}

/* stat tiles: proportional figures at this size — tabular digits look loose */
.dtile{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px 13px;
}
.dtile:hover{border-color:var(--accent)}
.dtile .tl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.dtile .tl .ico{color:var(--muted)}
.dtile .tl .ico.crit{color:var(--danger)}
.dtile .tv{font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-.02em;color:var(--ink)}
.dtile .ts{font-size:12px;color:var(--muted);line-height:1.35}
.dtile .ts .up{color:var(--good)}
.dtile .ts .down{color:var(--danger)}

/* cards */
.wcard{
  margin:0;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px 12px;scroll-margin-top:66px;
}
.wcard:focus{outline:none}
.whead{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.whead .wt{flex:1;min-width:0}
.whead h3{
  margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.005em;
  display:flex;align-items:center;gap:8px;
}
.whead h3 .n{
  font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;
}
.wsub{font-size:12px;color:var(--muted);margin-top:1px}
.wact{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:1px;
  font-size:12.5px;color:var(--accent-ink);padding:4px 4px 4px 8px;margin:-4px -6px 0 0;border-radius:4px;
}
.wact:hover{background:var(--accent-soft)}
.wmore{display:block;text-align:left;font-size:12.5px;color:var(--accent-ink);padding:6px 4px 3px 28px}
.wmore:hover{text-decoration:underline}
.wnote{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}
.dgroup.crit{display:flex;align-items:center;gap:5px;color:var(--danger)}
.dgroup.crit .ico{width:13px;height:13px}
button.dgroup{display:block;width:100%;text-align:left}
button.dgroup:hover{color:var(--accent-ink)}
.dspace{flex:0 0 auto;width:19px}
.drow .dwho{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;margin:7px 2px 0 0;
  background:var(--line-soft);
}
.dassign{
  flex:0 0 auto;width:22px;height:22px;margin:6px 2px 0 0;border-radius:50%;position:relative;
  border:1.5px dashed var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.dassign .ico{width:12px;height:12px;stroke-width:2.4}
.dassign:hover{border-color:var(--accent);color:var(--accent-ink)}
.dpick{
  display:inline-flex;align-items:center;gap:2px;margin:0 0 8px;
  border:1px solid var(--line);border-radius:999px;padding:1px 2px 1px 10px;
  font-size:12px;color:var(--ink-2);background:var(--panel-2);
}
.dpick button{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.dpick button:hover{color:var(--ink);background:var(--line-soft)}
.dpick .ico{width:13px;height:13px}

/* the completions chart. No colour is ever written into the SVG — var() inside a
   presentation attribute is unreliable on iOS — so every mark gets a class, and a
   theme flip repaints it without a redraw. */
.vx-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:-2px 0 10px}
.vx-total{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.vx-stat{font-size:12.5px;color:var(--muted)}
.vx-host{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
svg.vx{display:block;overflow:visible}
.vx-bar{fill:var(--viz-1)}
.vx-bar.dim{opacity:.35}
.vx-grid{stroke:var(--viz-grid);stroke-width:1;shape-rendering:crispEdges}
.vx-base{stroke:var(--viz-axis);stroke-width:1;shape-rendering:crispEdges}
.vx-tick{fill:var(--muted);font-family:var(--ui);font-size:11px;font-variant-numeric:tabular-nums}
.vx-tick.now{fill:var(--ink-2);font-weight:600}
.vx-lbl{fill:var(--ink);font-family:var(--ui);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.vx-untracked{fill:var(--viz-untracked)}
.vx-utxt{fill:var(--muted);font-family:var(--ui);font-size:11.5px}
.vx-msg{
  position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:0 10px;font-size:12.5px;line-height:1.4;color:var(--muted);pointer-events:none;
}
.vx-hits{position:absolute;display:flex}
.vx-hit{flex:1 1 0;min-width:0;height:100%;border-radius:3px}
.vx-hit:hover{background:var(--viz-1-soft)}
.vx-hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--viz-1-soft)}
.vx-hit.off,.vx-hit.off:hover{background:transparent;cursor:default}
.vx-tip{
  position:absolute;z-index:5;pointer-events:none;width:max-content;max-width:230px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:8px 10px 9px;font-size:12px;line-height:1.4;color:var(--ink-2);
}
.vx-tip[hidden]{display:none}
.vx-tip .tv{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink)}
.vx-tip .tv::before{content:"";width:12px;height:2px;border-radius:1px;background:var(--viz-1);flex:0 0 auto}
.vx-tip .td{color:var(--muted)}
.vx-tip .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.vx-tip .tsplit{margin-top:3px}
.vx-readout{
  display:flex;align-items:center;gap:2px;margin-top:8px;padding:1px;
  border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2);
}
.vx-readout .rt{flex:1;min-width:0;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.vx-readout button{
  flex:0 0 auto;width:38px;height:38px;border-radius:4px;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
}
.vx-readout button:hover{background:var(--line-soft)}
.vx-readout button:disabled{opacity:.35;cursor:default;background:transparent}
.seg.wtog{display:inline-flex;flex:0 0 auto;margin:-3px 0 0}
.wtog button{flex:0 0 auto;padding:3px 9px;font-size:12px}
.vx-table{width:100%;border-collapse:collapse;font-size:13px}
.vx-table th{
  text-align:left;font-weight:500;font-size:12px;color:var(--muted);
  padding:0 8px 6px;border-bottom:1px solid var(--line);
}
.vx-table td{padding:6px 8px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.vx-table .num{text-align:right}
.vx-table .muted{color:var(--muted)}

/* part-to-whole bars: one ordinal ramp, so one encoding means status everywhere on
   the page. A 2px surface gap between segments, the data end rounded, the start square. */
.stk{display:flex;gap:2px;height:10px;min-width:0}
.stk span{flex:1 1 0;min-width:3px}
.stk span:last-child{border-radius:0 4px 4px 0}
.stk .s-done{background:var(--viz-done)}
.stk .s-doing{background:var(--viz-doing)}
.stk .s-todo{background:var(--viz-todo)}
/* not ".empty": that's the empty-state block, and it would pad this to 68px */
.stk.stk-none{background:var(--line-soft);border-radius:0 4px 4px 0}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px}
.lgd .s-done{background:var(--viz-done)}
.lgd .s-doing{background:var(--viz-doing)}
.lgd .s-todo{background:var(--viz-todo)}

/* projects: a table because it's many rows with several measures each */
.ptable{display:flex;flex-direction:column}
.pth,.ptr{
  display:grid;align-items:center;gap:0 14px;
  grid-template-columns:minmax(0,2.3fr) minmax(0,2fr) 48px 48px 64px 76px;
}
.pth{font-size:11.5px;color:var(--muted);padding:0 8px 6px;border-bottom:1px solid var(--line)}
.pth .pa{text-align:right}
.pth .num,.ptr .num{text-align:right;font-variant-numeric:tabular-nums}
.ptr{width:100%;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.ptr:hover{background:var(--panel-2)}
.ptr .pn{display:flex;align-items:center;gap:8px;min-width:0}
.ptr .pdot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;transform:rotate(-8deg);background:var(--muted)}
.ptr .pnw{display:flex;flex-direction:column;min-width:0}
.ptr .pnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ptr .pquiet{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.ptr .pp{display:flex;align-items:center;gap:10px;min-width:0}
.ptr .pp .stk{flex:1 1 auto}
.ptr .ppct{flex:0 0 auto;min-width:34px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptr .late{color:var(--danger);font-weight:500;display:inline-flex;align-items:center;justify-content:flex-end;gap:3px}
.ptr .late .ico{width:12px;height:12px}
.ptr .zero{color:var(--muted)}
.ptr .pa{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.ptr .pai,.ptr .pm{display:none}
.ptr .pm .late{display:inline-flex;font-weight:400}
.pfold{
  width:100%;text-align:left;padding:9px 8px;font-size:12.5px;color:var(--accent-ink);
  border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:4px;
}
.pfold:hover{background:var(--panel-2)}
.pfold .ico{width:14px;height:14px}

/* workload */
.wlrow{
  display:grid;grid-template-columns:120px minmax(0,1fr);gap:3px 12px;align-items:center;
  width:100%;text-align:left;padding:8px 6px;border-radius:4px;
}
.wlrow:hover{background:var(--panel-2)}
.wlrow[aria-expanded="true"]{background:var(--panel-2)}
.wlwho{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.wlwho img,.wlwho .wlnone{width:22px;height:22px;border-radius:50%;flex:0 0 auto;background:var(--line-soft)}
.wlwho .wlnone{background:transparent;border:1.5px dashed var(--muted)}
.wlwho .wln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wltrack{display:flex;align-items:center;gap:8px;min-width:0}
.wltrack .stk{flex:0 0 auto}
.wlval{font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wlval.zero{color:var(--muted)}
.wlmeta{grid-column:2;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wlmeta .late{color:var(--danger);display:inline-flex;align-items:center;gap:3px}
.wlmeta .ico{width:12px;height:12px}
.wlx{padding:2px 4px 8px 36px}
.wlx .wmore{padding-left:0}

/* pipeline: three numbers read faster than three bars */
.pcounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcount{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0;
  padding:8px 10px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--panel-2);
}
.pcount:hover{border-color:var(--accent)}
.pcount b{font-size:20px;font-weight:600;line-height:1.2}
.pcount span{font-size:12px;line-height:1.3;color:var(--muted);max-width:100%}
.plost{font-size:12px;color:var(--muted);margin-top:7px}
.psub{font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin:14px 0 3px}
.pchase{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:7px 4px;border-radius:3px}
.pchase:hover{background:var(--line-soft)}
.pchase .pc1{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchase .pc2{font-size:12px;color:var(--muted);white-space:nowrap}
.pchase .pcd{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pchase .pcd.late{color:var(--danger)}
.pnudge{display:block;text-align:left;margin-top:8px;font-size:12.5px;color:var(--accent-ink)}
.pnudge:hover{text-decoration:underline}

/* All projects: a drill-through arrives as one removable chip, so a filter is
   never left on the shared board without saying so */
.drill{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.dchip{
  display:inline-flex;align-items:center;gap:2px;font-size:12.5px;
  color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:999px;padding:1px 2px 1px 11px;
}
.dchip button{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.dchip button:hover{background:var(--panel)}
.dchip .ico{width:13px;height:13px}

/* rail: the virtual views carry an icon where projects carry their colour dot,
   and the dot sits in the same 15px so every label lines up */
.rail-item .rico{width:15px;height:15px;color:var(--muted)}
.rail-item.on .rico{color:var(--accent-ink)}
.rail-item .dot{margin:0 4px}
.rail-item .ct.crit{color:var(--danger);font-weight:600}

/* boards and the list: finished work folds away after a fortnight */
.doneolder{
  width:100%;padding:6px 8px;font-size:12.5px;color:var(--muted);
  border:1px dashed var(--line);border-radius:var(--radius);
}
.doneolder:hover{color:var(--accent-ink);border-color:var(--accent)}
.listmore{margin-top:10px}
/* A phone board snaps a column at a time, and a mandatory snap undoes every 16px
   autoPan nudge — the dragged card could never reach the next column. Snapping
   comes back on release, and settles on whichever column is nearest. */
body.dragging-now .board{scroll-snap-type:none}

/* touch: the tick stays small to look at and gets a finger-sized target */
@media (hover:none){
  .dtick{width:22px;height:22px;margin-top:6px}
  .dtick::after,.dassign::after{content:"";position:absolute;inset:-9px}
  .dspace{width:22px}
}
@media (forced-colors:active){
  .vx-bar,.vx-bar.dim{fill:CanvasText}
  .vx-untracked{fill:GrayText}
  .stk span{background:CanvasText}
}

/* ---------- today: the page behind the notification briefs ---------- */
/* a vertical stack on every width — this page is for scrolling, not snapping */
.todaywrap{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;max-width:760px}
.dgroup{
  font-size:11.5px;color:var(--muted);letter-spacing:.02em;
  margin:9px 0 2px;padding-top:8px;border-top:1px solid var(--line-soft);
}
.dgroup:first-child{margin-top:2px;padding-top:0;border-top:0}

/* agenda is phone-only */
.agenda{display:none}
.agday{margin-bottom:16px}
.agday h4{
  margin:0 0 7px;font-size:12px;font-weight:500;color:var(--muted);
  display:flex;align-items:center;gap:9px;
}
.agday h4::after{content:"";flex:1;height:1px;background:var(--line)}
.agday.is-today h4{color:var(--accent-ink)}
.agrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);margin-bottom:7px;min-height:48px;
}
.agrow .tm{
  font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  flex:0 0 58px;
}
.agrow .ot{flex:1;font-size:14.5px;word-break:break-word}
.agrow.done{opacity:.55}
.agrow.done .ot{text-decoration:line-through}
.agrow .tick{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:transparent;
}
.agrow .tick .ico{width:13px;height:13px;stroke-width:2.6}
.agrow.done .tick{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.agempty{font-size:13px;color:var(--muted);padding:6px 0 2px}

/* ---------- bottom nav (phones) ---------- */
#bottomnav{
  display:none;
  position:sticky;bottom:0;z-index:35;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#bottomnav .bn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px 6px;min-height:52px;color:var(--muted);
}
#bottomnav .bn .ic{display:flex}
#bottomnav .bn .ic .ico{width:22px;height:22px}
#bottomnav .bn .bl{font-size:10.5px;letter-spacing:.01em}
#bottomnav .bn.on{color:var(--accent-ink)}
#bottomnav .bn.on .ic{transform:translateY(-1px)}

/* ---------- tablet ----------
   iPads sit here, including portrait (744–834px): they keep the persistent rail
   and the month grid rather than inheriting the phone layout. */
@media (max-width:1080px) and (min-width:721px){
  #body{grid-template-columns:200px minmax(0,1fr)}
  .board{scroll-snap-type:x proximity}
  .col{scroll-snap-align:start}
  #mainhead{padding:18px 18px 0}
  #mainbody{padding:16px 18px 40px}
  .calday{min-height:88px}
  .occ{font-size:11px;padding:3px 4px;gap:4px}

  /* ---- dashboard (redesign): one stack, Today first ---- */
  .dstacks{grid-template-columns:minmax(0,1fr)}
  /* ---- end dashboard ---- */
}

/* narrow tablets: the month grid has ~70px per column, so the time label goes
   and the title takes the room */
@media (max-width:900px) and (min-width:721px){
  .occ .tm{display:none}
  .calday{min-height:76px;padding:4px 4px 6px}
  .caldow{padding:5px 5px;font-size:11px}

  /* ---- dashboard (redesign): ~500-600px of content ---- */
  .dtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dband2{grid-template-columns:minmax(0,1fr)}
  /* Active moves under the project name rather than squeezing the bar */
  .pth,.ptr{grid-template-columns:minmax(0,2fr) minmax(0,2fr) 44px 44px 60px}
  .pth .pa,.ptr .pa{display:none}
  .ptr .pai{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
  /* ---- end dashboard ---- */
}

/* ---------- phone ---------- */
@media (max-width:720px){
  #body{grid-template-columns:1fr}
  #rail{
    position:fixed;top:0;left:0;bottom:0;width:min(84vw,300px);z-index:50;
    transform:translateX(-100%);transition:transform .2s ease;
    box-shadow:0 0 40px rgba(20,19,17,.28);
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    overscroll-behavior:contain;
  }
  #rail.open{transform:none}
  #railScrim{
    display:none;position:fixed;inset:0;z-index:45;
    background:rgba(20,19,17,.34);
  }
  #railScrim.on{display:block}

  #topbar{
    height:auto;min-height:52px;padding:0 12px;gap:10px;
    padding-top:env(safe-area-inset-top);
  }
  #railToggle{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;margin-left:-6px;color:var(--ink);
    border-radius:var(--radius);
  }
  .brand .sub{display:none}
  .brand .word{font-size:16px}
  #whoami .nm{display:none}
  #whoami img{width:28px;height:28px}
  #search{
    max-width:none;font-size:16px;padding:8px 11px;min-height:38px;
  }

  #mainhead{padding:14px 15px 0}
  #capture{margin:12px 15px 0;padding:11px 13px 10px}
  #capInput{font-size:16px;min-height:40px}
  #capFoot .btn{padding:8px 15px;font-size:14px;min-height:38px}
  #capProj,#capSpace{font-size:16px;padding:7px 8px;min-height:38px;flex:1 1 40%;max-width:none}
  #capHint{flex:1 1 100%;order:9}
  .thumb button{width:26px;height:26px;font-size:15px;line-height:26px;top:3px;right:3px}
  #mainbody{padding:14px 15px 28px}

  /* headline + actions stack */
  .projtitle{font-size:22px}
  .projtitle .pinfo{opacity:1}
  .head-actions{margin-left:0;width:100%;gap:7px;flex-wrap:wrap}
  .head-actions .btn{min-height:38px;padding:7px 13px;font-size:13.5px}
  .title-row{gap:8px}

  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:10px 13px;font-size:14px;flex:0 0 auto}
  .viewswitch{margin-left:12px;position:sticky;right:0;background:var(--paper);padding-left:6px}
  /* back to square icons on a phone: the row already scrolls sideways, and the
     bottom bar names these same views anyway */
  .vbtn{width:36px;height:36px;padding:0;justify-content:center;font-size:15px}
  .vbtn .vlabel{display:none}
  .pmeta-line{gap:6px 12px;font-size:13px}
  .docpage-head h2{font-size:20px}
  .docpage-head .btn{min-height:38px;padding:7px 14px}
  .docpage .blk{padding-right:0}
  .docpage .blkcopy{position:static;display:block;margin-top:7px;padding:7px 12px;font-size:13px}

  /* board: one column per screen, snapped */
  .board{
    gap:12px;scroll-snap-type:x mandatory;
    margin:0 -15px;padding:0 15px 10px;
  }
  .col{flex:0 0 86vw;max-width:none;max-height:none;scroll-snap-align:center}
  .col-body{max-height:none}
  .addtask{font-size:16px;padding:9px 11px}
  /* keep room for the grip — this rule comes after the (hover:none) block, so a
     bare `padding` here would silently drop its padding-left */
  .card{padding:11px 12px 11px 30px}
  .card .ttl{font-size:15px}

  /* list: tick + title only; tap a row for status, due and owner */
  .list th{display:none}
  .list .c-st,.list .c-due,.list .c-who{display:none}
  .list td{padding:12px 8px;font-size:15px}
  .list input[type=checkbox]{width:21px;height:21px}
  .rowx{font-size:21px;padding:6px 9px}

  /* ---- dashboard (redesign): one column in source order ---- */
  .dboard,.dstack{gap:10px}
  .dtiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .dtile{min-height:76px;padding:11px 12px 12px 12px}
  .dtile .tv{font-size:26px}
  .dstacks,.dband2{grid-template-columns:minmax(0,1fr);gap:10px}
  .dfilters{flex-direction:column;align-items:stretch;gap:8px}
  .seg.dseg{display:flex}
  .dseg button{flex:1 1 0;min-width:0;min-height:38px;padding:6px 6px;font-size:13.5px}
  .wcard{padding:13px 13px 11px 13px}
  .wact{min-height:38px;padding:4px 6px 4px 10px;margin:-10px -8px -6px 0}
  .wmore,.pnudge{min-height:38px;display:flex;align-items:center}
  .wtog button{min-height:38px;padding:4px 12px}
  button.dgroup{min-height:38px;display:flex;align-items:center}
  .dtick{width:22px;height:22px;margin-top:6px}
  .dtick::after,.dassign::after{content:"";position:absolute;inset:-9px}
  .dspace{width:22px}
  .dpick{min-height:38px;padding-left:12px}
  .dpick button{width:34px;height:34px}
  .dchip{min-height:38px;font-size:13.5px;padding-left:13px}
  .dchip button{width:34px;height:34px}
  /* projects: name and % / a full-width bar / the numbers as one line */
  .pth{display:none}
  .ptr{grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;padding:11px 4px;font-size:14.5px}
  .ptr .pn{grid-column:1;grid-row:1}
  .ptr .pp{display:contents}
  .ptr .ppct{grid-column:2;grid-row:1;font-size:12.5px}
  .ptr .pp .stk{grid-column:1 / -1;grid-row:2}
  .ptr .num,.ptr .pa,.ptr .pai{display:none}
  .ptr .pm{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;grid-column:1 / -1;grid-row:3;font-size:12.5px;color:var(--muted)}
  .pfold{min-height:44px}
  /* workload: the name above its bar */
  .wlrow{grid-template-columns:minmax(0,1fr);padding:10px 4px}
  .wlmeta{grid-column:1}
  .wlx{padding-left:4px}
  .pchase{padding:10px 4px}
  .pcount{min-height:58px}
  .doneolder{min-height:38px}
  /* ---- end dashboard ---- */

  .bgroup{margin-bottom:20px}
  .coladd{flex:0 0 auto;min-height:38px}
  .triage select{font-size:16px;padding:8px 9px;min-height:38px;flex:1 1 40%}
  .triage .btn{min-height:38px;padding:8px 14px;font-size:14px}
  .prow{flex-wrap:wrap;padding:11px 12px}
  .pmain{flex:1 1 100%}
  .pstage{font-size:16px;padding:7px 8px;min-height:38px;flex:1}
  .padd input{font-size:16px;min-height:42px}
  .pnote{white-space:normal}

  .notes{grid-template-columns:1fr;gap:10px}
  .feed{max-width:none}
  .fitem{padding:13px 14px 11px}
  .tagchip{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;font-size:13px}

  /* calendar becomes an agenda — a 7-col grid is unreadable here */
  .calgrid{display:none}
  .agenda{display:block}
  .calbar .mon{font-size:17px;flex:1;min-width:0}
  .calbar .nav{width:38px;height:38px;font-size:17px}
  .calbar .btn{min-height:38px}

  #bottomnav{display:flex}

  /* every overlay becomes a full-height sheet */
  #overlay,#schedDlg,#taskDlg,#prospectDlg,#projDlg{padding:0;background:var(--paper)}
  #editor,#editor.doc,#editor.whiteboard,.sbox{
    max-width:none;margin:0;min-height:100dvh;border:0;border-radius:0;
    box-shadow:none;
    padding:calc(14px + env(safe-area-inset-top)) 15px calc(15px + env(safe-area-inset-bottom));
  }
  #edTitle{font-size:21px}
  #edBody{font-size:16px;min-height:44vh}
  #editor.doc #edBody{min-height:44vh;font-size:16px}
  #edFoot{
    position:sticky;bottom:0;background:var(--note);
    /* auto top margin pins the footer to the bottom of the sheet when the note is
       short; sticky takes over once the body overflows */
    margin:auto -15px 0;padding:10px 15px calc(6px + env(safe-area-inset-bottom));
    gap:7px;
  }
  #editor.doc #edFoot,#editor.whiteboard #edFoot{background:var(--panel)}
  #edFoot .btn{min-height:38px;padding:7px 12px}
  /* 16px or iOS zooms the sheet when the select takes focus */
  #edProj,#edSpace{font-size:16px;padding:7px 9px;min-height:38px;flex:1;min-width:120px}
  #edFoot label{display:none}
  #edStatus{width:100%;order:9}
  .modeswitch{width:100%;order:-1}
  .modeswitch button{flex:1;padding:8px;font-size:13.5px}
  .blk{padding-right:0}
  .blk pre{white-space:pre-wrap;word-break:break-word}
  .blkcopy{position:static;display:block;margin-top:7px;padding:7px 12px;font-size:13px}

  /* whiteboard */
  #inkbar{gap:6px}
  #inkbar .tool{min-height:38px;padding:7px 12px;font-size:13.5px}
  .swatch{width:34px;height:34px}
  #inkWrap{max-height:none}
  #inkFoot .btn{min-height:38px}
  #inkHint{width:100%}

  /* forms — 16px or iOS zooms the page the moment one takes focus */
  .field input[type=text],.field input[type=time],.field input[type=date],.field select,
  .field textarea{
    font-size:16px;padding:9px 11px;min-height:42px;
  }
  .daybtn{width:44px;height:42px;font-size:13px}
  .crow{gap:8px}
  .crow .btn{flex:1;min-height:42px}

  /* task and schedule sheets: actions belong at the bottom of the screen, not
     floating under the last field */
  #tkNote{width:100%;min-height:38px;margin-bottom:10px}
  #prNote{font-size:16px}
  .sbox{display:flex;flex-direction:column;padding-bottom:0}
  .sbox .crow{
    margin:auto -15px 0;position:sticky;bottom:0;background:var(--panel);
    border-top:1px solid var(--line-soft);
    padding:10px 15px calc(10px + env(safe-area-inset-bottom));
  }
  #confirm{padding:0}
  #confirm.on{display:flex;align-items:flex-end}
  .cbox{
    max-width:none;width:100%;border-radius:12px 12px 0 0;
    padding:20px 18px calc(18px + env(safe-area-inset-bottom));
  }

  #toast{bottom:calc(76px + env(safe-area-inset-bottom));font-size:14px;padding:10px 16px}
  .inline-edit,.rail-new input,.rail-sub input{font-size:16px;padding:7px 9px}
  .rail-item{padding-top:9px;padding-bottom:9px;font-size:15px}
  .rail-sub .rail-item{font-size:14.5px}
  .rail-addspace{padding-top:9px;padding-bottom:9px;font-size:14px}
  .rail-head{font-size:13px;padding-bottom:8px}
  .rail-head button{font-size:20px;padding:8px 12px}
  #amenu{min-width:min(86vw,260px)}
  #amenu input{font-size:16px;padding:9px 10px}
  #amenu .opt{padding:9px 8px;font-size:15px}
}

/* narrow phones: paired fields stack rather than squeeze */
@media (max-width:430px){
  .two{flex-direction:column;gap:0}
  .head-actions .btn{flex:1 1 auto}
  /* Delete project is often the only header action, and stretching it makes the
     most destructive control the largest target on the screen */
  .head-actions .btn.danger{flex:0 0 auto}
  .calbar .btn.primary{width:100%;margin-left:0}
}

/* very narrow phones */
@media (max-width:380px){
  #bottomnav .bn .bl{font-size:9.5px}
  .col{flex:0 0 90vw}
  .brand .word{display:none}
}
