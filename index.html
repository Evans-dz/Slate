<script>
(function(){
"use strict";

/* ============ constants ============ */
/* Columns belong to a space. A project carries its own set too, used by tasks
   filed to the project but to no space. A set that has never been edited uses
   these. The LAST column always means done — the tick, the strikethrough and
   the dashboard all read it that way, so a set needs no extra flag. */
/* Every project gets its own hue, and an index is never handed out twice —
   not even after the project that held it is deleted. The golden angle keeps
   consecutive hues far apart, so the palette never visually repeats and never
   runs out. */
var GOLDEN_ANGLE = 137.508;
function projectHue(idx){ return ((idx || 0) * GOLDEN_ANGLE) % 360; }
function hueOf(projectId){
  var p = findProject(projectId);
  return p ? projectHue(p.colorIndex || 0) : null;
}
function projectColor(projectId, kind){
  var h = hueOf(projectId);
  if(h === null) return null;
  /* The hue is the project's; saturation and lightness belong to the theme and
     live in the token block. Returning var() references rather than resolved
     numbers means a theme switch repaints every project colour at once — the old
     version froze light-or-dark at render time, so dots stayed light after iOS
     switched to dark at sunset. */
  var hue = Math.round(h * 10) / 10;
  if(kind === "ink")  return "hsl(" + hue + " var(--ph-ink-s) var(--ph-ink-l))";
  if(kind === "soft") return "hsl(" + hue + " var(--ph-soft-s) var(--ph-soft-l))";
  return "hsl(" + hue + " var(--ph-s) var(--ph-l))";
}
/* A project's name as a chip in the project's own colour, so a cross-project
   list reads by project the way the rail dots and calendar already do — they
   were all one accent colour before. */
function projChip(projectId, text){
  var c = el("span","chip proj", text);
  var soft = projectColor(projectId, "soft"), ink = projectColor(projectId, "ink");
  if(soft){ c.style.background = soft; c.style.color = ink; }
  return c;
}
/* The high water mark lives in the database, not this browser, so a colour
   stays retired for both of you and survives the project that held it. */
function nextColorIndex(){
  var high = (S.meta.colors && S.meta.colors.high) || 0;
  S.projects.forEach(function(p){
    if((p.colorIndex || 0) >= high) high = (p.colorIndex || 0) + 1;
  });
  S.meta.colors = { high: high + 1 };
  queue("meta/colors", function(){ return S.db.doc("meta/colors").set({ high: high + 1 }); });
  return high;
}

/* one definition, shared with the brief logic in lib/brief.js */
var DEFAULT_COLUMNS = SlateBrief.DEFAULT_COLUMNS;

/* patchTask has stamped completedAt only since f6a0e3e (Sep 17, 2026). Nothing
   earlier knows when it finished, so completion history starts here: older days
   are drawn as "Not tracked", never as zeros that would claim nobody worked. No
   backfill from updatedAt either — it moves on any edit, so it would invent dates. */
var TRACK_START = "2026-09-17";
/* a project with open work and no edits for this long gets a Quiet flag */
var STALE_DAYS = 7;
/* finished cards stay on a board this long, then fold behind "Show N older" —
   otherwise every Done column keeps every card ever finished */
var DONE_KEEP_DAYS = 14;

/* outreach pipeline. Won is terminal: a won prospect becomes a project. */
var STAGES = [
  {id:"lead",      label:"Lead"},
  {id:"contacted", label:"Contacted"},
  {id:"talking",   label:"In conversation"},
  {id:"won",       label:"Won"},
  {id:"lost",      label:"Not now"}
];
var STAGE_LABEL = {};
STAGES.forEach(function(s){ STAGE_LABEL[s.id] = s.label; });

/* ============ state ============ */
var S = {
  db:null, user:null, assets:null, sample:null, canSampleImages:false,
  uid:null, me:null,
  canWrite:null,          // true / false / null (unknown)
  projects:[], spaces:[], tasks:[], notes:[], schedules:[], prospects:[],
  meta:{},                // small shared counters, currently just the colour high water mark
  sel:"dash",             // "dash" | "all" | "capture" | "unfiled" | "today" | projectId
  space:null,             // spaceId within the selected project, or null for all
  tab:"board",
  q:"",
  tag:null,
  capImages:[],
  capProj:null, capSpace:null,   // capture box pickers; cleared after every save
  doc:null,                      // a doc opened as a tab inside its project
  todaySec:null,                 // section the Today page should scroll to, from a notification link
  triage:{},                     // noteId -> project chosen mid-triage, before a space is picked
  calMonth:null,          // Date on the 1st of the shown month
  newSpaceFor:null,
  editSched:null,
  docMode:"write",
  composing:{col:null, text:""},
  newProject:false, newProjectText:"",
  openNote:null,
  /* the dashboard. who and dashRange are per device; the rest is transient but
     lives here so a realtime re-render doesn't collapse what you just opened */
  people:[],                     // profiles, me first; empty until loaded (and offline)
  who:prefGet("who",""),         // person lens: "" = everyone, else their work plus unassigned
  dashRange:prefGet("dashRange","7"),   // "7" | "30" | "12w"
  dashPick:null,                 // the chart bucket picked, by its start date
  dashTable:false,               // the chart's table twin
  dashMore:{},                   // "Show N more" expanders
  wlOpen:null,                   // the Workload row expanded
  drill:null,                    // All projects filter from a drill-through: {lens, owner, status, project}
  doneOlder:{},                  // board or list key -> showing finished work older than DONE_KEEP_DAYS
  ready:false
};

var $ = function(s){ return document.querySelector(s); };
var railEl=$("#rail"), headEl=$("#mainhead"), bodyEl=$("#mainbody");

/* ============ helpers ============ */
function esc(s){ return String(s==null?"":s); }
/* an icon from the sprite at the top of <body>; decorative, so the control that
   holds it carries the accessible name */
var SVGNS = "http://www.w3.org/2000/svg", XLINK = "http://www.w3.org/1999/xlink";
function ico(name, cls){
  var s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("class", "ico" + (cls ? " " + cls : ""));
  s.setAttribute("aria-hidden", "true");
  s.setAttribute("focusable", "false");
  var u = document.createElementNS(SVGNS, "use");
  u.setAttribute("href", "#i-" + name);
  u.setAttributeNS(XLINK, "xlink:href", "#i-" + name);
  s.appendChild(u);
  return s;
}
/* a button holding just an icon, named for screen readers and the tooltip */
function icoBtn(cls, name, label){
  var b = el("button", cls);
  b.appendChild(ico(name));
  b.setAttribute("aria-label", label);
  b.title = label;
  return b;
}
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function nowISO(){ return new Date().toISOString(); }

var toastT;
function toast(msg){
  var t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}
/* One strip, three things that want it. Highest wins, and a lower one never
   erases a higher one — the update notice in particular carries a click handler
   that a plain banner() call used to destroy. */
var bannerLayers = { update:null, error:null, outbox:null };
var BANNER_ORDER = ["update","error","outbox"];
function paintBanner(){
  var b = $("#banner");
  var top = null;
  for(var i=0;i<BANNER_ORDER.length;i++){
    if(bannerLayers[BANNER_ORDER[i]]){ top = bannerLayers[BANNER_ORDER[i]]; break; }
  }
  b.onclick = null;
  b.classList.remove("tap");
  if(!top){ b.classList.remove("on"); b.textContent = ""; return; }
  b.textContent = top.text;
  if(top.onTap){ b.classList.add("tap"); b.onclick = top.onTap; }
  b.classList.add("on");
}
function setBanner(layer, text, onTap){
  bannerLayers[layer] = text ? { text: text, onTap: onTap || null } : null;
  paintBanner();
}
function banner(msg){ setBanner("error", msg || null); }

/* a dialog that works inside a sandboxed frame, unlike confirm() */
function askConfirm(title, body, yesLabel){
  return new Promise(function(resolve){
    var box = $("#confirm"), yes = $("#cYes"), no = $("#cNo");
    $("#cTitle").textContent = title;
    $("#cBody").textContent = body;
    yes.textContent = yesLabel || "Delete";
    box.classList.add("on");
    yes.focus();
    function done(v){
      box.classList.remove("on");
      yes.onclick = no.onclick = null;
      box.onmousedown = null;
      document.removeEventListener("keydown", key);
      resolve(v);
    }
    function key(e){ if(e.key === "Escape"){ e.stopPropagation(); done(false); } }
    yes.onclick = function(){ done(true); };
    no.onclick = function(){ done(false); };
    box.onmousedown = function(e){ if(e.target === box) done(false); };
    document.addEventListener("keydown", key);
  });
}

/* swap a node's contents for a text input; Enter or blur saves, Escape cancels */
function inlineEdit(container, current, onSave){
  container.textContent = "";
  var i = document.createElement("input");
  i.type = "text";
  i.className = "inline-edit";
  i.value = current || "";
  container.appendChild(i);
  i.focus();
  i.select();
  var closed = false;
  function finish(save){
    if(closed) return;
    closed = true;
    var v = i.value.trim();
    if(save && v && v !== current) onSave(v);
    else render();
  }
  i.onkeydown = function(e){
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); finish(true); }
    else if(e.key === "Escape"){ e.preventDefault(); finish(false); }
  };
  i.onblur = function(){
    if(!i.isConnected){ closed = true; return; }
    finish(true);
  };
  i.onclick = function(e){ e.stopPropagation(); };
}

function prefGet(k, d){
  try{ var v = localStorage.getItem("slate:"+k); return v==null?d:v; }catch(e){ return d; }
}
function prefSet(k, v){
  try{ localStorage.setItem("slate:"+k, v); }catch(e){}
}

/* one write at a time per document path */
var chains = new Map();
function queue(path, fn){
  var prev = chains.get(path) || Promise.resolve();
  var next = prev.catch(function(){}).then(fn).catch(function(e){ dbErr(e); });
  chains.set(path, next);
  return next;
}
/* The codes this used to test — invalid_argument, quota_exceeded,
   resource_exhausted, revoked — were artifact-runtime strings. PostgREST emits
   none of them, so every branch was dead and the read-only banner had never
   fired once. These are what actually arrives. */
function dbErr(e){
  var code = (e && e.code) || "";
  var status = (e && e.status) || 0;
  if(code === "offline"){
    toast("Images need a connection. Your text saves now — add the photo when you're back.");
  } else if(code === "queue_full"){
    banner("There are too many unsaved changes on this device. Get back online before adding more.");
  } else if(code === "not_loaded"){
    toast("That isn't loaded yet. Give it a second and try again.");
  } else if(code === "42501" || status === 401 || status === 403){
    S.canWrite = false;
    banner("You have read-only access to this board, so changes aren't saved.");
    render();
  } else if(code === "23505"){
    toast("Something with that name already exists.");
  } else if(code === "PGRST301" || code === "PGRST303"){
    banner("Your sign-in expired. Reload to continue.");
  } else {
    toast("That change didn't save. Try again.");
  }
}
function writable(){ return S.canWrite !== false && !!S.db; }

function fmtDate(d){
  if(!d) return "";
  var p = d.split("-");
  if(p.length !== 3) return d;
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  var mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return mons[dt.getMonth()] + " " + dt.getDate();
}
function isLate(d, status){
  if(!d || status === "done") return false;
  var today = new Date(); today.setHours(0,0,0,0);
  var p = d.split("-");
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  return dt < today;
}
function relTime(iso){
  if(!iso) return "";
  var diff = (Date.now() - new Date(iso).getTime())/1000;
  if(diff < 60) return "just now";
  if(diff < 3600) return Math.floor(diff/60) + "m ago";
  if(diff < 86400) return Math.floor(diff/3600) + "h ago";
  if(diff < 604800) return Math.floor(diff/86400) + "d ago";
  return fmtDate(iso.slice(0,10));
}
/* ---- tags, links, days ---- */
var TAG_RE = /#([\w-]{1,32})/g;
var URL_RE = /(https?:\/\/[^\s<>()]+)/g;

function tagsOf(n){
  var out = [], m;
  var hay = (n.title || "") + " " + (n.body || "");
  TAG_RE.lastIndex = 0;
  while((m = TAG_RE.exec(hay)) !== null){
    var t = m[1].toLowerCase();
    if(out.indexOf(t) === -1) out.push(t);
  }
  return out;
}
function allTags(notes){
  var counts = {};
  notes.forEach(function(n){
    tagsOf(n).forEach(function(t){ counts[t] = (counts[t]||0) + 1; });
  });
  return Object.keys(counts).sort(function(a,b){
    return counts[b] - counts[a] || a.localeCompare(b);
  }).map(function(t){ return {tag:t, n:counts[t]}; });
}

/* text with #tags and links made live, built as nodes (never innerHTML) */
function richText(container, text){
  var parts = String(text || "").split(/(\s+)/);
  parts.forEach(function(p){
    if(!p) return;
    if(/^#[\w-]{1,32}$/.test(p)){
      var s = el("span","tagref", p);
      s.onclick = function(e){
        e.stopPropagation();
        S.tag = p.slice(1).toLowerCase();
        if(S.sel === "dash" || (S.sel !== "capture" && S.tab !== "notes")) S.sel = "capture";
        render();
      };
      container.appendChild(s);
    } else if(/^https?:\/\//.test(p)){
      var a = document.createElement("a");
      a.href = p; a.textContent = p;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.onclick = function(e){ e.stopPropagation(); };
      container.appendChild(a);
    } else {
      container.appendChild(document.createTextNode(p));
    }
  });
}

/* a card that can contain links, so not a <button> */
function clickable(cls, onActivate){
  var d = el("div", cls);
  d.setAttribute("role","button");
  d.tabIndex = 0;
  d.onclick = function(e){
    if(e.target.closest && e.target.closest("a, .tagref")) return;
    onActivate();
  };
  d.onkeydown = function(e){
    if(e.key === "Enter" || e.key === " "){
      if(e.target !== d) return;
      e.preventDefault();
      onActivate();
    }
  };
  return d;
}

function dayKey(iso){
  if(!iso) return "";
  var d = new Date(iso);
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
}
function dayLabel(iso){
  if(!iso) return "";
  var d = new Date(iso), now = new Date();
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((b - a) / 86400000);
  if(days === 0) return "Today";
  if(days === 1) return "Yesterday";
  var mons = ["January","February","March","April","May","June","July",
              "August","September","October","November","December"];
  var s = mons[d.getMonth()] + " " + d.getDate();
  if(d.getFullYear() !== now.getFullYear()) s += ", " + d.getFullYear();
  return s;
}

function findProject(id){
  for(var i=0;i<S.projects.length;i++) if(S.projects[i].id === id) return S.projects[i];
  return null;
}
function findSpace(id){
  for(var i=0;i<S.spaces.length;i++) if(S.spaces[i].id === id) return S.spaces[i];
  return null;
}
/* the doc that owns a set of columns: the space if there is one, else the project */
function columnHost(projectId, spaceId){
  if(spaceId && findSpace(spaceId)) return "spaces/" + spaceId;
  if(projectId && findProject(projectId)) return "projects/" + projectId;
  return null;
}
function columnsFor(projectId, spaceId){
  var sp = spaceId && findSpace(spaceId);
  if(sp && sp.columns && sp.columns.length) return sp.columns;
  var pr = projectId && findProject(projectId);
  if(pr && pr.columns && pr.columns.length) return pr.columns;
  return DEFAULT_COLUMNS;
}
function firstColumnId(projectId, spaceId){
  var c = columnsFor(projectId, spaceId);
  return c.length ? c[0].id : null;
}
function doneColumnId(projectId, spaceId){
  var c = columnsFor(projectId, spaceId);
  return c.length ? c[c.length-1].id : null;
}
function taskDone(t){
  return !!t && t.status === doneColumnId(t.projectId, t.spaceId);
}
/* started but not finished: anything in a middle column */
function taskUnderway(t){
  var c = columnsFor(t.projectId, t.spaceId);
  if(c.length < 3) return false;
  for(var i=1;i<c.length-1;i++) if(c[i].id === t.status) return true;
  return false;
}
function columnName(projectId, spaceId, colId){
  var c = columnsFor(projectId, spaceId);
  for(var i=0;i<c.length;i++) if(c[i].id === colId) return c[i].name;
  return c.length ? c[0].name : "";
}
/* a status that no longer matches any column falls back to the first one, so a
   renamed or deleted column can never strand a task off the board */
function columnOf(t){
  var c = columnsFor(t.projectId, t.spaceId);
  for(var i=0;i<c.length;i++) if(c[i].id === t.status) return t.status;
  return c.length ? c[0].id : t.status;
}

function projName(id){
  for(var i=0;i<S.projects.length;i++) if(S.projects[i].id === id) return S.projects[i].name || "Untitled project";
  return null;
}
function spaceName(id){
  for(var i=0;i<S.spaces.length;i++) if(S.spaces[i].id === id) return S.spaces[i].name || "Untitled space";
  return null;
}
function spacesOf(projectId){
  return S.spaces.filter(function(s){ return s.projectId === projectId; })
    .sort(function(a,b){ return (a.order||0)-(b.order||0); });
}
/* views that aren't a project: anything else in S.sel is a project id */
var VIRTUAL_VIEWS = ["dash","all","capture","unfiled","today"];
function isVirtualView(sel){ return VIRTUAL_VIEWS.indexOf(sel) !== -1; }
function currentProject(){
  return isVirtualView(S.sel) ? null : S.sel;
}
/* still chasing: won ones became projects, lost ones are parked */
function openProspects(){
  var q = S.q.toLowerCase();
  return S.prospects.filter(function(p){
    if(p.stage === "won" || p.stage === "lost") return false;
    if(q){
      var hay = (String(p.company||"") + " " + String(p.contact||"") + " " + String(p.note||"")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

/* ============ selectors ============ */
function visibleTasks(){
  var q = S.q.toLowerCase();
  /* a drill-through filter only ever applies where its chip is showing */
  var dr = S.sel === "all" ? S.drill : null;
  return S.tasks.filter(function(t){
    /* the dashboard and Today read S.tasks through their own models */
    if(S.sel === "unfiled" || S.sel === "capture" || S.sel === "dash" || S.sel === "today") return false;
    if(S.sel !== "all" && t.projectId !== S.sel) return false;
    if(S.space && t.spaceId !== S.space) return false;
    if(q && (String(t.title||"") + " " + String(t.notes||"")).toLowerCase().indexOf(q) === -1) return false;
    if(dr && !drillMatch(t, dr)) return false;
    return true;
  }).sort(function(a,b){ return (a.order||0) - (b.order||0); });
}
/* The lens rule is the morning brief's: someone's view is theirs plus nobody's. */
function drillMatch(t, dr){
  if(dr.lens && t.assignee && t.assignee !== dr.lens) return false;
  if(dr.owner === "none" && t.assignee) return false;
  if(dr.owner && dr.owner !== "none" && t.assignee !== dr.owner) return false;
  if(dr.status === "doing" && !taskUnderway(t)) return false;
  if(dr.status === "open" && taskDone(t)) return false;
  if(dr.project === "none" && t.projectId && findProject(t.projectId)) return false;
  return true;
}
function visibleNotes(){
  var q = S.q.toLowerCase();
  return S.notes.filter(function(n){
    if(S.sel === "unfiled"){ if(n.projectId) return false; }
    else if(S.sel !== "all" && S.sel !== "capture"){
      if(n.projectId !== S.sel) return false;
      if(S.space && n.spaceId !== S.space) return false;
    }
    if(S.tag && tagsOf(n).indexOf(S.tag) === -1) return false;
    if(q){
      var hay = (String(n.title||"") + " " + String(n.body||"")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function(a,b){
    return String(b.updatedAt||"").localeCompare(String(a.updatedAt||""));
  });
}
function visibleSchedules(){
  return S.schedules.filter(function(s){
    if(S.sel === "all") return true;
    if(S.sel !== s.projectId) return false;
    if(S.space && s.spaceId !== S.space) return false;
    return true;
  }).sort(function(a,b){ return String(a.time||"").localeCompare(String(b.time||"")); });
}

/* ============ writes ============ */
/* ---- spaces ---- */
function createSpace(projectId, name){
  if(!writable() || !String(name||"").trim()) return;
  var id = uid();
  var maxOrder = spacesOf(projectId).reduce(function(m,s){ return Math.max(m, s.order||0); }, 0);
  queue("spaces/"+id, function(){
    return S.db.doc("spaces/"+id).set({
      projectId: projectId,
      name: String(name).trim(),
      order: maxOrder + 1,
      createdAt: nowISO(),
      createdBy: S.uid || null
    });
  }).then(function(){ S.space = id; render(); });
}
function renameSpace(id, name){
  if(!writable()) return;
  queue("spaces/"+id, function(){ return S.db.doc("spaces/"+id).update({ name: name }); });
}
function deleteSpace(id){
  if(!writable()) return;
  var n = S.tasks.filter(function(t){ return t.spaceId === id; }).length +
          S.notes.filter(function(x){ return x.spaceId === id; }).length;
  askConfirm("Delete " + (spaceName(id) || "this space") + "?",
    n ? "Its " + n + " item" + (n===1?"":"s") + " stay in the project, just without a space."
      : "Nothing is in it yet.",
    "Delete space").then(function(ok){
    if(!ok) return;
    S.tasks.filter(function(t){ return t.spaceId === id; }).forEach(function(t){
      queue("tasks/"+t.id, function(){ return S.db.doc("tasks/"+t.id).update({ spaceId:null }); });
    });
    S.notes.filter(function(x){ return x.spaceId === id; }).forEach(function(x){
      queue("notes/"+x.id, function(){ return S.db.doc("notes/"+x.id).update({ spaceId:null }); });
    });
    S.schedules.filter(function(x){ return x.spaceId === id; }).forEach(function(x){
      queue("schedules/"+x.id, function(){ return S.db.doc("schedules/"+x.id).update({ spaceId:null }); });
    });
    queue("spaces/"+id, function(){ return S.db.doc("spaces/"+id).delete(); })
      .then(function(){ if(S.space === id) S.space = null; render(); });
  });
}

/* ---- schedules ---- */
function saveSchedule(id, data){
  if(!writable()) return Promise.resolve();

    return queue("schedules/"+sid, function(){ return S.db.doc("schedules/"+sid).update(data); });

}
function deleteSchedule(id){

  queue("schedules/"+id, function(){ return S.db.doc("schedules/"+id).delete(); });
}
function toggleOccurrence(sched, dateStr){
  if(!writable()) return;
  var done = Object.assign({}, sched.done || {});
  if(done[dateStr]) delete done[dateStr]; else done[dateStr] = true;
  queue("schedules/"+sched.id, function(){
    return S.db.doc("schedules/"+sched.id).update({ done: done });
  });
}

function createProject(name){
  if(!writable()) return;
  var id = uid();
  var maxOrder = S.projects.reduce(function(m,p){ return Math.max(m, p.order||0); }, 0);
  queue("projects/"+id, function(){
    return S.db.doc("projects/"+id).set({
      name: name || "New project",
      order: maxOrder + 1,
      colorIndex: nextColorIndex(),
      contact: "", email: "", phone: "", website: "",
      createdAt: nowISO(),
      createdBy: S.uid || null
    });
  }).then(function(){ S.sel = id; S.tab = "board"; render(); });
}
function deleteProject(id){
  if(!writable()) return;
  var tasks = S.tasks.filter(function(t){ return t.projectId === id; });
  var notes = S.notes.filter(function(n){ return n.projectId === id; });
  /* Repeating items and spaces belong to the project and can only be reached
     through it. Left behind they become unreachable: a schedule still occurs
     every day, so the dashboard and every morning brief would go on announcing
     an event for a project that no longer exists, with nowhere to go and delete
     it. deleteSpace already clears schedules for the same reason. */
  var scheds = S.schedules.filter(function(s){ return s.projectId === id; });
  var spaces = spacesOf(id);

  var msg = tasks.length + " task" + (tasks.length===1?"":"s") +
            (scheds.length ? " and " + scheds.length + " repeating item" + (scheds.length===1?"":"s") : "") +
            " will be deleted with it. " +
            notes.length + " note" + (notes.length===1?"":"s") + " will move to Unfiled notes.";
  askConfirm("Delete " + (projName(id) || "this project") + "?", msg, "Delete project").then(function(ok){
    if(!ok) return;
    tasks.forEach(function(t){ queue("tasks/"+t.id, function(){ return S.db.doc("tasks/"+t.id).delete(); }); });
    notes.forEach(function(n){ queue("notes/"+n.id, function(){ return S.db.doc("notes/"+n.id).update({ projectId:null }); }); });
    scheds.forEach(function(s){ queue("schedules/"+s.id, function(){ return S.db.doc("schedules/"+s.id).delete(); }); });
    spaces.forEach(function(sp){ queue("spaces/"+sp.id, function(){ return S.db.doc("spaces/"+sp.id).delete(); }); });
    queue("projects/"+id, function(){ return S.db.doc("projects/"+id).delete(); })
      .then(function(){ goView("dash"); });
  });
}

function createTask(title, status, projectId, spaceId, noteId){
  if(!writable() || !String(title||"").trim()) return;
  var id = uid();
  status = status || firstColumnId(projectId, spaceId);
  var inCol = S.tasks.filter(function(t){
    return t.status === status && (t.projectId||null) === (projectId||null) && (t.spaceId||null) === (spaceId||null);
  });
  var maxOrder = inCol.reduce(function(m,t){ return Math.max(m, t.order||0); }, 0);
  var doc = {
    title: String(title).trim(),
    status: status,
    projectId: projectId || null,
    spaceId: spaceId || null,
    assignee: null,
    due: null,
    noteId: noteId || null,
    order: maxOrder + 1,
    createdAt: nowISO(),
    createdBy: S.uid || null,
    updatedAt: nowISO()
  };
  /* typed straight into the Done column's "Add a task": finished now, and without
     the stamp it would never appear in the evening wrap or the history */
  if(status === doneColumnId(projectId, spaceId)){ doc.completedAt = nowISO(); doc.completedBy = S.uid || null; }
  queue("tasks/"+id, function(){ return S.db.doc("tasks/"+id).set(doc); });
}
function patchTask(id, patch){
  if(!writable()) return;
  patch.updatedAt = nowISO();
  /* Completion is positional — the last column means done — so the timestamp the
     evening brief reads is stamped here, the one door every status change walks
     through. Landing in the done column sets it; leaving clears it. */
  if("status" in patch || "projectId" in patch || "spaceId" in patch){
    var cur = null;
    for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id === id){ cur = S.tasks[i]; break; }
    if(cur){
      var was = taskDone(cur);
      var now = taskDone(Object.assign({}, cur, patch));
      /* and who: the dashboard reports who finished what, and without this the
         answer for anything done before today would always be "someone" */
      if(!was && now){ patch.completedAt = nowISO(); patch.completedBy = S.uid || null; }
      else if(was && !now){ patch.completedAt = null; patch.completedBy = null; }
    }
  }
  queue("tasks/"+id, function(){ return S.db.doc("tasks/"+id).update(patch); });
}
function deleteTask(id){
  if(!writable()) return;
  queue("tasks/"+id, function(){ return S.db.doc("tasks/"+id).delete(); });
}

/* a captured note: first line becomes the name, the rest is the body */
function captureNote(text, images, projectId, spaceId){
  if(!writable()) return Promise.resolve();
  var raw = String(text || "").replace(/\r/g,"");
  if(!raw.trim() && !(images && images.length)) return Promise.resolve();
  var lines = raw.split("\n");
  var title = "", body = raw.trim();
  if(lines.length > 1 && lines[0].trim() && lines[0].trim().length <= 70){
    title = lines[0].trim();
    body = lines.slice(1).join("\n").trim();
  } else if(lines.length === 1 && raw.trim().length <= 70){
    title = raw.trim();
    body = "";
  }
  var id = uid();
  captureNote.lastId = id;
  return queue("notes/"+id, function(){
    return S.db.doc("notes/"+id).set({
      title: title,
      body: body,
      kind: "note",
      images: images ? images.slice() : [],
      projectId: projectId || null,
      spaceId: projectId ? (spaceId || (S.space || null)) : null,
      createdAt: nowISO(),
      createdBy: S.uid || null,
      updatedAt: nowISO(),
      updatedBy: S.uid || null
    });
  });
}

function taskTitleFor(n){
  var title = (n.title && n.title.trim()) || String(n.body||"").split("\n")[0].trim() || "Untitled";
  return title.length > 120 ? title.slice(0,117) + "…" : title;
}
function noteToTask(n){
  if(!writable()) return;
  createTask(taskTitleFor(n), null, n.projectId || null, n.spaceId || null, n.id || null);
  toast(n.projectId ? "Added to " + (projName(n.projectId) || "the board")
                    : "Added to All projects — file it into a project from there");
}

/* ---- columns ---- */
function writeColumns(projectId, spaceId, cols){
  var host = columnHost(projectId, spaceId);
  if(!host || !writable()) return Promise.resolve();
  return queue(host, function(){ return S.db.doc(host).update({ columns: cols }); });
}
function addColumn(projectId, spaceId, name){
  var cols = columnsFor(projectId, spaceId).slice();
  cols.push({ id: uid(), name: name || "New column" });
  return writeColumns(projectId, spaceId, cols);
}
function renameColumn(projectId, spaceId, colId, name){
  var cols = columnsFor(projectId, spaceId).map(function(c){
    return c.id === colId ? { id: c.id, name: name } : { id: c.id, name: c.name };
  });
  return writeColumns(projectId, spaceId, cols);
}
function deleteColumn(projectId, spaceId, colId){
  var cols = columnsFor(projectId, spaceId);
  if(cols.length <= 1) return Promise.resolve();
  var left = cols.filter(function(c){ return c.id !== colId; });
  var fallback = left[0].id;
  /* This re-files cards without going through patchTask, so it has to keep
     completedAt itself — and done-ness has to be judged against the columns that
     will exist after the delete, not the ones being replaced. Deleting down to a
     single column makes that column both first and last, so the cards landing on
     it become done. */
  var doneAfter = left[left.length - 1].id;
  var nowDone = fallback === doneAfter;
  S.tasks.forEach(function(t){
    if(t.projectId === projectId && (t.spaceId || null) === (spaceId || null) && t.status === colId){
      var patch = { status: fallback, updatedAt: nowISO() };
      var wasDone = taskDone(t);
      if(!wasDone && nowDone){ patch.completedAt = nowISO(); patch.completedBy = S.uid || null; }
      else if(wasDone && !nowDone){ patch.completedAt = null; patch.completedBy = null; }
      queue("tasks/"+t.id, function(){ return S.db.doc("tasks/"+t.id).update(patch); });
    }
  });
  return writeColumns(projectId, spaceId, left);
}

/* Landing one turns it into a project. Everything you wrote while chasing them
   becomes the project's first note, so the context survives the handover. */
function convertProspect(id){
  var p = findProspect(id);
  if(!p || !writable()) return;
  var pid = uid();
  var maxOrder = S.projects.reduce(function(m,x){ return Math.max(m, x.order||0); }, 0);
  queue("projects/"+pid, function(){
    return S.db.doc("projects/"+pid).set({
      name: p.company || "New project",
      order: maxOrder + 1,
      colorIndex: nextColorIndex(),
      contact: p.contact || "", email: p.email || "", phone: "", website: "",
      createdAt: nowISO(),
      createdBy: S.uid || null
    });
  }).then(function(){
    var lines = [];
    if(p.contact) lines.push("Contact: " + p.contact);
    if(p.email) lines.push("Email: " + p.email);
    if(p.note) lines.push("", p.note);
    if(!lines.length) return;
    var nid = uid();
    return queue("notes/"+nid, function(){
      return S.db.doc("notes/"+nid).set({
        title: "How we won " + (p.company || "this one"),
        body: lines.join("\n"),
        kind: "note",
        images: [],
        projectId: pid,
        spaceId: null,
        createdAt: nowISO(),
        createdBy: S.uid || null,
        updatedAt: nowISO(),
        updatedBy: S.uid || null
      });
    });
  }).then(function(){
    deleteProspect(id);
    S.sel = pid; S.space = null; S.tab = "board";
    toast("Welcome aboard, " + (p.company || "new client"));
    render();
  });
}

function createNote(projectId, kind){
  if(!writable()) return;
  var id = uid();
  queue("notes/"+id, function(){
    return S.db.doc("notes/"+id).set({
      title: "",
      body: "",
      kind: kind || "note",
      images: [],
      projectId: projectId || null,
      spaceId: (projectId && S.space) ? S.space : null,
      createdAt: nowISO(),
      createdBy: S.uid || null,
      updatedAt: nowISO(),
      updatedBy: S.uid || null
    });

}
function patchNote(id, patch){
  if(!writable()) return Promise.resolve();
  patch.updatedAt = nowISO();
  patch.updatedBy = S.uid || null;
  return queue("notes/"+id, function(){ return S.db.doc("notes/"+id).update(patch); });
}
function deleteNote(id){

}

/* ============ render: rail ============ */
function renderRail(){
  railEl.textContent = "";

  /* Counts that mean something, and ignore the dashboard's lens: every task ever
     made (the old Dashboard number) and every note (the old Capture one) only
     ever go up. Overdue is the number that wants you; Capture's meaningful count
     is already on Unfiled notes, so it carries none. */
  var todayS = SlateBrief.denverToday().ymd, overdue = 0, openAll = 0;
  S.tasks.forEach(function(t){
    if(taskDone(t)) return;
    openAll++;
    if(t.due && t.due < todayS) overdue++;
  });
  var top = el("div","rail-sec");
  top.appendChild(railItem("dash", "Dashboard", overdue || null, "dash", overdue + " overdue", true));
  top.appendChild(railItem("capture", "Capture", null, "capture"));
  railEl.appendChild(top);

  var ps = el("div","rail-sec");
  var h = el("div","rail-head");
  h.appendChild(el("span",null,"Projects"));
  if(writable()){
    var add = el("button",null,"+");
    add.title = "New project";
    add.setAttribute("aria-label","New project");
    add.onclick = function(){ S.newProject = true; S.newProjectText = ""; render(); };
    h.appendChild(add);
  }
  ps.appendChild(h);
  /* first under its heading: it's the parent of every row below it */
  ps.appendChild(railItem("all", "All projects", openAll, "all", openAll + " open"));

  if(S.newProject && writable()){
    var wrap = el("div","rail-new");
    var ni = document.createElement("input");
    ni.type = "text";
    ni.placeholder = "Project name";
    ni.value = S.newProjectText || "";
    ni.setAttribute("aria-label","New project name");
    ni.oninput = function(){ S.newProjectText = ni.value; };
    /* One shot, like inlineEdit. Writes are queued through a promise, so the
       re-render that removes this field happens a microtask later — meaning on
       iOS, where the return key also dismisses the keyboard, blur fires while
       the node is still connected and still holding the text. Without this flag
       Enter creates the project and the blur right behind it creates it again. */
    var committed = false;
    function commitProject(save){
      if(committed) return;
      committed = true;
      var v = ni.value.trim();
      S.newProject = false; S.newProjectText = "";
      if(save && v) createProject(v); else render();
    }
    ni.onkeydown = function(e){
      if(e.key === "Enter"){ e.preventDefault(); commitProject(true); }
      else if(e.key === "Escape"){ e.preventDefault(); commitProject(false); }
    };
    ni.onblur = function(){
      // a live re-render detaches this node; that isn't the user leaving the field
      if(!ni.isConnected) return;
      commitProject(true);
    };
    wrap.appendChild(ni);
    ps.appendChild(wrap);
  }

  var sorted = S.projects.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  if(!sorted.length && !S.newProject){
    ps.appendChild(el("div","rail-empty","No projects yet."));
  }
  sorted.forEach(function(p){
    var open = S.tasks.filter(function(t){ return t.projectId === p.id && !taskDone(t); }).length;
    ps.appendChild(railItem(p.id, p.name || "Untitled project", open, "dot"));
  });
  railEl.appendChild(ps);

  var ns = el("div","rail-sec");
  var nh = el("div","rail-head");
  nh.appendChild(el("span",null,"Notes"));
  if(writable()){
    var na = el("button",null,"+");
    na.title = "New unfiled note";
    na.setAttribute("aria-label","New unfiled note");
    na.onclick = function(){ createNote(null); };
    nh.appendChild(na);
  }
  ns.appendChild(nh);
  var unfiled = S.notes.filter(function(n){ return !n.projectId; }).length;
  ns.appendChild(railItem("unfiled","Unfiled notes", unfiled, "notes"));
  railEl.appendChild(ns);
}
/* mark: "dot" for a project's colour, else an icon from the sprite */
function railItem(id, label, count, mark, countLabel, crit){
  var b = el("button","rail-item" + (S.sel === id ? " on" : ""));
  if(S.sel === id) b.setAttribute("aria-current","page");
  if(mark === "dot"){
    var dot = el("span","dot");
    var c = projectColor(id);
    if(c) dot.style.background = c;
    b.appendChild(dot);
  } else if(mark){
    b.appendChild(ico(mark, "rico"));
  }
  b.appendChild(el("span","lbl", label));
  if(count != null){
    b.appendChild(el("span","ct" + (crit ? " crit" : ""), String(count)));
    if(countLabel) b.setAttribute("aria-label", label + ", " + countLabel);
  }
  b.onclick = function(){ goView(id); };
  return b;
}
/* Every change of view goes through here — the rail, the bottom bar, every
   dashboard drill-through — so none of them can strand a doc, a tag filter, a
   space or a drill chip from the view before, or a Prospects tab somewhere that
   has none. */
function goView(sel, tab, drill){
  if(S.sel !== sel) S.space = null;
  S.sel = sel;
  S.doc = null;
  S.tag = null;
  S.drill = drill || null;
  if(sel === "unfiled") S.tab = "notes";
  else if(tab){ S.tab = tab; prefSet("tab", tab); }
  if(S.tab === "prospects" && sel !== "all"){ S.tab = "board"; prefSet("tab","board"); }
  closeRail();
  render();
  /* render() keeps your place, which is right for a live update and wrong for
     arriving somewhere new */
  window.scrollTo(0, 0);
}

    headEl.appendChild(el("div","meta",
      SlateBrief.denverToday().label + " — everything on today, and what got done."));

  }

  /* A project's contact details are what you want while you're on the phone to
     them, so they sit in the header rather than behind the details sheet. */
  if(isProject){

    if(pr && (pr.contact || pr.email || pr.phone || pr.website)){

        at.href = "tel:" + pr.phone.replace(/[^\d+]/g, ""); at.textContent = pr.phone;
        info.appendChild(at);
      }
      if(pr.website){
        var aw = document.createElement("a");
        aw.href = /^https?:\/\//.test(pr.website) ? pr.website : "https://" + pr.website;
        aw.target = "_blank"; aw.rel = "noopener noreferrer";
        aw.textContent = pr.website.replace(/^https?:\/\//, "");
        info.appendChild(aw);
      }

    }
  }

  var tabs = el("div","tabs");

  /* Inside a project the tabs are its spaces: since columns became per-space,
     the space is the unit of work. The view switcher sits at the right end. */
  if(isProject){
    var allb = el("button","tab" + (!S.doc && S.space === null ? " on" : ""));
    allb.appendChild(document.createTextNode("All"));
    allb.onclick = function(){ S.doc = null; S.space = null; render(); };
    tabs.appendChild(allb);

    spacesOf(S.sel).forEach(function(sp){
      var b = el("button","tab" + (!S.doc && S.space === sp.id ? " on" : ""));
      b.appendChild(document.createTextNode(sp.name || "Untitled space"));
      var cnt = S.tasks.filter(function(t){ return t.spaceId === sp.id && !taskDone(t); }).length;
      b.appendChild(el("span","n", String(cnt)));
      b.onclick = function(){ S.doc = null; S.space = sp.id; render(); };
      tabs.appendChild(b);
    });

    if(writable()){
      if(S.newSpaceFor === S.sel){
        var si = document.createElement("input");
        si.className = "tabnew";
        si.type = "text";
        si.placeholder = "Space name";
        si.setAttribute("aria-label","New space name");
        /* one shot, for the same reason the new-project field is — see there */
        var spaceCommitted = false;
        var forProject = S.sel;
        function commitSpace(save){
          if(spaceCommitted) return;
          spaceCommitted = true;
          var v = si.value.trim();
          S.newSpaceFor = null;
          if(save && v) createSpace(forProject, v); else render();
        }
        si.onkeydown = function(e){
          if(e.key === "Enter"){ e.preventDefault(); commitSpace(true); }
          else if(e.key === "Escape"){ e.preventDefault(); commitSpace(false); }
        };
        si.onblur = function(){
          if(!si.isConnected) return;
          commitSpace(true);
        };
        tabs.appendChild(si);
      } else {
        var addS = el("button","tab tabadd","+");
        addS.title = "Add a space";
        addS.setAttribute("aria-label","Add a space");
        addS.onclick = function(){ S.newSpaceFor = S.sel; render(); };
        tabs.appendChild(addS);
      }
    }

    /* Docs filed to this project get their own tab: a prompt library or a
       client brief is reference material you want one tap away, not something
       to go hunting for under Notes. */
    var docs = S.notes.filter(function(n){
      return n.projectId === S.sel && noteKind(n) === "doc";
    }).sort(function(a,b){
      return String(a.title||"").localeCompare(String(b.title||""));
    });
    if(docs.length){
      tabs.appendChild(el("span","tabsep"));
      docs.forEach(function(d){
        var b = el("button","tab tabdoc" + (S.doc === d.id ? " on" : ""));
        b.appendChild(ico("notes","sm dico"));
        b.appendChild(document.createTextNode(
          (d.title && d.title.trim()) || "Untitled doc"));
        b.onclick = function(){ S.doc = d.id; render(); };
        tabs.appendChild(b);
      });
    }

    var views = el("div","viewswitch");
    [["board","board","Board"],["list","list","List"],
     ["calendar","calendar","Calendar"],["notes","notes","Notes"]].forEach(function(v){
      var vb = el("button","vbtn" + (!S.doc && S.tab === v[0] ? " on" : ""));
      vb.appendChild(ico(v[1], "sm vico"));
      vb.appendChild(el("span","vlabel", v[2]));
      vb.title = v[2];
      vb.setAttribute("aria-label", v[2]);
      vb.onclick = function(){ S.doc = null; S.tab = v[0]; prefSet("tab", v[0]); render(); };
      views.appendChild(vb);
    });
    tabs.appendChild(views);
    headEl.appendChild(tabs);
    return;
  }

  var tabDefs = [["board","Board"],["list","List"],["calendar","Calendar"],["notes","Notes"]];
  if(S.sel === "all") tabDefs.push(["prospects","Prospects"]);
  /* open work only: counting finished tasks made a number that only ever grew */
  var openN = visibleTasks().filter(function(t){ return !taskDone(t); }).length;
  tabDefs.forEach(function(t){
    var b = el("button","tab" + (S.tab === t[0] ? " on" : ""));
    b.appendChild(document.createTextNode(t[1]));
    var n = t[0] === "notes" ? visibleNotes().length
          : t[0] === "calendar" ? visibleSchedules().length
          : t[0] === "prospects" ? openProspects().length
          : openN;
    b.appendChild(el("span","n", String(n)));
    b.onclick = function(){ S.tab = t[0]; prefSet("tab", t[0]); render(); };
    tabs.appendChild(b);
  });
  headEl.appendChild(tabs);

  if(S.sel === "all" && S.drill){
    var dr = el("div","drill");
    var chip = el("span","dchip");
    chip.appendChild(el("span", null, drillLabel(S.drill)));
    var dx = icoBtn(null, "x", "Clear this filter");
    dx.onclick = function(){ S.drill = null; render(); };
    chip.appendChild(dx);
    dr.appendChild(chip);
    headEl.appendChild(dr);
  }
}
function drillLabel(dr){
  var parts = [];
  if(dr.status === "doing") parts.push("In progress");
  else if(dr.status === "open") parts.push("Open");
  if(dr.lens) parts.push(personName(dr.lens) + " + unassigned");
  if(dr.owner === "none") parts.push("Unassigned");
  else if(dr.owner) parts.push(personName(dr.owner));
  if(dr.project === "none") parts.push("No project");
  return parts.join(" · ") || "Filtered";
}
function drillEmpty(){
  var clr = el("button","btn","Clear the filter");
  clr.onclick = function(){ S.drill = null; render(); };
  return emptyBlock("Nothing matches this filter",
    drillLabel(S.drill) + ": nothing fits that right now.", clr);
}

/* ============ render: board ============ */
var dragId = null;
var justDragged = false;

function boardGroups(){
  var tasks = visibleTasks();
  /* one board per set of columns. A space owns a set; tasks filed to a project
     but to no space share the project's own set. */
  var groups = [], byKey = {};
  function bucket(projectId, spaceId){
    var key = (projectId || "~") + "|" + (spaceId || "~");
    if(!byKey[key]){
      byKey[key] = { projectId: projectId, spaceId: spaceId, tasks: [] };
      groups.push(byKey[key]);
    }
    return byKey[key];
  }
  tasks.forEach(function(t){ bucket(t.projectId || null, t.spaceId || null).tasks.push(t); });

  /* a space you're looking at should show even when it holds nothing yet */
  if(S.sel !== "all"){
    if(S.space) bucket(S.sel, S.space);
    else {
      var spaces = spacesOf(S.sel);
      spaces.forEach(function(sp){ bucket(S.sel, sp.id); });
      /* an empty "No space" board is noise once everything is filed */
      if(!spaces.length) bucket(S.sel, null);
    }
  }

  groups.sort(function(a,b){
    var pa = a.projectId ? (projName(a.projectId) || "") : "\uffff";
    var pb = b.projectId ? (projName(b.projectId) || "") : "\uffff";
    if(pa !== pb) return pa.localeCompare(pb);
    var sa = a.spaceId ? (spaceName(a.spaceId) || "") : "";
    var sb = b.spaceId ? (spaceName(b.spaceId) || "") : "";
    return sa.localeCompare(sb);
  });
  return groups;
}

/* Finished long enough ago to fold away. completedAt when there is one; before
   tracking began only updatedAt says anything, and nothing at all means old. */
function doneLongAgo(t, cutoff){
  var at = Date.parse(t.completedAt || t.updatedAt || "");
  return !(at >= cutoff);
}
function boardKey(projectId, spaceId){ return (projectId || "~") + "|" + (spaceId || "~"); }

function boardFor(group){
  var cols = columnsFor(group.projectId, group.spaceId);
  var editable = writable() && !!columnHost(group.projectId, group.spaceId);
  var board = el("div","board");
  /* render() rebuilds every board on every snapshot; the key is how it puts each
     one back where you had it scrolled */
  var bkey = boardKey(group.projectId, group.spaceId);
  board.dataset.key = bkey;
  var doneId = cols.length ? cols[cols.length-1].id : null;
  var cutoff = Date.now() - DONE_KEEP_DAYS * 86400000;

  cols.forEach(function(st){
    var col = el("div","col");
    col.dataset.status = st.id;
    col.dataset.project = group.projectId || "";
    col.dataset.space = group.spaceId || "";

    var ch = el("div","col-head");
    ch.appendChild(el("span","bar"));
    var nm = el("span","nm", st.name);
    if(editable){
      nm.title = "Rename this column";
      nm.style.cursor = "text";
      nm.onclick = function(){
        if(nm.querySelector(".inline-edit")) return;
        inlineEdit(nm, st.name, function(v){
          renameColumn(group.projectId, group.spaceId, st.id, v || st.name);
        });
      };
    }
    ch.appendChild(nm);
    var allInCol = group.tasks.filter(function(t){ return columnOf(t) === st.id; });
    var older = st.id === doneId ? allInCol.filter(function(t){ return doneLongAgo(t, cutoff); }) : [];
    var inCol = older.length && !S.doneOlder[bkey]
      ? allInCol.filter(function(t){ return older.indexOf(t) === -1; }) : allInCol;
    ch.appendChild(el("span","n", String(inCol.length)));
    if(editable && cols.length > 1){
      var del = el("button","colx"); del.appendChild(ico("x","sm"));
      del.title = "Remove this column";
      del.setAttribute("aria-label","Remove the " + st.name + " column");
      del.onclick = function(e){
        e.stopPropagation();
        var moving = allInCol.length;
        askConfirm("Remove the " + st.name + " column?",
          moving ? moving + (moving === 1 ? " card moves" : " cards move") + " to " + cols[0].name + ". Nothing is deleted."
                 : "It's empty, so nothing moves.",
          "Remove column").then(function(ok){
            if(ok) deleteColumn(group.projectId, group.spaceId, st.id);
          });
      };
      ch.appendChild(del);
    }
    col.appendChild(ch);

    var cb = el("div","col-body");
    cb.dataset.status = st.id;
    inCol.forEach(function(t){ cb.appendChild(taskCard(t)); });
    if(older.length){
      var showing = !!S.doneOlder[bkey];
      var tog = el("button","doneolder", (showing ? "Hide " : "Show ") + older.length + " older");
      tog.title = "Finished more than " + DONE_KEEP_DAYS + " days ago";
      tog.setAttribute("aria-expanded", showing ? "true" : "false");
      tog.onclick = function(){ S.doneOlder[bkey] = !showing; render(); };
      cb.appendChild(tog);
    }
    col.appendChild(cb);

    if(writable()){
      var ckey = (group.projectId || "~") + "|" + (group.spaceId || "~") + "|" + st.id;
      var cf = el("div","col-foot");
      var inp = document.createElement("input");
      inp.className = "addtask";
      inp.type = "text";
      inp.placeholder = "Add a task";
      inp.setAttribute("aria-label","Add a task to " + st.name);
      if(S.composing.col === ckey) inp.value = S.composing.text;
      inp.oninput = function(){ S.composing = {col: ckey, text: inp.value}; };
      inp.onfocus = function(){ S.composing.col = ckey; };
      inp.onkeydown = function(e){
        if(e.key === "Enter"){
          var v = inp.value.trim();
          if(v){
            createTask(v, st.id, group.projectId, group.spaceId);
            inp.value = "";
            S.composing = {col: ckey, text: ""};
          }
        } else if(e.key === "Escape"){
          inp.value = ""; S.composing = {col:null, text:""}; inp.blur();
        }
      };
      cf.appendChild(inp);
      col.appendChild(cf);
    }

    board.appendChild(col);
  });

  if(editable){
    var addc = el("button","coladd","+ Column");
    addc.onclick = function(){ addColumn(group.projectId, group.spaceId, "New column"); };
    board.appendChild(addc);
  }
  return board;
}

function renderBoard(){
  var groups = boardGroups();

  /* one space selected: just its board, no heading, it's the page title */
  if(S.sel !== "all" && S.space){
    bodyEl.appendChild(boardFor(groups[0] || { projectId: S.sel, spaceId: S.space, tasks: [] }));
    return;
  }

  if(!groups.length && S.sel === "all" && S.drill && !S.q){
    bodyEl.appendChild(drillEmpty());
    return;
  }
  if(!groups.length){
    bodyEl.appendChild(emptyBlock(
      S.q ? "Nothing matches that" : "Nothing on the board",
      S.q ? "Try a different word, or clear the filter."
          : "Type in a column to add your first task, then drag it across as it moves.",
      null
    ));
    return;
  }

  var onAll = S.sel === "all";
  groups.forEach(function(g){
    var sec = el("div","bgroup");
    var h = el("h4",null);
    var label = onAll
      ? (g.projectId ? (projName(g.projectId) || "Untitled project") : "No project")
      : (g.spaceId ? (spaceName(g.spaceId) || "Untitled space") : "No space");
    if(onAll && g.spaceId){
      h.appendChild(el("span","bg-proj", label));
      h.appendChild(el("span","bg-sep", "\u203a"));

/* Pointer-based dragging. HTML5 drag-and-drop does nothing on touch, so
   cards move by pointer events instead: drag the grip on any device, or
   drag the card body with a mouse. */
var drag = null;

function attachDrag(card, grip, t){
  grip.addEventListener("pointerdown", function(e){ startDrag(e, card, t, true); });
  card.addEventListener("pointerdown", function(e){
    if(e.pointerType !== "mouse") return;          // touch drags via the grip only
    if(e.target.closest(".grip")) return;
    startDrag(e, card, t, false);
  });
}

function startDrag(e, card, t, immediate){
  if(!writable()) return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  var pid = e.pointerId;
  var sx = e.clientX, sy = e.clientY;
  var began = false;

  function begin(){
    began = true;
    var r = card.getBoundingClientRect();
    var ghost = card.cloneNode(true);
    var g = ghost.querySelector(".grip");
    if(g) g.remove();
    ghost.className = "card dragghost";
    ghost.style.width = r.width + "px";
    var home = card.closest(".board");
    drag = { id: t.id, card: card, ghost: ghost, ox: sx - r.left, oy: sy - r.top, col: null,
             board: home, boardKey: home ? home.dataset.key : null };
    document.body.appendChild(ghost);
    moveGhost(sx, sy);
    card.classList.add("dragging");
    document.body.classList.add("dragging-now");
    if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(err){} }
  }
  function moveGhost(x, y){
    drag.ghost.style.left = (x - drag.ox) + "px";
    drag.ghost.style.top  = (y - drag.oy) + "px";
  }
  function onMove(ev){
    if(ev.pointerId !== pid) return;
    if(!began){
      if(Math.abs(ev.clientX-sx) + Math.abs(ev.clientY-sy) < 7) return;
      begin();
    }
    ev.preventDefault();
    moveGhost(ev.clientX, ev.clientY);
    var col = columnAt(ev.clientX, ev.clientY);
    if(drag.col && drag.col !== col) drag.col.classList.remove("over");
    drag.col = col;
    if(col) col.classList.add("over");
    autoPan(ev.clientX, col ? col.closest(".board") : null);
  }
  function onUp(ev){
    if(ev.pointerId !== pid) return;
    cleanup();
    if(!began) return;
    justDragged = true;
    setTimeout(function(){ justDragged = false; }, 120);
    var col = columnAt(ev.clientX, ev.clientY);
    if(col){
      var body = col.querySelector(".col-body");
      dropOn(t.id, col, ev.clientY, body);
    }
  }
  function cleanup(){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    clearTimeout(panT);
    if(!began) return;
    if(drag){
      if(drag.col) drag.col.classList.remove("over");
      if(drag.ghost) drag.ghost.remove();
      drag.card.classList.remove("dragging");
      drag = null;
    }
    document.body.classList.remove("dragging-now");
  }

  document.addEventListener("pointermove", onMove, {passive:false});
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
  if(immediate){ e.preventDefault(); begin(); }
}

function columnAt(x, y){
  if(drag && drag.ghost) drag.ghost.style.pointerEvents = "none";
  var n = document.elementFromPoint(x, y);
  return n && n.closest ? n.closest(".col") : null;
}

/* Nudge a board sideways when a card is dragged to its edge. It has to be the
   board under the finger, else the one the card came from — the first .board on
   the page is the wrong one on All projects or a project's All tab, where every
   space has its own, and off-screen columns there were unreachable on a phone. */
var panT = null;
function autoPan(x, over){
  if(!drag) return;
  var board = over || drag.board;
  /* a live update mid-drag rebuilds the boards; find ours again by its key */
  if(board && !board.isConnected && drag.boardKey){
    board = bodyEl.querySelector('.board[data-key="' + drag.boardKey + '"]');
    drag.board = board;
  }
  if(!board) return;
  clearTimeout(panT);
  var r = board.getBoundingClientRect();
  var d = 0;
  if(x > r.right - 56) d = 16;
  else if(x < r.left + 56) d = -16;
  if(!d) return;
  board.scrollLeft += d;
  panT = setTimeout(function(){ autoPan(x, board); }, 16);
}

function dropOn(id, col, clientY, colBody){
  var task = null;
  for(var i=0;i<S.tasks.length;i++) if(S.tasks[i].id === id) task = S.tasks[i];
  if(!task) return;

  var status = col.dataset.status;
  var projectId = col.dataset.project || null;
  var spaceId = col.dataset.space || null;

  /* Neighbours are the cards actually drawn, in drawn order. Taken from
     visibleTasks() instead, anything not on screen — finished work folded away,
     a task whose status matches no column — shifted every index after it. */
  var cards = [], siblings = [];
  Array.prototype.forEach.call(colBody.querySelectorAll(".card"), function(c){
    if(c.dataset.id === id) return;
    for(var k=0;k<S.tasks.length;k++){
      if(S.tasks[k].id === c.dataset.id){ cards.push(c); siblings.push(S.tasks[k]); return; }
    }
  });

  var idx = cards.length;
  for(var j=0;j<cards.length;j++){
    var r = cards[j].getBoundingClientRect();
    if(clientY < r.top + r.height/2){ idx = j; break; }
  }
  var before = idx > 0 ? siblings[idx-1] : null;
  var after  = idx < siblings.length ? siblings[idx] : null;
  var order;
  if(before && after) order = ((before.order||0) + (after.order||0)) / 2;
  else if(before)     order = (before.order||0) + 1;
  else if(after)      order = (after.order||0) - 1;
  else                order = 1;

  var moved = (task.projectId || null) !== projectId || (task.spaceId || null) !== spaceId;
  if(!moved && task.status === status && task.order === order) return;
  patchTask(id, moved
    ? { status: status, order: order, projectId: projectId, spaceId: spaceId }
    : { status: status, order: order });
}



/* ============ render: list ============ */
function renderList(){
  var tasks = visibleTasks();
  if(!tasks.length && S.sel === "all" && S.drill && !S.q){
    bodyEl.appendChild(drillEmpty());
    return;
  }
  if(!tasks.length){
    bodyEl.appendChild(emptyBlock(
      S.q ? "Nothing matches that" : "No tasks here yet",
      S.q ? "Try a different word, or clear the filter."
          : "Switch to the board to add one, or add it from any column.",
      null
    ));
    return;
  }
  var tbl = el("table","list");
  var thead = document.createElement("thead");
  var tr = document.createElement("tr");
  [["", "c-check"], ["Task",""], ["Status","c-st"], ["Due","c-due"], ["Owner","c-who"], ["","c-x"]]
    .forEach(function(h){
      var th = document.createElement("th");
      th.className = h[1];
      th.textContent = h[0];
      tr.appendChild(th);
    });
  thead.appendChild(tr);
  tbl.appendChild(thead);

  /* `order` is a per-column float, meaningless across columns or projects, so
     on its own it made a cross-project list look shuffled: open before done,
     then soonest due (undated last), then project, and only then order. */
  var multi = S.sel === "all";
  tasks.sort(function(a, b){
    var da = taskDone(a), db = taskDone(b);
    if(da !== db) return da ? 1 : -1;
    var ad = a.due || "9999-99-99", bd = b.due || "9999-99-99";
    if(ad !== bd) return ad < bd ? -1 : 1;
    if(multi){
      var pa = a.projectId ? (projName(a.projectId) || "") : "￿";
      var pb = b.projectId ? (projName(b.projectId) || "") : "￿";
      if(pa !== pb) return pa.localeCompare(pb);
    }
    return (a.order||0) - (b.order||0);
  });
  /* finished work folds away after a fortnight, as on the board */
  var lkey = "list:" + S.sel + "|" + (S.space || "~");
  var cutoff = Date.now() - DONE_KEEP_DAYS * 86400000;
  var older = tasks.filter(function(t){ return taskDone(t) && doneLongAgo(t, cutoff); });
  var shown = older.length && !S.doneOlder[lkey]
    ? tasks.filter(function(t){ return older.indexOf(t) === -1; }) : tasks;

  var tb = document.createElement("tbody");
  shown.forEach(function(t){ tb.appendChild(listRow(t)); });
  tbl.appendChild(tb);
  bodyEl.appendChild(tbl);

  if(older.length){
    var showing = !!S.doneOlder[lkey];
    var more = el("button","doneolder listmore",
      (showing ? "Hide " : "Show ") + older.length + " finished more than " + DONE_KEEP_DAYS + " days ago");
    more.setAttribute("aria-expanded", showing ? "true" : "false");
    more.onclick = function(){ S.doneOlder[lkey] = !showing; render(); };
    bodyEl.appendChild(more);
  }
}

/* ============ notifications menu ============ */
/* The subscribe end of the push briefs. Two iOS rules shape all of this:
   web push only works once the app is launched from a home-screen icon, and
   the permission prompt must come from inside a tap — so the request lives in
   the Enable button's handler, never on load. */
var nmenu = $("#nmenu");
var bellBtn = $("#bell");

function b64ToU8(b64){
  var pad = "=".repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  var out = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
function isIOS(){
  return /iP(hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isStandalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
    navigator.standalone === true;
}
function pushSupported(){
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

/* tint the bell when this device is subscribed */
function paintBell(){
  if(!pushSupported()) return;
  navigator.serviceWorker.getRegistration().then(function(reg){
    return reg ? reg.pushManager.getSubscription() : null;
  }).then(function(sub){
    bellBtn.classList.toggle("on", !!sub);
  }).catch(function(){});
}

function paintNotif(body){
  body.textContent = "";
  function say(t){ body.appendChild(el("p", null, t)); }

  if(!window.SLATE_CONFIG || !window.SLATE_CONFIG.vapidPublicKey){
    say("Push isn't configured yet — vapidPublicKey is missing from config.js.");
    return;
  }
  if(isIOS() && !isStandalone()){
    say("On an iPhone or iPad, notifications only work once Slate is installed: " +
        "Share → Add to Home Screen, then open it from the icon and come back here.");
    return;
  }
  if(!pushSupported()){
    say("This browser can't receive web push notifications.");
    return;
  }
  if(Notification.permission === "denied"){
    say("Notifications are blocked for Slate in this browser's settings. Allow them there, then try again.");
    return;
  }

  say("Checking this device…");
  /* serviceWorker.ready resolves when a worker takes control and otherwise never
     settles at all — it has no rejection path. If registration failed, waiting on
     it alone leaves this menu on "Checking…" for good, so race it against a clock. */
  Promise.race([
    navigator.serviceWorker.ready,
    new Promise(function(_, reject){
      setTimeout(function(){ reject(new Error("service worker never became ready")); }, 8000);
    })
  ]).then(function(reg){
    return reg.pushManager.getSubscription().then(function(sub){ return { reg: reg, sub: sub }; });
  }).then(function(got){
    body.textContent = "";
    var row = el("div","nrow");

    if(got.sub){
      say("This device gets the morning brief and the day wrap, weekdays only.");
      var test = el("button","btn","Send a test");
      test.onclick = function(){
        test.disabled = true;
        SlateStore.use("push").then(function(push){ return push.test(); })
          .then(function(res){
            /* "nothing sent" and "sending failed" are different problems and the
               whole point of this button is telling them apart. */
            if(res.sent) toast("Test sent — check the notification.");
            else if(res.failed) toast("The push service rejected it — see the Vercel logs.");
            else if(res.pruned) toast("This device's subscription had expired. Turn notifications off and on again.");
            else toast("Nothing sent — no devices enabled for you yet.");
          })
          .catch(function(e){ toast(e.message || "That didn't work."); })
          .then(function(){ test.disabled = false; });
      };
      var off = el("button","btn","Turn off");
      off.onclick = function(){
        off.disabled = true;
        var endpoint = got.sub.endpoint;
        got.sub.unsubscribe().then(function(){
          return SlateStore.use("push").then(function(push){ return push.unsubscribe(endpoint); });
        }).then(function(){
          toast("Notifications are off for this device.");
          paintBell();
          paintNotif(body);
        }).catch(function(e){
          toast(e.message || "That didn't work.");
          off.disabled = false;
        });
      };
      row.appendChild(test);
      row.appendChild(off);
    } else {
      say("Two pushes a day on this device: the morning brief and the day wrap, weekdays only.");
      var on = el("button","btn primary","Enable on this device");
      on.onclick = function(){
        on.disabled = true;
        on.textContent = "Enabling…";
        Notification.requestPermission().then(function(perm){
          if(perm !== "granted") throw new Error("Notifications weren't allowed.");
          return got.reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: b64ToU8(window.SLATE_CONFIG.vapidPublicKey)
          });
        }).then(function(sub){
          return SlateStore.use("push").then(function(push){ return push.subscribe(sub.toJSON()); });
        }).then(function(){
          toast("Notifications are on for this device.");
          paintBell();
          paintNotif(body);
        }).catch(function(e){
          toast(e.message || "That didn't work.");
          paintNotif(body);
        });
      };
      row.appendChild(on);
    }
    body.appendChild(row);
  }).catch(function(){
    body.textContent = "";
    say(window.__slateSwError
      ? "The service worker didn't install: " + window.__slateSwError +
        " Notifications can't work until that does."
      : "The service worker didn't start, so notifications can't be set up yet. " +
        "Close Slate completely, open it again from the home screen icon, and try once more.");
  });
}

function openNotifMenu(){
  nmenu.textContent = "";
  var r = bellBtn.getBoundingClientRect();
  var w = Math.min(window.innerWidth * 0.88, 290);
  nmenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 10)) + "px";
  nmenu.style.top = (r.bottom + window.scrollY + 6) + "px";
  nmenu.appendChild(el("h4", null, "Notification briefs"));
  var body = el("div");
  nmenu.appendChild(body);
  nmenu.classList.add("on");
  paintNotif(body);
  setTimeout(function(){ document.addEventListener("mousedown", outsideNotif); }, 0);
}
function outsideNotif(e){
  if(!nmenu.contains(e.target) && !bellBtn.contains(e.target)) closeNotifMenu();
}
function closeNotifMenu(){
  nmenu.classList.remove("on");
  document.removeEventListener("mousedown", outsideNotif);
}
bellBtn.onclick = function(){

/* ============ account menu: appearance and sign out ============ */
/* Theme and accent are chosen per device — the two of you needn't agree. The
   neutral base is fixed for legibility; the accent is taste. Each entry carries
   its swatch for both themes so the menu shows the colour as it will look now.
   The CSS for each accent lives in the token block under [data-accent]. */
var ACCENTS = [
  { id:"cobalt",   label:"Cobalt",   light:"#2F5FD9", dark:"#3E68E0" },
  { id:"violet",   label:"Violet",   light:"#6A45D6", dark:"#7856E6" },
  { id:"teal",     label:"Teal",     light:"#0E7780", dark:"#0E7C86" },
  { id:"ember",    label:"Ember",    light:"#C2410C", dark:"#C2440F" },
  { id:"rose",     label:"Rose",     light:"#C0265E", dark:"#CC3068" },
  { id:"forest",   label:"Forest",   light:"#1B7A45", dark:"#1C7D47" },
  { id:"graphite", label:"Graphite", light:"#3D4350", dark:"#687080" }
];
var DEFAULT_ACCENT = ACCENTS[0].id;
var umenu = $("#umenu"), whoBtn = $("#whoami");

function effectiveDark(){
  var t = document.documentElement.getAttribute("data-theme");
  if(t === "dark") return true;
  if(t === "light") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyAppearance(){
  var d = document.documentElement;
  var t = prefGet("theme", "system"), a = prefGet("accent", DEFAULT_ACCENT);
  if(t === "light" || t === "dark") d.setAttribute("data-theme", t); else d.removeAttribute("data-theme");
  if(a && a !== DEFAULT_ACCENT) d.setAttribute("data-accent", a); else d.removeAttribute("data-accent");
  /* iOS tints the status bar from theme-color, and the two tags in <head> are
     gated on the SYSTEM scheme — so a forced theme has to overwrite both or the
     bar keeps the system's colour above a page in the other one. */
  var paper = getComputedStyle(d).getPropertyValue("--paper").trim();
  Array.prototype.forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function(m){
    if(!m.dataset.base) m.dataset.base = m.getAttribute("content");
    m.setAttribute("content", (t === "light" || t === "dark") ? paper : m.dataset.base);
  });
}

/* Signing out doesn't delete unsynced writes — the outbox keeps them on this
   device, tagged with who made them, and replays them when that person signs in
   here again. But it does stop them sending until then, so say so first. */
function signOutGuarded(){
  closeUserMenu();

  if(!n){ SlateStore.signOut(); return; }
  askConfirm(n + " change" + (n === 1 ? " hasn't" : "s haven't") + " synced yet",

/* The Today page calls this with the task alone (and forEach hands it an index
   as the second argument, hence the type check); the dashboard passes options:
     todayS    judge lateness against the Denver date, not this device's clock
     lateDays  add "4d late" to a late task
     noDue     leave the date off where a heading already says it
     col       name the column of a task that's underway ("Review")
     time      a clock time, for finished work
     avatar    a uid whose avatar sits at the row's end
     assign    an owner button instead, for triaging unassigned work in place */
function dashTaskRow(t, o){
  if(!o || typeof o !== "object") o = {};
  var done = taskDone(t);
  var row = el("div","drow");

  var tick = el("button","dtick" + (done ? " on" : "")); tick.appendChild(ico("check","sm"));
  tick.setAttribute("aria-label", (done ? "Not done after all: " : "Mark done: ") + (t.title || "Untitled"));
  tick.disabled = !writable();
  tick.onclick = function(e){
    e.stopPropagation();
    patchTask(t.id, { status: taskDone(t) ? firstColumnId(t.projectId, t.spaceId) : doneColumnId(t.projectId, t.spaceId) });
  };
  row.appendChild(tick);

  var main = el("button","dmain");
  main.appendChild(el("span","dt", t.title || "Untitled"));
  var meta = el("span","dmeta");
  var pn = t.projectId && projName(t.projectId);
  if(pn) meta.appendChild(projChip(t.projectId, pn));
  var sn = t.spaceId && spaceName(t.spaceId);
  if(sn) meta.appendChild(el("span","chip", sn));
  if(o.col && taskUnderway(t)) meta.appendChild(el("span","chip", columnName(t.projectId, t.spaceId, columnOf(t))));
  if(t.due && !o.noDue){
    var late = !done && (o.todayS ? t.due < o.todayS : isLate(t.due, ""));
    meta.appendChild(el("span","ddue" + (late ? " late" : ""), fmtDate(t.due)));
    if(late && o.lateDays && o.todayS) meta.appendChild(el("span","ddue late", daysBetween(t.due, o.todayS) + "d late"));
  }
  if(o.time) meta.appendChild(el("span","dtime", o.time));
  if(meta.childNodes.length) main.appendChild(meta);
  main.onclick = function(){ openTask(t.id); };
  row.appendChild(main);

  if(o.assign && writable()){
    var ab = el("button","dassign"); ab.appendChild(ico("plus"));
    ab.setAttribute("aria-label","Give “" + (t.title || "Untitled") + "” an owner");
    ab.title = "Give it an owner";
    ab.onclick = function(e){ e.stopPropagation(); openAssignee(ab, t); };
    row.appendChild(ab);
  } else if(o.avatar){
    var im = document.createElement("img");
    im.className = "dwho"; im.alt = "";
    im.dataset.uid = o.avatar; im.dataset.kind = "avatar";
    row.appendChild(im);
  }
  return row;
}

/* The page the notification briefs deep-link into. It renders the same models
   the push text is built from (lib/brief.js), so what the phone said matches
   what this page shows — the notification is the digest, this is the detail. */
function fillGroupedCard(card, groups, emptyText){
  var list = card.querySelector(".dlist");
  var any = false;
  groups.forEach(function(g){
    g.spaces.forEach(function(b){
      any = true;
      list.appendChild(el("div","dgroup", g.name + (b.name ? " → " + b.name : "")));
      b.tasks.forEach(function(t){ list.appendChild(dashTaskRow(t)); });
    });

  return card;
}

/* Filtering only the view you happen to be on hides the thing you're looking
   for whenever it lives somewhere else, which for a capture-first tool is most
   of the time. A query searches everything and says where each hit lives. */
function searchAll(q){
  var lq = q.toLowerCase();
  function hit(){
    for(var i=0;i<arguments.length;i++){
      if(String(arguments[i] || "").toLowerCase().indexOf(lq) > -1) return true;
    }
    return false;
  }
  return {
    notes: S.notes.filter(function(n){ return hit(n.title, n.body); })
      .sort(function(a,b){ return String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")); }),
    tasks: S.tasks.filter(function(t){ return hit(t.title, t.notes); }),
    prospects: S.prospects.filter(function(p){ return hit(p.company, p.contact, p.email, p.note); }),
    projects: S.projects.filter(function(p){ return hit(p.name, p.contact, p.email, p.website, p.phone); })
  };
}

function searchSection(title, rows){

      o.value = st.id; o.textContent = st.label;
      if((p.stage || "lead") === st.id) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function(){
      if(sel.value === "won"){ sel.value = p.stage || "lead"; convertProspect(p.id); return; }
      patchProspect(p.id, { stage: sel.value });
    };
    row.appendChild(sel);

    var x = el("button","rowx"); x.appendChild(ico("x","sm"));
    x.title = "Remove prospect";
    x.setAttribute("aria-label","Remove prospect");
    x.onclick = function(e){
      e.stopPropagation();
      askConfirm("Remove " + (p.company || "this prospect") + "?",
        "They disappear from the pipeline. Nothing else changes.",
        "Remove").then(function(ok){ if(ok) deleteProspect(p.id); });
    };
    row.appendChild(x);
  }
  return row;
}

function renderProspects(){
  var all = S.prospects.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
  var q = S.q.toLowerCase();
  if(q){
    all = all.filter(function(p){
      return ((String(p.company||"") + " " + String(p.contact||"") + " " + String(p.note||"")).toLowerCase()).indexOf(q) > -1;

  if(writable()){

    rows.forEach(function(p){ sec.appendChild(prospectRow(p)); });
    bodyEl.appendChild(sec);
  });
