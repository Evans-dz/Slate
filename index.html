<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202329" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Slate">
<meta name="format-detection" content="telephone=no">
<title>Slate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
<script>
/* Theme and accent are per device (each of you picks your own), and must be on
   <html> before the first paint or the page flashes the wrong theme on every
   open. Kept tiny and inline for that reason; applyAppearance() owns it after. */
(function(){
  try{
    var d = document.documentElement;
    var t = localStorage.getItem("slate:theme"), a = localStorage.getItem("slate:accent");
    if(t === "light" || t === "dark") d.setAttribute("data-theme", t);
    if(a) d.setAttribute("data-accent", a);
  }catch(e){}
})();
</script>
<style>
:root{
  color-scheme:light;
  /* Colour system: "Slate Crisp". Cool neutral greys so white cards read clearly
     on a grey page; every text/background pair is checked by
     tools/validate-colours.js (ink >= 7:1, muted >= 4.5:1, borders >= 1.5:1,
     controls >= 3:1). Change a value here and re-run it. */
  /* surfaces */
  --paper:#F4F5F7; --panel:#FFFFFF; --panel-2:#EFF1F4; --raised:#FFFFFF; --sunken:#EFF1F4;
  --note:#FBF7EC; --note-edge:#D6C79B;
  /* text: ink for reading, ink-2 secondary, muted for meta, faint for hints only */
  --ink:#1B1E24; --ink-2:#3F4552; --muted:#5C6371; --faint:#838A97;
  /* lines: soft for dividers, line for cards and columns, strong for controls you have to find */
  --line:#C6CCD5; --line-soft:#E3E6EB; --line-strong:#868D9A;
  /* accent: raw values for the default (Cobalt); [data-accent] swaps the raw set,
     and each theme block maps --accent* onto its -l or -d half */
  --acc-l:#2F5FD9; --acc-ink-l:#2449B8; --acc-soft-l:#E8EEFD; --on-acc-l:#FFFFFF;
  --acc-d:#3E68E0; --acc-ink-d:#A3B8FF; --acc-soft-d:#263355; --on-acc-d:#FFFFFF;
  --accent:var(--acc-l); --accent-ink:var(--acc-ink-l); --accent-soft:var(--acc-soft-l); --on-accent:var(--on-acc-l);
  /* status — always paired with an icon or a label, never colour alone */
  --danger:#C42B2B; --danger-soft:#FDECEC; --on-danger:#FFFFFF;
  --good:#177A41; --good-soft:#E4F4EA; --warn:#965A00; --warn-soft:#FDF0DB;
  /* docs */
  --mark:#FFE58A; --code-bg:#F1F3F6; --quote-bar:#868D9A;
  /* charts: deliberately NOT the accent, so a chart looks the same on both of your
     devices whatever accent each of you picked. One validated blue ramp for
     not started -> in progress -> done, plus eight categorical slots. The ramp's
     pale end is stepped so it clears 2:1 on every surface a bar can sit on
     (paper, panel, sunken, raised) in both themes — check with the dataviz
     validator's --ordinal mode against each surface if you move it. */
  --viz-1:#2A78D6; --viz-1-soft:rgba(42,120,214,.12); --viz-todo:#6DA7EC; --viz-done:#104281;
  --chart-1:#2E62C9; --chart-2:#A74A04; --chart-3:#AE4090; --chart-4:#40A138;
  --chart-5:#067396; --chart-6:#AC7809; --chart-7:#7F62D5; --chart-8:#129E8E; --chart-other:#868D9A;
  /* aliases: declared once here, they resolve against whichever theme is active */
  --viz-doing:var(--viz-1); --viz-grid:var(--line-soft); --viz-axis:var(--line);
  --viz-untracked:var(--line-soft); --crit:var(--danger);
  /* project colours: projectColor() supplies an OKLCH hue and chroma, the theme
     supplies lightness — so every project is equally bright, and a theme switch
     repaints them with no re-render */
  --ph-l:0.56; --ph-ink-l:0.44; --ph-soft-l:0.945;
  /* depth */
  --scrim:rgba(17,20,26,.40);
  --shadow:0 1px 1px rgba(17,20,26,.04), 0 2px 6px rgba(17,20,26,.06);
  --shadow-md:0 10px 26px rgba(17,20,26,.14);
  --shadow-lg:0 18px 44px rgba(17,20,26,.22);
  --radius:5px;
  --ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1A1C20; --panel:#202329; --panel-2:#2B2F37; --raised:#272B32; --sunken:#1C1E23;
    --note:#2A2822; --note-edge:#4A4536;
    --ink:#E8EAEE; --ink-2:#C5CAD3; --muted:#9CA3AF; --faint:#767D8A;
    --line:#444A55; --line-soft:#2E3239; --line-strong:#737A87;
    --accent:var(--acc-d); --accent-ink:var(--acc-ink-d); --accent-soft:var(--acc-soft-d); --on-accent:var(--on-acc-d);
    --danger:#F2857A; --danger-soft:#3B2426; --on-danger:#1A1C20;
    --good:#52C48C; --good-soft:#1B3328; --warn:#E3A342; --warn-soft:#3A2E1A;
    --mark:#574710; --code-bg:#1C1E23; --quote-bar:#737A87;
    --viz-1:#3987E5; --viz-1-soft:rgba(57,135,229,.18); --viz-todo:#1C5CAB; --viz-done:#9EC5F4;
    --chart-1:#3F75DD; --chart-2:#C05708; --chart-3:#B84999; --chart-4:#4CAD43;
    --chart-5:#059BC9; --chart-6:#B88213; --chart-7:#987CF2; --chart-8:#0F9485; --chart-other:#737A87;
    --ph-l:0.68; --ph-ink-l:0.82; --ph-soft-l:0.31;
    --scrim:rgba(6,8,11,.58);
    --shadow:0 1px 1px rgba(0,0,0,.24), 0 2px 8px rgba(0,0,0,.24);
    --shadow-md:0 10px 28px rgba(0,0,0,.42);
    --shadow-lg:0 18px 48px rgba(0,0,0,.52);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1A1C20; --panel:#202329; --panel-2:#2B2F37; --raised:#272B32; --sunken:#1C1E23;
  --note:#2A2822; --note-edge:#4A4536;
  --ink:#E8EAEE; --ink-2:#C5CAD3; --muted:#9CA3AF; --faint:#767D8A;
  --line:#444A55; --line-soft:#2E3239; --line-strong:#737A87;
  --accent:var(--acc-d); --accent-ink:var(--acc-ink-d); --accent-soft:var(--acc-soft-d); --on-accent:var(--on-acc-d);
  --danger:#F2857A; --danger-soft:#3B2426; --on-danger:#1A1C20;
  --good:#52C48C; --good-soft:#1B3328; --warn:#E3A342; --warn-soft:#3A2E1A;
  --mark:#574710; --code-bg:#1C1E23; --quote-bar:#737A87;
  --viz-1:#3987E5; --viz-1-soft:rgba(57,135,229,.18); --viz-todo:#1C5CAB; --viz-done:#9EC5F4;
  --chart-1:#3F75DD; --chart-2:#C05708; --chart-3:#B84999; --chart-4:#4CAD43;
  --chart-5:#059BC9; --chart-6:#B88213; --chart-7:#987CF2; --chart-8:#0F9485; --chart-other:#737A87;
  --ph-l:0.68; --ph-ink-l:0.82; --ph-soft-l:0.31;
  --scrim:rgba(6,8,11,.58);
  --shadow:0 1px 1px rgba(0,0,0,.24), 0 2px 8px rgba(0,0,0,.24);
  --shadow-md:0 10px 28px rgba(0,0,0,.42);
  --shadow-lg:0 18px 48px rgba(0,0,0,.52);
}
/* selectable accents (account menu): raw values only — the theme blocks map them */
:root[data-accent="violet"]{
  --acc-l:#6A45D6; --acc-ink-l:#5733C0; --acc-soft-l:#EFEAFD; --on-acc-l:#FFFFFF;
  --acc-d:#7856E6; --acc-ink-d:#C3B3FF; --acc-soft-d:#2F2852; --on-acc-d:#FFFFFF;
}
:root[data-accent="teal"]{
  --acc-l:#0E7780; --acc-ink-l:#0B636B; --acc-soft-l:#DFF2F3; --on-acc-l:#FFFFFF;
  --acc-d:#0E7C86; --acc-ink-d:#6FD2DA; --acc-soft-d:#17363A; --on-acc-d:#FFFFFF;
}
:root[data-accent="ember"]{
  /* amber-leaning, so an Ember accent never reads as --danger beside a late date */
  --acc-l:#A85A0A; --acc-ink-l:#8F4A0A; --acc-soft-l:#FEF1E1; --on-acc-l:#FFFFFF;
  --acc-d:#B45309; --acc-ink-d:#FCC27A; --acc-soft-d:#3D2A1A; --on-acc-d:#FFFFFF;
}
:root[data-accent="rose"]{
  --acc-l:#B3196E; --acc-ink-l:#9A1560; --acc-soft-l:#FCE7EF; --on-acc-l:#FFFFFF;
  --acc-d:#CC3068; --acc-ink-d:#FFA3C3; --acc-soft-d:#3F2231; --on-acc-d:#FFFFFF;
}
:root[data-accent="forest"]{
  --acc-l:#1B7A45; --acc-ink-l:#16673A; --acc-soft-l:#E3F3E9; --on-acc-l:#FFFFFF;
  --acc-d:#1C7D47; --acc-ink-d:#7ED6A3; --acc-soft-d:#1B3427; --on-acc-d:#FFFFFF;
}
:root[data-accent="graphite"]{
  --acc-l:#3D4350; --acc-ink-l:#2F3440; --acc-soft-l:#ECEEF2; --on-acc-l:#FFFFFF;
  --acc-d:#687080; --acc-ink-d:#D3D8E0; --acc-soft-d:#31353D; --on-acc-d:#FFFFFF;
}

*{box-sizing:border-box}
/* the sprite's icons: stroked in the colour of the text they sit beside */
.ico{
  width:18px;height:18px;flex:0 0 auto;display:block;
  fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.ico.sm{width:15px;height:15px}
.ico.lg{width:22px;height:22px}
/* the few glyphs made of dots fill rather than stroke */
.ico.dots{fill:currentColor;stroke:none}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:3px}
::selection{background:var(--accent-soft);color:var(--ink)}
::placeholder{color:var(--faint);opacity:1}

/* touch devices: never hide an action behind hover */
@media (hover:none){
  .rowx,.blkcopy,.spacex,.col-head .colx,.projtitle .pinfo{opacity:1 !important}
}

/* ---------- shell ---------- */
#shell{
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  /* landscape on a notched phone: keep the rail and bar out of the cutout */
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}

#topbar{
  display:flex;align-items:center;gap:14px;
  padding:0 16px;height:52px;flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .mark{
  width:15px;height:15px;border-radius:2px;
  background:var(--accent);flex:0 0 auto;align-self:center;
  transform:rotate(-8deg);
}
.brand .word{font-size:15px}
.brand .sub{font-size:12px;color:var(--muted);font-weight:400}
#railToggle{display:none}

#search{
  /* min-width:0 — an input's intrinsic width is ~20 characters, which pushed the
     top bar past a 320px screen and made the whole page scroll sideways */
  flex:1;min-width:0;max-width:340px;margin-left:auto;
  border:1px solid var(--line-strong);background:var(--paper);
  border-radius:var(--radius);padding:6px 10px;font-size:13px;
}
#search:focus{border-color:var(--accent);outline:none}
#whoami{display:flex;align-items:center;gap:7px;flex:0 0 auto}
#whoami img{width:24px;height:24px;border-radius:50%;display:block}
#whoami .nm{font-size:13px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#body{display:grid;grid-template-columns:224px minmax(0,1fr);flex:1 1 auto;min-height:0}

/* base rule must precede the 860px block, or the scrim becomes a grid item and
   displaces the rail and main pane on every desktop width */
#railScrim{display:none}

/* ---------- rail ---------- */
#rail{
  border-right:1px solid var(--line);
  background:var(--panel);
  padding:14px 0 28px;
  overflow-y:auto;
}
.rail-sec{margin-bottom:22px}
.rail-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 6px;font-size:12px;color:var(--muted);letter-spacing:.01em;
}
.rail-head button{color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;border-radius:3px}
.rail-head button:hover{color:var(--accent-ink);background:var(--accent-soft)}
.rail-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:5px 14px;font-size:13.5px;text-align:left;
  border-left:2px solid transparent;color:var(--ink);
}
.rail-item:hover{background:var(--panel-2)}
.rail-item.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
.rail-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
.rail-item .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.rail-item .ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-empty{padding:2px 14px 0;font-size:12.5px;color:var(--muted)}

/* ---------- main ---------- */
#main{min-width:0;display:flex;flex-direction:column}
#mainhead{padding:20px 22px 0;flex:0 0 auto}
.title-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.projtitle{
  display:flex;align-items:center;gap:9px;text-align:left;max-width:100%;
  font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.2;
  padding:2px 6px;margin:-2px -6px;border-radius:4px;
}
.projtitle.plain{cursor:default}
.projtitle .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projtitle .pdot{
  width:11px;height:11px;border-radius:3px;flex:0 0 auto;
  transform:rotate(-8deg);
}
.projtitle .pinfo{
  font-size:11.5px;font-weight:400;letter-spacing:0;color:var(--muted);
  border:1px solid var(--line);border-radius:9px;padding:1px 8px;
  flex:0 0 auto;opacity:0;transition:opacity .12s ease;
}
.projtitle:hover{background:var(--line-soft)}
.projtitle:hover .pinfo,.projtitle:focus-visible .pinfo{opacity:1}
#tkNote{align-self:flex-start;margin:2px 0 10px;font-size:12.5px}
.triage{
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--note-edge);
}
.triage select{
  border:1px solid var(--line-strong);background:var(--panel);
  border-radius:3px;padding:4px 7px;font-size:12px;font-family:var(--ui);
  max-width:100%;
}
.triage select:focus{border-color:var(--accent);outline:none}
.triage .btn{padding:4px 10px;font-size:12px}
.pmeta-line{
  display:flex;align-items:center;gap:7px 14px;flex-wrap:wrap;
  margin-top:8px;font-size:12.5px;color:var(--muted);
}
.pmeta-line a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.pmeta-line a:hover{color:var(--accent-ink);border-bottom-color:var(--accent)}

.viewswitch{
  margin-left:auto;display:flex;gap:4px;align-self:center;
  padding-bottom:5px;flex:0 0 auto;
  position:sticky;right:0;background:var(--paper);padding-left:10px;
}
/* icon plus its name: these four switch the whole view, and as bare glyphs
   nobody could tell ▣ from ◈ without hovering for the tooltip */
.vbtn{
  display:flex;align-items:center;gap:6px;
  min-height:34px;padding:0 11px;border-radius:5px;
  font-size:13px;line-height:1;white-space:nowrap;
  color:var(--muted);border:1px solid transparent;
}
.vbtn .vico{opacity:.9}
.vbtn:hover{background:var(--line-soft);color:var(--ink)}
.vbtn.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.tab.tabadd{color:var(--muted);font-size:16px;padding:7px 11px}
.tab.tabadd:hover{color:var(--accent-ink)}
.tabnew{
  align-self:center;border:1px solid var(--accent);border-radius:3px;
  padding:4px 8px;font-size:13px;background:var(--paper);margin-bottom:5px;
}
.tabnew:focus{outline:none}
.pjspaces{display:flex;flex-direction:column;gap:6px}
.pjspace{display:flex;align-items:center;gap:8px}
.pjspace input{flex:1}
.pjspace .btn{padding:4px 9px;font-size:12px}
.tabsep{
  align-self:center;width:1px;height:16px;background:var(--line);
  margin:0 6px 6px;flex:0 0 auto;
}
.tab.tabdoc{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-size:14px}
.tab.tabdoc .dico{color:var(--muted);width:14px;height:14px}
.tab.tabdoc.on .dico{color:var(--accent-ink)}

.docpage-head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);
}
.docpage-head h2{
  margin:0;font-family:var(--serif);font-size:23px;font-weight:600;
  letter-spacing:-.015em;
}
.docpage-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.docpage-acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.docpage{
  display:flex;flex-direction:column;gap:10px;max-width:760px;
}
.pjcolor{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);line-height:1.4}
.pjcolor .sw{width:22px;height:22px;border-radius:4px;flex:0 0 auto;transform:rotate(-8deg)}
#mainhead .meta{font-size:12.5px;color:var(--muted);margin-top:7px}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:5px 11px;font-size:13px;background:var(--panel);
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{box-shadow:0 0 0 3px var(--accent-soft);color:var(--on-accent);border-color:var(--accent)}
.btn.quiet{border-color:transparent;color:var(--muted);background:transparent}
.btn.quiet:hover{border-color:var(--line);color:var(--ink)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}

/* The row scrolls sideways at every width, with the view switch pinned at its
   right end: spaces plus doc tabs ran off an iPad portrait screen (744-834px)
   and pushed Calendar and Notes out of reach. */
.tabs{
  display:flex;gap:2px;margin:16px 0 0;border-bottom:1px solid var(--line);align-items:flex-end;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:7px 12px;font-size:13.5px;color:var(--muted);white-space:nowrap;flex:0 0 auto;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tab .n{font-size:11.5px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}

#mainbody{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 22px 40px}

/* ---------- board ---------- */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.col{
  /* flexes so all four columns fit an iPad in landscape, and widens a little on a
     big monitor, but never gets too narrow to read a card */
  flex:1 1 0;min-width:216px;max-width:300px;
  background:var(--sunken);
  border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;max-height:calc(100dvh - 230px);
}
.col.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.col-head{
  display:flex;align-items:center;gap:8px;padding:9px 11px;
  border-bottom:1px solid var(--line-soft);
}
.col-head .bar{width:18px;height:3px;border-radius:2px;background:var(--accent)}
.col-head .nm{font-size:13px;font-weight:500}
.col-head .n{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-body{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:44px}
.col-foot{padding:0 8px 8px}
.addtask{
  width:100%;border:1px dashed var(--line);background:transparent;
  border-radius:var(--radius);padding:6px 9px;font-size:13px;
}
.addtask:focus{border-style:solid;border-color:var(--accent);outline:none}

.card{
  position:relative;
  background:var(--raised);border:1px solid var(--line);
  border-radius:var(--radius);padding:8px 10px 8px 22px;cursor:pointer;
  box-shadow:var(--shadow);
}
.card .grip{
  position:absolute;left:0;top:0;bottom:0;width:20px;
  display:flex;align-items:center;justify-content:center;
  color:var(--faint);
  cursor:grab;touch-action:none;
  border-radius:var(--radius) 0 0 var(--radius);
}
.card .grip:hover{opacity:1;background:var(--line-soft)}
.card .grip:active{cursor:grabbing}
@media (hover:none){ .card .grip{width:26px} .card{padding-left:28px} }
.card.dragging{opacity:.32}
.dragghost{
  position:fixed;z-index:95;pointer-events:none;
  box-shadow:var(--shadow-lg);
  transform:rotate(1.4deg);opacity:.96;
}
body.dragging-now{user-select:none;-webkit-user-select:none}

/* task sheet reuses the schedule dialog shell */
#projDlg{
  position:fixed;inset:0;z-index:78;display:none;
  background:var(--scrim);padding:9vh 16px 16px;overflow-y:auto;
}
#projDlg.on{display:block}

#prospectDlg{
  position:fixed;inset:0;z-index:77;display:none;
  background:var(--scrim);padding:9vh 16px 16px;overflow-y:auto;
}
#prospectDlg.on{display:block}
#prNote{
  width:100%;border:1px solid var(--line);border-radius:3px;
  padding:8px 9px;font-size:13.5px;background:var(--paper);
  font-family:var(--ui);line-height:1.5;resize:vertical;
}
#prNote:focus{border-color:var(--accent);outline:none}

#taskDlg{
  position:fixed;inset:0;z-index:76;display:none;
  background:var(--scrim);padding:9vh 16px 16px;overflow-y:auto;
}
#taskDlg.on{display:block}
.card .ttl{font-size:13.5px;line-height:1.35;word-break:break-word}
.card.done .ttl{color:var(--muted);text-decoration:line-through}
.card .foot{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.chip{
  font-size:11px;padding:1px 6px;border-radius:3px;
  background:var(--line-soft);color:var(--muted);
}
.chip.proj{background:var(--accent-soft);color:var(--accent-ink)}
.chip.due{border:1px solid var(--line);background:transparent}
.chip.due.late{color:var(--danger);border-color:var(--danger)}
.card .who{width:19px;height:19px;border-radius:50%;margin-left:auto;display:block}
.drop-line{height:2px;background:var(--accent);border-radius:2px;margin:-4px 0}

/* ---------- list ---------- */
.list{width:100%;border-collapse:collapse;font-size:13.5px}
.list th{
  text-align:left;font-weight:500;font-size:12px;color:var(--muted);
  padding:0 10px 7px;border-bottom:1px solid var(--line);
}
.list td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.list tr:hover td{background:var(--panel)}
.list .c-check{width:30px}
.list .c-due{width:128px}
.list .c-who{width:44px}
.list .c-st{width:132px}
.list .c-x{width:34px}
.list td.tt{word-break:break-word}
.list td.tt.done{color:var(--muted);text-decoration:line-through}
.list input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.list select,.list input[type=date]{
  border:1px solid transparent;background:transparent;border-radius:3px;
  padding:3px 5px;font-size:12.5px;width:100%;
}
.list select:hover,.list input[type=date]:hover{border-color:var(--line)}
.list img.who{width:21px;height:21px;border-radius:50%;display:block}
.rowx{color:var(--muted);padding:3px;border-radius:3px;opacity:0;display:inline-flex;align-items:center;justify-content:center}
tr:hover .rowx{opacity:1}
.rowx:hover{color:var(--danger)}

/* ---------- notes ---------- */
.notes{
  display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
  align-items:start;
}
.note{
  background:var(--note);border:1px solid var(--note-edge);
  border-radius:3px 12px 3px 3px;padding:12px 13px 11px;
  text-align:left;width:100%;min-height:104px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;
  box-shadow:var(--shadow);
}
.note:hover{border-color:var(--accent)}
.note .nt{
  font-family:var(--serif);font-size:17px;font-weight:500;
  line-height:1.25;letter-spacing:-.005em;word-break:break-word;
}
.note .nb{
  font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink-2);
  flex:1;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;
  white-space:pre-wrap;word-break:break-word;
}
.note .nf{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.note .nf img{width:17px;height:17px;border-radius:50%;margin-left:auto}
.note.add{
  background:transparent;border:1px dashed var(--line);box-shadow:none;
  align-items:center;justify-content:center;color:var(--muted);
  font-family:var(--ui);font-size:13px;border-radius:3px;
}
.note.add:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- empty ---------- */
.empty{
  max-width:400px;padding:34px 0;color:var(--muted);font-size:14px;line-height:1.55;
}
.empty h2{
  font-family:var(--serif);font-size:20px;font-weight:500;
  color:var(--ink);margin:0 0 6px;letter-spacing:-.01em;
}
.empty .btn{margin-top:14px}

/* ---------- note editor ---------- */
#overlay{
  position:fixed;inset:0;z-index:60;display:none;
  background:var(--scrim);
  padding:24px 16px;overflow-y:auto;
}
#overlay.on{display:block}
#editor{
  max-width:680px;margin:0 auto;background:var(--note);
  border:1px solid var(--note-edge);border-radius:4px 16px 4px 4px;
  box-shadow:var(--shadow-lg);
  padding:20px 22px 16px;display:flex;flex-direction:column;gap:10px;
}
#edTitle{
  font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.015em;
  border:0;background:transparent;width:100%;padding:0;line-height:1.2;
}
#edTitle:focus{outline:none}
#edBody{
  font-family:var(--serif);font-size:16px;line-height:1.62;
  border:0;background:transparent;width:100%;resize:vertical;
  min-height:300px;padding:0;
}
#edBody:focus{outline:none}
#edRule{height:1px;background:var(--note-edge);margin:2px 0 4px}
#edFoot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--note-edge);padding-top:11px;margin-top:4px;
  font-size:12.5px;color:var(--muted);
}
#edProj,#edSpace{
  border:1px solid var(--note-edge);background:transparent;
  border-radius:3px;padding:4px 7px;font-size:12.5px;font-family:var(--ui);
}
#edStatus{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- inline edit ---------- */
.inline-edit{
  width:100%;border:1px solid var(--accent);border-radius:3px;
  padding:2px 5px;font-size:13.5px;background:var(--panel);
}
.inline-edit:focus{outline:none}
.rail-new{padding:3px 12px 0}
.rail-new input{
  width:100%;border:1px solid var(--accent);border-radius:3px;
  padding:4px 7px;font-size:13px;background:var(--paper);
}
.rail-new input:focus{outline:none}

/* ---------- confirm ---------- */
#confirm{
  position:fixed;inset:0;z-index:80;display:none;
  background:var(--scrim);padding:22vh 16px 16px;
}
#confirm.on{display:block}
.cbox{
  max-width:400px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);padding:18px 20px 16px;
}
.cbox h3{
  margin:0 0 6px;font-size:16px;font-weight:600;letter-spacing:-.01em;
}
.cbox p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
.crow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn.solid-danger:hover{box-shadow:0 0 0 3px var(--danger-soft);color:var(--on-danger);border-color:var(--danger)}

/* ---------- assignee menu ---------- */
#amenu{
  position:absolute;z-index:70;display:none;min-width:212px;
  background:var(--raised);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow-md);
  padding:6px;
}
#amenu.on{display:block}
#amenu input{
  width:100%;border:1px solid var(--line);border-radius:3px;
  padding:5px 8px;font-size:13px;background:var(--paper);margin-bottom:5px;
}
#amenu .opt{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:5px 7px;border-radius:3px;font-size:13px;text-align:left;
}
#amenu .opt:hover{background:var(--accent-soft)}
#amenu .opt img{width:20px;height:20px;border-radius:50%}
#amenu .none{color:var(--muted)}

/* ---------- notifications menu ---------- */
#bell{
  flex:0 0 auto;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
}
#bell:hover{color:var(--ink);background:var(--line-soft)}
#bell.on{color:var(--accent-ink)}
#bell svg{width:16px;height:16px;display:block}
#nmenu,#umenu{
  position:absolute;z-index:70;display:none;width:min(88vw,290px);
  background:var(--raised);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow-md);
  padding:11px 12px 12px;
}
#nmenu.on,#umenu.on{display:block}
#nmenu h4,#umenu h4{
  margin:0 0 6px;font-size:12.5px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;text-transform:uppercase;
}
#nmenu p{margin:0 0 10px;font-size:13px;line-height:1.5;color:var(--muted)}
#nmenu .nrow{display:flex;gap:7px;flex-wrap:wrap}
/* ---------- account menu ---------- */
#whoami{border-radius:999px;padding:3px 4px 3px 10px}
#whoami:hover{background:var(--line-soft)}
#umenu .who{display:flex;align-items:center;gap:10px;padding:2px 0 12px;margin-bottom:10px;border-bottom:1px solid var(--line)}
#umenu .who img{width:34px;height:34px;border-radius:50%}
#umenu .who b{display:block;font-weight:600;font-size:14px}
#umenu .who span{font-size:12.5px;color:var(--muted)}
#umenu .sect{margin:0 0 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);padding:2px;gap:2px;background:var(--paper)}
.seg button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 6px;border-radius:calc(var(--radius) - 2px);font-size:12.5px;color:var(--muted);
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
/* "accsw", not "swatch": the whiteboard's pen-colour buttons already own .swatch,
   and sharing the name would restyle them — the same collision that once shrank
   the whiteboard to 320px when its editor borrowed the kanban's .board */
.accsws{display:flex;gap:8px;flex-wrap:wrap}
.accsw{
  width:28px;height:28px;border-radius:50%;position:relative;
  box-shadow:inset 0 0 0 1px var(--line-strong);
}
.accsw.on{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--ink)}
.accsw .ico{position:absolute;inset:0;margin:auto;width:14px;height:14px;stroke-width:2.8}
#umenu .signout{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 6px;margin-top:2px;
  border-top:1px solid var(--line);border-radius:0;color:var(--ink);font-size:13.5px;
}
#umenu .signout:hover{color:var(--danger)}

/* ---------- toast / banner ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:13px;
  padding:8px 14px;border-radius:var(--radius);z-index:90;
  opacity:0;pointer-events:none;max-width:88vw;
  /* hidden, not just transparent, once it has faded: a see-through Undo button
     still took taps and Tab focus, and brought a deleted task back later */
  visibility:hidden;transition:opacity .16s,visibility 0s linear .16s;
}
#toast.on{opacity:1;visibility:visible;transition-delay:0s}
#toast.act{display:flex;align-items:center;gap:14px}
/* a toast that offers an action (Undo) has to be tappable while it's up */
#toast.on.act{pointer-events:auto}
.toastbtn{
  color:var(--paper);font-weight:600;text-decoration:underline;text-underline-offset:3px;
  padding:6px 4px;margin:-6px -4px;min-height:32px;
}
#banner{
  display:none;padding:9px 22px;font-size:13px;
  background:var(--accent-soft);color:var(--accent-ink);
  border-bottom:1px solid var(--line);
}
#banner.tap{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
#banner.on{display:block}

/* ---------- capture ---------- */
#capture{
  display:none;margin:14px 22px 0;flex:0 0 auto;
  border:1px solid var(--note-edge);background:var(--note);
  border-radius:3px 12px 3px 3px;padding:10px 12px 9px;
}
#capture.on{display:block}
#capture.drag{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#capInput{
  width:100%;border:0;background:transparent;resize:none;overflow:hidden;
  font-family:var(--serif);font-size:16px;line-height:1.5;
  min-height:26px;max-height:240px;padding:0;
}
#capInput:focus{outline:none}
#capFoot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
#capHint{font-size:11.5px;color:var(--muted)}
/* a label wrapping the file input: iOS opens Take Photo / Photo Library from a
   real tap on it, more reliably than from a scripted click() */
.capphoto{display:inline-flex;align-items:center;gap:6px;cursor:pointer;position:relative}
.capphoto input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.capphoto[hidden]{display:none}
/* focus lands on the invisible input, so the label wears the ring */
.capphoto:focus-within{outline:2px solid var(--accent-ink);outline-offset:2px}
.capacts{margin-left:auto;display:flex;gap:8px;align-items:center}
#capProj,#capSpace{
  border:1px solid var(--line-strong);background:transparent;
  border-radius:3px;padding:3px 6px;font-size:12px;font-family:var(--ui);
  max-width:46%;
}
#capProj:focus,#capSpace:focus{border-color:var(--accent);outline:none}
#capFoot .btn{padding:3px 10px;font-size:12.5px}
#capThumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#capThumbs:empty{margin:0}
.thumb{
  position:relative;width:60px;height:60px;border-radius:3px;
  border:1px solid var(--note-edge);overflow:hidden;background:var(--paper);
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.up{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted)}
.thumb button{
  position:absolute;top:1px;right:1px;width:17px;height:17px;
  border-radius:50%;background:rgba(20,19,17,.72);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.thumb button .ico{width:11px;height:11px;stroke-width:2.4}

/* ---------- tags ---------- */
#tagbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tagchip{
  font-size:12px;padding:2px 8px;border-radius:11px;
  border:1px solid var(--line);color:var(--muted);background:transparent;
}
.tagchip:hover{border-color:var(--accent);color:var(--accent-ink)}
.tagchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tagref{color:var(--accent-ink);font-weight:500;cursor:pointer}
.tagref:hover{text-decoration:underline}

/* ---------- feed ---------- */
.feed{max-width:620px}
.daymark{
  font-size:11.5px;color:var(--muted);margin:20px 0 9px;
  display:flex;align-items:center;gap:9px;
}
.daymark::after{content:"";flex:1;height:1px;background:var(--line)}
.daymark:first-child{margin-top:0}
.fitem{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--note);border:1px solid var(--note-edge);
  border-radius:3px 12px 3px 3px;padding:11px 13px 9px;margin-bottom:8px;
  box-shadow:var(--shadow);
}
.fitem:hover{border-color:var(--accent)}
.fitem .ft{
  font-family:var(--serif);font-size:16px;font-weight:500;line-height:1.25;
  margin-bottom:3px;word-break:break-word;
}
.fitem .fb{
  font-family:var(--serif);font-size:15px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;
}
.fitem .ff{
  display:flex;align-items:center;gap:8px;margin-top:8px;
  font-size:11.5px;color:var(--muted);
}
.fitem .ff img.av{width:17px;height:17px;border-radius:50%;margin-left:auto}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.imgs img{
  width:74px;height:74px;object-fit:cover;border-radius:3px;
  border:1px solid var(--note-edge);display:block;
}
.fitem a,.note a,.nb a{color:var(--accent-ink)}

/* ---------- editor images ---------- */
#edImgs{display:flex;gap:8px;flex-wrap:wrap}
#edImgs:empty{display:none}
#edImgs .thumb{width:88px;height:88px}

/* ---------- spaces in rail ---------- */
.rail-sub{padding-left:14px}
.rail-sub .rail-item{padding-left:22px;font-size:13px}
.rail-sub .rail-item .lbl{color:var(--muted)}
.rail-sub .rail-item.on .lbl{color:var(--ink)}
.rail-addspace{
  display:block;width:100%;text-align:left;padding:3px 14px 3px 36px;
  font-size:12.5px;color:var(--muted);
}
.rail-addspace:hover{color:var(--accent-ink)}
.rail-sub input{
  width:calc(100% - 44px);margin:2px 0 2px 36px;
  border:1px solid var(--accent);border-radius:3px;
  padding:3px 6px;font-size:12.5px;background:var(--paper);
}
.rail-sub input:focus{outline:none}
.spacex{
  margin-left:4px;color:var(--muted);font-size:13px;opacity:0;
  padding:0 3px;border-radius:3px;
}
.rail-item:hover .spacex{opacity:1}
.spacex:hover{color:var(--danger)}

/* ---------- calendar ----------
   One DOM at every width: a month grid beside (or above) a panel for the selected
   day. Above 720px each cell carries its date and up to three chips; the phone
   half, further down in the phone block, hides the chips and turns each cell into
   a date with dots, iPhone Calendar style. Colours are tokens only — project
   colours arrive as inline oklch(var()) strings or through --cp. */
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calbar .mon{
  margin:0 auto 0 0;min-width:0;
  font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.25;
}
.calnav{display:flex;align-items:center;gap:4px}
.calbar .nav{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
  width:32px;height:32px;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center;
}
.calbar .nav:hover{border-color:var(--accent);color:var(--accent-ink)}
.calbar .todaybtn{height:32px;padding:0 12px}
.calbar .btn.primary{margin-left:6px}

.calwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.calgrid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--line);gap:1px;
}
.caldow{
  background:var(--panel-2);padding:6px 8px;
  font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
}
.calday{
  background:var(--panel);min-width:0;min-height:100px;padding:5px 5px 6px;
  display:flex;flex-direction:column;gap:3px;cursor:pointer;
}
.calday:hover{background:var(--panel-2)}
.calday.off{background:var(--paper)}
.calday.sel{box-shadow:inset 0 0 0 2px var(--accent)}
/* the ring needs the plain panel under it: on the hover wash it fell below 3:1 in dark */
.calday.sel:hover{background:var(--panel)}
.calday .chead{display:flex;align-items:center;gap:4px;min-width:0}
.calday .dn{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  border-radius:11px;
}
.calday .dnum{
  display:flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;padding:0 6px;border-radius:11px;
  font-size:12.5px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-2);
}
.calday .dn:hover .dnum{background:var(--line-soft)}
.calday.off .dnum{color:var(--muted)}
.calday.today .dnum,
.calday.today .dn:hover .dnum{background:var(--accent);color:var(--on-accent);font-weight:600;opacity:1}
.calday .dots{display:none}
.occ{
  display:flex;align-items:center;gap:5px;width:100%;min-width:0;text-align:left;
  font-size:11.5px;line-height:1.25;padding:1px 6px;border-radius:4px;
  border:1px solid transparent;background:var(--accent-soft);color:var(--accent-ink);
}
.occ:hover{box-shadow:0 0 0 2px var(--line-strong)}
.occ .tm{font-variant-numeric:tabular-nums;font-weight:600;flex:0 0 auto}
.occ .ot{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.occ.task{background:transparent;border-color:var(--line);color:var(--ink)}
.occ.done{background:var(--line-soft);border-color:transparent;color:var(--muted);text-decoration:line-through}
.occ.task.done{background:transparent}
.occ.late{background:transparent;border-color:var(--danger);color:var(--danger)}
.occ .late-ico{width:11px;height:11px;flex:0 0 auto;stroke-width:2.2}
.calday .cmore{
  margin-left:auto;min-width:0;padding:2px 6px;border-radius:4px;
  font-size:11px;font-weight:500;line-height:1.3;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.calday .cmore:hover{color:var(--ink);background:var(--line-soft)}
/* a finger on an iPad needs a little more chip than a pointer does */
@media (hover:none){ .occ{min-height:22px} }
@media (max-width:900px) and (min-width:721px){ .calday{padding:4px} .caldow{padding:5px 6px} }
/* where a column drops under ~100px, the title needs the room more than the time,
   and "+2 more" says enough as "+2" */
@media (max-width:900px), (min-width:1100px) and (max-width:1279px){
  .occ .tm,.calday .cmore .w{display:none}
}
@media (min-width:1100px){ .calwrap{grid-template-columns:minmax(0,1fr) 288px} }

.calpanel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 12px 10px;min-width:0;
}
.cphead{padding:0 2px 8px}
.cphead h3{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.cpsub{margin-top:2px;font-size:12px;color:var(--muted)}
.cpsub .now{color:var(--accent-ink);font-weight:600}
.cplist{display:flex;flex-direction:column;gap:1px}
.cpempty{padding:4px 2px 6px;font-size:13px;color:var(--muted)}
.cprow{display:flex;align-items:flex-start;border-radius:var(--radius)}
.cprow:hover{background:var(--panel-2)}
.cprow .ctick{
  flex:0 0 auto;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
}
.cprow .ctick:disabled{cursor:default}
/* the ring wears the project's colour, so a day's list reads by project too */
.cprow .ring{
  width:19px;height:19px;border-radius:50%;border:1.6px solid var(--cp,var(--muted));
  display:flex;align-items:center;justify-content:center;color:transparent;
}
.cprow .ring .ico{width:12px;height:12px;stroke-width:2.6}
.cprow .ctick:hover .ring{background:var(--accent-soft)}
.cprow.done .ring{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cprow .cmain{
  flex:1;min-width:0;text-align:left;
  display:flex;flex-direction:column;gap:3px;padding:7px 6px 7px 2px;
}
.cprow .ct{font-size:13.5px;line-height:1.35;word-break:break-word}
.cprow.done .ct{color:var(--muted);text-decoration:line-through}
.cprow .cmeta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--muted)}
.cprow .ctime{color:var(--ink-2);font-variant-numeric:tabular-nums}
.cprow .crep{display:inline-flex;align-items:center;gap:3px}
.cprow .crep .ico{width:12px;height:12px}
.cprow .clate{color:var(--danger);font-weight:500}
.cprow img.av{width:18px;height:18px;border-radius:50%;display:block;flex:0 0 auto;margin:9px 6px 0 0}
.cpadd{margin-top:6px;padding-top:6px;border-top:1px solid var(--line-soft)}
.cpaddbtn{
  display:flex;align-items:center;gap:7px;width:100%;min-height:34px;padding:5px 8px;
  border-radius:var(--radius);font-size:13px;color:var(--muted);text-align:left;
}
.cpaddbtn:hover{color:var(--accent-ink);background:var(--accent-soft)}
.cpform{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:2px}
.cpinput{
  flex:1 1 100%;min-width:0;padding:6px 9px;font-size:13.5px;
  border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--paper);
}
.cpinput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cpproj{
  flex:1 1 120px;min-width:0;padding:5px 7px;font-size:13px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);
}
.cpproj:focus{border-color:var(--accent);outline:none}
.cpform .btn.primary{margin-left:auto}
.cpx{
  width:30px;height:30px;border-radius:var(--radius);color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
}
.cpx:hover{color:var(--ink);background:var(--line-soft)}

.schedlist{margin-top:22px;max-width:640px}
.schedhead{display:flex;align-items:center;gap:10px;margin:0 0 9px;min-height:30px}
.schedhead h3{
  display:flex;align-items:center;gap:7px;margin:0;
  font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;
}
.schedhead .addsched{display:none;margin-left:auto}
.schedhead .n{
  font-size:11.5px;font-variant-numeric:tabular-nums;text-transform:none;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;
}
.schedrow{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);margin-bottom:7px;
}
.schedrow .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--cp,var(--muted))}
.schedrow .sbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.schedrow .sn{font-size:13.5px;word-break:break-word}
.schedrow .smeta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12px;color:var(--muted)}
.schednote{margin:0;font-size:13px;color:var(--muted);line-height:1.5;max-width:560px}
/* ---------- end calendar ---------- */

/* ---------- schedule dialog ---------- */
#schedDlg{
  position:fixed;inset:0;z-index:75;display:none;
  background:var(--scrim);padding:9vh 16px 16px;overflow-y:auto;
}
#schedDlg.on{display:block}
.sbox{
  max-width:470px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);padding:20px 22px 18px;
}
.sbox h3{margin:0 0 14px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field input[type=time],.field input[type=date],.field select,
.field textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:3px;
  padding:6px 9px;font-size:13.5px;background:var(--paper);
}
.field textarea{resize:vertical;min-height:72px;line-height:1.45}
.hasnotes{color:var(--muted);display:inline-flex;align-items:center;cursor:default}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.days{display:flex;gap:4px;flex-wrap:wrap}
.daybtn{
  width:35px;height:31px;border:1px solid var(--line);border-radius:3px;
  font-size:12px;color:var(--muted);
}
.daybtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.two{display:flex;gap:10px}
.two .field{flex:1}

/* ---------- doc mode ---------- */
#editor.doc{max-width:860px;background:var(--panel);border-color:var(--line);border-radius:var(--radius)}
#editor.doc #edTitle,#editor.doc #edBody{font-family:var(--serif)}
#editor.doc #edBody{min-height:440px;font-size:15.5px}
#editor.doc #edRule{background:var(--line)}
#editor.doc #edFoot{border-top-color:var(--line)}
#editor.doc #edProj,#editor.doc #edSpace{border-color:var(--line)}
.modeswitch{display:flex;gap:2px;margin-right:auto}
.modeswitch button{
  font-size:12px;padding:3px 9px;border-radius:3px;color:var(--muted);
  border:1px solid transparent;
}
.modeswitch button.on{border-color:var(--line);color:var(--ink);background:var(--paper)}
#edRead{display:none;flex-direction:column;gap:10px;min-height:300px}
#edRead.on{display:flex}
.blk{position:relative;padding-right:60px}
.blk p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
.blk h2{margin:10px 0 0;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.blk h3{margin:8px 0 0;font-family:var(--serif);font-size:16.5px;font-weight:600}
.blk ul{margin:0;padding-left:20px;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.blk pre{
  margin:0;background:var(--paper);border:1px solid var(--line);
  border-radius:4px;padding:10px 12px;overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;
}
.blkcopy{
  position:absolute;top:2px;right:0;font-size:11.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:3px;padding:2px 7px;
  background:var(--panel);opacity:0;
}
.blk:hover .blkcopy,.blkcopy:focus{opacity:1}
.blkcopy:hover{border-color:var(--accent);color:var(--accent-ink)}
.blkcopy.ok{color:var(--accent-ink);border-color:var(--accent);opacity:1}

/* ---------- rich docs: toolbar, editor, Read mode ----------
   Every base display:none here sits above the phone block on purpose (CSS trap 1). */
#edToolsWrap,#edRich,#edConflict,#edLinkRow{display:none}
#editor.doc.writing #edToolsWrap{
  display:block;position:sticky;top:0;z-index:3;
  margin-left:-22px;margin-right:-22px;
}
#edTools{
  display:flex;align-items:center;flex-wrap:wrap;gap:1px;
  padding:5px 16px;background:var(--panel);
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
}
.fmt{
  min-width:32px;height:34px;padding:0 6px;border-radius:var(--radius);
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  color:var(--ink-2);font-family:var(--ui);font-size:13.5px;font-weight:600;
}
.fmt.txt{font-family:var(--serif);font-size:15.5px}
.fmt:hover{background:var(--panel-2);color:var(--ink)}
.fmt.on{background:var(--accent-soft);color:var(--accent-ink)}
.fmt:disabled{opacity:.35;cursor:default;background:none}
.fmt.md{margin-left:auto;font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--muted)}
.fmt.md.on{color:var(--accent-ink)}
.fmt.done{display:none}
/* a conflict pauses saving; the bar is the one thing still in view while typing
   further down a doc on a phone, so it says so there too */
.fmt.unsaved{display:none;gap:5px;color:var(--warn);font-size:12.5px}
#editor.conflict .fmt.unsaved{display:inline-flex}
#editor.conflict .fmt.md{margin-left:6px}
#editor.conflict .fmt.unsaved{margin-left:auto}
.fmtsep{width:1px;height:20px;background:var(--line);margin:0 3px;flex:0 0 auto}
/* Markdown view: the bar keeps only its way back */
#editor.doc.md #edTools > .fmt:not(.md):not(.unsaved),#editor.doc.md #edTools > .fmtsep{display:none}
#edTools.linking > .fmt,#edTools.linking > .fmtsep{display:none}
#edTools.linking #edLinkRow{display:flex;flex:1;align-items:center;gap:6px;min-width:0}
#edLinkUrl{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 9px;font-size:14px;background:var(--paper);
}
#edLinkUrl:focus{border-color:var(--accent);outline:none}
#edLinkRow .btn{padding:5px 11px;font-size:12.5px}
/* someone else changed the note while it was open */
#edConflict.on{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 10px;border-radius:var(--radius);font-size:13px;line-height:1.4;
  background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);
}
#edConflict.warn{border-color:var(--warn)}
#edConflict .msg{flex:1 1 220px;display:flex;align-items:center;gap:7px}
#edConflict .msg .ico{color:var(--warn);flex:0 0 auto}
#edConflict .btn{padding:5px 11px;font-size:12.5px}
#edConflict.flash{animation:edflash .5s ease 2}
@keyframes edflash{50%{border-color:var(--warn);box-shadow:0 0 0 3px var(--accent-soft)}}

/* the editor: what's on screen is what gets saved, so anything the markdown
   can't hold (a pasted font size, a colour, a picture) isn't shown either */
#editor.doc #edRich{
  font-family:var(--serif);font-size:16px;line-height:1.62;color:var(--ink);
  min-height:440px;outline:none;position:relative;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  touch-action:manipulation;padding-bottom:18px;
}
#edRich > *{margin:.8em 0 0}
#edRich > :first-child,#edRich > [data-gap="0"]{margin-top:0}
#edRich > [data-gap="2"],#edRich > [data-gap="3"]{margin-top:1.6em}
#edRich p,#edRich div{margin-bottom:0}
#edRich h1{font-size:25px;font-weight:600;line-height:1.25;letter-spacing:-.015em;margin-top:1em}
#edRich h2{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin-top:.95em}
#edRich h3{font-size:17px;font-weight:600;line-height:1.35;margin-top:.9em}
#edRich > h1:first-child,#edRich > h2:first-child,#edRich > h3:first-child{margin-top:0}
#edRich ul,#edRich ol{padding-left:1.6em;margin-bottom:0}
#edRich li{margin:.12em 0}
#edRich li[data-task]{list-style:none;position:relative}
#edRich li[data-task]::before{
  content:"";position:absolute;left:-1.5em;top:.32em;width:1em;height:1em;
  border:1.5px solid var(--muted);border-radius:4px;box-sizing:border-box;cursor:pointer;
}
#edRich li[data-task="1"]::before{background:var(--accent);border-color:var(--accent)}
#edRich li[data-task="1"]::after{
  content:"";position:absolute;left:-1.16em;top:.43em;width:.3em;height:.55em;pointer-events:none;
  border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg);
}
#edRich li[data-task="1"]{color:var(--muted)}
#edRich li[data-task="1"] span[style*="rgb(255, 229, 102)"],#edRich li[data-task="1"] span[style*="rgb(255,229,102)"]{color:var(--ink-2)!important}
#edRich li[data-task="1"] li{color:var(--ink)}
#edRich blockquote{margin-left:0;margin-right:0;padding-left:14px;border-left:3px solid var(--quote-bar);color:var(--ink-2)}
#edRich pre{
  background:var(--code-bg);border-radius:var(--radius);padding:10px 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;
  white-space:pre-wrap;
}
#edRich code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;
  background:var(--code-bg);border-radius:3px;padding:.08em .3em;
}
#edRich hr{border:0;border-top:1px solid var(--line);margin-top:1.1em;margin-bottom:.3em}
#edRich a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}
#edRich [style],#edRich font{
  font-size:inherit!important;font-family:inherit!important;color:inherit!important;
  line-height:inherit!important;letter-spacing:inherit!important;
}
#edRich span[style*="background"]{background-color:transparent!important}
/* a heading's weight carried into a paragraph by a merge isn't bold (docmd reads
   it as plain), so it mustn't look bold either */
#edRich p span[style*="font-weight: 600"],#edRich li span[style*="font-weight: 600"],
#edRich blockquote span[style*="font-weight: 600"]{font-weight:inherit!important}
/* inline code as the toolbar applies it (a <font face>), and as Chrome sometimes
   rewrites a <code>; both are read back as code */
#edRich font[face="monospace"],#edRich span[style*="monospace"]{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;font-size:.86em!important;
  background-color:var(--code-bg)!important;border-radius:3px;padding:.08em .3em;
}
#edRich span[style*="rgb(255, 229, 102)"],#edRich span[style*="rgb(255,229,102)"]{
  background-color:var(--mark)!important;border-radius:2px;
}
#edRich img,#edRich video,#edRich iframe{display:none}
#edRich.empty::before{
  content:attr(data-placeholder);position:absolute;top:0;left:0;right:0;
  color:var(--faint);pointer-events:none;
}
#edRich[contenteditable="false"]{cursor:default}
/* With a software keyboard up (iPhone, iPad) the bar rides on top of it: iOS
   doesn't shrink the page for the keyboard, so a bar at the top of the sheet is
   scrolled out of sight exactly when formatting is wanted. JS sets the offset
   from visualViewport; the wrap keeps the bar's height so the text doesn't jump. */
#editor.kbd #edTools{
  position:fixed;top:0;left:0;right:0;z-index:5;flex-wrap:nowrap;overflow-x:auto;
  border-top:1px solid var(--line);border-bottom:0;
  padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));
}

/* Read mode and the project doc tab: the same blocks, with Copy buttons */
.blk h1{margin:12px 0 0;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.blk ol{margin:0;padding-left:22px;font-family:var(--serif);font-size:15.5px;line-height:1.6}
.blk li > ul,.blk li > ol{margin-top:2px}
.blk li.task{list-style:none}
.blk li.task > label{display:flex;align-items:flex-start;gap:8px;margin-left:-20px;cursor:pointer}
.blk li.task input{width:17px;height:17px;margin:4px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.blk li.task > label > span{white-space:pre-wrap;word-break:break-word}
.blk li.task.done > label > span{color:var(--muted);text-decoration:line-through}
.blk blockquote{
  margin:0;padding-left:14px;border-left:3px solid var(--quote-bar);color:var(--ink-2);
  font-family:var(--serif);font-size:15.5px;line-height:1.62;white-space:pre-wrap;word-break:break-word;
}
.blkhr{padding-right:0}
.blk hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.blk mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 .08em}
/* a ticked item is --muted, which is too faint on --mark in dark mode */
.blk li.task.done mark{color:var(--ink-2)}
.blk code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;
  background:var(--code-bg);border-radius:3px;padding:.08em .3em;
}
.blk pre{background:var(--code-bg);border-color:var(--line-soft)}
/* every link in a doc, including bare URLs made live by richText, not only
   [text](url) ones — those were the browser's own blue and purple */
.blk a{color:var(--accent-ink);text-underline-offset:2px}
.blk.heading .blkcopy{top:12px}


/* ---------- whiteboard ---------- */
/* NOT ".board" — that's the kanban container at the top of this file, and sharing
   the name meant this editor silently inherited its align-items:flex-start, which
   let #inkWrap shrink-wrap the canvas. The canvas is sized FROM the wrap's width,
   so it collapsed to the 320px floor and stayed there on every screen. */
#editor.whiteboard{
  max-width:min(1180px,96vw);background:var(--panel);
  border-color:var(--line);border-radius:var(--radius);
  padding:14px 14px 12px;gap:8px;
}
#inkbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#inkbar .tool{
  border:1px solid var(--line);border-radius:var(--radius);
  padding:4px 10px;font-size:12.5px;color:var(--muted);
}
#inkbar .tool.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#inkbar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.swatch{
  width:21px;height:21px;border-radius:50%;border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);
}
.swatch.on{border-color:var(--accent)}
#inkWrap{
  border:1px solid var(--line);border-radius:4px;background:#fff;
  overflow:auto;max-height:64vh;touch-action:pan-y;
  /* explicit, because the canvas inside is measured from this element: anything
     that lets it shrink-wrap collapses the page to its minimum and keeps it there */
  align-self:stretch;
}
/* On anything bigger than a phone — an iPad especially — a page of handwriting
   should have the screen. Fill the overlay's height and give the ink whatever the
   toolbar, title and footer don't use. Phones already get a full-height sheet from
   the block further down. */
@media (min-width:721px){
  #editor.whiteboard{height:calc(100dvh - 48px)}
  #editor.whiteboard #inkWrap{flex:1 1 auto;max-height:none;min-height:0}
}
#inkCanvas{display:block;touch-action:none;cursor:crosshair}
#inkFoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#inkFoot .btn{padding:4px 10px;font-size:12.5px}
#inkText{
  font-family:var(--serif);font-size:15px;line-height:1.6;white-space:pre-wrap;
  background:var(--paper);border:1px solid var(--line);border-radius:4px;
  padding:10px 12px;max-height:180px;overflow-y:auto;display:none;
}
#inkText.on{display:block}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

/* ---------- sign in (rendered by store.js when there's no session) ---------- */
#slateLogin{
  position:fixed;inset:0;z-index:200;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  padding:24px max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
}
#slateLogin form{
  width:100%;max-width:330px;background:var(--panel);

  box-shadow:var(--shadow);padding:24px 22px 22px;
}
#slateLogin .lbrand{

}
#slateLogin .lbrand .mark{
  width:15px;height:15px;border-radius:2px;background:var(--accent);
  transform:rotate(-8deg);flex:0 0 auto;
}
#slateLogin .lsub{margin:6px 0 20px;font-size:13px;color:var(--muted)}
#slateLogin label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
#slateLogin input{
  width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper);
  padding:10px 11px;font-size:16px;margin-bottom:14px;min-height:44px;
}
#slateLogin input:focus{border-color:var(--accent);outline:none}
#slateLogin button{
  width:100%;background:var(--accent);border:1px solid var(--accent);
  border-radius:var(--radius);color:var(--on-accent);
  padding:11px;font-size:15px;font-weight:500;min-height:46px;
}

}
#slateLogin .lerr:empty{margin:0}

/* same for the floating dialogs — must sit after their own padding shorthands */
#overlay,#taskDlg,#schedDlg,#prospectDlg,#projDlg,#confirm{
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}

/* ---------- search results ---------- */
.sbar{

  margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line);
}

.sbar .btn{margin-left:auto}
.ssec{margin-bottom:22px;max-width:760px}
.ssec h4{

}
.ssec h4 .n{

}
.srow{

}
.srow:hover{border-color:var(--accent)}

.smeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.swhere{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sago{font-variant-numeric:tabular-nums}

/* ---------- grouped boards ---------- */
.bgroup{margin-bottom:26px}
.bgroup h4{
  margin:0 0 9px;font-size:12px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.bgroup h4 .bg-proj{color:var(--ink);font-weight:600}
.bgroup h4 .bg-sep{color:var(--line);font-size:13px}
.bgroup h4 .n{
  font-size:11.5px;font-variant-numeric:tabular-nums;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;
}
.col-head .colx{

}
.col:hover .col-head .colx{opacity:1}
.col-head .colx:hover{opacity:1;color:var(--danger);background:var(--line-soft)}
.coladd{

  padding:9px 14px;font-size:12.5px;color:var(--muted);white-space:nowrap;
}
.coladd:hover{border-style:solid;border-color:var(--accent);color:var(--accent-ink)}
.col-head .nm .inline-edit{font-size:13px;padding:1px 4px}

/* ---------- prospects ---------- */
.padd{margin-bottom:18px;max-width:520px}
.padd input{
  width:100%;border:1px dashed var(--line);background:transparent;
  border-radius:var(--radius);padding:9px 11px;font-size:14px;
}
.padd input:focus{border-style:solid;border-color:var(--accent);outline:none}
.psec{margin-bottom:20px;max-width:760px}
.psec h4{
  margin:0 0 8px;font-size:12px;font-weight:500;color:var(--muted);
  letter-spacing:.02em;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
}
.psec h4 .n{
  font-size:11.5px;font-variant-numeric:tabular-nums;text-transform:none;
  background:var(--line-soft);border-radius:9px;padding:1px 7px;
}
.prow{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 11px;margin-bottom:6px;
}
.prow.is-cold, .prow.is-cold *{color:var(--muted)}
.pmain{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.pco{font-size:14px;font-weight:500;word-break:break-word}
.pmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.pem{font-variant-numeric:tabular-nums}
.pnext{font-variant-numeric:tabular-nums}
.pnext.late{color:var(--danger)}
.pnote{

}
.pstage{
