/* ============ note editor ============ */
var overlay = $("#overlay"), edTitle = $("#edTitle"), edBody = $("#edBody"),
    edProj = $("#edProj"), edStatus = $("#edStatus"), edImgs = $("#edImgs");
var edEditor = $("#editor"), edTools = $("#edTools"), edToolsWrap = $("#edToolsWrap"),
    edConflict = $("#edConflict"), edRich = $("#edRich"), edLinkUrl = $("#edLinkUrl");
var saveT = null, dirty = false;
/* The open note's text as it arrived or was last saved from here, and every
   version stamp this device has seen or written — so the other person's change
   can be told apart from the echo of our own save, and from a stale re-read. */
var ed = {
  kind: "note",      // what the note was when it was opened
  surface: "text",   // "rich": a doc's editor; "text": the textarea (notes, boards, a doc's Markdown view)
  base: "", baseTitle: "",
  edited: false,     // the rich editor changed since base; only then is it serialised
  known: {},         // updatedAt stamps that are not news
  conflict: null,    // their newer version, while ours has unsaved changes
  held: null,        // their newer version, waiting for the caret to leave
  mine: null,        // ours, kept after "See theirs" in case it was the one to keep
  range: null,       // the last selection inside the rich editor
  after: null        // what a Return the browser handled needs tidied afterwards
};

function currentNote(){
  for(var i=0;i<S.notes.length;i++) if(S.notes[i].id === S.openNote) return S.notes[i];
  return null;
}
function drawEdImgs(){
  edImgs.textContent = "";
  var n = currentNote();
  if(!n || !n.images || !n.images.length) return;
  n.images.forEach(function(id){
    var w = el("div","thumb");
    var im = document.createElement("img");
    im.src = SlateStore.blobUrl(id); im.alt = "";
    im.onerror = function(){ w.remove(); };
    w.appendChild(im);
    if(writable()){
      var x = el("button"); x.appendChild(ico("x","sm"));
      x.setAttribute("aria-label","Remove image");
      x.onclick = function(){
        askConfirm("Remove this image?", "It's deleted from the board for both of you.", "Remove")
          .then(function(ok){
            if(!ok) return;
            var cur = currentNote();
            if(!cur) return;
            var left = (cur.images||[]).filter(function(i){ return i !== id; });
            patchNote(cur.id, { images: left }).then(function(){
              if(S.assets) S.assets.delete(id).catch(function(){});
            });
          });
      };
      w.appendChild(x);
    }
    edImgs.appendChild(w);
  });
}

function noteKind(n){
  var k = n && n.kind;
  return (k === "doc" || k === "board") ? k : "note";
}
function isDocOpen(){ return !!S.openNote && ed.kind === "doc"; }
/* the rich editor, on a doc, in Write mode, for someone who can save */
function richLive(){
  return ed.surface === "rich" && S.docMode === "write" && writable() && !!S.openNote && isDocOpen();
}

function openNote(id, fresh){
  var n = null;
  for(var i=0;i<S.notes.length;i++) if(S.notes[i].id === id) n = S.notes[i];
  if(!n) return;
  if(S.openNote && dirty) flushNote();
  S.openNote = id;
  var kind = noteKind(n);
  var isBoard = kind === "board", isDoc = kind === "doc";
  edEditor.className = isDoc ? "doc" : isBoard ? "whiteboard" : "";
  ed.kind = kind;

  /* A doc opens in the rich editor unless this device was switched to Markdown
     view — the escape hatch if the rich editor misbehaves somewhere — or the
     parser failed to load, when the textarea is always there to fall back on. */
  ed.surface = isDoc && window.SlateDocMd && prefGet("docView", "rich") !== "markdown" ? "rich" : "text";
  ed.base = n.body || ""; ed.baseTitle = n.title || "";
  ed.edited = false; ed.known = {}; ed.known[n.updatedAt || ""] = true;
  ed.baseAt = n.updatedAt || "";
  /* this device's own save still on its way: open what it will write */
  var qs = queuedSave[id];
  if(qs && (!n.updatedAt || qs.at > n.updatedAt)){
    ed.baseAt = qs.at;
    if(qs.body !== undefined) ed.base = qs.body || "";
    if(qs.title !== undefined) ed.baseTitle = qs.title || "";
    ed.known[qs.at] = true;
  }
  ed.conflict = ed.held = ed.mine = ed.range = ed.after = null;
  dirty = false;
  clearTimeout(saveT);

  edTitle.value = ed.baseTitle;
  edTitle.placeholder = isDoc ? "Name this doc"
                      : isBoard ? "Name this page" : "Name this note";
  edTitle.disabled = edBody.disabled = edProj.disabled = !writable();
  freshRich();
  if(ed.surface === "rich"){ loadRich(ed.base); edBody.value = ""; }
  else edBody.value = ed.base;

  /* which parts show for this kind */
  $("#inkbar").style.display = isBoard ? "" : "none";
  inkWrap.style.display = isBoard ? "" : "none";
  $("#inkFoot").style.display = isBoard ? "" : "none";
  inkTextEl.style.display = "";
  if(!isBoard) inkTextEl.classList.remove("on");
  $("#edModes").style.display = isDoc ? "" : "none";
  edBody.placeholder = isDoc
    ? "This is the doc as it's stored: # heading, **bold**, - list, - [ ] checklist. Leave a blank line between prompts."
    : "Write it down.";
  S.docMode = "write";
  closeLinkRow(false);
  applyDocMode();
  paintConflict();

  fillProjSelect(n.projectId);
  fillSpaceSelect(n.projectId, n.spaceId);
  drawEdImgs();
  $("#edTask").style.display = writable() ? "" : "none";
  $("#edToDoc").style.display = writable() && kind === "note" ? "" : "none";
  $("#edDelete").style.display = writable() ? "" : "none";
  edStatus.textContent = writable() ? ("Edited " + relTime(n.updatedAt)) : "Read only";

  /* words saved to this device when the app was last put away, that never made
     it to the server: put them back, or ask if the note has changed since */
  var dr = !isBoard && writable() ? readDraft(id) : null;
  if(dr && typeof dr.body === "string"){
    if(dr.body === ed.base && (dr.title || "") === ed.baseTitle) dropDraft(id);
    else {
      edTitle.value = dr.title || "";
      loadSurface(dr.body);
      ed.edited = true;
      if((n.updatedAt || "") > (dr.base || "")){      // changed on the server since: their call
        dirty = true;
        ed.conflict = n;
        paintConflict();
        edStatus.textContent = "Not saved yet";
      } else {
        markDirty();
      }
    }
  }

  overlay.classList.add("on");
  document.body.style.overflow = "hidden";

  if(isBoard){ openInk(id); edTitle.focus(); }
  else if(fresh){ edTitle.focus(); edTitle.select(); }
  else bodySurface().focus();
}
function bodySurface(){ return ed.surface === "rich" && isDocOpen() ? edRich : edBody; }
function closeNote(){
  /* both versions are still in play: closing now would either overwrite theirs
     or drop ours without anyone having chosen */
  if(ed.conflict){
    toast("Pick a version first. Yours isn't saved yet.");
    edConflict.classList.remove("flash"); void edConflict.offsetWidth; edConflict.classList.add("flash");
    return;
  }
  if(dirty) flushNote();                 // drops the device copy once it's saved
  else if(S.openNote) dropDraft(S.openNote);   // nothing unsaved: e.g. they chose theirs
  closeLinkRow(false);
  closeInk();
  S.openNote = null;
  ed.held = ed.mine = null;
  overlay.classList.remove("on");
  document.body.style.overflow = "";
  edEditor.classList.remove("kbd", "typing");
  closeAssignee();
  render();
}
function fillSpaceSelect(projectId, current){
  var sp = $("#edSpace");
  sp.textContent = "";
  var list = projectId ? spacesOf(projectId) : [];
  sp.style.display = list.length ? "" : "none";
  var o0 = document.createElement("option");
  o0.value = ""; o0.textContent = "No space";
  sp.appendChild(o0);
  list.forEach(function(x){
    var o = document.createElement("option");
    o.value = x.id; o.textContent = x.name || "Untitled space";
    sp.appendChild(o);
  });

  sp.disabled = !writable();
}
$("#edSpace").addEventListener("change", function(){
  if(!S.openNote) return;
  patchNote(S.openNote, { spaceId: $("#edSpace").value || null });
});
function fillProjSelect(current){
  edProj.textContent = "";
  var o0 = document.createElement("option");
  o0.value = ""; o0.textContent = "Nothing — keep it loose";
  edProj.appendChild(o0);
  S.projects.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }).forEach(function(p){
    var o = document.createElement("option");
    o.value = p.id; o.textContent = p.name || "Untitled project";
    edProj.appendChild(o);
  });
  edProj.value = current || "";

/* The body as it stands. A doc that nobody has typed in hands back the exact
   string it was opened with — opening an old doc must never rewrite it. */
function bodyNow(){
  if(ed.surface === "rich" && isDocOpen()){
    return ed.edited ? SlateDocMd.serialize(SlateDocMd.fromDom(edRich, "live")) : ed.base;
  }
  return edBody.value;
}
function markDirty(){
  if(!S.openNote) return;
  if(!writable()){ edRich.contentEditable = "false"; return; }   // turned read-only mid-edit (a 403)
  dirty = true;
  // they changed it while we sat here; now that we're typing too, it's a choice
  if(ed.held){ ed.conflict = ed.held; ed.held = null; paintConflict(); }
  clearTimeout(saveT);
  if(ed.conflict){ edStatus.textContent = "Not saved yet"; return; }
  edStatus.textContent = "Saving…";
  saveT = setTimeout(flushNote, 700);
}
function flushNote(){
  clearTimeout(saveT);
  if(!S.openNote || !dirty || ed.conflict) return Promise.resolve();
  var id = S.openNote, title = edTitle.value, body = bodyNow();
  if(typeof body !== "string") return Promise.resolve();
  dirty = false;
  ed.base = body; ed.baseTitle = title; ed.edited = false;
  return saveNote(id, { title: title, body: body }).then(function(ok){
    if(ok){ var d = readDraft(id); if(d && d.body === body && d.title === title) dropDraft(id); }
    if(S.openNote !== id) return;
    if(ok){ if(!dirty) edStatus.textContent = "Saved"; }
    else { dirty = true; edStatus.textContent = "Not saved"; }
  });
}
/* The newest save of each note that hasn't reached the store yet. Reopening a
   doc while its closing save still waits behind an earlier one used to load the
   older text, then take that save's echo for someone else's change — and "Keep
   mine" wrote the older text back over the last words typed. */
var queuedSave = {};
/* patchNote's write, except the editor learns whether it failed: queue() hands
   an error to dbErr and resolves anyway, and a save that didn't happen must not
   say "Saved" or leave the editor believing it has nothing left to send. */
function saveNote(id, patch){
  if(!writable()) return Promise.resolve(false);
  patch.updatedAt = nowISO();
  patch.updatedBy = S.uid || null;
  if(id === S.openNote){ ed.known[patch.updatedAt] = true; if(patch.body !== undefined) ed.baseAt = patch.updatedAt; }
  var at = patch.updatedAt;
  if(patch.body !== undefined || patch.title !== undefined){
    var prev = queuedSave[id] || {};
    queuedSave[id] = {
      at: at,
      body: patch.body !== undefined ? patch.body : prev.body,
      title: patch.title !== undefined ? patch.title : prev.title
    };
  }
  var failed = false;
  return queue("notes/"+id, function(){
    return S.db.doc("notes/"+id).update(patch).catch(function(e){ failed = true; throw e; });
  }).then(function(){
    if(queuedSave[id] && queuedSave[id].at === at) delete queuedSave[id];
    return !failed;
  }, function(e){
    if(queuedSave[id] && queuedSave[id].at === at) delete queuedSave[id];
    throw e;
  });
}
edTitle.addEventListener("input", markDirty);
edBody.addEventListener("input", markDirty);
edTitle.addEventListener("blur", flushNote);
edBody.addEventListener("blur", flushNote);

/* Leaving the app is when the last 700ms of typing is most at risk: iOS pauses
   timers the moment an installed app is swiped away and may never fire blur. */
function saveOnLeave(){
  if(!S.openNote || !dirty || ed.kind === "board") return;
  /* The save below can sit behind an autosave still in flight, so for a moment
     the newest words exist only in a promise — and iOS may freeze or kill the
     app right now. A copy on the device survives that; the next open of this
     note offers it back (openNote). A conflict isn't saved at all, so it goes
     to the device copy only. */
  var body = bodyNow();
  if(typeof body === "string"){
    prefSet("draft:" + S.openNote, JSON.stringify({ title: edTitle.value, body: body, base: ed.baseAt || "", at: nowISO() }));
  }
  if(ed.conflict) return;
  flushNote();
  if(S.db && S.db.flushNow) S.db.flushNow().catch(function(){});
}
function readDraft(id){
  try{ return JSON.parse(prefGet("draft:" + id, "null")); }catch(e){ return null; }
}

/* ---- the other person changed the open note ----

   and so does every change to its project or pictures; only a title or body
   this device hasn't seen is news. */
function edSync(n){
  var stamp = n.updatedAt || "";
  if(ed.known[stamp]) return;
  ed.known[stamp] = true;
  var shown = ed.conflict || ed.held;
  var body = n.body || "", title = n.title || "";
  if(body === ed.base && title === ed.baseTitle && !shown) return;
  if(shown && body === (shown.body || "") && title === (shown.title || "")) return;
  // turned into a doc on the other device: reopen as what it is now
  if(noteKind(n) !== ed.kind && !dirty){ openNote(n.id); return; }
  if(dirty || ed.conflict){ ed.conflict = n; ed.held = null; paintConflict(); return; }
  /* Rebuilding the text under a live caret drops the keyboard, cancels a word
     being dictated or written with the Pencil, and jumps the caret — so it waits
     until the caret leaves. Typing first makes it a choice instead. */
  if(document.activeElement === bodySurface()){ ed.held = n; paintConflict(); return; }
  edTake(n);
}
function edTake(n){
  ed.held = ed.conflict = null;

  ed.base = n.body || ""; ed.baseTitle = n.title || ""; ed.edited = false;
  /* their title goes in even while the title field has focus — skipping it left
     the old name in the field, and the next save quietly wrote it back */
  if(edTitle.value !== ed.baseTitle){
    var f = document.activeElement === edTitle, a0 = edTitle.selectionStart, a1 = edTitle.selectionEnd;
    edTitle.value = ed.baseTitle;

  }

/* ============ doc read mode ============ */
var edRead = $("#edRead");

/* a doc's clean text, for previews, search and task names */
function docPlain(body){ return window.SlateDocMd ? SlateDocMd.plain(body) : String(body || ""); }

function copyText(text, btn){
  function ok(){
    var old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.textContent = "Copied";
    btn.classList.add("ok");
    setTimeout(function(){ btn.textContent = old; btn.classList.remove("ok"); }, 1300);
  }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); ok(); }
    catch(e){ toast("Couldn't copy here — select the text instead."); }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, fallback);
  } else fallback();
}

/* Read mode paints what's in the editor now, not what the store has: a save is

function renderDocRead(){
  paintDocBlocks(edRead, bodyNow(), {
    readOnly: !writable(),
    onTask: function(line, text, checked){
      var nb = window.SlateDocMd && SlateDocMd.toggleTask(bodyNow(), line, text, checked);
      if(nb == null){ renderDocRead(); return; }
      ed.base = nb; ed.edited = false;

      dirty = true;
      flushNote();
      renderDocRead();

/* One painter for the editor's Read mode and the project doc tab, so they can't
   drift apart. Built from nodes, never HTML. Copy hands over clean text — what
   you see, list markers kept — never the markdown underneath. */
function paintDocBlocks(box, text, opts){
  opts = opts || {};

  var blocks = M ? M.parse(text) : [];

    var raw = el("div","blk"), rp = el("p");
    richText(rp, text);
    raw.appendChild(rp);
    box.appendChild(raw);
    return;
  }

    var e = el("div","blk");
    e.appendChild(el("p", null,

    box.appendChild(e);
    return;

  M.units(blocks).forEach(function(u){
    var w = el("div", "blk" + (u.t === "hr" ? " blkhr" : u.t === "h" ? " heading" : ""));
    u.blocks.forEach(function(b){ w.appendChild(readBlock(b, opts)); });
    var copy = null;

    } else if(u.t !== "hr") copy = { label: "Copy", text: M.unitText(u) };

/* ============ doc editor ============

   (execCommand), because those are what native undo, the iOS B/I/U menu,

   rebuilds the DOM under a live caret. The DOM is read back into markdown only
   when something was typed; lib/docmd.js does the reading and writing. */

  catch(e){ return false; }

   on a reused element ⌘Z could replay the last doc's typing into this one. */

  edRich = next;
  wireRich(edRich);

     been replaced — so "typing" (which hides the phone footer) was never
     cleared, leaving no Close after See theirs / Put mine back */

  on("paste", onRichPaste);
  on("copy", function(e){ onRichCopy(e, false); });
  on("cut", function(e){ onRichCopy(e, true); });

  on("dragend", function(){ ed.dragging = false; });

  on("mousedown", onRichBox);

    setTimeout(function(){
      if(r !== edRich || document.activeElement === edRich || document.activeElement === edLinkUrl) return;
      edEditor.classList.remove("typing");

      flushNote();
      if(ed.held && !dirty && !edTools.classList.contains("linking")) edTake(ed.held);

/* ---- where the caret is ---- */
function selRange(){

}

    if(node.nodeType === 1 && test(node)) return node;
    node = node.parentNode;
  }

var BLOCK_TAG = /^(P|DIV|H[1-6]|LI|PRE|BLOCKQUOTE)$/;
function blockAt(node){ return upTo(node, function(n){ return BLOCK_TAG.test(n.nodeName); }); }

function textOfFrag(f){

   tight to it (data-gap="0"), so the browser's list, heading and quote commands

   the same block; Return on an empty line turns it into the gap that starts a

    if(soft) return null;                         // Shift+Return: another line in the item

    return null;                                  // the browser makes the next item, or ends the list
  }

         after stayed code. Instead: drop the empty line and put a fresh paragraph
         straight after the block, the way afterRule() does for a rule. */

      return function(){ moveSel("backward", at.head.length, true); exec("delete"); if(exec("insertHorizontalRule")) afterRule(); };
    }
    if(alone && /^```\w*$/.test(line)){
      return function(){ moveSel("backward", at.head.length, true); exec("delete"); exec("formatBlock", "<pre>"); };
    }

  if(r.collapsed && !(at.before + at.after).trim()){

  tool:"pen", color:"#1B1A17",
  chunks:[],                          // [{id, strokes:[]}]
  live:null,                          // stroke being drawn
  scale:1, unsub:null, noteId:null,
  penSeen:false, saveT:null, dirtyChunks:{}
};

function inkFit(){
  ink.lastFitW = inkWrap.clientWidth;
  var avail = Math.max(320, inkWrap.clientWidth - 2);
  ink.scale = Math.min(1, avail / INK_W);
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  inkCanvas.width = Math.round(INK_W * ink.scale * dpr);
  inkCanvas.height = Math.round(INK_H * ink.scale * dpr);
  inkCanvas.style.width = Math.round(INK_W * ink.scale) + "px";
  inkCanvas.style.height = Math.round(INK_H * ink.scale) + "px";
  ctx.setTransform(ink.scale * dpr, 0, 0, ink.scale * dpr, 0, 0);
  inkRedraw();
}

function allStrokes(){
  var out = [];
  ink.chunks.forEach(function(c){ (c.strokes || []).forEach(function(s){ out.push(s); }); });
  return out;
}

/* points are stored flat: [x,y,pressure*100, ...] */
function strokePoints(s){
  var p = s.p || [], out = [];
  for(var i=0;i+2<p.length+1;i+=3) out.push({x:p[i], y:p[i+1], pr:(p[i+2]||50)/100});
  return out;
}

function drawStroke(c, s){
  var pts = strokePoints(s);
  if(!pts.length) return;
  c.lineCap = "round";
  c.lineJoin = "round";
  c.strokeStyle = s.c || "#1B1A17";
  c.globalAlpha = s.m ? 0.32 : 1;
  var base = s.w || 2.6;

  if(pts.length === 1){
    c.globalAlpha = s.m ? 0.32 : 1;
    c.fillStyle = s.c || "#1B1A17";
    c.beginPath();
    c.arc(pts[0].x, pts[0].y, base * 0.5, 0, Math.PI*2);
    c.fill();
    c.globalAlpha = 1;
    return;
  }
  /* variable width: draw segment by segment so pressure shows */
  for(var i=1;i<pts.length;i++){
    var a = pts[i-1], b = pts[i];
    var mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
    var prev = pts[i-2] ? { x:(pts[i-2].x+a.x)/2, y:(pts[i-2].y+a.y)/2 } : a;
    c.lineWidth = s.m ? base : base * (0.42 + 0.58 * ((a.pr + b.pr)/2));
    c.beginPath();
    c.moveTo(prev.x, prev.y);
    c.quadraticCurveTo(a.x, a.y, mid.x, mid.y);
    c.stroke();
  }
  c.globalAlpha = 1;
}

function inkRedraw(){
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,inkCanvas.width,inkCanvas.height);
  ctx.restore();
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,INK_W,INK_H);
  /* faint ruled lines to write on */
  ctx.strokeStyle = "rgba(60,72,92,.13)";
  ctx.lineWidth = 1;
  for(var y=90;y<INK_H;y+=54){
    ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(INK_W-40,y); ctx.stroke();
  }
  allStrokes().forEach(function(s){ drawStroke(ctx, s); });
  if(ink.live) drawStroke(ctx, ink.live);
}

/* one-euro-ish smoothing on the way in, then a cleanup pass on lift */
function smoothStroke(raw){
  if(raw.length < 3) return raw;
  /* 1. resample: drop points that barely moved */
  var kept = [raw[0]];
  for(var i=1;i<raw.length;i++){
    var last = kept[kept.length-1];
    var d = Math.hypot(raw[i].x-last.x, raw[i].y-last.y);
    if(d >= 1.6 || i === raw.length-1) kept.push(raw[i]);
  }
  if(kept.length < 3) return kept;
  /* 2. two Chaikin passes — rounds off the shake without losing letterforms */
  var pts = kept;
  for(var pass=0; pass<2; pass++){
    var out = [pts[0]];
    for(var j=0;j<pts.length-1;j++){
      var a = pts[j], b = pts[j+1];
      out.push({x:a.x*0.75+b.x*0.25, y:a.y*0.75+b.y*0.25, pr:a.pr*0.75+b.pr*0.25});
      out.push({x:a.x*0.25+b.x*0.75, y:a.y*0.25+b.y*0.75, pr:a.pr*0.25+b.pr*0.75});
    }
    out.push(pts[pts.length-1]);
    pts = out;
  }
  /* 3. even out pressure so weight doesn't jitter mid-letter */
  var sm = pts.map(function(p){ return p.pr; });
  for(var k=1;k<sm.length-1;k++) sm[k] = (sm[k-1]+sm[k]*2+sm[k+1])/4;
  pts.forEach(function(p,idx){ p.pr = sm[idx]; });
  return pts;
}

function packStroke(pts, color, marker, width){
  var flat = [];
  pts.forEach(function(p){
    flat.push(Math.round(p.x*10)/10, Math.round(p.y*10)/10, Math.round(Math.max(0.05,Math.min(1,p.pr))*100));
  });
  var s = { p: flat, c: color, w: width };
  if(marker) s.m = 1;
  return s;
}

function inkPos(e){
  var r = inkCanvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / ink.scale,
    y: (e.clientY - r.top) / ink.scale,
    pr: (e.pressure && e.pressure > 0) ? e.pressure : 0.5
  };
}

var rawPts = [], smoothPt = null, drawingId = null;

inkCanvas.addEventListener("pointerdown", function(e){
  if(!writable()) return;
  if(e.pointerType === "pen") ink.penSeen = true;
  if(e.pointerType === "touch" && ink.penSeen) return;   // palm rejection
  if(e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  inkCanvas.setPointerCapture(e.pointerId);
  drawingId = e.pointerId;

  var p = inkPos(e);
  if(ink.tool === "eraser"){ eraseAt(p); return; }
  rawPts = [p];
  smoothPt = {x:p.x, y:p.y, pr:p.pr};
  ink.live = packStroke([p], ink.color, ink.tool === "marker",
                        ink.tool === "marker" ? 14 : 2.8);
  inkRedraw();
});

inkCanvas.addEventListener("pointermove", function(e){
  if(drawingId !== e.pointerId || !writable()) return;
  e.preventDefault();
  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if(!evs.length) evs = [e];

  if(ink.tool === "eraser"){
    evs.forEach(function(ev){ eraseAt(inkPos(ev)); });
    return;
  }
  evs.forEach(function(ev){
    var p = inkPos(ev);
    /* live smoothing — this is what steadies the line as you write */
    smoothPt.x += (p.x - smoothPt.x) * 0.45;
    smoothPt.y += (p.y - smoothPt.y) * 0.45;
    smoothPt.pr += (p.pr - smoothPt.pr) * 0.3;
    rawPts.push({x:smoothPt.x, y:smoothPt.y, pr:smoothPt.pr});
  });
  ink.live = packStroke(rawPts, ink.color, ink.tool === "marker",
                        ink.tool === "marker" ? 14 : 2.8);
  inkRedraw();
});

function endStroke(e){
  if(drawingId !== e.pointerId) return;
  drawingId = null;
  try{ inkCanvas.releasePointerCapture(e.pointerId); }catch(err){}
  if(ink.tool === "eraser"){ saveInk(); return; }
  if(!rawPts.length){ ink.live = null; return; }
  /* the cleanup pass — the finished stroke is tidier than what you drew */
  var cleaned = smoothStroke(rawPts);
  var s = packStroke(cleaned, ink.color, ink.tool === "marker",
                     ink.tool === "marker" ? 14 : 2.8);
  ink.live = null;
  rawPts = [];
  addStroke(s);
  inkRedraw();
  saveInk();
}
inkCanvas.addEventListener("pointerup", endStroke);
inkCanvas.addEventListener("pointercancel", endStroke);
inkCanvas.addEventListener("pointerleave", function(e){ if(drawingId === e.pointerId) endStroke(e); });

function addStroke(s){
  var last = ink.chunks[ink.chunks.length-1];
  if(!last || JSON.stringify(last.strokes).length > 170000){
    last = { id: "c" + uid(), strokes: [] };
    ink.chunks.push(last);
  }
  last.strokes.push(s);
  ink.dirtyChunks[last.id] = true;
}

function eraseAt(p){
  var hit = false;
  ink.chunks.forEach(function(c){
    var keep = (c.strokes || []).filter(function(s){
      var pts = strokePoints(s);
      for(var i=0;i<pts.length;i++){
        if(Math.hypot(pts[i].x-p.x, pts[i].y-p.y) < 13){ hit = true; return false; }
      }
      return true;
    });
    if(keep.length !== (c.strokes||[]).length){ c.strokes = keep; ink.dirtyChunks[c.id] = true; }
  });
  if(hit) inkRedraw();
}

/* The actual write, callable straight away so closing a page doesn't outrun it. */
function writeInk(){
  clearTimeout(ink.saveT);
  ink.saveT = null;
  if(!writable() || !ink.noteId || !S.db) return;
  var noteId = ink.noteId;
  var ids = Object.keys(ink.dirtyChunks);
  if(!ids.length) return;
  ink.dirtyChunks = {};
  ids.forEach(function(cid){
    var c = null;
    for(var i=0;i<ink.chunks.length;i++) if(ink.chunks[i].id === cid) c = ink.chunks[i];
    /* A chunk that is no longer in ink.chunks is one a snapshot replaced while
       this save was pending — not a page someone erased. The old code deleted it
       here, throwing away the very strokes it had been scheduled to write. */
    if(!c) return;
    var ref = S.db.doc("notes/"+noteId).collection("strokes").doc(cid);
    queue("ink/"+noteId+"/"+cid, function(){
      if(!c.strokes.length) return ref.delete();   // genuinely erased
      return ref.set({ strokes: c.strokes, at: nowISO() });
    });
  });
  patchNote(noteId, {});
}
function saveInk(){
  if(!writable() || !ink.noteId) return;
  clearTimeout(ink.saveT);
  ink.saveT = setTimeout(writeInk, 500);
}

function openInk(noteId){
  ink.noteId = noteId;
  ink.chunks = [];
  ink.live = null;
  ink.dirtyChunks = {};
  inkTextEl.classList.remove("on");
  inkTextEl.textContent = "";
  setInkTool(ink.tool);
  setInkColor(ink.color);
  inkFit();
  if(ink.unsub){ ink.unsub(); ink.unsub = null; }
  if(!S.db) return;
  ink.unsub = S.db.doc("notes/"+noteId).collection("strokes").onSnapshot(function(snap){
    if(ink.noteId !== noteId) return;
    ink.chunks = snap.docs.map(function(d){
      return { id: d.id, strokes: (d.data().strokes || []) };
    });
    inkRedraw();
  }, function(){ /* drawing still works locally */ });
  $("#inkToText").style.display = (S.sample && S.canSampleImages) ? "" : "none";
}
function closeInk(){
  if(ink.unsub){ ink.unsub(); ink.unsub = null; }
  /* Write first. Cancelling the debounce here silently dropped whatever was
     drawn in the half-second before the page was closed. */
  writeInk();
  ink.noteId = null;
  ink.chunks = [];
  ink.live = null;
}

function setInkTool(t){
  ink.tool = t;
  Array.prototype.forEach.call($("#inkbar").querySelectorAll("[data-ink]"), function(b){
    b.classList.toggle("on", b.dataset.ink === t);
  });
  inkCanvas.style.cursor = t === "eraser" ? "cell" : "crosshair";
}
function setInkColor(c){
  ink.color = c;
  Array.prototype.forEach.call($("#inkbar").querySelectorAll(".swatch"), function(b){
    b.classList.toggle("on", b.dataset.color === c);
  });
}
$("#inkbar").addEventListener("click", function(e){
  var t = e.target.closest("[data-ink]");
  if(t){ setInkTool(t.dataset.ink); return; }
  var s = e.target.closest(".swatch");
  if(s){ setInkColor(s.dataset.color); if(ink.tool === "eraser") setInkTool("pen"); }
});
$("#inkUndo").onclick = function(){
  if(!writable()) return;
  for(var i=ink.chunks.length-1;i>=0;i--){
    if(ink.chunks[i].strokes && ink.chunks[i].strokes.length){
      ink.chunks[i].strokes.pop();
      ink.dirtyChunks[ink.chunks[i].id] = true;
      inkRedraw();
      saveInk();
      return;
    }
  }
};
$("#inkClear").onclick = function(){
  if(!writable() || !ink.noteId) return;
  askConfirm("Clear this page?", "Every stroke on it goes, for both of you.", "Clear")
    .then(function(ok){
      if(!ok) return;
      ink.chunks.forEach(function(c){ c.strokes = []; ink.dirtyChunks[c.id] = true; });
      inkRedraw();
      saveInk();
    });
};
$("#inkToText").onclick = function(){
  if(!S.sample || !ink.noteId) return;
  if(!allStrokes().length){ toast("Write something first."); return; }
  var btn = $("#inkToText");
  btn.disabled = true;
  btn.textContent = "Reading it…";
  inkTextEl.classList.add("on");
  inkTextEl.textContent = "Working through your handwriting…";

  var out = document.createElement("canvas");
  out.width = INK_W; out.height = INK_H;
  var o = out.getContext("2d");
  o.fillStyle = "#fff"; o.fillRect(0,0,INK_W,INK_H);
  allStrokes().forEach(function(s){ drawStroke(o, s); });

  out.toBlob(function(blob){
    if(!blob){ finish("Couldn't read the page."); return; }
    S.sample(
      "This image is a page of handwriting from a notebook app. Transcribe it into plain text, " +
      "keeping the line breaks and any bullet points or lists. Return only the transcription, " +
      "with no preamble, no commentary and no markdown fences. If a word is unclear, put your " +
      "best guess in [square brackets]. If the page has no legible writing, reply exactly: (nothing legible)",
      { images: blob, modelTier: "default" }
    ).then(function(r){
      var text = (r.text || "").trim();
      finish(text || "(nothing legible)");
      if(text && text !== "(nothing legible)" && S.openNote === ink.noteId){
        var existing = edBody.value.trim();
        edBody.value = existing ? existing + "\n\n" + text : text;
        markDirty();
        flushNote();
      }
    }).catch(function(e){
      var c = (e && e.code) || "";
      if(c === "not_granted") finish("You'd need to allow this page to ask Claude before it can read handwriting.");
      else if(c === "rate_limited") finish("Too many requests just now — try again in a minute.");
      else if(c === "images_unavailable") finish("Handwriting reading isn't available on this account.");
      else finish("That didn't come back. Try again.");
    });
  }, "image/png");

  function finish(msg){
    btn.disabled = false;
    btn.textContent = "Turn writing into text";
    inkTextEl.textContent = msg;
  }
};
function inkScroll(dir){
  var step = Math.max(160, inkWrap.clientHeight * 0.72);
  inkWrap.scrollBy({ top: dir * step, behavior: "smooth" });
}
$("#inkUp").onclick = function(){ inkScroll(-1); };
$("#inkDown").onclick = function(){ inkScroll(1); };
window.addEventListener("resize", function(){ if(ink.noteId) inkFit(); });
/* Rotating an iPad, entering Split View, or the editor's flex height resolving a
   frame late all change the drawing area without firing a window resize. Refit only
   when the WIDTH actually moved: this observes the element whose own child we then
   resize, so reacting to every change would chase its own tail. */
if(window.ResizeObserver){
  new ResizeObserver(function(){
    if(!ink.noteId) return;
    var w = inkWrap.clientWidth;
    if(w === ink.lastFitW) return;
    inkFit();
  }).observe(inkWrap);
}

/* ============ profiles ============ */
function paintPeople(){
  if(!S.user) return;
  var nodes = Array.prototype.slice.call(document.querySelectorAll("[data-uid]"));
  var ids = [];
  nodes.forEach(function(n){ if(n.dataset.uid && ids.indexOf(n.dataset.uid) === -1) ids.push(n.dataset.uid); });
  if(!ids.length) return;
  S.user.profiles(ids).then(function(ps){
    nodes.forEach(function(n){
      var p = ps[n.dataset.uid];
      if(!p) return;
      if(n.tagName === "IMG"){ n.src = p.avatarUrl; n.title = p.name || "Someone"; n.alt = p.name || "Someone"; }
      else { n.textContent = p.name || "Someone"; }
    });
  });
}

/* ============ render ============ */
/* render() rebuilds the page on every snapshot — your own drops (the store emits
   optimistically), every change the other person makes, every resync when the
   app comes back to the foreground. Rebuilt boards and tab rows start scrolled to
   zero, which on a phone threw you back to the first column after every drag.
   So each one is keyed, and its scroll put back — but only while you're still
   looking at the same thing; arriving somewhere new should start fresh. */
var lastViewSig = null;
function viewSig(){
  return [S.sel, S.tab, S.space || "", S.doc || "", S.q ? "q" : ""].join("|");
}
function keepScroll(){
  var k = { sig: lastViewSig, boards: {}, cols: {}, tabs: 0 };
  Array.prototype.forEach.call(bodyEl.querySelectorAll(".board[data-key]"), function(b){
    if(b.scrollLeft) k.boards[b.dataset.key] = b.scrollLeft;
    Array.prototype.forEach.call(b.querySelectorAll(".col-body"), function(cb){
      if(cb.scrollTop) k.cols[b.dataset.key + "|" + cb.dataset.status] = cb.scrollTop;
    });
  });
  var tabs = headEl.querySelector(".tabs");
  if(tabs) k.tabs = tabs.scrollLeft;
  return k;
}
function restoreScroll(k){
  var sig = viewSig(), same = k.sig === sig;
  lastViewSig = sig;
  var tabs = headEl.querySelector(".tabs");
  if(!same){
    /* a new tab or space: bring its tab into view, sideways only — scrollIntoView
       would also scroll the page to the header on every update */
    var on = tabs && tabs.querySelector(".tab.on");
    if(on){
      var tr = tabs.getBoundingClientRect(), orr = on.getBoundingClientRect();
      var vs = tabs.querySelector(".viewswitch");
      var right = vs && getComputedStyle(vs).position === "sticky" ? vs.getBoundingClientRect().left : tr.right;
      if(orr.left < tr.left) tabs.scrollLeft -= tr.left - orr.left + 12;
      else if(orr.right > right) tabs.scrollLeft += orr.right - right + 12;
    }
    return;
  }
  if(tabs && k.tabs) tabs.scrollLeft = k.tabs;
  Object.keys(k.boards).forEach(function(key){
    var b = bodyEl.querySelector('.board[data-key="' + key + '"]');
    if(b) b.scrollLeft = k.boards[key];
  });
  Object.keys(k.cols).forEach(function(key){
    var cut = key.lastIndexOf("|");
    var cb = bodyEl.querySelector('.board[data-key="' + key.slice(0, cut) + '"] .col-body[data-status="' + key.slice(cut + 1) + '"]');
    if(cb) cb.scrollTop = k.cols[key];
  });
}
/* Dashboard controls are rebuilt too; a keyboard user keeps their place because
   each carries a data-fkey and focus follows it to its replacement. */
function refocus(key){
  var sel = window.CSS && CSS.escape ? CSS.escape(key) : key.replace(/["\\]/g, "\\$&");
  var n = document.querySelector('[data-fkey="' + sel + '"]');
  if(n && n !== document.activeElement){ try{ n.focus({ preventScroll: true }); }catch(e){ n.focus(); } }
}

var restoreCompose = null;
function render(){
  var active = document.activeElement;
  var wasCompose = active && active.classList && active.classList.contains("addtask")
    ? S.composing.col : null;
  var focusKey = wantFocus || (active && active.dataset && active.dataset.fkey) || null;
  wantFocus = null;
  var kept = keepScroll();

  renderRail();
  renderHead();
  updateCapture();

  bodyEl.textContent = "";
  if(!S.ready){
    bodyEl.appendChild(emptyBlock("Opening the board", "One moment.", null));
  } else if(S.q){
    renderSearch();
  } else if(S.sel === "capture"){
    renderCapture();
  } else if(S.sel === "unfiled"){
    renderNotes();
  } else if(S.sel === "today"){
    renderToday();
  } else if(S.sel === "dash"){
    renderDash();
  } else {
    if(S.doc && !isVirtualView(S.sel)) renderDocPage();
    else if(S.sel === "all" && S.tab === "prospects") renderProspects();
    else if(S.tab === "board") renderBoard();
    else if(S.tab === "list") renderList();
    else if(S.tab === "calendar") renderCalendar();
    else renderNotes();
  }

  if(S.ready && !S.projects.length && !S.tasks.length && !S.notes.length && (S.sel === "dash" || S.sel === "all")){
    bodyEl.textContent = "";
    var act = el("button","btn primary","Create your first project");
    act.onclick = function(){
      S.newProject = true; S.newProjectText = "";
      openRail();
      render();
    };
    bodyEl.appendChild(emptyBlock(
      "Start with a project",
      "A project holds a board of tasks and a stack of notes. Add one for each client or piece of work, or keep notes loose in Unfiled notes.",
      writable() ? act : null
    ));
  }

  restoreScroll(kept);
  if(focusKey) refocus(focusKey);

  if(wasCompose){
    var inp = bodyEl.querySelector('.col[data-status="'+wasCompose+'"] .addtask');
    if(inp){ inp.value = S.composing.text; inp.focus(); }
  }
  /* the new-space field sits in a row that scrolls sideways under the pinned
     view buttons: bring it into view, with the keyboard */
  if(S.newSpaceFor){
    var ns = headEl.querySelector(".tabnew");
    if(ns && document.activeElement !== ns){
      ns.focus({ preventScroll:true });
      try{ ns.setSelectionRange(ns.value.length, ns.value.length); }catch(e){}
      ns.scrollIntoView({ block:"nearest", inline:"center" });
    }
  }
  if(S.newProject){
    var np = railEl.querySelector(".rail-new input");
    if(np && document.activeElement !== np){
      np.focus();
      np.setSelectionRange(np.value.length, np.value.length);
    }
  }

  renderBottomNav();
  paintPeople();
}

/* ============ search ============ */

/* ============ boot ============ */
S.tab = prefGet("tab","board");
if(["board","list","calendar","notes","prospects"].indexOf(S.tab) === -1) S.tab = "board";

/* A notification tap lands on ?view=today (&sec=done from the evening wrap).
   The query is consumed then cleared so a reload doesn't re-jump. */
try{
  var bootQ = new URLSearchParams(location.search);
  if(bootQ.get("view") === "today"){
    S.sel = "today";
    S.todaySec = bootQ.get("sec");
    history.replaceState(null, "", location.pathname);
  } else if(bootQ.get("view") === "all"){
    S.sel = "all";
    history.replaceState(null, "", location.pathname);
  }
}catch(e){}

/* A tap while the app is already open arrives as a message from the service
   worker instead — switch views in place rather than reloading. */
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", function(e){
    var m = e.data || {};
    if(m.kind !== "open-view" || !m.url) return;
    try{
      var q = new URL(m.url, location.origin).searchParams;
      if(q.get("view") === "today"){
        S.q = "";
        $("#search").value = "";
        S.todaySec = q.get("sec");
        goView("today");
      }
    }catch(err){}
  });
}

function docsToArray(snap){

  });
}

(async function(){

    var who = $("#whoami");
    var img = document.createElement("img");
    img.src = me.avatarUrl; img.alt = "";
    var nm = el("span","nm", me.name || "You");
    who.appendChild(nm); who.appendChild(img);
    /* The dashboard's lens and Workload name people. search("") is memoised in
       store.js and resolves [] offline; a stored lens is only dropped after a
       real, non-empty answer, so a flaky connection never wipes the preference. */
    user.search("").then(function(list){
      if(!list || !list.length) return;
      S.people = [me].concat(list.filter(function(p){ return p.id !== me.id; }));
      if(S.who && !S.people.some(function(p){ return p.id === S.who; })){ S.who = ""; prefSet("who", ""); }
      render();
    }).catch(function(){});
    S.canWrite = await user.can("data.write");
  }

  S.assets = await SlateStore.use("assets");
  S.sample = await SlateStore.use("sample");
  if(S.sample){
    var lim = await S.sample.limits().catch(function(){ return null; });
    S.canSampleImages = !!(lim && lim.images);
  }
  updateCapture();
  var db = await SlateStore.use("db");
  if(!db){
    S.ready = true;
    banner("Can't reach the database, so nothing can be saved right now. Check your connection and reload.");
    render();
    return;
  }
  S.db = db;

  /* Anything that couldn't reach the server is on this device, waiting. Saying so
     is what makes a force-quit with unsynced work survivable — otherwise the only
     signal is silence. First time it happens in a stretch, say it once out loud. */
  var toldOffline = false;
  if(db.outbox) db.outbox(function(state){
    if(state.pending){
      if(!toldOffline){ toldOffline = true; toast("Saved on this phone. It'll sync when you're back."); }
      setBanner("outbox", state.stuck
        ? state.pending + " change" + (state.pending===1?"":"s") + " can't reach the server. Check your connection."
        : state.pending + " change" + (state.pending===1?"":"s") + " waiting to sync.");
    } else {
      toldOffline = false;
      setBanner("outbox", null);
    }
  });

  var got = {projects:false, spaces:false, tasks:false, notes:false, schedules:false, prospects:false};
  function mark(k){
    got[k] = true;
    if(got.projects && got.spaces && got.tasks && got.notes && got.schedules && got.prospects) S.ready = true;
    if(S.ready && holdForTyping()) return;
    render();
  }
  /* The calendar's add field is rebuilt by every render, and on an iPhone
     rebuilding a focused input drops the keyboard mid-word — and the other
     person's autosaves arrive about once per pause in their typing. So their
     changes wait until this field loses focus, then draw in one go. */
  var held = false;
  function holdForTyping(){
    var a = document.activeElement;
    if(!a || !a.classList || !a.classList.contains("cpinput")) return false;
    if(!held){
      held = true;
      a.addEventListener("blur", function(){
        setTimeout(function(){ held = false; render(); }, 0);
      }, { once:true });
    }
    return true;
  }

  db.collection("projects").onSnapshot(function(snap){
    S.projects = docsToArray(snap);
    mark("projects");
  }, dbErr);

  db.collection("spaces").onSnapshot(function(snap){
    S.spaces = docsToArray(snap);
    mark("spaces");
  }, dbErr);

  db.collection("schedules").onSnapshot(function(snap){
    S.schedules = docsToArray(snap);
    mark("schedules");
  }, dbErr);

  db.collection("prospects").onSnapshot(function(snap){
    S.prospects = docsToArray(snap);
    mark("prospects");
  }, dbErr);

  /* not gated on readiness: an empty meta is a perfectly good starting point */
  db.collection("meta").onSnapshot(function(snap){
    var m = {};
    snap.docs.forEach(function(d){ m[d.id] = d.data(); });
    S.meta = m;
  }, function(){});

  db.collection("tasks").onSnapshot(function(snap){
    S.tasks = docsToArray(snap);
    mark("tasks");
  }, dbErr);

  db.collection("notes").onSnapshot(function(snap){
    S.notes = docsToArray(snap);
    if(S.openNote){
      var n = null;
      for(var i=0;i<S.notes.length;i++) if(S.notes[i].id === S.openNote) n = S.notes[i];
      if(!n){
        S.openNote = null; dirty = false; ed.conflict = ed.held = ed.mine = null;
        overlay.classList.remove("on"); document.body.style.overflow = "";
        edEditor.classList.remove("kbd", "typing");
      } else {
        if(!dirty && !ed.conflict && !ed.held) edStatus.textContent = "Edited " + relTime(n.updatedAt);
        drawEdImgs();
        // the other person's edit reloads the text, or asks, but never overwrites silently
        edSync(n);
        /* Every autosave comes back through here. The page behind the editor
           can't be seen, and rebuilding it — tag bar, cards, the doc tab's blocks —
           on each pause in typing is the lag; closeNote() renders on the way out. */
        if(S.ready){ got.notes = true; return; }
      }
    }
    mark("notes");
  }, dbErr);

  setTimeout(function(){ if(!S.ready){ S.ready = true; render(); } }, 4000);

  if(pushSupported()) navigator.serviceWorker.ready.then(paintBell);
})();

})();

if("serviceWorker" in navigator){
  addEventListener("load", function(){
    /* Keep the reason: without it a failed registration is indistinguishable from
       a slow one, and the notifications menu is left guessing. */
    navigator.serviceWorker.register("/sw.js").then(function(reg){
      /* An installed PWA that's only been backgrounded never re-navigates, so it
         can go on running a build from days ago — which looks exactly like a fix
         that didn't work. Say so instead, and let a tap take it. Never reload on
         its own: that would throw away whatever is half-typed. */
      function offerUpdate(){
        setBanner("update", "A new version of Slate is ready — tap to reload.", function(){
          // the open note's last few keystrokes go first; a stuck save can't hold the reload hostage
          var save = window.slateSaveNow ? window.slateSaveNow() : null;
          Promise.race([Promise.resolve(save), new Promise(function(r){ setTimeout(r, 1500); })])
            .catch(function(){}).then(function(){ location.reload(); });
        });
      }
      reg.addEventListener("updatefound", function(){
        var fresh = reg.installing;
        if(!fresh) return;
        fresh.addEventListener("statechange", function(){
          // only when one was already in charge; on a first install there's nothing to replace
          if(fresh.state === "installed" && navigator.serviceWorker.controller) offerUpdate();
        });
      });
      // coming back to the app is the moment worth checking
      document.addEventListener("visibilitychange", function(){
        if(!document.hidden) reg.update().catch(function(){});
      });
    }).catch(function(e){
      window.__slateSwError = (e && e.message) || String(e);
    });
  });
}

</script>
</body>
</html>
