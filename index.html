/* ============ render: dashboard page ============ */
/* The dashboard reads at a glance and acts in place — tick, assign, open — or
   drills somewhere specific. The cross-project board, list, calendar, notes and
   prospects that used to sit under it are All projects now (S.sel "all").
   Everything is worked out from what's already loaded, in one pass per render,
   on the Denver date the briefs use: dashOccRow writes schedule.done[todayS], and
   the Today page and both briefs key that map by the Denver date, so a laptop
   left on another timezone would otherwise tick a different day of the same
   schedule. */

/* ---- dates: YYYY-MM-DD strings and Date.UTC, so no clock or DST can move them ---- */
var SHORT_DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var SHORT_MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function ymdUTC(s){ var p = String(s).split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
function addDays(s, n){ return new Date(ymdUTC(s) + n * 86400000).toISOString().slice(0,10); }
function daysBetween(a, b){ return Math.round((ymdUTC(b) - ymdUTC(a)) / 86400000); }
function dowOf(s){ return new Date(ymdUTC(s)).getUTCDay(); }
function mondayOf(s){ return addDays(s, -((dowOf(s) + 6) % 7)); }
function ymdShort(s){ var d = new Date(ymdUTC(s)); return SHORT_MON[d.getUTCMonth()] + " " + d.getUTCDate(); }
function ymdLabel(s){ return SHORT_DOW[dowOf(s)] + ", " + ymdShort(s); }
function relDay(s, todayS){
  var n = daysBetween(s, todayS);
  return n === 0 ? "Today" : n === 1 ? "Yesterday" : n === -1 ? "Tomorrow" : ymdLabel(s);
}
/* brief.js builds a new Intl formatter on every call, which is too slow to run
   over every finished task on every realtime render on an iPhone. It isn't
   changed here: the cron routes require it too, and the service worker can
   still pair a fresh page with a cached copy. So remember each answer instead. */
var ddayMemo = {};
function ddayOf(iso){
  if(!iso) return null;
  if(!(iso in ddayMemo)) ddayMemo[iso] = SlateBrief.ymdInDenver(iso);
  return ddayMemo[iso];
}
var clockFmt = null;
function denverClock(iso){
  try{
    if(!clockFmt) clockFmt = new Intl.DateTimeFormat("en-US", { timeZone: SlateBrief.TZ, hour: "numeric", minute: "2-digit" });
    return clockFmt.format(new Date(iso)).replace(/:00(?=\s)/, "").replace(/\s*([AP])M$/i, function(m, ap){ return ap.toLowerCase() + "m"; });
  }catch(e){ return ""; }
}

/* ---- people, lens, buckets ---- */
function personName(uid){
  for(var i=0;i<S.people.length;i++) if(S.people[i].id === uid) return S.people[i].name || "Someone";
  return "Someone";
}
/* A stored lens for someone the profiles don't include (offline, not loaded yet)
   isn't applied: a filter with no visible control would hide work silently. */
function lensWho(){
  if(!S.who) return "";
  for(var i=0;i<S.people.length;i++) if(S.people[i].id === S.who) return S.who;
  return "";
}
function lensText(who){ return who ? personName(who) + " + unassigned" : "Everyone"; }
/* One rule for everything, the morning brief's: a person's view is theirs plus
   nobody's. Completions are credited to the owner, else whoever ticked it; with
   neither they count for both of you, so a lens never undercounts. */
function lensOpen(t, who){ return !who || !t.assignee || t.assignee === who; }
function creditOf(t){ return t.assignee || t.completedBy || null; }
function lensCredit(t, who){ var c = creditOf(t); return !who || !c || c === who; }
/* first column, last column, anything between — so 1- and 2-column sets behave */
function bucketOf(t){
  var c = columnsFor(t.projectId, t.spaceId), s = columnOf(t);
  if(!c.length || s === c[c.length-1].id) return "done";
  return s === c[0].id ? "todo" : "doing";
}
/* an axis top whose half is a whole number */
var NICE = [4,6,8,10,12,16,20,24,30,40,50,60,80,100];
function niceMax(n){
  n = Math.max(n, 4);
  for(var i=0;i<NICE.length;i++) if(NICE[i] >= n) return NICE[i];
  return Math.ceil(n / 20) * 20;
}

/* 12 weeks rather than 90 days, so every bucket is a whole Monday week */
var DASH_RANGES = {
  "7":   { label: "7 days",   span: "the last 7 days",   short: "7d" },
  "30":  { label: "30 days",  span: "the last 30 days",  short: "30d" },
  "12w": { label: "12 weeks", span: "the last 12 weeks", short: "12w" }
};
function dashRangeKey(){ return DASH_RANGES[S.dashRange] ? S.dashRange : "7"; }
function dashBuckets(todayS, rk){
  var out = [], i;
  if(rk === "12w"){
    var mon = mondayOf(todayS);
    for(i=11;i>=0;i--){
      var ws = addDays(mon, -7 * i), we = addDays(ws, 6);
      out.push({ key: ws, start: ws, end: we > todayS ? todayS : we, week: true });
    }
  } else {
    for(i=+rk-1;i>=0;i--){ var d = addDays(todayS, -i); out.push({ key: d, start: d, end: d, week: false }); }
  }
  out.forEach(function(b){
    b.untracked = b.end < TRACK_START;
    b.partial = !b.untracked && b.start < TRACK_START;
    b.count = 0; b.tasks = [];
  });
  return out;
}
function bucketLabel(b){ return b.week ? "Week of " + ymdShort(b.start) : ymdLabel(b.start); }
function bucketFind(m, key){
  for(var i=0;i<m.buckets.length;i++) if(m.buckets[i].key === key) return m.buckets[i];
  return null;
}

/* ---- the model: one pass over what's loaded ---- */
function dashModel(){
  var today = SlateBrief.denverToday(), todayS = today.ymd;
  var who = lensWho(), rk = dashRangeKey();
  var buckets = dashBuckets(todayS, rk), byKey = {};
  buckets.forEach(function(b, i){ byKey[b.key] = i; });
  var start = buckets[0].start;
  var tracked = start < TRACK_START ? TRACK_START : start;
  var span = daysBetween(start, todayS) + 1;
  var prevStart = addDays(start, -span), prevEnd = addDays(start, -1);
  var weekEnd = addDays(todayS, 7);

  var m = {
    today: today, todayS: todayS, who: who, rk: rk, buckets: buckets, start: start,
    trackedFrom: tracked, trackedDays: tracked > todayS ? 0 : daysBetween(tracked, todayS) + 1,
    /* a delta against a window nobody tracked would be an invented number */
    prevTracked: prevStart >= TRACK_START, prevCount: 0,
    open: 0, doing: [], overdue: [], dueToday: [], soon: [], week: 0, weekToday: 0,
    done: [], added: 0, legacy: 0, proj: {}, load: {}
  };
  function projStat(key){
    return m.proj[key] || (m.proj[key] = { total:0, done:0, doing:0, todo:0, open:0, late:0, range:0, touched:"", any:false });
  }

  S.tasks.forEach(function(t){
    var done = taskDone(t);
    var ps = projStat(t.projectId && findProject(t.projectId) ? t.projectId : "");
    ps.any = true;
    if(t.updatedAt && t.updatedAt > ps.touched) ps.touched = t.updatedAt;

    /* Workload is the per-person view, so it never takes the lens */
    if(!done){
      var wk = t.assignee || "";
      var w = m.load[wk] || (m.load[wk] = { doing:0, todo:0, late:0, week:0, tasks:[] });
      if(taskUnderway(t)) w.doing++; else w.todo++;
      if(t.due && t.due < todayS) w.late++;
      else if(t.due && t.due <= weekEnd) w.week++;
      w.tasks.push(t);
    }
    /* inflow against outflow, over the same tracked window as the completions */
    if(!who && t.createdAt){
      var cd = ddayOf(t.createdAt);
      if(cd && cd >= tracked && cd <= todayS) m.added++;
    }

    if(!(done ? lensCredit(t, who) : lensOpen(t, who))) return;
    ps.total++; ps[bucketOf(t)]++;
    if(!done){
      ps.open++; m.open++;
      if(taskUnderway(t)) m.doing.push(t);
      if(t.due){
        if(t.due < todayS){ ps.late++; m.overdue.push(t); }
        else if(t.due === todayS) m.dueToday.push(t);
        else if(t.due <= weekEnd) m.soon.push(t);
        if(t.due >= todayS && t.due <= weekEnd){ m.week++; if(t.due === todayS) m.weekToday++; }
      }
      return;
    }
    /* Counted exactly as the evening wrap counts: completedAt set AND still in a
       done column, so the chart's today always equals what the wrap says. */
    if(!t.completedAt){ m.legacy++; return; }
    var d = ddayOf(t.completedAt);
    if(!d || d < TRACK_START) return;
    if(d >= start && d <= todayS){
      var bi = byKey[rk === "12w" ? mondayOf(d) : d];
      if(bi != null){ buckets[bi].count++; buckets[bi].tasks.push(t); }
      m.done.push(t); ps.range++;
    } else if(d >= prevStart && d <= prevEnd){
      m.prevCount++;
    }
  });
  S.notes.forEach(function(n){
    if(!n.projectId || !findProject(n.projectId)) return;
    var ps = projStat(n.projectId);
    if(n.updatedAt && n.updatedAt > ps.touched) ps.touched = n.updatedAt;
  });

  function byDue(a, b){
    if(a.due !== b.due) return String(a.due) < String(b.due) ? -1 : 1;
    var pa = projName(a.projectId) || "￿", pb = projName(b.projectId) || "￿";
    return pa !== pb ? pa.localeCompare(pb) : (a.order||0) - (b.order||0);
  }
  function newestDone(a, b){ return String(b.completedAt).localeCompare(String(a.completedAt)); }
  m.overdue.sort(byDue); m.dueToday.sort(byDue); m.soon.sort(byDue);
  m.done.sort(newestDone);
  buckets.forEach(function(b){ b.tasks.sort(newestDone); });

  m.events = S.schedules.filter(function(s){ return SlateBrief.occursOn(s, todayS); })
    .sort(function(a,b){ return String(a.time||"").localeCompare(String(b.time||"")); });
  m.pendingEvents = m.events.filter(function(s){ return !(s.done && s.done[todayS]); }).length;

  function byNext(a, b){ return String(a.next).localeCompare(String(b.next)); }
  var pros = openProspects();
  m.prospects = pros.length;
  m.chaseNow = pros.filter(function(p){ return p.next && p.next <= todayS; }).sort(byNext);
  m.chaseSoon = pros.filter(function(p){ return p.next && p.next > todayS && p.next <= weekEnd; }).sort(byNext);
  m.chaseNext = pros.filter(function(p){ return p.next; }).sort(byNext).slice(0, 5);
  m.noNext = pros.filter(function(p){ return !p.next; }).length;
  m.stages = { lead: 0, contacted: 0, talking: 0 };
  pros.forEach(function(p){ var st = p.stage || "lead"; if(st in m.stages) m.stages[st]++; });
  m.lost = S.prospects.filter(function(p){ return p.stage === "lost"; }).length;
  return m;
}

/* ---- building blocks ---- */
/* Cards take focus when a tile scrolls to them; tabindex -1 keeps them out of
   the tab order. */
function wcard(o){
  var sec = el(o.tag || "section", "wcard" + (o.cls ? " " + o.cls : ""));
  sec.id = o.id;
  sec.tabIndex = -1;
  sec.setAttribute("aria-labelledby", o.id + "-h");
  var head = el("div","whead");
  var wt = el("div","wt");
  var h3 = el("h3", null, o.title);
  h3.id = o.id + "-h";
  if(o.count) h3.appendChild(el("span","n", String(o.count)));
  wt.appendChild(h3);
  if(o.sub) wt.appendChild(el("div","wsub", o.sub));
  head.appendChild(wt);
  if(o.action){
    var a = el("button","wact", o.action.label);
    a.appendChild(ico("right","sm"));
    a.onclick = o.action.run;
    head.appendChild(a);
  }
  if(o.extra) head.appendChild(o.extra);
  sec.appendChild(head);
  return sec;
}
/* expanders live in S.dashMore, so a realtime re-render never collapses one */
function moreBtn(key, open, label){
  var b = el("button","wmore", open ? "Show fewer" : label);
  b.dataset.fkey = "more-" + key;
  b.setAttribute("aria-expanded", open ? "true" : "false");
  b.onclick = function(){ S.dashMore[key] = !open; render(); };
  return b;
}
function dashGroup(list, key, label, items, build, cap, crit){
  if(!items.length) return;
  var g = el("div","dgroup" + (crit ? " crit" : ""));
  if(crit) g.appendChild(ico("alert","sm"));
  g.appendChild(document.createTextNode(label + " · " + items.length));
  list.appendChild(g);
  var k = "g-" + key, open = !!S.dashMore[k];
  (open ? items : items.slice(0, cap)).forEach(function(x){ list.appendChild(build(x)); });
  if(items.length > cap) list.appendChild(moreBtn(k, open, "Show " + (items.length - cap) + " more"));
}
function stackBar(parts){
  var bar = el("span","stk");
  bar.setAttribute("aria-hidden","true");
  var any = false;
  parts.forEach(function(p){
    if(!p[1]) return;
    any = true;
    var s = el("span","s-" + p[0]);
    s.style.flexGrow = String(p[1]);
    bar.appendChild(s);
  });
  if(!any) bar.classList.add("stk-none");
  return bar;
}
function alertText(cls, text){
  var s = el("span", cls);
  s.appendChild(ico("alert","sm"));
  s.appendChild(document.createTextNode(text));
  return s;
}
function dashJump(id){
  var c = document.getElementById(id);
  if(!c) return;
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  c.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "start" });
  try{ c.focus({ preventScroll: true }); }catch(e){}
}
function plural(n, one, many){ return n + " " + (n === 1 ? one : (many || one + "s")); }

/* ---- header: the two controls that scope everything below them ---- */
var wantFocus = null;
function renderDashHead(){
  var who = lensWho();
  var meta = SlateBrief.denverToday().label;
  /* the lens rule, said in words: the two lenses overlap by design */
  if(who) meta += " · " + personName(who) + "'s work plus anything unassigned. Events and prospects are shared.";
  headEl.appendChild(el("div","meta", meta));

  var f = el("div","dfilters");
  var people = [{ id: "", label: "Everyone" }].concat(S.people.map(function(p){
    return { id: p.id, label: p.name || "Someone", img: p.avatarUrl };
  }));
  f.appendChild(dashSeg("lens", "Whose work", people, who, function(id){
    S.who = id; prefSet("who", id);
  }));
  f.appendChild(dashSeg("range", "History range", ["7","30","12w"].map(function(k){
    return { id: k, label: DASH_RANGES[k].label };
  }), dashRangeKey(), function(id){
    S.dashRange = id; prefSet("dashRange", id); S.dashPick = null;
  }));
  headEl.appendChild(f);
}
/* the appearance menu's segmented control, as a proper radio group: one tab
   stop, arrows move the choice */
function dashSeg(key, label, opts, cur, pick){
  var seg = el("div","seg dseg");
  seg.setAttribute("role","radiogroup");
  seg.setAttribute("aria-label", label);
  opts.forEach(function(o, i){
    var on = o.id === cur;
    var b = el("button", on ? "on" : "");
    b.setAttribute("role","radio");
    b.setAttribute("aria-checked", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;
    b.dataset.fkey = "seg-" + key + "-" + o.id;
    if(o.img){ var im = document.createElement("img"); im.src = o.img; im.alt = ""; b.appendChild(im); }
    b.appendChild(document.createTextNode(o.label));
    b.onclick = function(){ if(o.id !== cur){ pick(o.id); render(); } };
    b.onkeydown = function(e){
      var d = (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1
            : (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : 0;
      if(!d) return;
      e.preventDefault();
      var nx = opts[(i + d + opts.length) % opts.length];
      wantFocus = "seg-" + key + "-" + nx.id;
      pick(nx.id); render();
    };
    seg.appendChild(b);
  });
  return seg;
}

/* ---- the page ---- */
function renderDash(){
  var m = dashModel();
  if(S.dashPick && !bucketFind(m, S.dashPick)) S.dashPick = null;

  var board = el("div","dboard");
  board.appendChild(dashTiles(m));

  var stacks = el("div","dstacks");
  var act = el("div","dstack");
  act.appendChild(wToday(m));
  act.appendChild(wNext(m));
  var review = el("div","dstack");
  var chart = wChart(m);
  review.appendChild(chart.card);
  review.appendChild(wFinished(m));
  stacks.appendChild(act);
  stacks.appendChild(review);
  board.appendChild(stacks);

  board.appendChild(wProjects(m));
  var band = el("div","dband2");
  band.appendChild(wWorkload(m));
  band.appendChild(wPipeline(m));
  board.appendChild(band);
  bodyEl.appendChild(board);

  /* Measured last, with the whole page in place. Reading a width while the body
     is half built forces a layout that clamps the page's scroll position, and on
     a phone every realtime update from the other person would jump the page. */
  if(chart.host) mountChart(chart.host, m);
}

function dashTiles(m){
  var wrap = el("div","dtiles");
  var rl = DASH_RANGES[m.rk];

  function tile(o){
    var b = el("button","dtile");
    b.dataset.fkey = "tile-" + o.key;
    var l = el("span","tl");
    l.appendChild(ico(o.icon, "sm" + (o.crit ? " crit" : "")));
    l.appendChild(el("span", null, o.label));
    b.appendChild(l);
    b.appendChild(el("span","tv", String(o.value)));
    var s = el("span","ts");
    if(o.glyph){ s.appendChild(el("span", o.glyphCls, o.glyph)); s.appendChild(document.createTextNode(" ")); }
    s.appendChild(document.createTextNode(o.sub));
    b.appendChild(s);
    b.setAttribute("aria-label", o.aria);
    b.onclick = o.run;
    wrap.appendChild(b);
  }

  var total = m.done.length, sub, glyph = null, gcls = null;
  if(!m.prevTracked) sub = "Tracking since " + ymdShort(TRACK_START);
  else if(!total) sub = "Nothing finished in " + rl.span;
  else {
    var dlt = total - m.prevCount;
    if(!dlt) sub = "Same as the previous " + rl.label;
    else { glyph = dlt > 0 ? "▲" : "▼"; gcls = dlt > 0 ? "up" : "down"; sub = Math.abs(dlt) + " vs previous " + rl.label; }
  }
  tile({ key: "done", icon: "trend", label: "Completed · " + rl.label, value: total, sub: sub,
    glyph: glyph, glyphCls: gcls,
    aria: total + " completed in " + rl.span + ". " + (glyph ? (glyph === "▲" ? "Up " : "Down ") : "") + sub + ".",
    run: function(){ dashJump("wc-chart"); } });

  var doing = m.doing.length;
  var dsub = doing ? "of " + m.open + " open" : "Nothing on the go" + (m.open ? " · " + m.open + " open" : "");
  tile({ key: "doing", icon: "bolt", label: "In progress", value: doing, sub: dsub,
    aria: doing + " in progress, " + dsub + ". Show them in All projects.",
    run: function(){ goView("all", "list", { lens: m.who || null, status: "doing" }); } });

  var wsub = m.week ? "incl. " + m.weekToday + " today" : "Nothing due this week";
  tile({ key: "week", icon: "clock", label: "Due this week", value: m.week, sub: wsub,
    aria: m.week + " due in the next 7 days, " + wsub + ".",
    run: function(){ dashJump("wc-next"); } });

  var late = m.overdue.length;
  var lsub = late ? "oldest " + plural(daysBetween(m.overdue[0].due, m.todayS), "day") + " late" : "Nothing late";
  /* the value stays in ink; the icon carries the state, and changes shape too */
  tile({ key: "late", icon: late ? "alert" : "check", crit: !!late, label: "Overdue", value: late, sub: lsub,
    aria: late + " overdue, " + lsub + ".",
    run: function(){ dashJump("wc-today"); } });
  return wrap;
}

function wToday(m){
  var pending = m.overdue.length + m.dueToday.length + m.pendingEvents + m.chaseNow.length;
  var card = wcard({ id: "wc-today", title: "Today", count: pending,
    sub: m.who ? lensText(m.who) + " · events and chases are shared" : "Everyone",
    action: { label: "Full day", run: function(){ goView("today"); } } });
  var list = el("div","dlist");
  var av = !m.who;
  dashGroup(list, "late", "Overdue", m.overdue, function(t){
    return dashTaskRow(t, { todayS: m.todayS, lateDays: true, avatar: av && t.assignee });
  }, 5, true);
  dashGroup(list, "ev", "Events", m.events, function(s){ return dashOccRow(s, m.todayS); }, 5);
  dashGroup(list, "due", "Due today", m.dueToday, function(t){
    return dashTaskRow(t, { todayS: m.todayS, noDue: true, col: true, avatar: av && t.assignee });
  }, 5);
  dashGroup(list, "chase", "Chase", m.chaseNow, function(p){ return dashProspectRow(p); }, 5);
  if(!list.childNodes.length) list.appendChild(el("div","dempty","Nothing due, nothing late, no events. A clear day."));
  card.appendChild(list);
  return card;
}

/* Recurring items stay out: a daily one would flood the list, and the calendar
   has them. Underway tasks stay in, named by their column. */
function wNext(m){
  var items = m.soon.map(function(t){ return { d: t.due, t: t }; })
    .concat(m.chaseSoon.map(function(p){ return { d: p.next, p: p }; }));
  items.sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
  var toCal = function(){ calGo("all", m.todayS); };
  var card = wcard({ id: "wc-next", title: "Next 7 days", count: items.length,
    sub: m.who ? lensText(m.who) + " · chases are shared" : "Everyone",
    action: { label: "Calendar", run: toCal } });
  var list = el("div","dlist");
  if(!items.length){
    list.appendChild(el("div","dempty","Nothing due in the next 7 days."));
  } else {
    var perDay = {};
    items.forEach(function(it){ perDay[it.d] = (perDay[it.d] || 0) + 1; });
    var cap = 8, open = !!S.dashMore.next, last = null;
    (open ? items : items.slice(0, cap)).forEach(function(it){
      if(it.d !== last){
        last = it.d;
        var h = el("button","dgroup", relDay(it.d, m.todayS) + " · " + perDay[it.d]);
        h.title = "Open the calendar";
        h.onclick = (function(d){ return function(){ calGo("all", d); }; })(it.d);
        list.appendChild(h);
      }
      list.appendChild(it.t
        ? dashTaskRow(it.t, { todayS: m.todayS, noDue: true, col: true, avatar: !m.who && it.t.assignee })
        : dashProspectRow(it.p));
    });
    if(items.length > cap) list.appendChild(moreBtn("next", open, "Show all " + items.length));
  }
  card.appendChild(list);
  return card;
}

/* ---- the completions chart: the widget the owners asked for ---- */
function wChart(m){
  var rl = DASH_RANGES[m.rk], total = m.done.length;
  var tog = el("div","seg wtog");
  tog.setAttribute("role","group");
  tog.setAttribute("aria-label","Show as");
  [["chart","Chart"],["table","Table"]].forEach(function(o){
    var on = (o[0] === "table") === !!S.dashTable;
    var b = el("button", on ? "on" : "", o[1]);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.dataset.fkey = "vx-mode-" + o[0];
    b.onclick = function(){ S.dashTable = o[0] === "table"; render(); };
    tog.appendChild(b);
  });
  var card = wcard({ id: "wc-chart", tag: "figure", title: "Completed",
    sub: "Last " + rl.label + " · " + lensText(m.who), extra: tog });

  var head = el("div","vx-head");
  head.appendChild(el("span","vx-total", String(total)));
  var stat = "completed";
  if(total && m.trackedDays){
    stat += m.rk === "12w" && m.trackedDays >= 14
      ? " · avg " + (total / (m.trackedDays / 7)).toFixed(1) + "/week"
      : " · avg " + (total / m.trackedDays).toFixed(1) + "/day";
  }
  /* inflow as text, not a second series: two measures, one axis */
  if(!m.who) stat += " · " + m.added + " added";
  head.appendChild(el("span","vx-stat", stat));
  card.appendChild(head);

  var host = null;
  if(S.dashTable){
    card.appendChild(chartTable(m));
  } else {
    host = el("div","vx-host");
    /* Hold the chart's height from the last draw while the page is rebuilt. An
       empty host when the width is measured would make the page briefly shorter,
       and that is enough to clamp the scroll position near the bottom. */
    host.style.height = ((chartW || 480) >= 480 ? 160 : 128) + 38 + "px";
    card.appendChild(host);
    var pick = S.dashPick ? bucketFind(m, S.dashPick) : null;
    if(pick) card.appendChild(chartReadout(m, pick));
  }

  var peak = null;
  m.buckets.forEach(function(b){ if(!b.untracked && b.count && (!peak || b.count >= peak.count)) peak = b; });
  var cap = el("figcaption","sr-only",
    total + " completed in " + rl.span +
    (peak ? "; most " + (peak.week ? "in the week of " + ymdShort(peak.start) : "on " + ymdLabel(peak.start)) + " (" + peak.count + ")" : "") +
    (m.buckets[0].start < TRACK_START ? "; not tracked before " + ymdShort(TRACK_START) : "") + ".");
  card.appendChild(cap);
  return { card: card, host: host };
}

/* The readout is how a phone steps through thirty ~10px columns: 38px buttons
   either side of the picked one. */
function chartReadout(m, pick){
  var i = m.buckets.indexOf(pick), unit = pick.week ? "week" : "day";
  function step(d){
    for(var j=i+d; j>=0 && j<m.buckets.length; j+=d) if(!m.buckets[j].untracked) return m.buckets[j];
    return null;
  }
  var rd = el("div","vx-readout");
  var prev = icoBtn(null, "left", "Previous " + unit), next = icoBtn(null, "right", "Next " + unit);
  var pb = step(-1), nb = step(1);
  prev.disabled = !pb; next.disabled = !nb;
  prev.dataset.fkey = "vx-prev"; next.dataset.fkey = "vx-next";
  prev.onclick = function(){ if(pb){ S.dashPick = pb.key; render(); } };
  next.onclick = function(){ if(nb){ S.dashPick = nb.key; render(); } };
  var txt = el("span","rt", bucketLabel(pick) + " · " + pick.count + " completed");
  txt.setAttribute("aria-live","polite");
  var x = icoBtn(null, "x", "Clear the selection");
  x.dataset.fkey = "vx-clear";
  x.onclick = function(){ S.dashPick = null; wantFocus = "vx-" + pick.key; render(); };
  rd.appendChild(prev); rd.appendChild(txt); rd.appendChild(next); rd.appendChild(x);
  return rd;
}

function chartTable(m){
  var tbl = el("table","vx-table");
  var thead = document.createElement("thead"), hr = document.createElement("tr");
  var h1 = el("th", null, m.rk === "12w" ? "Week" : "Day"), h2 = el("th","num","Completed");
  hr.appendChild(h1); hr.appendChild(h2); thead.appendChild(hr); tbl.appendChild(thead);
  var tb = document.createElement("tbody");
  m.buckets.forEach(function(b){
    var tr = document.createElement("tr");
    var c1 = el("td", null, bucketLabel(b) + (b.partial ? " (partial week, tracking began " + ymdLabel(TRACK_START) + ")" : ""));
    var c2 = b.untracked ? el("td","num muted","Not tracked") : el("td","num", String(b.count));
    tr.appendChild(c1); tr.appendChild(c2); tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  return tbl;
}

function svgEl(tag, attrs, cls){
  var n = document.createElementNS(SVGNS, tag);
  for(var k in attrs) if(Object.prototype.hasOwnProperty.call(attrs, k)) n.setAttribute(k, attrs[k]);
  if(cls) n.setAttribute("class", cls);
  return n;
}
function r2(v){ return Math.round(v * 100) / 100; }
/* a column with a 4px rounded top and a square foot on the baseline */
function barPath(x, y, w, h){
  var r = Math.min(4, w / 2, h);
  return "M" + r2(x) + "," + r2(y + h) + "V" + r2(y + r) +
         "Q" + r2(x) + "," + r2(y) + " " + r2(x + r) + "," + r2(y) +
         "H" + r2(x + w - r) + "Q" + r2(x + w) + "," + r2(y) + " " + r2(x + w) + "," + r2(y + r) +
         "V" + r2(y + h) + "Z";
}

/* One observer, re-pointed at each render's new host. It redraws only the SVG,
   and only when the width really changed — iPad rotation, Split View — the
   ink.lastFitW pattern. No entry animation: render() runs on every snapshot. */
var chartRO = null, chartHost = null, chartModel = null, chartW = 0, chartRaf = 0;
function mountChart(host, m){
  chartHost = host; chartModel = m;
  drawCompletions(host, m);
  if(!window.ResizeObserver) return;
  if(!chartRO){
    chartRO = new ResizeObserver(function(){
      if(!chartHost || !chartHost.isConnected || chartHost.clientWidth === chartW) return;
      if(chartRaf) cancelAnimationFrame(chartRaf);
      chartRaf = requestAnimationFrame(function(){
        chartRaf = 0;
        if(chartHost && chartHost.isConnected) drawCompletions(chartHost, chartModel);
      });
    });
  }
  chartRO.disconnect();
  chartRO.observe(host);
}

function drawCompletions(host, m){
  var had = document.activeElement && host.contains(document.activeElement) ? document.activeElement.dataset.fkey : null;
  host.textContent = "";
  var W = host.clientWidth;
  chartW = W;
  if(!W) return;

  var bs = m.buckets, n = bs.length, pick = S.dashPick;
  /* by the width actually available, not isPhone(), which answers for 860px */
  var plotH = W >= 480 ? 160 : 128, padT = 16, axisH = 22, padL = 30, padR = 2;
  var H = padT + plotH + axisH, plotW = W - padL - padR, slot = plotW / n, base = padT + plotH;
  var bw = Math.max(1, Math.min(24, slot - 2));
  var max = 0, peak = -1;
  bs.forEach(function(b, i){ if(!b.untracked && b.count && b.count >= max){ max = b.count; peak = i; } });
  var top = niceMax(max);
  function yOf(v){ return base - v / top * plotH; }
  function cxOf(i){ return padL + (i + 0.5) * slot; }

  var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, "aria-hidden": "true", focusable: "false" }, "vx");
  [0, top / 2, top].forEach(function(v){
    var y = Math.round(yOf(v)) + 0.5;
    if(v) svg.appendChild(svgEl("line", { x1: padL, x2: W - padR, y1: y, y2: y }, "vx-grid"));
    var tk = svgEl("text", { x: padL - 8, y: r2(y + 3.5), "text-anchor": "end" }, "vx-tick");
    tk.textContent = String(v);
    svg.appendChild(tk);
  });

  /* untracked days are one flat band, never zero-height bars that would claim
     nobody worked; the axis keeps the full range so nothing jumps as history grows */
  var ut = 0;
  while(ut < n && bs[ut].untracked) ut++;
  if(ut){
    var bandW = ut * slot - (ut < n ? 2 : 0);
    svg.appendChild(svgEl("rect", { x: padL, y: padT, width: r2(bandW), height: plotH, rx: 3 }, "vx-untracked"));
    if(ut < n && bandW >= 70){
      var ul = svgEl("text", { x: r2(padL + bandW / 2), y: base - plotH / 2 + 4, "text-anchor": "middle" }, "vx-utxt");
      ul.textContent = "Not tracked";
      svg.appendChild(ul);
    }
  }

  bs.forEach(function(b, i){
    if(b.untracked || !b.count) return;
    var h = b.count / top * plotH, x = cxOf(i) - bw / 2;
    svg.appendChild(svgEl("path", { d: barPath(x, base - h, bw, h) }, "vx-bar" + (pick && pick !== b.key ? " dim" : "")));
  });
  /* labels only where the story is: the peak and the bucket you're in */
  [peak, n - 1].forEach(function(i, k){
    if(i < 0 || (k === 1 && i === peak)) return;
    var b = bs[i];
    if(b.untracked || !b.count) return;
    var lb = svgEl("text", { x: r2(cxOf(i)), y: r2(yOf(b.count) - 5), "text-anchor": "middle" }, "vx-lbl");
    lb.textContent = String(b.count);
    svg.appendChild(lb);
  });
  svg.appendChild(svgEl("line", { x1: padL, x2: W - padR, y1: base + 0.5, y2: base + 0.5 }, "vx-base"));

  bs.forEach(function(b, i){
    var from = n - 1 - i;
    var show = m.rk === "7" || (m.rk === "30" ? from % 7 === 0 : from % 3 === 0);
    if(!show) return;
    var txt = m.rk === "7" ? SHORT_DOW[dowOf(b.start)] : ymdShort(b.start);
    var x = cxOf(i), anchor = "middle", half = txt.length * 3.1;
    if(x + half > W){ x = W - 1; anchor = "end"; }
    var t = svgEl("text", { x: r2(x), y: base + 15, "text-anchor": anchor }, "vx-tick" + (i === n - 1 ? " now" : ""));
    t.textContent = txt;
    svg.appendChild(t);
  });
  host.style.height = H + "px";
  host.appendChild(svg);

  function msg(text, left, width){
    var d = el("div","vx-msg", text);
    d.style.left = left + "px"; d.style.top = padT + "px";
    d.style.width = width + "px"; d.style.height = plotH + "px";
    host.appendChild(d);
  }
  if(ut === n) msg("Completion dates are recorded from " + ymdShort(TRACK_START) + ", " + TRACK_START.slice(0,4) + ".", padL, plotW);
  else if(!m.done.length){
    var left = padL + ut * slot;
    msg(ut ? "Nothing completed since tracking began on " + ymdShort(TRACK_START) + "."
           : "Nothing completed in " + DASH_RANGES[m.rk].span + ".", left, W - padR - left);
  }

  /* One real button per bucket across the full height: a name for each, a target
     far bigger than a 10px column, and none of iOS's trouble with focusable SVG.
     A roving tabindex keeps thirty of them out of the tab order. */
  var hits = el("div","vx-hits");
  hits.style.left = padL + "px"; hits.style.top = "0px";
  hits.style.width = plotW + "px"; hits.style.height = H + "px";
  var tip = el("div","vx-tip");
  tip.hidden = true;
  tip.setAttribute("aria-hidden","true");
  var rove = n - 1;
  bs.forEach(function(b, i){ if(b.key === pick) rove = i; });

  function showTip(i){
    var b = bs[i];
    tip.textContent = "";
    if(b.untracked){
      tip.appendChild(el("div","tv","Not tracked"));
      tip.appendChild(el("div","td", bucketLabel(b) + " · before " + ymdShort(TRACK_START)));
    } else {
      tip.appendChild(el("div","tv", b.count + " completed"));
      tip.appendChild(el("div","td", bucketLabel(b) +
        (b.partial ? " · partial week, tracking began " + ymdLabel(TRACK_START) : "")));
      if(b.count){
        var by = {}, order = [];
        b.tasks.forEach(function(t){
          var c = creditOf(t), k = c ? personName(c) : "Unattributed";
          if(!(k in by)){ by[k] = 0; order.push(k); }
          by[k]++;
        });
        order.sort(function(a, z){ return (a === "Unattributed") - (z === "Unattributed") || by[z] - by[a]; });
        tip.appendChild(el("div","td tsplit", order.map(function(k){ return k + " " + by[k]; }).join(" · ")));
        b.tasks.slice(0, 3).forEach(function(t){ tip.appendChild(el("div","tt", t.title || "Untitled")); });
        if(b.tasks.length > 3) tip.appendChild(el("div","td", "+" + (b.tasks.length - 3) + " more"));
      }
    }
    tip.hidden = false;
    var tw = tip.offsetWidth, cx = cxOf(i);
    var lx = cx < W / 2 ? cx + slot / 2 + 6 : cx - slot / 2 - 6 - tw;
    tip.style.left = Math.max(0, Math.min(W - tw, lx)) + "px";
    tip.style.top = padT + "px";
  }
  function keyVisible(b){ try{ return b.matches(":focus-visible"); }catch(e){ return true; } }

  bs.forEach(function(b, i){
    var hb = el("button","vx-hit" + (b.untracked ? " off" : ""));
    hb.type = "button";
    hb.tabIndex = i === rove ? 0 : -1;
    hb.dataset.fkey = "vx-" + b.key;
    hb.setAttribute("aria-label", b.untracked ? bucketLabel(b) + ": not tracked"
      : bucketLabel(b) + ": " + b.count + " completed" + (b.partial ? ", partial week" : ""));
    if(!b.untracked) hb.setAttribute("aria-pressed", b.key === pick ? "true" : "false");
    hb.onpointerenter = function(e){ if(e.pointerType === "mouse") showTip(i); };
    hb.onpointerleave = function(){ tip.hidden = true; };
    hb.onfocus = function(){ if(keyVisible(hb)) showTip(i); };
    hb.onblur = function(){ tip.hidden = true; };
    hb.onclick = function(){
      if(b.untracked) return;
      S.dashPick = S.dashPick === b.key ? null : b.key;
      render();
    };
    hb.onkeydown = function(e){
      var j = e.key === "ArrowRight" ? Math.min(n - 1, i + 1)
            : e.key === "ArrowLeft" ? Math.max(0, i - 1)
            : e.key === "Home" ? 0 : e.key === "End" ? n - 1 : -1;
      if(e.key === "Escape" && S.dashPick){ e.preventDefault(); S.dashPick = null; render(); return; }
      if(j < 0 || j === i) return;
      e.preventDefault();
      hb.tabIndex = -1;
      hits.children[j].tabIndex = 0;
      hits.children[j].focus();
    };
    hits.appendChild(hb);
  });
  host.appendChild(hits);
  host.appendChild(tip);
  if(had){
    var back = host.querySelector('[data-fkey="' + had + '"]');
    if(back) back.focus({ preventScroll: true });
  }
}

/* The completions log — the literal "show what got done", and the chart's detail
   view. The tick stays live: it's the undo for a mis-tick made in Today above. */
function wFinished(m){
  var rl = DASH_RANGES[m.rk];
  var pick = S.dashPick ? bucketFind(m, S.dashPick) : null;
  var list = pick ? pick.tasks : m.done;
  var where = pick ? (pick.week ? "in the week of " + ymdShort(pick.start) : "on " + ymdLabel(pick.start)) : "in " + rl.span;
  var card = wcard({ id: "wc-done", title: "Finished", count: list.length,
    sub: "Last " + rl.label + " · " + lensText(m.who) });
  if(pick){
    var chip = el("div","dpick");
    chip.appendChild(el("span", null, bucketLabel(pick)));
    var x = icoBtn(null, "x", "Show the whole range");
    x.dataset.fkey = "pick-clear";
    x.onclick = function(){ S.dashPick = null; render(); };
    chip.appendChild(x);
    card.appendChild(chip);
  }
  var dl = el("div","dlist");
  if(!list.length){
    dl.appendChild(el("div","dempty", "Nothing finished " + where + (pick ? "." : " yet.")));
  } else {
    var perDay = {};
    list.forEach(function(t){ var d = ddayOf(t.completedAt); perDay[d] = (perDay[d] || 0) + 1; });
    var cap = 10, open = !!S.dashMore.fin, last = null;
    (open ? list : list.slice(0, cap)).forEach(function(t){
      var d = ddayOf(t.completedAt);
      if(d !== last){ last = d; dl.appendChild(el("div","dgroup", relDay(d, m.todayS) + " · " + perDay[d])); }
      dl.appendChild(dashTaskRow(t, { noDue: true, time: denverClock(t.completedAt), avatar: creditOf(t) }));
    });
    if(list.length > cap) dl.appendChild(moreBtn("fin", open, "Show all " + list.length));
  }
  card.appendChild(dl);
  if(m.legacy){
    card.appendChild(el("div","wnote", plural(m.legacy, "older finished task") +
      (m.legacy === 1 ? " predates" : " predate") + " completion tracking and " + (m.legacy === 1 ? "isn't" : "aren't") + " counted."));
  }
  return card;
}

/* ---- projects: which client is slipping ---- */
function wProjects(m){
  var rl = DASH_RANGES[m.rk];
  var card = wcard({ id: "wc-proj", title: "Projects",
    sub: lensText(m.who) + " · done in " + rl.span });
  if(!S.projects.length){
    card.appendChild(el("div","dempty","No projects yet."));
    if(writable()){
      var mk = el("button","btn primary","Create your first project");
      mk.style.marginTop = "10px";
      mk.onclick = function(){ S.newProject = true; S.newProjectText = ""; openRail(); render(); };
      card.appendChild(mk);
    }
    return card;
  }
  var now = Date.now();
  var blank = { total:0, done:0, doing:0, todo:0, open:0, late:0, range:0, touched:"", any:false };
  var rows = S.projects.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); }).map(function(p){
    var s = m.proj[p.id] || blank;
    var touched = s.touched || p.createdAt || "";
    var idleDays = touched ? Math.floor((now - Date.parse(touched)) / 86400000) : 0;
    return { p: p, s: s, touched: touched, quiet: s.open > 0 && idleDays >= STALE_DAYS ? idleDays : 0 };
  });
  var busy = rows.filter(function(r){ return r.s.open || r.s.range; });
  var idle = rows.filter(function(r){ return !(r.s.open || r.s.range); });
  /* late first, then the quiet ones (stalest first), then the busiest */
  busy.sort(function(a, b){
    return (b.s.late - a.s.late) || (b.quiet - a.quiet) || (b.s.open - a.s.open) ||
      String(a.p.name||"").localeCompare(String(b.p.name||""));
  });

  /* the bar's three blues need a key, and on phones the column header is hidden */
  var lgd = el("div","lgd");
  lgd.setAttribute("aria-hidden","true");
  [["done","Done"],["doing","In progress"],["todo","Not started"]].forEach(function(l){
    var sw = el("span");
    sw.appendChild(el("i","s-" + l[0]));
    sw.appendChild(document.createTextNode(l[1]));
    lgd.appendChild(sw);
  });
  card.appendChild(lgd);

  var tbl = el("div","ptable");
  var th = el("div","pth");
  th.setAttribute("aria-hidden","true");
  [["Project",""],["Progress",""],["Open","num"],["Late","num"],["Done · " + rl.short,"num"],["Active","pa"]].forEach(function(c){
    th.appendChild(el("span", c[1] || null, c[0]));
  });
  tbl.appendChild(th);

  function row(name, colorId, s, touched, quiet, run){
    var b = el("button","ptr");
    var pct = s.total ? Math.round(s.done / s.total * 100) : 0;
    var act = touched ? relTime(touched) : "—";
    var pn = el("span","pn");
    var dot = el("span","pdot");
    var c = colorId && projectColor(colorId);
    if(c) dot.style.background = c;
    pn.appendChild(dot);
    var nw = el("span","pnw");
    nw.appendChild(el("span","pnm", name));
    nw.appendChild(el("span","pai", "Active " + act));
    pn.appendChild(nw);
    if(quiet) pn.appendChild(el("span","chip pquiet", "Quiet " + quiet + "d"));
    b.appendChild(pn);

    var pp = el("span","pp");
    pp.appendChild(stackBar([["done", s.done], ["doing", s.doing], ["todo", s.todo]]));
    pp.appendChild(el("span","ppct", s.total ? pct + "%" : "No tasks yet"));
    b.appendChild(pp);

    b.appendChild(el("span","num" + (s.open ? "" : " zero"), String(s.open)));
    b.appendChild(s.late ? alertText("num late", String(s.late)) : el("span","num zero","0"));
    b.appendChild(el("span","num" + (s.range ? "" : " zero"), String(s.range)));
    b.appendChild(el("span","pa", act));

    /* the phone's third line */
    var pm = el("span","pm");
    [el("span", null, s.open + " open"),
     s.late ? alertText("late", s.late + " late") : null,
     el("span", null, s.range + " done"),
     el("span", null, act)].forEach(function(part){
      if(!part) return;
      if(pm.childNodes.length) pm.appendChild(el("span", null, "·"));
      pm.appendChild(part);
    });
    b.appendChild(pm);

    b.setAttribute("aria-label", name + ": " + (s.total ? pct + "% done" : "no tasks yet") + ", " +
      s.open + " open, " + s.late + " late, " + s.range + " done in " + rl.span +
      (touched ? ", active " + act : "") + (quiet ? ", quiet for " + quiet + " days" : ""));
    b.onclick = run;
    return b;
  }
  function projRow(r){
    return row(r.p.name || "Untitled project", r.p.id, r.s, r.touched, r.quiet,
      function(){ goView(r.p.id, "board"); });
  }
  busy.forEach(function(r){ tbl.appendChild(projRow(r)); });
  if(idle.length){
    var open = !!S.dashMore.projIdle;
    if(busy.length){
      var fold = el("button","pfold", open ? "Hide the " + idle.length + " with nothing open"
                                           : idle.length + " with nothing open");
      if(!open) fold.appendChild(ico("right","sm"));
      fold.dataset.fkey = "more-projIdle";
      fold.setAttribute("aria-expanded", open ? "true" : "false");
      fold.onclick = function(){ S.dashMore.projIdle = !open; render(); };
      tbl.appendChild(fold);
    }
    if(open || !busy.length) idle.forEach(function(r){ tbl.appendChild(projRow(r)); });
  }
  var un = m.proj[""];
  if(un && un.any){
    tbl.appendChild(row("Unfiled", null, un, un.touched, 0,
      function(){ goView("all", "list", { project: "none" }); }));
  }
  card.appendChild(tbl);
  return card;
}

/* ---- workload: who's carrying what. Per person by design, so no lens. ---- */
function wWorkload(m){
  var card = wcard({ id: "wc-load", title: "Workload", sub: "Everyone · open now" });
  var rows = [], seen = {};
  S.people.forEach(function(p){ rows.push({ uid: p.id, name: p.name || "Someone", img: p.avatarUrl }); seen[p.id] = true; });
  Object.keys(m.load).forEach(function(k){ if(k && !seen[k]) rows.push({ uid: k, name: null }); });
  rows.push({ uid: "", name: "Unassigned" });
  var zero = { doing:0, todo:0, late:0, week:0, tasks:[] };
  var maxOpen = 1, totalOpen = 0;
  rows.forEach(function(r){
    r.s = m.load[r.uid] || zero;
    r.open = r.s.doing + r.s.todo;
    maxOpen = Math.max(maxOpen, r.open);
    totalOpen += r.open;
  });
  if(!totalOpen){
    card.appendChild(el("div","dempty","Nobody has anything open."));
    return card;
  }
  var lgd = el("div","lgd");
  lgd.setAttribute("aria-hidden","true");
  [["doing","In progress"],["todo","Not started"]].forEach(function(l){
    var s = el("span");
    s.appendChild(el("i","s-" + l[0]));
    s.appendChild(document.createTextNode(l[1]));
    lgd.appendChild(s);
  });
  card.appendChild(lgd);

  var wrap = el("div","wl");
  rows.forEach(function(r){
    var key = r.uid || "~none", open = S.wlOpen === key;
    var b = el("button","wlrow");
    b.dataset.fkey = "wl-" + key;
    b.setAttribute("aria-expanded", open ? "true" : "false");
    var who = el("span","wlwho");
    if(r.uid){
      var im = document.createElement("img");

      if(r.img) im.src = r.img; else { im.dataset.uid = r.uid; im.dataset.kind = "avatar"; }
      who.appendChild(im);
    } else {
      who.appendChild(el("span","wlnone"));

    var nm = el("span","wln", r.name || "Someone");
    /* offline the profiles aren't there; paintPeople names them when they are */
    if(!r.name) nm.dataset.uid = r.uid;
    who.appendChild(nm);
    b.appendChild(who);

    var track = el("span","wltrack");
    if(r.open){
      var bar = stackBar([["doing", r.s.doing], ["todo", r.s.todo]]);
      /* scaled to the heaviest load, not to 100%: comparing load is the point.
         70px of every bar's share is kept back for the label at its end. */
      var pct = r.open / maxOpen * 100;
      bar.style.width = "calc(" + r2(pct) + "% - " + r2(pct * 0.7) + "px)";
      track.appendChild(bar);
    }
    track.appendChild(el("span","wlval" + (r.open ? "" : " zero"), r.open ? r.open + " open" : "Nothing open"));
    b.appendChild(track);
    if(r.s.late || r.s.week){
      var meta = el("span","wlmeta");
      if(r.s.late) meta.appendChild(alertText("late", r.s.late + " late"));
      if(r.s.late && r.s.week) meta.appendChild(el("span", null, "·"));
      if(r.s.week) meta.appendChild(el("span", null, r.s.week + " this week"));
      b.appendChild(meta);
    }
    b.setAttribute("aria-label", (r.name || "Someone") + ": " + r.open + " open, " + r.s.doing + " in progress, " +
      r.s.late + " late, " + r.s.week + " due this week");
    b.onclick = function(){ S.wlOpen = open ? null : key; render(); };
    wrap.appendChild(b);

    if(open){
      var x = el("div","wlx");
      var tasks = r.s.tasks.slice().sort(function(a, z){
        var al = a.due && a.due < m.todayS, zl = z.due && z.due < m.todayS;
        if(al !== zl) return al ? -1 : 1;
        return String(a.due || "9999").localeCompare(String(z.due || "9999")) || (a.order||0) - (z.order||0);
      });
      if(!tasks.length) x.appendChild(el("div","dempty","Nothing open."));
      tasks.slice(0, 8).forEach(function(t){
        x.appendChild(dashTaskRow(t, { todayS: m.todayS, lateDays: true, assign: !r.uid }));
      });
      var all = el("button","wmore", tasks.length > 8 ? "See all " + tasks.length + " in All projects" : "See them in All projects");
      all.appendChild(ico("right","sm"));
      all.style.display = "inline-flex"; all.style.alignItems = "center";
      all.onclick = function(){ goView("all", "list", { owner: r.uid || "none", status: "open" }); };
      x.appendChild(all);
      wrap.appendChild(x);
    }
  });
  card.appendChild(wrap);
  var assigned = rows.some(function(r){ return r.uid && r.open; });
  if(!assigned) card.appendChild(el("div","wnote","Give tasks an owner to see who's carrying what."));
  return card;
}

/* ============ render: calendar ============ */
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS = ["January","February","March","April","May","June","July",
              "August","September","October","November","December"];

function ymd(d){
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
}
function parseYmd(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length !== 3) return null;
  return new Date(+p[0], +p[1]-1, +p[2]);
}
function fmtTime(t){
  if(!t) return "";
  var p = t.split(":");
  var h = +p[0], m = p[1] || "00";
  var ap = h >= 12 ? "pm" : "am";
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  return h12 + (m === "00" ? "" : ":" + m) + ap;
}
/* a calendar chip wears its project's colour, so a month reads by project */
function tintOcc(node, projectId, outline){
  var soft = projectColor(projectId, "soft");
  var ink = projectColor(projectId, "ink");
  if(!soft || !ink) return;
  if(outline){ node.style.borderColor = ink; node.style.color = ink; }
  else { node.style.background = soft; node.style.color = ink; }
}

/* The calendar's today is Denver's, like the dashboard, the Today page and both
   briefs. A tick here writes schedule.done[date] under the key they all read, so
   on a laptop left in another timezone the device clock would tick a different
   day of the same schedule than the phone does. */
function calToday(){ return SlateBrief.denverToday().ymd; }
function calMonthOf(ds){
  var d = parseYmd(ds);
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
/* a month opens on today if today is in it, otherwise on its 1st */
function calDefaultDay(m, todayS){
  var first = ymd(m);
  return first.slice(0,7) === todayS.slice(0,7) ? todayS : first;
}
function calLongLabel(ds, todayS){
  var d = parseYmd(ds);
  return DOW_LONG[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() +
    (ds.slice(0,4) !== todayS.slice(0,4) ? ", " + d.getFullYear() : "");
}
function calRelative(ds, todayS){
  var n = Math.round((parseYmd(ds) - parseYmd(todayS)) / 86400000);
  if(n === 0) return "Today";
  if(n === 1) return "Tomorrow";
  if(n === -1) return "Yesterday";
  return n > 0 ? "In " + n + " days" : (-n) + " days ago";
}
function schedWhen(s){
  if(s.freq === "daily") return "Every day";
  if(s.freq === "monthly") return "Day " + (s.dayOfMonth || 1) + " each month";
  var days = (s.days || []).slice().sort();
  var key = days.join(",");
  if(key === "1,2,3,4,5") return "Weekdays";
  if(key === "0,6") return "Weekends";
  if(days.length === 7) return "Every day";
  return days.map(function(d){ return DOW[d]; }).join(" ") || "No days set";
}

/* open a calendar on a given day, not whatever month it was last left on */
function calGo(sel, ds){
  S.calMonth = calMonthOf(ds);
  S.calDay = ds;
  S.calAdd = null;
  goView(sel, "calendar");
}
/* A typed-but-unsaved task in the add field is saved before any calendar
   navigation throws the field away. On touch, the tap on another day renders
   before the field's blur gets to save, and the words simply vanished. */
function calFlushAdd(){
  var st = S.calAdd;
  S.calAdd = null;
  if(st && st.sel === S.sel && st.text && st.text.trim()){
    var v = st.text.trim();
    st.text = "";                      // the field's own blur must not save it again
    calAddTask(st.day, v, currentProject() || st.proj || null);
  }
}
function calShowMonth(m){
  S.calMonth = new Date(m.getFullYear(), m.getMonth(), 1);
  S.calDay = calDefaultDay(S.calMonth, calToday());
  calFlushAdd();
  render();
}
/* a day from a neighbouring month's spill-over brings that month into view */
function calSelect(ds, focus){
  S.calMonth = calMonthOf(ds);
  if(S.calDay !== ds) calFlushAdd();
  S.calDay = ds;
  S.calFocus = !!focus;
  render();
}
function calOpenItem(it){
  if(it.kind === "task") openTask(it.t.id);
  else openSchedule(it.s);
}

/* Everything on each of the 42 visible days, worked out once per render rather
   than once per cell per item. Tasks come first — they're the day's all-day
   items, already in board order — then repeating items in time order, which is
   how visibleSchedules() sorts them. */
function calIndex(days, scheds, tasks, todayS){
  var by = {};
  days.forEach(function(ds){ by[ds] = []; });
  tasks.forEach(function(t){
    var list = by[t.due];
    if(!list) return;
    var done = taskDone(t);
    list.push({ kind:"task", t:t, ds:t.due, pid:t.projectId || null, time:"",
                done:done, late:!done && t.due < todayS });
  });
  scheds.forEach(function(s){
    days.forEach(function(ds){
      if(!SlateBrief.occursOn(s, ds)) return;
      by[ds].push({ kind:"sched", s:s, ds:ds, pid:s.projectId || null, time:s.time || "",
                    done:!!(s.done && s.done[ds]), late:false });
    });
  });
  return by;
}

var CAL_CAP = 3;                 // chips per cell above 720px; the rest become "+N more"
var CAL_KEYS = { ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7 };
var calPendingFocus = null;

function renderCalendar(){
  var todayS = calToday();
  if(!S.calMonth) S.calMonth = calMonthOf(todayS);
  var m = S.calMonth;
  if(!S.calDay || S.calDay.slice(0,7) !== ymd(m).slice(0,7)) S.calDay = calDefaultDay(m, todayS);
  var proj = currentProject();
  calPendingFocus = null;

  var lead = new Date(m.getFullYear(), m.getMonth(), 1).getDay();
  var days = [];
  for(var i=0;i<42;i++) days.push(ymd(new Date(m.getFullYear(), m.getMonth(), 1 - lead + i)));
  var scheds = visibleSchedules();
  var byDay = calIndex(days, scheds, visibleTasks().filter(function(t){ return t.due; }), todayS);

  var wrap = el("div","cal");
  wrap.appendChild(calBar(m, proj));

  var body = el("div","calwrap");
  var grid = el("div","calgrid");
  DOW.forEach(function(d){ grid.appendChild(el("div","caldow", d)); });
  days.forEach(function(ds){ grid.appendChild(calCell(ds, m, byDay[ds], todayS)); });
  calSwipe(grid, m);
  body.appendChild(grid);
  var panel = calDayPanel(S.calDay, byDay[S.calDay] || [], todayS, proj);
  body.appendChild(panel);
  wrap.appendChild(body);
  wrap.appendChild(calRepeating(scheds, proj));
  bodyEl.appendChild(wrap);

  if(S.calFocus){
    S.calFocus = false;
    var dn = grid.querySelector('.dn[data-day="' + S.calDay + '"]');
    if(dn) dn.focus({ preventScroll:true });
  }
  /* "+N more" on an iPad lands in a panel that sits below the grid */
  if(S.calReveal){
    S.calReveal = false;
    panel.scrollIntoView({ block:"nearest" });
  }
  if(calPendingFocus){
    var inp = calPendingFocus;
    calPendingFocus = null;
    inp.focus({ preventScroll:true });
    try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){}
  }
}

function calBar(m, proj){
  var bar = el("div","calbar");
  bar.appendChild(el("h2","mon", MONTHS[m.getMonth()] + " " + m.getFullYear()));
  var nav = el("div","calnav");
  var prev = icoBtn("nav","left","Previous month");
  prev.onclick = function(){ calShowMonth(new Date(m.getFullYear(), m.getMonth()-1, 1)); };
  var today = el("button","btn todaybtn","Today");
  today.onclick = function(){
    var t = calToday();
    S.calMonth = calMonthOf(t);
    S.calDay = t;
    calFlushAdd();
    render();
  };
  var next = icoBtn("nav","right","Next month");
  next.onclick = function(){ calShowMonth(new Date(m.getFullYear(), m.getMonth()+1, 1)); };
  nav.appendChild(prev);
  nav.appendChild(today);
  nav.appendChild(next);
  bar.appendChild(nav);
  if(writable() && proj) bar.appendChild(calNewSchedBtn("btn primary addsched"));
  return bar;
}
/* Beside the month title above 720px. On a phone it would be a full-width bar
   between the title and the grid, for the rarest thing done here, so there it
   moves down to head the list of repeating items instead. */
function calNewSchedBtn(cls){
  var b = el("button", cls, "New repeating item");
  b.onclick = function(){ openSchedule(null); };
  return b;
}

/* One cell serves every width. Above 720px it shows the date and up to CAL_CAP
   chips; on a phone the chips are hidden and the date button fills the cell,
   with a dot per item beneath the number. Keeping one DOM means rotating an iPad
   across the breakpoint needs no re-render. */
function calCell(ds, m, items, todayS){
  var d = parseYmd(ds);
  var inMonth = d.getMonth() === m.getMonth();
  var isToday = ds === todayS, isSel = ds === S.calDay;
  var cell = el("div","calday" + (inMonth ? "" : " off") + (isToday ? " today" : "") + (isSel ? " sel" : ""));
  cell.onclick = function(){ calSelect(ds, true); };

  /* open work first, so a capped cell shows what still needs doing */
  var shown = items.filter(function(it){ return !it.done; })
    .concat(items.filter(function(it){ return it.done; }));

  var dn = el("button","dn");
  dn.type = "button";
  dn.dataset.day = ds;
  /* one tab stop for the whole month; the arrow keys walk the days */
  dn.tabIndex = isSel ? 0 : -1;
  dn.setAttribute("aria-pressed", isSel ? "true" : "false");
  if(isToday) dn.setAttribute("aria-current","date");
  var lateN = items.filter(function(it){ return it.late; }).length;
  dn.setAttribute("aria-label", calLongLabel(ds, todayS) + (isToday ? ", today" : "") +
    (items.length ? ", " + items.length + (items.length === 1 ? " item" : " items") : "") +
    (lateN ? ", " + lateN + " overdue" : ""));
  dn.appendChild(el("span","dnum", String(d.getDate())));
  var dots = el("span","dots");
  shown.slice(0,3).forEach(function(it){
    var dot = el("i","dot" + (it.late ? " late" : it.done ? " done" : ""));
    var c = projectColor(it.pid);
    if(c) dot.style.setProperty("--cp", c);
    dots.appendChild(dot);
  });
  if(shown.length > 3) dots.appendChild(el("i","dot over"));
  dn.appendChild(dots);
  dn.onclick = function(e){ e.stopPropagation(); calSelect(ds, true); };
  dn.onkeydown = function(e){
    if(!CAL_KEYS.hasOwnProperty(e.key)) return;
    e.preventDefault();
    var to = parseYmd(ds);
    to.setDate(to.getDate() + CAL_KEYS[e.key]);
    calSelect(ymd(to), true);
  };
  /* "+N more" shares the date's row, so a full cell is no taller than three
     chips and a whole month fits a laptop screen */
  var head = el("div","chead");
  head.appendChild(dn);
  if(shown.length > CAL_CAP){
    var extra = shown.length - CAL_CAP;
    var more = el("button","cmore", "+" + extra);
    more.appendChild(el("span","w"," more"));
    more.type = "button";
    more.setAttribute("aria-label", extra + " more on " + calLongLabel(ds, todayS));
    more.onclick = function(e){
      e.stopPropagation();
      S.calReveal = true;
      calSelect(ds, false);
    };
    head.appendChild(more);
  }
  cell.appendChild(head);
  shown.slice(0, CAL_CAP).forEach(function(it){ cell.appendChild(calChip(it, inMonth)); });
  return cell;
}

/* A tap on an item opens it. It used to complete it, which on a phone meant a
   curious tap finished a task; completing now needs the tick in the day panel. */
function calChip(it, inMonth){
  var isTask = it.kind === "task";
  var title = (isTask ? it.t.title : it.s.title) || "Untitled";
  var o = el("button","occ" + (isTask ? " task" : "") + (it.done ? " done" : "") + (it.late ? " late" : ""));
  o.type = "button";
  if(!it.done && !it.late) tintOcc(o, it.pid, isTask);
  // overdue says so with a mark, not red alone — red sits close to some project hues
  if(it.late) o.appendChild(ico("alert","sm late-ico"));
  if(!isTask && it.time) o.appendChild(el("span","tm", fmtTime(it.time)));
  o.appendChild(el("span","ot", title));
  o.title = title + (it.late ? " — overdue" : it.done ? " — done" : "");
  if(it.late || it.done) o.setAttribute("aria-label", title + (it.late ? ", overdue" : ", done"));
  o.onclick = function(e){
    e.stopPropagation();
    /* select its day too, so closing the sheet leaves you looking at it — but not
       from a neighbouring month's spill-over, which would swap the month under you */
    if(inMonth && S.calDay !== it.ds){ S.calDay = it.ds; calFlushAdd(); render(); }
    calOpenItem(it);
  };
  return o;
}

/* Horizontal swipe on the grid changes month, as in iPhone Calendar. Passive
   listeners, and only a clearly sideways, quick gesture counts, so scrolling the
   page past the grid never flips the month by accident. */
function calSwipe(grid, m){
  var x0 = null, y0 = 0, t0 = 0;
  grid.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive:true });
  grid.addEventListener("touchend", function(e){
    if(x0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - t0 > 700) return;
    calShowMonth(new Date(m.getFullYear(), m.getMonth() + (dx < 0 ? 1 : -1), 1));
  }, { passive:true });
}

/* the selected day: every item on it, each with a tick, plus adding a task */
function calDayPanel(ds, items, todayS, proj){
  var p = el("section","calpanel");
  p.setAttribute("aria-label", calLongLabel(ds, todayS));
  var rel = calRelative(ds, todayS);

  var head = el("div","cphead");
  head.appendChild(el("h3", null, calLongLabel(ds, todayS)));
  var sub = el("div","cpsub");
  sub.appendChild(el("span", ds === todayS ? "rel now" : "rel", rel));
  if(items.length){
    var doneN = items.filter(function(it){ return it.done; }).length;
    sub.appendChild(document.createTextNode(" · " + items.length + (items.length === 1 ? " item" : " items") +
      (doneN ? ", " + doneN + " done" : "")));
  }
  head.appendChild(sub);
  p.appendChild(head);

  var list = el("div","cplist");
  items.forEach(function(it){ list.appendChild(agendaRow(it, proj)); });
  if(!items.length){
    list.appendChild(el("div","cpempty", "Nothing on " +
      (rel === "Today" || rel === "Tomorrow" ? rel.toLowerCase() : "this day") + "."));
  }
  p.appendChild(list);
  if(writable()) p.appendChild(calAddRow(ds, proj, todayS));
  return p;
}

function agendaRow(it, proj){
  var isTask = it.kind === "task";
  var title = (isTask ? it.t.title : it.s.title) || "Untitled";
  var row = el("div","cprow" + (it.done ? " done" : ""));
  var c = projectColor(it.pid);
  if(c) row.style.setProperty("--cp", c);

  var tick = el("button","ctick");
  tick.type = "button";
  var ring = el("span","ring");
  ring.appendChild(ico("check","sm"));
  tick.appendChild(ring);
  tick.setAttribute("aria-label", (it.done ? "Not done: " : "Done: ") + title);
  tick.setAttribute("aria-pressed", it.done ? "true" : "false");
  tick.disabled = !writable();
  tick.onclick = function(){
    /* answer the tap now; the write's snapshot redraws the row properly */
    row.classList.toggle("done");
    if(isTask){
      var t = it.t;
      patchTask(t.id, { status: it.done ? firstColumnId(t.projectId, t.spaceId) : doneColumnId(t.projectId, t.spaceId) });
    } else {
      toggleOccurrence(it.s, it.ds);
    }
  };
  row.appendChild(tick);

  var main = el("button","cmain");
  main.type = "button";
  main.appendChild(el("span","ct", title));
  var meta = el("span","cmeta");
  if(isTask){
    if(it.late) meta.appendChild(el("span","clate","Overdue"));
    else meta.appendChild(el("span", null, columnName(it.t.projectId, it.t.spaceId, columnOf(it.t))));
  } else {

/* The field's state lives in S.calAdd, not the node, because the other person's
   edits re-render the page mid-sentence; the next render rebuilds the field with
   the same text and focus. Enter saves and leaves it open for the next one. */
function calAddForm(box, ds, proj, st, todayS){
  var form = el("div","cpform");
  var inp = document.createElement("input");
  inp.type = "text";
  inp.className = "cpinput";
  inp.value = st.text || "";
  inp.placeholder = "What needs doing?";
  inp.setAttribute("enterkeyhint","done");
  inp.setAttribute("aria-label","New task for " + calLongLabel(ds, todayS));
  form.appendChild(inp);

  /* across projects a task still needs a home; inside one it's that project */
  var pick = null;
  if(!proj){
    pick = document.createElement("select");
    pick.className = "cpproj";
    pick.setAttribute("aria-label","Project");
    var ps = S.projects.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); });
    ps.forEach(function(p){
      var o = document.createElement("option");
      o.value = p.id; o.textContent = p.name || "Untitled project";
      pick.appendChild(o);
    });
    var none = document.createElement("option");
    none.value = ""; none.textContent = "No project";
    pick.appendChild(none);
    var want = st.proj;
    if(want == null || (want && !findProject(want))) want = ps.length ? ps[0].id : "";
    pick.value = want;
    st.proj = want;
    pick.onchange = function(){ st.proj = pick.value; S.calAddProj = pick.value; };
    form.appendChild(pick);
  }
  var addB = el("button","btn primary","Add");
  addB.type = "button";
  var xB = icoBtn("cpx","x","Cancel");
  xB.type = "button";
  form.appendChild(addB);
  form.appendChild(xB);
  box.appendChild(form);

  var closed = false, cancelling = false;
  function save(){
    var v = inp.value.trim();
    if(!v || !st.text) return;         // empty, or already saved by calFlushAdd
    /* cleared before the write, so the blur that iOS fires right behind Enter
       finds nothing left to save — the same trap commitProject guards against */
    inp.value = ""; st.text = "";
    calAddTask(ds, v, proj || (pick ? pick.value : null));
  }
  function close(keep){
    if(closed) return;
    closed = true;
    if(keep) save();
    if(S.calAdd === st) S.calAdd = null;
    /* swapped in place rather than re-rendered: a full render here would replace
       whatever was clicked to cause this blur, and swallow that click */
    calAddButton(box, ds, todayS);
  }
  inp.oninput = function(){ st.text = inp.value; };
  inp.onkeydown = function(e){
    // an Enter that confirms an IME composition isn't a save (229: Safari's version)
    if(e.isComposing || e.keyCode === 229) return;
    if(e.key === "Enter"){ e.preventDefault(); save(); }
    else if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); close(false); }
  };
  addB.onclick = function(){ save(); inp.focus(); };
  /* pointerdown lands before the blur it causes, so Cancel can say it's a cancel */
  xB.addEventListener("pointerdown", function(){ cancelling = true; });
  xB.onclick = function(){ close(false); };
  form.addEventListener("focusin", function(){ st.focus = true; });
  /* Decided a tick later, not in the event: Chrome fires focusout while a live
     re-render is still clearing the page, with the form connected, so in the
     moment a re-render and the user leaving look identical. A tick on, the
     re-render has detached this form and drawn its replacement; the user
     leaving has left it connected, with focus somewhere outside it. */
  form.addEventListener("focusout", function(){
    setTimeout(function(){
      if(closed || !form.isConnected || form.contains(document.activeElement)) return;
      st.focus = false;
      close(!cancelling);
    }, 0);
  });
  if(st.focus) calPendingFocus = inp;
}

/* ============ capture bar ============ */
var capEl = $("#capture"), capInput = $("#capInput"),
    capThumbs = $("#capThumbs"), capSave = $("#capSave"), capHint = $("#capHint"),
    capProj = $("#capProj"), capSpace = $("#capSpace");

function autosize(ta){
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 240) + "px";
}
function captureTarget(){
  return isVirtualView(S.sel) ? null : S.sel;
}
/* The project the note will be filed under: inside a project that's the project
   you're looking at, otherwise whatever the picker says. */
function captureProject(){
  return captureTarget() || S.capProj || null;
}
function fillCapturePickers(){
  var inProject = !!captureTarget();
  var proj = captureProject();

  capProj.style.display = inProject ? "none" : "";
  if(!inProject){
    capProj.textContent = "";
    var none = document.createElement("option");
    none.value = ""; none.textContent = "No project";
    capProj.appendChild(none);
    S.projects.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); })
      .forEach(function(p){
        var o = document.createElement("option");
        o.value = p.id; o.textContent = p.name || "Untitled project";
        capProj.appendChild(o);
      });
    capProj.value = S.capProj || "";
    if(capProj.value !== (S.capProj || "")){ S.capProj = null; capProj.value = ""; }
  }

  /* spaces are optional and never auto-created, so the picker only appears
     once the chosen project actually has some */
  var spaces = proj ? spacesOf(proj) : [];
  capSpace.style.display = spaces.length ? "" : "none";
  if(!spaces.length){ S.capSpace = null; capSpace.textContent = ""; return; }

  capSpace.textContent = "";
  var ns = document.createElement("option");
  ns.value = ""; ns.textContent = "No space";
  capSpace.appendChild(ns);
  spaces.forEach(function(sp){
    var o = document.createElement("option");
    o.value = sp.id; o.textContent = sp.name || "Untitled space";
    capSpace.appendChild(o);
  });
  capSpace.value = S.capSpace || "";
  if(capSpace.value !== (S.capSpace || "")){ S.capSpace = null; capSpace.value = ""; }
}
function resetCapturePickers(){
  S.capProj = null;
  S.capSpace = null;
}
function updateCapture(){
  var show = writable() && !S.doc && S.sel !== "today" && S.sel !== "dash" &&
    (S.sel === "capture" || S.sel === "unfiled" || S.tab === "notes");
  capEl.classList.toggle("on", !!show);
  if(!show) return;
  var target = captureTarget();
  capInput.placeholder = target
    ? "Capture something for " + (projName(target) || "this project") + ". Enter saves it."
    : "Get it out of your head. Enter saves it.";
  capHint.textContent = navigator.onLine === false
    ? "#tag anything · Shift+Enter for a new line · saves on this phone until you're back"
    : S.assets
      ? "#tag anything · Shift+Enter for a new line · paste an image"
      : "#tag anything · Shift+Enter for a new line";
  $("#capPhoto").hidden = !S.assets;
  fillCapturePickers();
}
function drawCapThumbs(){
  var batch = S.capBatch;
  capThumbs.textContent = "";
  batch.ids.forEach(function(id){
    var w = el("div","thumb");
    var im = document.createElement("img");
    im.src = SlateStore.blobUrl(id); im.alt = "";
    w.appendChild(im);
    var x = el("button"); x.appendChild(ico("x","sm"));
    x.setAttribute("aria-label","Remove image");
    x.onclick = function(){
      batch.ids = batch.ids.filter(function(i){ return i !== id; });
      drawCapThumbs();
      if(S.assets) S.assets.delete(id).catch(function(){});
    };
    w.appendChild(x);
    capThumbs.appendChild(w);
  });
  for(var i = 0; i < batch.pending; i++){
    var w = el("div","thumb up");
    w.appendChild(el("span", null, "Uploading"));
    capThumbs.appendChild(w);
  }
}
/* one promise per image; each settles once that upload is done or has failed */
function uploadImages(files, onId){
  if(!S.assets || !files || !files.length) return [];
  var out = [];
  Array.prototype.slice.call(files).forEach(function(f){
    if(!/^image\//.test(f.type)) return;
    out.push(S.assets.upload(f).then(function(r){ onId(r.id); }).catch(function(e){
      var c = (e && e.code) || "";
      if(c === "too_large") toast("That image is too big. 20 MB is the limit.");
      else if(c === "unsupported_type") toast("That file type can't be attached.");
      else if(c === "quota_or_state") toast("Image storage is full for this board.");
      else if(c === "rate_limited") toast("Slow down a moment — too many uploads.");
      else if(c === "offline") toast("Images need a connection. Your text saves now — add the photo when you're back.");
      else toast("That image didn't upload.");
    }));
  });
  return out;
}
/* Photos belong to the capture they were picked for. An upload still running
   when Enter is pressed used to land in the NEXT note, because it pushed into
   whatever the capture box held by the time it finished. Now each upload
   carries its batch: if that batch's note has already been written, the photo
   is added to that note; otherwise it waits in the box as before. */
function capAddFiles(files){
  var batch = S.capBatch;
  var waits = uploadImages(files, function(id){
    if(batch.noteId){
      var n = findNote(batch.noteId);
      var imgs = ((n && n.images) || []).slice();
      if(imgs.indexOf(id) === -1) imgs.push(id);
      patchNote(batch.noteId, { images: imgs });
    } else {
      batch.ids.push(id);
    }
  });
  batch.pending += waits.length;
  waits.forEach(function(w){
    w.then(function(){
      batch.pending--;
      if(batch === S.capBatch) drawCapThumbs();
    });
  });
  batch.waits = batch.waits.concat(waits);
  drawCapThumbs();
}
function doCapture(){
  var text = capInput.value;
  var batch = S.capBatch;
  if(!text.trim() && !batch.ids.length && !batch.pending) return;
  var proj = captureProject();
  var space = proj ? (S.capSpace || null) : null;
  S.capBatch = { ids:[], pending:0, waits:[], noteId:null };
  capInput.value = "";
  drawCapThumbs();
  autosize(capInput);
  /* every note is filed deliberately, so the pickers start empty again */
  resetCapturePickers();
  /* A photo alone, still uploading, has nothing to save yet: wait for it. With
     any text the note is written now, so the words are safe even if the upload
     never finishes, and late photos join it as they land. */
  var ready = (!text.trim() && !batch.ids.length)
    ? Promise.all(batch.waits)
    : Promise.resolve();
  ready.then(function(){
    var before = captureNote.lastId;
    var p = captureNote(text, batch.ids.slice(), proj, space);
    // lastId only moves when a note was actually written (not for a failed photo alone)
    batch.noteId = captureNote.lastId !== before ? captureNote.lastId : null;
    return p;
  }).then(function(){
    /* filing it into a project puts it on that board's first column too, with the
       note kept whole behind the card */
    if(!proj) return;
    var noteId = batch.noteId;
    var n = findNote(noteId);
    if(!n) return;
    createTask(taskTitleFor(n), null, proj, space, noteId);
    toast("Saved, and added to " + (columnName(proj, space, firstColumnId(proj, space)) || "the board"));
  });
  fillCapturePickers();
}

capSpace.addEventListener("change", function(){

function openProspect(id){

var taskDlg = $("#taskDlg"), tkId = null, tkOwnerIds = [];
var tkBase = null;   // the sheet's fields as they were when it opened

function findTask(id){

function fillSelect(sel, opts, value){

function tkSyncSpaces(){

    return [x.id, x.name || "Untitled space"];
  }));

function openTask(id){

  $("#tkDue").value = t.due || "";
  fillSelect($("#tkProj"),
    [["","No project"]].concat(S.projects.slice().sort(function(a,b){ return (a.order||0)-(b.order||0); })
      .map(function(p){ return [p.id, p.name || "Untitled project"]; })),

  $("#tkSpace").value = t.spaceId || "";

  /* owner list: whoever this page already knows about, plus nobody */
  tkOwnerIds = [];

  if(S.uid && tkOwnerIds.indexOf(S.uid) === -1) tkOwnerIds.unshift(S.uid);
  var ownerSel = $("#tkOwner");
  fillSelect(ownerSel, [["","No owner"]].concat(tkOwnerIds.map(function(u){ return [u, "…"]; })), t.assignee || "");
  if(S.user){
    S.user.search("").then(function(hits){
      hits.forEach(function(h){ if(tkOwnerIds.indexOf(h.id) === -1) tkOwnerIds.push(h.id); });
      return S.user.profiles(tkOwnerIds);
    }).then(function(ps){

      fillSelect(ownerSel, [["","No owner"]].concat(tkOwnerIds.map(function(u){
        return [u, (ps[u] && ps[u].name) || "Someone"];

/* What the sheet shows, in the shape of a task patch. */
function tkForm(){
  return {
    title: $("#tkName").value.trim(),
    notes: $("#tkNotes").value.trim() || null,
    status: $("#tkStatus").value,
    due: $("#tkDue").value || null,
    projectId: $("#tkProj").value || null,
    spaceId: $("#tkSpace").value || null,
    assignee: $("#tkOwner").value || null
  };
}
/* What the sheet would write: only fields the user changed since the sheet
   opened (tkBase), and only where that still differs from the task now.
   Diffing against the live task alone counted every field the other person
   changed while the sheet was open as an edit here, so merely closing the
   sheet wrote the stale copy back — un-finishing a task Zac had just ticked.
   Status is compared as columnOf(), not the raw field, because a status
   matching no column is shown as the first one. */
function tkPending(){
  var t = findTask(tkId);
  if(!t || !writable() || !tkBase) return null;
  var want = tkForm();
  if(!want.title) want.title = tkBase.title;   // an emptied name keeps the old one
  var have = {
    title: t.title || "", notes: t.notes || null, status: columnOf(t), due: t.due || null,
    projectId: t.projectId || null, spaceId: t.spaceId || null, assignee: t.assignee || null
  };
  var changed = {};
  Object.keys(want).forEach(function(k){
    if(want[k] !== tkBase[k] && want[k] !== have[k]) changed[k] = want[k];
  });
  return Object.keys(changed).length ? changed : null;
}
/* Every way out of the sheet keeps what was typed — Close, tapping outside,
   Escape. They all used to discard it silently. Only Delete passes false. */
function closeTask(save){
  if(save !== false && tkId){
    var ch = tkPending();
    if(ch) patchTask(tkId, ch);
  }
  taskDlg.classList.remove("on");
  tkId = null;
  tkBase = null;
}

$("#tkProj").onchange = tkSyncSpaces;
$("#tkClose").onclick = function(){ closeTask(); };
$("#tkNote").onclick = function(){
  var t = findTask(tkId);
  if(!t || !t.noteId) return;

};

    deleteTask(id);
    closeTask(false);
  });
};
